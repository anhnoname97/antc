:root{
  --top:#0B3B3A;--p:#0E7C72;--p-h:#0A6A61;--tint:#E3F4F1;--tint-t:#0A5E57;--ring:#B9E2DB;--brand:#5C0F0B;
  --bg:#F4F6FB;--card:#fff;--line:#E3E7F0;--line2:#EEF0F5;--in:#C9CFDB;--t:#1A2033;--t2:#3B4256;--m:#5B6478;--m2:#6B7385;--dis:#8A92A6;
  --ok:#1E8E3E;--ok-bg:#E6F4EA;--ok-t:#17692F;--warn:#E8890C;--warn-bg:#FFF1DC;--warn-t:#8A4A06;--bad:#C4320A;--bad-bg:#FDE7E2;--bad-t:#8A2307;
  --info:#3D4FC4;--info-bg:#E8EBFB;--info-t:#2B3990;--r:10px;--r2:16px;--sh:0 24px 60px rgba(20,30,60,.28)
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;color:var(--t);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3,p{margin:0}

/* Khung */
.top{position:sticky;top:0;z-index:30;background:var(--top);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;padding:10px 24px}
.logo{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.logo i{width:36px;height:36px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center}
.logo b{display:block;font-size:15px;line-height:1.2}
.logo small{display:block;font-size:12px;color:rgba(255,255,255,.78)}
.tnav{display:flex;gap:2px;flex:1 1 420px;overflow-x:auto;scrollbar-width:none}
.tnav a{color:rgba(255,255,255,.82);text-decoration:none;font-weight:500;padding:8px 12px;border-radius:8px;white-space:nowrap}
.tnav a:hover{background:rgba(255,255,255,.1);color:#fff}
.tnav a[aria-current]{background:rgba(255,255,255,.16);color:#fff;font-weight:700}
.tools{display:flex;align-items:center;gap:10px}
.qs{display:flex;align-items:center;gap:10px;min-width:210px;height:40px;padding:0 12px;border:0;border-radius:10px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.85);text-align:left}
.qs:hover{background:rgba(255,255,255,.18)}
.qs span{flex:1}
kbd{font-family:inherit;font-size:11px;padding:2px 6px;border-radius:5px;background:rgba(255,255,255,.16)}
.mode{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:0;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;font-size:13px;font-weight:700}
.mode.adm{background:var(--info-bg);color:var(--info-t)}
.ava{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:#fff;color:var(--top);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.wrap{display:flex;align-items:stretch;min-height:calc(100vh - 60px)}
.side{flex:0 0 248px;background:#fff;border-right:1px solid var(--line);padding:20px 14px 24px}
.side h4{margin:16px 0 6px;padding:0 12px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--m2)}
.side h4:first-child{margin-top:0}
.side a{display:flex;align-items:center;gap:12px;min-height:40px;padding:0 12px;border-radius:9px;text-decoration:none;font-weight:500;color:var(--t2)}
.side a:hover{background:#F1F3F8}
.side a svg{flex:0 0 auto;color:var(--m2)}
.side a span{flex:1}
.side a em{font-style:normal;font-size:12px;color:var(--m2)}
.side a[aria-current]{background:var(--tint);color:var(--tint-t);font-weight:700}
.side a[aria-current] svg{color:var(--tint-t)}
.side a.lock{color:var(--dis)}
.main{flex:1;min-width:0;padding:24px 32px 56px}
.in{max-width:1240px;margin:0 auto}
.in.narrow{max-width:980px}

/* Dau trang */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.ph>div:first-child{flex:1 1 420px;min-width:0}
.crumb{font-size:13px;color:var(--m);margin-bottom:4px}
.back{display:inline-flex;gap:6px;margin-bottom:8px;font-weight:500;color:#4A5268;text-decoration:none;border:0;background:none;padding:0}
.back:hover{color:var(--t)}
h1{font-size:28px;line-height:1.25;font-weight:700;letter-spacing:-.02em}
.lead{margin-top:6px;font-size:15px;color:var(--m)}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Nut */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border:1px solid #D5DAE5;border-radius:var(--r);background:#fff;color:var(--t);font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{background:#F6F8FB}
.btn.p{background:var(--p);border-color:var(--p);color:#fff}
.btn.p:hover{background:var(--p-h)}
.btn.d{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.dl{color:var(--bad);border-color:#F2B8A6}
.btn.dl:hover{background:#FFF3F0}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--tint-t)}
.btn.ghost:hover{background:var(--tint)}
.btn[disabled],.btn.dis{background:#FAFAFC;border-color:var(--line);color:var(--dis);cursor:not-allowed}
.lnk{border:0;background:none;padding:0;color:var(--tint-t);font-weight:600;text-decoration:none;cursor:pointer}
.lnk:hover{text-decoration:underline}
.lnk.red{color:var(--bad)}
.icon-btn{width:36px;height:36px;border:0;border-radius:9px;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--m)}
.icon-btn:hover{background:#EEF1F6;color:var(--t)}

/* The */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:20px 22px}
.card.flush{padding:0;overflow:hidden}
.card h2{font-size:17px;margin-bottom:12px}
.card h2+.sub{margin:-8px 0 14px;font-size:13px;color:var(--m)}
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.cols>.a{flex:999 1 520px;min-width:0;display:grid;gap:20px}
.cols>.b{flex:1 1 320px;min-width:0;display:grid;gap:20px}
.grid{display:grid;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:14px}
.row>*{flex:1 1 200px;min-width:0}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.stat{flex:1 1 180px;padding:14px 16px;border-radius:14px;background:#fff;border:1px solid var(--line);text-decoration:none}
a.stat:hover{border-color:var(--ring)}
.stat span{font-size:13px;color:var(--m)}
.stat b{display:block;font-size:24px;line-height:1.3}
.muted{color:var(--m)}
.small{font-size:13px}
.xs{font-size:12.5px;color:var(--m2)}
.mt{margin-top:14px}
.mb{margin-bottom:14px}
.sp{flex:1}
.hr{height:1px;background:var(--line2);margin:16px 0}

/* Bang */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--m2);font-weight:700;padding:11px 12px;white-space:nowrap}
.tbl td{padding:12px;border-top:1px solid var(--line2);vertical-align:middle}
.tbl th:first-child,.tbl td:first-child{padding-left:20px}
.tbl th:last-child,.tbl td:last-child{padding-right:20px}
.tbl tr.click{cursor:pointer}
.tbl tbody tr:hover{background:#F8F9FC}
.tbl tr.is-sel{background:var(--tint) !important}
.tbl .r{text-align:right}
.tbl .nw{white-space:nowrap}
.tbl strong{font-weight:600}
.tfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 20px;border-top:1px solid var(--line2);font-size:13px;color:var(--m)}

/* Nhan trang thai */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}
.pill.ok{background:var(--ok-bg);color:var(--ok-t)}
.pill.warn{background:var(--warn-bg);color:var(--warn-t)}
.pill.bad{background:var(--bad-bg);color:var(--bad-t)}
.pill.info{background:var(--info-bg);color:var(--info-t)}
.pill.mute{background:#EEF0F5;color:#4A5268}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:99px;border:1px solid #D5DAE5;background:#fff;color:var(--t2);font-weight:600;white-space:nowrap}
.chip:hover{border-color:#AEB6C6}
.chip[aria-pressed=true]{border-color:var(--p);background:var(--tint);color:var(--tint-t)}
.chip em{font-style:normal;font-weight:500;color:var(--m2)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;background:var(--tint);color:var(--tint-t);font-weight:600}
.tag button{border:0;background:none;padding:0;color:inherit;font-size:15px;line-height:1}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}

/* Truong nhap */
.f{display:block}
.f>span:first-child{display:flex;gap:6px;align-items:baseline;font-weight:600;margin-bottom:6px}
.f>span:first-child i{font-style:normal;color:var(--bad)}
.f>span:first-child small{margin-left:auto;font-weight:400;font-size:13px;color:var(--m)}
.f>span:first-child small.over{color:var(--bad)}
.hint{display:block;margin-top:4px;font-size:13px;color:var(--m)}
.err{display:block;margin-top:4px;font-size:13px;color:var(--bad);font-weight:500}
.inp,.sel,.area{width:100%;height:44px;padding:0 14px;border:1px solid var(--in);border-radius:var(--r);background:#fff;font-size:15px}
.sel{padding:0 10px}
.area{height:auto;padding:10px 14px;line-height:1.6;resize:vertical}
.inp:focus,.sel:focus,.area:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 3px var(--ring)}
.inp.bad,.area.bad{border-color:var(--bad);background:#FFF8F6}
.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid #D5DAE5;border-radius:var(--r);background:#fff;flex:1 1 260px;color:var(--m2)}
.search input{flex:1;border:0;outline:0;background:transparent;min-width:0}
.search:focus-within{border-color:var(--p);box-shadow:0 0 0 3px var(--ring)}
.prefix{display:flex;align-items:center;height:44px;border:1px solid var(--in);border-radius:var(--r);overflow:hidden;background:#fff}
.prefix span{padding:0 10px;height:100%;display:flex;align-items:center;background:#F4F5F8;color:var(--m2);border-right:1px solid var(--line)}
.prefix input{flex:1;min-width:0;height:100%;padding:0 10px;border:0;outline:0}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.chk input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--p);flex:0 0 auto}
.chk b{font-weight:600}
.chk small{display:block;font-size:13px;color:var(--m)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid #D5DAE5;border-radius:12px;background:#fff;cursor:pointer}
.opt:has(input:checked){border:2px solid var(--p);background:#F2FAF8;padding:11px 13px}
.opt input{margin:3px 0 0;accent-color:var(--p)}
.opt b{font-weight:600}
.opt small{display:block;font-size:13px;color:var(--m)}
.sw{position:relative;width:40px;height:24px;flex:0 0 auto}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:99px;background:#C9CFDB;transition:.15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+i{background:var(--p)}
.sw input:checked+i::after{left:19px}

/* Tab */
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin:14px 0 20px;overflow-x:auto}
.tabs button,.tabs a{display:flex;align-items:center;gap:6px;height:44px;border:0;border-bottom:3px solid transparent;background:none;padding:0;font-weight:600;color:var(--m);text-decoration:none;white-space:nowrap}
.tabs button:hover,.tabs a:hover{color:var(--t)}
.tabs [aria-selected=true]{border-bottom-color:var(--p);color:var(--t);font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}

/* Thong bao */
.note{padding:12px 14px;border-radius:12px;border:1px solid;font-size:14px}
.note.info{background:#EEF6FF;border-color:#BFD7F5;color:#1C4F8A}
.note.warn{background:#FFF8EC;border-color:#F5D49A;color:#7A4206}
.note.ok{background:#EEF8F1;border-color:#B8E0C3;color:var(--ok-t)}
.note.bad{background:#FFF3F0;border-color:#F2B8A6;color:var(--bad-t)}
.check-list{display:grid;gap:8px}
.check-list p{display:flex;gap:8px}
.check-list .y::before{content:"✓";color:var(--ok);font-weight:700}
.check-list .n{color:var(--warn-t)}
.check-list .n::before{content:"!";font-weight:700;width:9px;text-align:center}
.empty{text-align:center;padding:48px 20px;color:var(--m)}
.empty b{display:block;font-size:16px;color:var(--t);margin:10px 0 4px}

/* Hop thoai */
.ov{position:fixed;inset:0;z-index:60;background:rgba(26,32,51,.45);display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px 16px;overflow:auto;animation:fade .12s}
.dlg{width:min(560px,100%);background:#fff;border-radius:18px;box-shadow:var(--sh);padding:24px;animation:pop .14s}
.dlg.w{width:min(760px,100%)}
.dlg.xw{width:min(980px,100%)}
.dlg h2{font-size:20px;margin-bottom:4px}
.dlg .sub{color:var(--m);margin-bottom:16px}
.dlg .foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;margin-top:22px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
.toasts{position:fixed;right:20px;bottom:88px;z-index:80;display:grid;gap:10px;width:min(380px,calc(100vw - 40px))}
.toast{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:#1A2033;color:#fff;box-shadow:var(--sh);animation:pop .16s}
.toast.ok{background:#12391F}
.toast.bad{background:#5A1607}
.toast p{flex:1}
.toast button{border:0;background:none;color:#9FE3D8;font-weight:700;padding:0}
.menu{position:absolute;z-index:50;min-width:220px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(20,30,60,.16);padding:6px}
.menu button,.menu a{display:flex;width:100%;gap:10px;align-items:center;padding:9px 12px;border:0;border-radius:8px;background:none;text-align:left;text-decoration:none;color:var(--t)}
.menu button:hover,.menu a:hover{background:#F2F4F8}
.menu .red{color:var(--bad)}
.menu hr{border:0;height:1px;background:var(--line2);margin:6px 0}
.menu .head{padding:8px 12px 4px;font-size:12px;color:var(--m2);font-weight:700;letter-spacing:.04em;text-transform:uppercase}

/* Soan thao */
.ed{border:1px solid var(--in);border-radius:var(--r);overflow:hidden;background:#fff}
.ed .bar{display:flex;flex-wrap:wrap;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line);background:#FAFBFD}
.ed .bar button{height:30px;min-width:30px;padding:0 9px;border:0;border-radius:6px;background:transparent;color:var(--t2);font-size:13px}
.ed .bar button:hover{background:#ECEFF5}
.ed .body{padding:12px 14px;font-size:15px;line-height:1.7;min-height:140px;outline:0}
.ed .body:focus{box-shadow:inset 0 0 0 2px var(--ring)}
.blk{border:1px solid var(--line);border-radius:14px;background:#fff}
.blk.on{border-color:var(--p);box-shadow:0 0 0 3px var(--ring)}
.blk-h{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line2)}
.blk-h b{flex:1}
.blk-h .k{font-size:12px;font-weight:700;color:var(--tint-t);background:var(--tint);padding:2px 8px;border-radius:6px}
.blk-b{padding:14px 16px;display:grid;gap:12px}
.add-blk{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:46px;border:2px dashed #C9D3DE;border-radius:14px;background:transparent;color:var(--tint-t);font-weight:700}
.add-blk:hover{border-color:var(--p);background:#F2FAF8}

/* Buoc */
.steps{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px;padding:0;list-style:none}
.steps li{flex:1 1 170px}
.steps button{display:flex;width:100%;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;text-align:left}
.steps .now button{border-color:var(--p);background:var(--tint)}
.steps i{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:13px;background:#EEF0F5;color:#4A5268;flex:0 0 auto}
.steps .done i{background:var(--ok);color:#fff}
.steps .now i{background:var(--p);color:#fff}
.steps b{display:block;font-size:14px}
.steps small{font-size:12px;color:var(--m)}
.foot-bar{position:sticky;bottom:0;z-index:5;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;padding:14px 18px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.96);backdrop-filter:blur(4px)}

/* Phuong tien */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.mitem{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;text-align:left;padding:0}
.mitem:hover{border-color:#AEB6C6}
.mitem.is-sel{border:2px solid var(--p);box-shadow:0 0 0 3px var(--ring)}
.mthumb{height:112px;display:flex;align-items:flex-end;padding:8px;color:#fff;font-size:11px;font-weight:700}
.mitem p{padding:8px 10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mitem small{display:block;color:var(--m2);font-size:12px}
.drop{border:2px dashed #B9C3D3;border-radius:14px;padding:30px;text-align:center;background:#FAFBFD}
.drop.hot{border-color:var(--p);background:#F2FAF8}
.bar-p{height:8px;border-radius:99px;background:#EEF0F5;overflow:hidden}
.bar-p i{display:block;height:100%;background:var(--p);transition:width .2s}

/* Dang nhap */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1200px 600px at 10% 0%,#0E5F58 0,transparent 60%),var(--top)}
.login .box{width:min(440px,100%);background:#fff;border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.35);padding:32px}
.login .brand{display:flex;gap:12px;align-items:center;margin-bottom:22px}
.login .brand i{width:48px;height:48px;border-radius:14px;background:#FBEDEC;display:flex;align-items:center;justify-content:center}
.otp{display:flex;gap:8px}
.otp input{width:48px;height:56px;text-align:center;font-size:22px;font-weight:700;border:1px solid var(--in);border-radius:10px}
.otp input:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 3px var(--ring)}

/* Quay so */
.drum{height:120px;border-radius:16px;background:var(--top);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.drum b{font-size:40px;letter-spacing:.06em}
.drum.spin b{animation:blink .1s infinite}
@keyframes blink{50%{opacity:.6}}

/* Tim nhanh */
.cmd{width:min(720px,100%);background:#fff;border-radius:18px;box-shadow:var(--sh);overflow:hidden}
.cmd input{width:100%;height:60px;padding:0 20px;border:0;border-bottom:1px solid var(--line);font-size:17px;outline:0}
.cmd .res{max-height:60vh;overflow:auto;padding:8px}
.cmd .grp{padding:10px 12px 4px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--m2)}
.cmd .it{display:flex;gap:12px;align-items:center;width:100%;padding:10px 12px;border:0;border-radius:10px;background:none;text-align:left}
.cmd .it.on,.cmd .it:hover{background:var(--tint)}
.cmd .it small{display:block;color:var(--m);font-size:12.5px}

/* Thanh chuyen man cua ban thu */
.proto{position:fixed;left:16px;bottom:16px;z-index:70}
.proto>button{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:0;border-radius:99px;background:#1A2033;color:#fff;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.proto .panel{position:absolute;left:0;bottom:50px;width:340px;max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:12px}
.proto .panel h3{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--m2);margin:12px 6px 4px}
.proto .panel a{display:block;padding:6px 8px;border-radius:8px;text-decoration:none;font-size:13.5px}
.proto .panel a:hover{background:#F2F4F8}

.bar-h{display:inline-flex;align-items:center;gap:8px;min-width:150px}
.bar-h span{flex:1;height:8px;border-radius:99px;background:#EEF0F5;overflow:hidden}
.bar-h i{display:block;height:100%}
.list-row{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;width:100%}
.list-row:hover{border-color:#C3CAD8}
.list-row.is-sel{border-color:var(--p);background:#F2FAF8}
.ico{flex:0 0 auto;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.preview-g{padding:12px;border:1px solid var(--line2);border-radius:10px}
.preview-g .u{font-size:12px;color:#3B4256}
.preview-g .t{font-size:17px;color:#1A0DAB;margin:2px 0}
.diff-d{background:#FDE7E2;color:#8A2307;text-decoration:line-through}
.diff-a{background:#DDF3E4;color:#17692F}

@media (max-width:900px){
  .wrap{flex-direction:column}
  .side{flex:none;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;display:flex;gap:4px;overflow-x:auto}
  .side h4{display:none}
  .side a{white-space:nowrap}
  .side a em{display:none}
  .main{padding:18px 16px 80px}
  .qs{min-width:0}.qs span,.qs kbd{display:none}
  h1{font-size:23px}
}

/* Cay noi dung kieu Umbraco */
.tree{display:grid;gap:1px}
.tn{position:relative;display:flex;align-items:center;gap:4px;min-height:38px;padding-right:4px;border-radius:9px}
.tn:hover{background:#F1F3F8}
.tn.on{background:var(--tint)}
.tn.on>a{color:var(--tint-t);font-weight:700}
.tn .car{width:24px;height:24px;flex:0 0 auto;border:0;background:none;border-radius:6px;color:var(--m2);display:flex;align-items:center;justify-content:center;padding:0}
.tn .car:hover{background:#E4E8EF}
.tn .car.x{visibility:hidden}
.tn>a{flex:1;min-width:0;display:flex;align-items:center;gap:9px;min-height:38px;text-decoration:none;color:var(--t2);font-weight:500}
.tn>a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn>a svg{flex:0 0 auto;color:var(--m2)}
.tn>a em{margin-left:auto;font-style:normal;font-size:12px;color:var(--m2);padding-right:4px}
.tn .more{opacity:0;width:28px;height:28px;border:0;border-radius:7px;background:none;color:var(--m);flex:0 0 auto}
.tn:hover .more,.tn.on .more,.tn .more[aria-expanded=true]{opacity:1}
.tn .more:hover{background:#E1E6EE}
.tn.unpub>a span{color:var(--m2);font-style:italic}
.tn .st{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:0 0 auto}
.side .sep{height:1px;background:var(--line2);margin:10px 4px}

/* Vung lam viec (workspace) */
.ws{display:flex;flex-direction:column;min-height:calc(100vh - 60px)}
.ws-h{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:14px 32px;background:#fff;border-bottom:1px solid var(--line)}
.ws-h .back{margin:0}
.ws-name{flex:1 1 380px;min-width:0;display:flex;align-items:center;gap:10px}
.ws-name svg{color:var(--m2);flex:0 0 auto}
.ws-name input{flex:1;min-width:0;height:44px;padding:0 12px;border:1px solid transparent;border-radius:10px;font-size:20px;font-weight:700;background:transparent}
.ws-name input:hover{border-color:var(--line)}
.ws-name input:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 3px var(--ring);background:#fff}
.ws-name input.bad{border-color:var(--bad);background:#FFF8F6}
.views{display:flex;gap:2px;background:#F1F3F8;border-radius:12px;padding:3px}
.views a{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:78px;padding:6px 10px;border-radius:9px;text-decoration:none;font-size:12px;font-weight:600;color:var(--m)}
.views a:hover{color:var(--t)}
.views a[aria-current]{background:#fff;color:var(--tint-t);box-shadow:0 1px 3px rgba(20,30,60,.12)}
.ws-b{flex:1;padding:22px 32px 40px}
.ws-f{position:sticky;bottom:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 32px;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 16px rgba(20,30,60,.05)}
.crumbs{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:13px;color:var(--m)}
.crumbs a{color:var(--m);text-decoration:none}
.crumbs a:hover{color:var(--t);text-decoration:underline}
.split{display:inline-flex}
.split .btn:first-child{border-top-right-radius:0;border-bottom-right-radius:0}
.split .btn:last-child{border-top-left-radius:0;border-bottom-left-radius:0;border-left:1px solid rgba(255,255,255,.35);padding:0 12px}
.dirty{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--warn-t);font-weight:600}
.dirty::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn)}

/* Thuoc tinh: nhan ben trai, o nhap ben phai (bo cuc Umbraco) */
.grp{background:#fff;border:1px solid var(--line);border-radius:var(--r2);margin-bottom:20px}
.grp>h3{font-size:15px;padding:14px 22px;border-bottom:1px solid var(--line2)}
.prop{display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:8px 28px;padding:18px 22px;border-top:1px solid var(--line2)}
.grp>h3+.prop{border-top:0}
.prop>label,.prop>.lbl{font-weight:700;line-height:1.35}
.prop>label i,.prop>.lbl i{font-style:normal;color:var(--bad)}
.prop>label small,.prop>.lbl small{display:block;margin-top:4px;font-weight:400;font-size:13px;color:var(--m)}
.prop .cnt{display:block;margin-top:4px;font-size:12.5px;font-weight:400;color:var(--m2)}
.prop .cnt.over{color:var(--bad);font-weight:600}
.prop.inv{background:#FFFAF8}
.prop.inv>label{color:var(--bad-t)}
@media (max-width:760px){.prop{grid-template-columns:1fr}}

/* Bang ben phai (sidebar modal cua Umbraco) */
.ov.r{align-items:stretch;justify-content:flex-end;padding:0}
.smod{width:min(720px,100%);height:100vh;background:var(--bg);box-shadow:var(--sh);display:flex;flex-direction:column;animation:slide .16s}
.smod.n{width:min(520px,100%)}
.sm-h{display:flex;align-items:center;gap:12px;padding:16px 24px;background:#fff;border-bottom:1px solid var(--line)}
.sm-h h2{flex:1;font-size:18px}
.sm-b{flex:1;overflow:auto;padding:20px 24px}
.sm-f{display:flex;justify-content:flex-end;gap:10px;padding:12px 24px;background:#fff;border-top:1px solid var(--line)}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cat button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left}
.cat button:hover{border-color:var(--p);background:#F7FCFB}
.cat button b{font-size:14px}
.cat button small{font-size:12.5px;color:var(--m);line-height:1.4}
.picked{display:flex;flex-wrap:wrap;gap:10px}
.thumb{position:relative;width:140px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.thumb div{height:80px}
.thumb p{padding:6px 8px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb button{position:absolute;top:6px;right:6px;width:24px;height:24px;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:14px;line-height:1}
.pick-add{width:140px;height:112px;border:2px dashed #C9D3DE;border-radius:10px;background:transparent;color:var(--tint-t);font-weight:700}
.pick-add:hover{border-color:var(--p);background:#F2FAF8}
.blist{display:grid;gap:10px}
.bitem{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;text-align:left;width:100%}
.bitem:hover{border-color:#AEB6C6;box-shadow:0 2px 8px rgba(20,30,60,.06)}
.bitem .k{flex:0 0 auto;font-size:11.5px;font-weight:700;color:var(--tint-t);background:var(--tint);padding:2px 8px;border-radius:6px;margin-top:2px}
.bitem .c{flex:1;min-width:0}
.bitem .c p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--t2)}
.bitem .ops{display:flex;gap:2px;opacity:.55}
.bitem:hover .ops{opacity:1}
.bnote{border-left:4px solid var(--warn);background:#FFFBF3}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;font-size:14px}
.kv dt{color:var(--m)}
.kv dd{margin:0;font-weight:500}
.ucards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.ucard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:20px 16px;border:1px solid var(--line);border-radius:16px;background:#fff;text-decoration:none}
.ucard:hover{border-color:var(--ring);box-shadow:0 4px 14px rgba(20,30,60,.06)}
.uava{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;background:var(--tint);color:var(--tint-t)}
.dash-tabs{display:flex;gap:6px;margin-bottom:20px}
[hidden]{display:none !important}
.side-tg{display:none}
@media (max-width:900px){
  .top{padding:10px 16px;gap:8px}
  .logo small{display:none}
  .tnav{order:3;flex:1 1 100%}
  .tools{margin-left:auto}
  .mode{padding:0 10px}
  .side-tg{display:flex;align-items:center;gap:8px;width:100%;height:44px;padding:0 16px;border:0;border-bottom:1px solid var(--line);background:#fff;font-weight:700;color:var(--t2)}
  .side{display:none}
  .side.open{display:block;max-height:60vh;overflow:auto}
  .ws-h,.ws-b,.ws-f{padding-left:16px;padding-right:16px}
  .ws-f .crumbs{display:none}
  .views a{min-width:64px}
  .toasts{bottom:96px}
}

</style>
</head>
<body>
<div id="app"></div>
<script>
const QUIZ = {"1":{"t":"Những điều nền tảng và cách quyết định cho chắc","q":[{"code":"CĐ1-001","q":"Ai có thể trở thành nạn nhân của lừa đảo?","opt":[["A","Chỉ người có nhiều tiền của"],["B","Ai cũng có thể bị lừa"],["C","Chỉ người cả tin, ít hiểu biết"],["D","Chỉ người già, ít dùng điện thoại thông minh"]],"ans":"B","exp":{"B":"Đúng. Ai cũng có thể bị lừa, nhất là lúc đang ham lợi, đang vội, đang sợ, quá tin hoặc quá hy vọng."}},{"code":"CĐ1-002","q":"Kẻ lừa đảo thường đánh vào cái gì trước, để mình không kịp bình tĩnh kiểm tra?","opt":[["A","Lý trí"],["B","Tài sản"],["C","Cảm xúc"],["D","Mạng xã hội"]],"ans":"C","exp":{"C":"Đúng. Khi mình đang sợ, đang vội, quá tin hoặc quá hy vọng thì việc kiểm tra hay bị gác lại."}},{"code":"CĐ1-006","q":"Một lời mời vừa hấp dẫn vừa bị giục phải quyết ngay. Tự hỏi câu nào thì nhận ra mình đang bị thúc ép về thời gian?","opt":[["A","Chuyển một khoản nhỏ để giữ suất ưu đãi có được không?"],["B","Nếu bỏ qua thì mình có tiếc cơ hội này không?"],["C","Ai đang chọn thời điểm quyết định thay cho mình?"],["D","Người đang liên hệ trông có đáng tin không?"]],"ans":"C","exp":{"C":"Đúng. Nếu người khác đang chọn giùm mình thời điểm phải quyết, đó chính là lúc cần dừng lại."}},{"code":"CĐ1-050","q":"Khi thấy có dấu hiệu lạ — bị giục quyết ngay, bị bắt giữ bí mật — hoặc gặp một yêu cầu nguy hiểm như đọc mã, chuyển tiền, bấm đường dẫn lạ, cách xử lý nào phù hợp nhất?","opt":[["A","Chỉ dừng khi đếm đủ hai dấu hiệu; gặp một yêu cầu nguy hiểm thì vẫn có thể chờ thêm"],["B","Thấy dấu hiệu lạ thì hoãn lại và tự kiểm tra ở nguồn khác; gặp yêu cầu nguy hiểm thì dừng ngay"],["C","Hoãn hay dừng tùy lúc đó mình thấy người kia có đáng tin hay không"],["D","Dừng mọi giao dịch, vì việc bình thường cũng có thể khiến mình băn khoăn"]],"ans":"B","exp":{"B":"Đúng. Thấy có điều bất thường thì hoãn lại và tự kiểm tra ở một nguồn khác do mình chủ động tìm, ví dụ số in trên thẻ hoặc ứng dụng chính thức; đừng hỏi lại chính người đang thúc mình. Còn nếu họ đòi đọc mã, đòi mật khẩu, bắt cài ứng dụng lạ, xin quyền điều khiển điện thoại, bắt chuyển tiền để xác minh hoặc bắt giữ bí mật với người nhà — thì dừng ngay, rồi tự gọi ngân hàng, ví điện tử, cơ quan liên quan hoặc Công an bằng kênh chính thức."}},{"code":"CĐ1-013","q":"Sáu tín hiệu tâm lý mà kẻ lừa đảo hay lợi dụng là gì?","opt":[["A","THAM - SỢ - GẤP - TIN - THƯƠNG - HY VỌNG"],["B","THAM - LO - GẤP - TIN - GHÉT - HY VỌNG"],["C","THAM - SỢ - VUI - TIN - THƯƠNG - HY VỌNG"],["D","THAM - SỢ - GẤP - NGHI - THƯƠNG - TIẾC"]],"ans":"A","exp":{"A":"Đúng. Sáu tín hiệu cần nhớ là THAM - SỢ - GẤP - TIN - THƯƠNG - HY VỌNG. Một câu chuyện lừa có thể đánh vào nhiều tín hiệu cùng lúc."}},{"code":"CĐ1-016","q":"Vì sao để ý cảm xúc của mình lại có ích hơn là cố nhớ tên từng kiểu lừa đảo?","opt":[["A","Vì kiểu lừa mới nào cũng được thông báo đầy đủ ngay trong ngày"],["B","Vì cảm xúc lúc nào cũng dễ nhớ và dễ gọi tên hơn mọi thông tin"],["C","Vì kẻ lừa đảo chỉ nhắm vào người không biết gì và không đề phòng"],["D","Vì kiểu lừa thì đổi liên tục, còn cảm xúc bị lợi dụng thì cứ lặp lại"]],"ans":"D","exp":{"D":"Đúng. Kiểu lừa thay đổi liên tục, nhưng cảm xúc bị lợi dụng thì cứ lặp lại. Nhận ra cảm xúc giúp mình dừng và kiểm tra kịp thời."}},{"code":"CĐ1-019","q":"Chị P. đọc quảng cáo “sàn đầu tư cam kết lãi 3% mỗi ngày, rút vốn lúc nào cũng được” và thấy nôn nao muốn nạp thử một ít. Chị đang bị đánh vào cảm xúc nào, và việc đầu tiên nên làm là gì?","opt":[["A","THAM - chậm lại, chưa làm gì cả"],["B","SỢ - báo ngay cơ quan công an"],["C","TIN - hỏi lại người đăng quảng cáo cho rõ"],["D","GẤP - nạp thử một ít để xem sao"]],"ans":"A","exp":{"A":"Đúng. Lời hứa lãi cao đánh vào lòng ham và sự nôn nao. Việc đầu tiên là chậm lại, chưa nạp đồng nào, rồi đi kiểm tra ở nơi khác."}},{"code":"CĐ1-005","q":"Anh H. gặp một kiểu lừa chưa từng nghe ai nói tới bao giờ. Vì sao cách “chậm lại, kiểm tra, tự hỏi lại nơi chính thức” vẫn giúp được anh?","opt":[["A","Vì kiểu lừa mới nào cũng được thông báo rộng rãi trước khi xuất hiện"],["B","Vì kiểu lừa mới thường ít nguy hiểm hơn những kiểu đã có từ lâu"],["C","Vì chỉ cần hỏi thêm chính người đang mời chào là đủ biết thật hay giả"],["D","Vì cách này không phụ thuộc vào chuyện mình có biết tên kiểu lừa hay không"]],"ans":"D","exp":{"D":"Đúng. Dù chưa từng nghe tên kiểu lừa đó, anh H. vẫn kiểm tra được ba việc: người này là ai, họ bảo mình làm gì, và mình hỏi lại được ở đâu."}},{"code":"CĐ1-007","q":"Nhân viên tư vấn nói với chị T.: “Ưu đãi này chỉ còn hôm nay thôi, chị cứ ký trước đi, giấy tờ đầy đủ em gửi sau.” Chị T. nên làm gì?","opt":[["A","Ký trước để giữ ưu đãi, hẹn nhân viên gửi giấy tờ đầy đủ ngay hôm sau"],["B","Chưa ký; xin bản đầy đủ rồi tự đọc lại khi không còn bị hối thúc"],["C","Hỏi lại chính nhân viên đó cho kỹ, thấy trả lời trôi chảy thì ký"],["D","Nhờ một người quen từng dùng dịch vụ này xem hộ rồi ký theo ý họ"]],"ans":"B","exp":{"B":"Đúng. Bị hối chính là lúc dễ bỏ qua bước kiểm tra nhất. Xin bản đầy đủ, đọc khi đã hết bị giục, rồi mới quyết."}},{"code":"CĐ1-010","q":"Vì sao cuộc gọi hay tin nhắn đọc đúng tên mình, đúng mã đơn hàng lại dễ làm mình tin?","opt":[["A","Vì thông tin thật thì không thể bị lộ ra ngoài"],["B","Vì thông tin thật làm câu chuyện nghe có vẻ thật hơn"],["C","Vì biết đúng thông tin nghĩa là người gọi có ý tốt"],["D","Vì chỉ cơ quan nhà nước mới biết những thông tin đó"]],"ans":"B","exp":{"B":"Đúng. Thông tin thật làm câu chuyện nghe đáng tin hơn, nhưng người gọi vẫn có thể là kẻ giả mạo."}},{"code":"CĐ1-021","q":"Đang xúc động mà phải quyết việc liên quan đến tiền, thông tin cá nhân hoặc quyền vào điện thoại, quy trình nào chắc nhất?","opt":[["A","CHẬM LẠI - XÁC MINH ĐỘC LẬP - LÀM RÕ ĐIỀU KIỆN - QUYẾT ĐỊNH"],["B","HỎI CHÍNH NGƯỜI ĐANG THUYẾT PHỤC - NGHE XUÔI THÌ QUYẾT ĐỊNH"],["C","QUYẾT NHANH CHO HẾT ÁP LỰC - SAU ĐÓ MỚI KIỂM TRA"],["D","HỎI NGƯỜI QUEN XEM CÓ CẢM GIÁC ĐÁNG TIN KHÔNG - RỒI QUYẾT"]],"ans":"A","exp":{"A":"Đúng. Chậm lại để tách cảm xúc khỏi hành động; kiểm tra qua một kênh độc lập; làm rõ điều kiện bằng thông tin có thể lưu và đối chiếu; rồi mới tự quyết."}},{"code":"CĐ1-049","q":"Đang xúc động trước một giao dịch, làm theo cách nào là hợp lý nhất?","opt":[["A","Quyết luôn, chuyển một khoản nhỏ giữ chỗ, xong rồi mới kiểm tra sau"],["B","Hoãn lại, hỏi nhiều người trong cùng nhóm rồi làm theo ý số đông"],["C","Nhận ra mình đang xúc động, chậm lại, xem rõ việc và người mình giao dịch"],["D","Từ chối giao dịch, rồi hỏi lại trong nhóm bạn xem có ai từng làm chưa"]],"ans":"C","exp":{"C":"Đúng. Cách này chỉ rõ từng việc làm được ngay, không bắt mình phải thuộc lòng bảng biểu nào."}},{"code":"CĐ1-020","q":"Nghe điện thoại của người tự xưng là cán bộ cơ quan A, chị Q. thấy mình rất sợ. Nên làm gì?","opt":[["A","Làm theo lời họ để chứng minh mình trong sạch, rồi kiểm tra lại sau"],["B","Cúp máy. Tra số điện thoại đăng công khai của cơ quan A rồi tự gọi lại"],["C","Giữ máy nghe hết cho rõ đầu đuôi, chưa làm gì cho tới khi họ nói xong"],["D","Cúp máy và không nói với ai, để cả nhà khỏi lo lắng theo"]],"ans":"B","exp":{"B":"Đúng. Thấy mình đang sợ là lúc phải chậm lại. Cúp máy rồi tự tìm số của cơ quan đó mà gọi lại."}},{"code":"CĐ1-041","q":"Một người lạ gửi đường link, bảo anh K. cài ứng dụng để được hỗ trợ. Cách hiểu nào đúng nhất?","opt":[["A","Bài giới thiệu có nhiều lượt thích thì có thể yên tâm bấm vào cài đặt"],["B","Người gửi xưng danh rõ ràng, nói năng rành mạch thì cài cũng được"],["C","Không cài theo yêu cầu trong liên hệ chưa xác minh; nếu thật sự cần thì tự tìm đúng nhà phát hành và xem kỹ quyền ứng dụng"],["D","Cài trước cho nhanh, thấy máy chạy bình thường thì để lại, không thì gỡ"]],"ans":"C","exp":{"C":"Đúng. Có mặt trên kho ứng dụng chưa đủ bảo đảm an toàn: kẻ lừa còn có thể dụ cài một ứng dụng điều khiển từ xa hợp pháp. Chỉ cài ứng dụng mình chủ động cần, đúng nhà phát hành và quyền phù hợp."}},{"code":"CĐ1-038","q":"Người gọi xưng là nhân viên ngân hàng, nói tài khoản anh V. có giao dịch lạ và yêu cầu đọc mã OTP để “khóa khẩn cấp”. Anh V. nên làm gì?","opt":[["A","Hoãn lại, hẹn người gọi mười phút sau gọi lại rồi mới quyết"],["B","Đọc mã, vì đây là việc khóa tài khoản để bảo vệ tiền của mình"],["C","Dừng ngay, không đọc mã; tự gọi ngân hàng bằng số chính thức"],["D","Hỏi thêm mã nhân viên và số hồ sơ, thấy khớp thì làm theo"]],"ans":"C","exp":{"C":"Đúng. Không đọc hoặc gửi OTP cho bất kỳ ai. Cúp máy rồi tự gọi số sau thẻ hoặc trong ứng dụng chính thức mình chủ động mở."}},{"code":"CĐ1-030","q":"Chủ nhà trọ báo từ tháng sau tính lại tiền điện. Người thuê đã đối chiếu với biểu giá điện niêm yết chính thức và với điều khoản trong hợp đồng thuê thấy khớp. Nên làm gì?","opt":[["A","Trả theo mức mới, giữ lại thông báo và hợp đồng để sau này còn đối chiếu"],["B","Trả theo mức mới, không cần giữ giấy tờ gì vì đã kiểm tra thấy đúng rồi"],["C","Chưa trả, yêu cầu chủ nhà ký lại toàn bộ hợp đồng thuê từ đầu"],["D","Trả theo mức cũ cho tới khi có văn bản của cơ quan quản lý gửi riêng cho mình"]],"ans":"A","exp":{"A":"Đúng. Đã đối chiếu thấy khớp thì cứ làm theo. Giữ thông báo và hợp đồng để sau này có gì còn đối chiếu lại được."}},{"code":"CĐ1-045","q":"Vừa nhận ra mình đã chuyển tiền trong một tình huống bất thường. Việc đầu tiên phải làm là gì?","opt":[["A","Xóa lịch sử giao dịch đi cho gọn"],["B","Nhắn tin trách móc kẻ đã lừa mình"],["C","Chờ vài hôm xem tiền có quay lại"],["D","Dừng lại ngay, không chuyển thêm"]],"ans":"D","exp":{"D":"Đúng. Chặn thiệt hại trước đã, rồi mới báo ngân hàng, giữ bằng chứng và trình báo."}},{"code":"CĐ1-048","q":"Bạn của em N. vừa bị lừa mất tiền, định giấu gia đình và tự xoay xở một mình. Nên khuyên bạn ấy điều gì?","opt":[["A","Tự đi tìm kẻ lừa đảo để đòi lại tiền"],["B","Đăng lên mạng xã hội để cảnh báo, kèm đầy đủ thông tin cá nhân"],["C","Cứ giữ kín cho đỡ xấu hổ"],["D","Nói với người nhà và trình báo sớm"]],"ans":"D","exp":{"D":"Đúng. Im lặng làm mất thời gian vàng và dễ bị lừa tiếp. Trình báo sớm còn giúp bảo vệ người khác."}},{"code":"CĐ1-047","q":"Sau khi bị mất tiền, có người tự tìm đến hứa chắc chắn lấy lại được, chỉ cần nộp trước phí hồ sơ. Nên làm gì?","opt":[["A","Không chuyển thêm, dừng liên lạc; lưu tin nhắn và đến cơ quan Công an"],["B","Nộp phí hồ sơ trước, vì họ nắm rõ vụ việc và hứa chắc chắn lấy lại được"],["C","Cài ứng dụng họ gửi để tiện theo dõi tiến độ hồ sơ của mình"],["D","Gửi ảnh giấy tờ và số tài khoản để họ tra giúp xem tiền đi đâu"]],"ans":"A","exp":{"A":"Đúng. Hứa chắc chắn lấy lại được mà lại đòi nộp phí trước là dấu hiệu của lừa lần hai. Không chuyển thêm, dừng liên lạc, giữ lại tin nhắn rồi mang đến cơ quan Công an."}}]},"2":{"t":"Ký hợp đồng và cam kết dịch vụ","q":[{"code":"CĐ2-001","q":"Trước khi ký một hợp đồng dịch vụ dài hạn, câu hỏi nào mình nên tự đặt ra trước tiên?","opt":[["A","Nhân viên tư vấn có phải người xấu, đang cố giấu điều khoản không?"],["B","Trong hợp đồng còn chỗ nào mình chưa hiểu rõ không?"],["C","Có nên ký bản tóm tắt để giữ ưu đãi, hồ sơ đầy đủ bổ sung sau?"],["D","Người quen của mình đã ký loại hợp đồng dài hạn này chưa?"]],"ans":"B","exp":{"B":"Đúng. Câu hỏi này buộc mình dừng lại đúng lúc: còn chỗ quan trọng chưa hiểu thì chưa ký."}},{"code":"CĐ2-002","q":"Việc nào khiến sau này mình khó nói rằng dịch vụ chưa làm xong hoặc chưa giao đủ?","opt":[["A","So giá của ba nơi trước khi chọn một nơi"],["B","Nghe nhân viên giới thiệu rồi hẹn suy nghĩ thêm"],["C","Nhận tờ rơi quảng cáo tại cửa hàng"],["D","Ký biên bản nghiệm thu, xác nhận đã nhận đủ"]],"ans":"D","exp":{"D":"Đúng. Ký biên bản nghiệm thu tức là mình đã xác nhận nhận đủ. Sau đó có nói thiếu thì rất khó chứng minh."}},{"code":"CĐ2-022","q":"Ngoài tên dịch vụ và quyền lợi được hưởng, mình cần biết thêm điều gì trước khi ký?","opt":[["A","Bao giờ mình được nhận, và ai chịu trách nhiệm làm"],["B","Có bao nhiêu khách hàng khác đang dùng dịch vụ này"],["C","Tên, số điện thoại và mã nhân viên của người tư vấn"],["D","Dịch vụ có được quảng cáo nhiều nơi hay không"]],"ans":"A","exp":{"A":"Đúng. Biết tên dịch vụ thôi chưa đủ. Phải biết bao giờ mình được nhận, và tên đơn vị nào đứng ra chịu trách nhiệm nếu không làm đúng."}},{"code":"CĐ2-013","q":"Nhân viên nói: “Phí phát sinh với cách chấm dứt chỉ là quy định chung thôi, không quan trọng đâu.” Câu này đang làm nhẹ đi điều gì?","opt":[["A","Những giấy tờ còn thiếu mà bên bán định gửi sau khi ký"],["B","Quyền được cầm một bản đầy đủ mang về đọc trước khi ký"],["C","Lời hứa của nhân viên chưa được ghi vào giấy tờ công ty"],["D","Số tiền mình có thể phải trả thêm, và cách thoát khỏi hợp đồng"]],"ans":"D","exp":{"D":"Đúng. Phí phát sinh quyết định mình phải trả bao nhiêu, cách chấm dứt quyết định mình có thoát ra được không. Đó là hai mục quan trọng nhất, không phải chuyện nhỏ."}},{"code":"CĐ2-041","q":"Trang đăng ký hiện đồng hồ đếm ngược: “Chỉ còn 02 phút để giữ mức giá này.” Điều gì đang diễn ra?","opt":[["A","Bên bán không cho mình mang văn bản về đọc"],["B","Mình đang bị thúc phải quyết định thật nhanh"],["C","Bên bán muốn mình ký trước, gửi giấy tờ sau"],["D","Bảng phí và điều kiện chấm dứt bị làm cho khó đọc"]],"ans":"B","exp":{"B":"Đúng. Đồng hồ đếm ngược sinh ra để mình bấm đồng ý trước khi kịp đọc. Đó là sức ép, không phải thông tin."}},{"code":"CĐ2-033","q":"Nếu một ưu đãi thật sự sẽ hết hạn trước khi mình đọc xong hợp đồng, nên quyết thế nào?","opt":[["A","Bên bán buộc phải gia hạn ưu đãi cho khách chưa đọc xong"],["B","Ký trước cho kịp giữ giá, đọc kỹ lại vào hôm sau"],["C","Chấp nhận mất ưu đãi, chưa đọc xong thì chưa ký"],["D","Nhờ nhân viên ký thay để kịp thời hạn ưu đãi"]],"ans":"C","exp":{"C":"Đúng. Ưu đãi mất đi là mất một khoản tiền biết trước. Ký khi chưa hiểu là nhận một rủi ro chưa biết to đến đâu."}},{"code":"CĐ2-012","q":"Nhân viên đề nghị: “Anh chị ký trước đi, phụ lục với số tiền em điền sau.” Vì sao phải dừng lại?","opt":[["A","Vì pháp luật cấm mọi việc gửi giấy tờ bổ sung sau khi đã ký"],["B","Vì phụ lục chỉ có giá trị khi ký cùng ngày, cùng chỗ với bản chính"],["C","Vì những điều bất lợi có thể bị điền vào chỗ trống"],["D","Vì nhận thêm giấy tờ sau khi ký thường mất nhiều thời gian"]],"ans":"C","exp":{"C":"Đúng. Chữ ký đã giao rồi thì chỗ trống điền gì mình cũng khó cãi. Đó là điều nguy hiểm nhất."}},{"code":"CĐ2-043","q":"Khi đồng ý một hợp đồng trên mạng, tối thiểu phải làm được những gì thì mới nên bấm xác nhận?","opt":[["A","Mở đúng bản mình sắp đồng ý, đọc hết, và tải hoặc lưu lại được"],["B","Dùng màn hình lớn cho dễ nhìn, dù phần điều khoản chưa mở hết"],["C","Có người hướng dẫn qua điện thoại, đọc giúp các phần quan trọng"],["D","Có bản in giấy và chữ ký tay, dù giao dịch mạng không đòi hỏi"]],"ans":"A","exp":{"A":"Đúng. Ba việc này đi liền nhau: đúng bản, đọc hết, và lưu được. Thiếu việc lưu lại thì sau này mình không có gì trong tay."}},{"code":"CĐ2-017","q":"Anh D. đã đọc hợp đồng nhưng còn một điểm quan trọng chưa rõ, trong khi nhân viên giục ký cho kịp giờ đóng cửa. Anh D. nên làm gì?","opt":[["A","Ký, vì đã đọc gần hết hợp đồng rồi mà"],["B","Nhờ nhân viên trả lời miệng điểm đó rồi ký ngay"],["C","Hoãn tới khi điểm đó được làm rõ"],["D","Ký, rồi ghi thắc mắc của mình vào lề tờ hợp đồng"]],"ans":"C","exp":{"C":"Đúng. Còn điểm quan trọng chưa rõ mà lại đang bị giục, thì đó chính là lúc phải hoãn."}},{"code":"TN-07","q":"Có ba cách xử lý cần nhớ. HOÃN là tạm dừng để hỏi thêm khi còn thiếu thông tin. DỪNG là ngừng hẳn khi gặp yêu cầu nguy hiểm, hoặc khi điều kiện không thể chấp nhận. CÓ THỂ QUYẾT ĐỊNH là khi đã đủ thông tin để tự quyết. Nay có một gói dịch vụ đã rõ bên cung cấp, rõ mình phải trả gì, phải làm gì và được hưởng gì; riêng cách dừng dịch vụ thì họ nói xác nhận xong mới gửi. Nên xử lý thế nào?","opt":[["A","CÓ THỂ QUYẾT ĐỊNH, vì ba mục đã rõ, mục còn lại gửi sau vẫn kịp khiếu nại"],["B","DỪNG, và kết luận bên cung cấp gian dối vì chưa gửi cách dừng dịch vụ"],["C","CÓ THỂ QUYẾT ĐỊNH, nếu người quen cho biết họ từng dừng dịch vụ dễ dàng"],["D","HOÃN, để nhận đúng cách dừng dịch vụ áp dụng cho mình rồi mới xác nhận"]],"ans":"D","exp":{"D":"Đúng. Cách dừng dịch vụ là thông tin quan trọng còn thiếu, nên đây là trường hợp HOÃN. Chưa có thì chưa xác nhận."}},{"code":"CĐ2-030","q":"Khi vừa ký hợp đồng vừa phải đặt cọc, mình cần kiểm tra những gì?","opt":[["A","Đối chiếu kỹ người nhận tiền, còn quyền lợi và cách chấm dứt để đọc sau"],["B","Đọc kỹ hợp đồng, còn tên người nhận tiền và nội dung chuyển thì bỏ qua"],["C","Kiểm tra cả hai: ký với ai, nhận gì, trả gì; và chuyển cho ai, để làm gì"],["D","Ký và chuyển tiền trước, giữ giấy tờ lại phòng khi sau này có vấn đề"]],"ans":"C","exp":{"C":"Đúng. Ký và đặt cọc là hai việc có hai rủi ro khác nhau, nên phải kiểm tra cả nội dung cam kết lẫn đường đi của tiền tránh lừa đảo hoặc tranh chấp."}},{"code":"TN-05","q":"Bản dự thảo sửa nhà đã ghi rõ bên thi công và các hạng mục, nhưng tổng giá lại ghi “chưa gồm phát sinh”, cách chấm dứt thì nói báo sau, và bên kia đang đòi đặt cọc. Cách xử lý nào đầy đủ nhất?","opt":[["A","Làm rõ phạm vi và nghiệm thu, tổng giá và trần phát sinh, tiến độ, chấm dứt, tiền cọc và điều kiện hoàn/mất cọc; rồi kiểm tra đúng người nhận tiền"],["B","Chốt hạng mục rồi ký; phát sinh và cách chấm dứt làm rõ dần sau khi thợ đã vào làm việc"],["C","Nhờ ngân hàng kiểm tra người nhận cọc; tài khoản đúng thì ký, dù tổng tiền và cách chấm dứt chưa rõ"],["D","Kiểm tra người nhận cọc và điều kiện hoàn cọc; tổng tiền và cách chấm dứt hỏi sau vì hạng mục đã rõ"]],"ans":"A","exp":{"A":"Đúng. Cách này kiểm tra cả phạm vi công việc, tổng nghĩa vụ, đường ra và khoản tiền sắp chuyển — những phần dễ phát sinh tranh chấp (hai bên cãi nhau về hợp đồng) nhất."}},{"code":"CĐ2-025","q":"Khi nào việc nhờ một người độc lập đọc và góp ý trước khi ký đặc biệt cần thiết?","opt":[["A","Khi giao dịch nhỏ, điều khoản đã rõ và mình có đủ thời gian tự đọc"],["B","Khi hợp đồng số tiền lớn, kéo dài nhiều năm, hoặc còn chỗ khó hiểu"],["C","Khi nhân viên bán hàng đồng ý cho mình đi hỏi người khác"],["D","Sau khi đã ký, để xem lại mình có hiểu đúng hay không"]],"ans":"B","exp":{"B":"Đúng. Số tiền lớn, thời hạn dài hoặc còn chỗ khó hiểu là ba lúc ý kiến độc lập giúp nhận ra rủi ro tốt nhất."}},{"code":"CĐ2-038","q":"“Đề nghị ghi thỏa thuận thành văn bản có thể lưu và đối chiếu — bằng giấy hoặc điện tử — khi giao dịch với người quen là việc bình thường và bảo vệ cả hai bên.” Nhận định này đúng hay sai?","opt":[["A","Đúng"],["B","Sai"]],"ans":"A","exp":{"A":"Đúng. Văn bản rõ ràng giúp hai bên nhớ và đối chiếu đúng điều đã thống nhất. Hợp đồng điện tử không bị mất giá trị chỉ vì ở dạng thông điệp dữ liệu."}},{"code":"TH09-01-A","q":"Anh Lâm nên quyết thế nào ở bước xác nhận đang mở?","opt":[["A","Xác nhận để giữ giá, lưu quảng cáo và tin nhắn lại, có tranh chấp thì đưa ra"],["B","Xác nhận bản dự thảo, tự ghi chú riêng rằng bảng phí và điều kiện dừng chưa nhận được"],["C","Hoãn ít phút, gọi nhân viên; nếu họ nhắc lại đủ các lời hứa thì xác nhận"],["D","Hoãn bước xác nhận; yêu cầu gửi đủ bảng phí và điều kiện dừng, lưu lại rồi mới quyết"]],"ans":"D","exp":{"D":"Đúng. Còn thiếu hai mục quan trọng là phí và cách dừng, lại đang bị giục, nên phải hoãn bước xác nhận để làm rõ."}},{"code":"TH09-01-B","q":"Việc tiếp theo nào là phù hợp nhất?","opt":[["A","Đợi người quen dùng thử cùng gói; họ dùng không gặp vấn đề gì thì anh Lâm xác nhận theo"],["B","Nhận đủ hồ sơ rồi đối chiếu các nhóm tối thiểu trước khi quyết, kể cả gia hạn, tải/xóa dữ liệu và hậu quả khi dừng"],["C","Chỉ gọi tổng đài hỏi giá cuối cùng, lưu câu trả lời rồi xác nhận, vì các mục khác đã có trên quảng cáo"],["D","Yêu cầu tổng đài xác nhận ưu đãi và thời hạn áp dụng, còn cách tải dữ liệu và cách dừng thì bỏ qua"]],"ans":"B","exp":{"B":"Đúng. Bốn câu ai cung cấp, tổng tiền, quyền lợi và cách dừng là mức tối thiểu; với dịch vụ lưu trữ còn phải xem tự động gia hạn, cách tải/xóa dữ liệu, bảo mật và hậu quả khi chấm dứt."}},{"code":"TH09-02-A","q":"Giấy tờ đã đủ để quyết chưa, và gia đình nên làm gì ở bước xác nhận đang mở?","opt":[["A","Đủ rồi, vì hợp đồng chính tải được; xác nhận xong sẽ lưu phụ lục ở bước sau"],["B","Đủ rồi, nếu chụp lại quảng cáo và đang thao tác trong đúng ứng dụng chính thức"],["C","Chưa đủ; thoát khỏi bước xác nhận, vì chưa mở được phụ lục mà lại đang bị đồng hồ giục"],["D","Hoãn ít phút, nhờ nhân viên đọc phụ lục qua điện thoại, ghi âm rồi xác nhận"]],"ans":"C","exp":{"C":"Đúng. Giấy tờ chưa đầy đủ và đồng hồ đang gây áp lực. Hãy thoát khỏi bước xác nhận, yêu cầu đúng bản phụ lục rồi mới cân nhắc lại."}},{"code":"TH09-02-B","q":"Việc tiếp theo nào giúp gia đình xem xét lại an toàn nhất?","opt":[["A","Nhờ một người trong nhà đăng nhập thử, xem bảng phí rồi hủy nếu khác quảng cáo"],["B","Gọi nhân viên đọc phụ lục qua tổng đài, ghi âm lại rồi xác nhận trước khi hết ưu đãi"],["C","Chỉ kiểm tra tên ứng dụng và bên thu tiền; đúng cả thì bỏ qua lỗi không mở được phụ lục"],["D","Yêu cầu gửi đúng bản hợp đồng và phụ lục sẽ áp dụng, lưu quảng cáo rồi đối chiếu phí"]],"ans":"D","exp":{"D":"Đúng. Cách này lấy lại đủ ba thứ: giấy tờ đầy đủ, thời gian đọc, và bằng chứng để đối chiếu quảng cáo với hợp đồng."}},{"code":"CĐ2-006","q":"Anh S. bị thu một khoản tiền định kỳ để tiếp tục dùng dịch vụ. Khoản này nằm trong phụ lục mà anh chưa từng đọc. Kết luận nào phù hợp nhất?","opt":[["A","Phải xem phụ lục đến tay anh S. lúc nào, và anh đồng ý ra sao"],["B","Chắc chắn không phải trả, vì anh S. chưa hề được đọc phụ lục đó"],["C","Chắc chắn phải trả, vì tài liệu đó mang tên là phụ lục hợp đồng"],["D","Chỉ cần gọi hỏi lại nhân viên tư vấn là biết có phải trả hay không"]],"ans":"A","exp":{"A":"Đúng. Cần xem hợp đồng chính có dẫn chiếu phụ lục không, phụ lục có mở được trước khi đồng ý, đúng phiên bản nào, có bằng chứng chấp thuận ra sao và điều khoản có trái quy định bảo vệ người tiêu dùng hay không."}},{"code":"CĐ2-003","q":"Sau khi ký mà phát sinh vướng mắc, cách kiểm tra nào phù hợp nhất?","opt":[["A","Xem lại quảng cáo cũ, nhưng không so với bản hợp đồng đã ký"],["B","So bản đã ký với phụ lục, bảng phí, tin nhắn và biên lai"],["C","Nghe lại lời người tư vấn và coi đó là căn cứ duy nhất"],["D","Dựa vào trí nhớ về những điều hai bên đã nói với nhau lúc đó"]],"ans":"B","exp":{"B":"Đúng. Đặt các giấy tờ cạnh nhau thì mới thấy được chỗ vênh giữa lời giới thiệu và điều mình đã ký."}},{"code":"CĐ2-047","q":"Chị P. phát hiện khoản phí bị thu khác với lời giới thiệu ban đầu, mà còn một phụ lục chị chưa được đọc. Việc đầu tiên nên làm là gì?","opt":[["A","Không ký bổ sung, chưa nộp khoản chưa rõ; gom hồ sơ và kiểm tra ngay các mốc thanh toán, hủy, gia hạn"],["B","Nộp khoản đang bị yêu cầu để giữ quyền lợi, rồi mới đối chiếu phụ lục với quảng cáo"],["C","Ngừng trả mọi khoản ngay lập tức, không cần xem thời hạn hay điều kiện hủy và gia hạn"],["D","Đăng hợp đồng và thông tin cá nhân lên một nhóm trên mạng để nhờ mọi người xem giúp"]],"ans":"A","exp":{"A":"Đúng. Khoản phí đã phát sinh nên cần xử lý hồ sơ và thời hạn ngay; đồng thời không ký bổ sung hoặc nộp thêm khoản chưa được làm rõ."}},{"code":"TH09-03-A","q":"Chị Ngân nên quyết thế nào trước tiên?","opt":[["A","Ngừng luôn kỳ phí sắp đến hạn và đòi hoàn lại tiền; nếu họ từ chối thì đưa chuyện lên mạng"],["B","Chưa đồng ý phụ lục, không xóa ảnh quảng cáo; yêu cầu giải thích bằng tin nhắn"],["C","Đồng ý phụ lục, lưu bản mới rồi xóa ảnh cũ; nếu phí sai thì lấy bản mới ra khiếu nại"],["D","Đăng cả hợp đồng và thông tin tài khoản lên mạng để nhờ mọi người xác nhận quyền hủy"]],"ans":"B","exp":{"B":"Đúng. Cách này giữ được bằng chứng, không tạo thêm rủi ro mới, mà vẫn xử lý kịp khoản sắp đến hạn."}},{"code":"TH09-03-B","q":"Nếu chuyện vẫn chưa được giải quyết, chị nên chuẩn bị gì và liên hệ bằng cách nào?","opt":[["A","Chỉ giữ bản hợp đồng, gọi nhân viên qua tổng đài hỏi phí và cách hủy, rồi cứ làm theo lời họ nói"],["B","Chuyển phí cho người hứa hủy hợp đồng giúp, sau khi họ gửi ảnh giấy tờ và cam kết hoàn tiền"],["C","Gom hợp đồng, bảng phí, quảng cáo, tin nhắn và biên lai; liên hệ bằng cách lưu lại được"],["D","Chỉ gọi tổng đài hỏi lại phụ lục; họ xác nhận miệng là được thì cứ tiếp tục dùng dịch vụ"]],"ans":"C","exp":{"C":"Đúng. Có đủ giấy tờ, lại trao đổi bằng tin nhắn hoặc email lưu lại được, thì chị mới có cơ sở để khiếu nại hoặc nhờ hỗ trợ."}},{"code":"CĐ2-050","q":"Sau khi gặp chuyện, có người lạ tự tìm đến, hứa chắc chắn hủy được hợp đồng và lấy lại toàn bộ tiền, chỉ cần nộp phí trước. Nên làm gì?","opt":[["A","Nộp phí nếu họ gửi ảnh giấy tờ, địa chỉ văn phòng và cam kết hoàn tiền bằng văn bản"],["B","Đưa thông tin đăng nhập để họ kiểm tra trước, nhưng chưa chuyển tiền cho tới khi có kết quả"],["C","Thương lượng giảm phí rồi chuyển một phần, và đòi họ báo tiến độ xử lý hồ sơ"],["D","Không nộp tiền, không đưa thông tin đăng nhập; tự tìm và liên hệ nơi chính thức để hỏi"]],"ans":"D","exp":{"D":"Đúng. Hứa chắc chắn lấy lại tiền mà đòi nộp phí trước đây là dấu hiệu rất đáng ngại của lừa đảo lần hai. Việc cần làm là tự tìm nơi chính thức để hỏi."}}]},"3":{"t":"Đầu tư, góp vốn và tài sản","q":[{"code":"TN-09","q":"Trường hợp nào là góp vốn, tức là phải cân nhắc rủi ro kỹ trước khi đưa tiền?","opt":[["A","Đưa tiền để cùng làm ăn, lãi cùng hưởng và lỗ cùng chịu"],["B","Đặt mua thiết bị, trả dần nhiều đợt, nhận hàng vào ngày đã hẹn"],["C","Cho người quen vay một khoản, đã hẹn ngày trả và mức trả"],["D","Đóng phí sử dụng một dịch vụ trong sáu tháng"]],"ans":"A","exp":{"A":"Đúng. Đây là góp vốn: tiền của mình vào chung việc làm ăn, làm ăn tốt thì được chia, thua thì mình cùng mất."}},{"code":"CĐ3-003","q":"Một tờ giấy đề là “hợp tác đầu tư”, nhưng lại hứa trả đủ tiền gốc và thêm một khoản cố định hằng tháng, làm ăn lãi hay lỗ cũng vậy. Nên làm gì?","opt":[["A","So mức lãi với vài nơi khác rồi chọn nơi trả cao hơn"],["B","Coi là góp vốn, vì giấy ghi chữ “đầu tư” và có dấu công ty"],["C","Làm rõ đây là góp vốn hay cho vay, và ai phải trả tiền cho mình"],["D","Coi là gửi tiết kiệm, vì khoản trả được hứa đều đặn hằng tháng"]],"ans":"C","exp":{"C":"Đúng. Hứa trả đủ gốc kèm một khoản cố định thì gần với cho vay hơn là góp vốn. Phải làm rõ ai vay, ai trả, và điều kiện đòi lại."}},{"code":"CĐ3-005","q":"Một người mua trái phiếu hoặc sản phẩm đầu tư ngay tại quầy ngân hàng. Vì sao vẫn phải xem kỹ đó thật ra là thứ gì?","opt":[["A","Vì mua ở quầy ngân hàng thì đương nhiên đó là tiền gửi ngân hàng"],["B","Vì ngân hàng đã giới thiệu thì phải chịu thay mọi khoản lỗ"],["C","Vì sản phẩm do một doanh nghiệp hợp pháp phát hành thì không mất vốn"],["D","Vì mua ở đâu không quan trọng bằng biết ai phải trả tiền cho mình"]],"ans":"D","exp":{"D":"Đúng. Điều cần biết là đơn vị nào phát hành, ai phải trả tiền cho mình, và mình chịu rủi ro gì. Nơi bán không quyết định những điều đó."}},{"code":"CĐ3-009","q":"Không rõ tiền lãi ở đâu ra; người nhận tiền không đúng tên công ty; thu nhập dựa vào việc kéo thêm người mới; nạp thì dễ mà rút thì khó. Bốn điều này nói lên gì?","opt":[["A","Mỗi điều chỉ ra một chỗ mình cần dừng lại kiểm tra"],["B","Chỉ đáng lo khi số tiền mình định bỏ ra đã khá lớn"],["C","Chỉ có ý nghĩa khi lời mời xuất hiện trên mạng"],["D","Có thể bỏ qua nếu người mời là chỗ quen biết"]],"ans":"A","exp":{"A":"Đúng. Không rõ lãi ở đâu ra thì hỏi tiền ở đâu ra. Người nhận không khớp thì hỏi ai nhận. Nạp dễ rút khó thì hỏi điều kiện rút. Riêng việc bị đòi mật khẩu, mã OTP hoặc bắt nộp thêm mới cho rút thì phải dừng ngay."}},{"code":"CĐ3-007","q":"Vì sao lời hứa “lãi cao, cố định, mà lại bảo toàn vốn, không có rủi ro” là thứ phải kiểm tra kỹ nhất?","opt":[["A","Vì thấy lãi cao là đủ căn cứ kết luận họ vi phạm pháp luật"],["B","Vì tổ hợp lãi cao, cố định, bảo toàn vốn và “không rủi ro” là bất thường; mọi bảo đảm phải kiểm tra được"],["C","Vì mức lãi cao và cố định cho biết mình phải nộp bao nhiêu thuế"],["D","Vì cơ hội lãi cao chỉ hợp với người đã nhiều kinh nghiệm đầu tư"]],"ans":"B","exp":{"B":"Đúng. Một sản phẩm có thể ghi lãi suất cố định, nhưng vẫn có nguy cơ bên cầm tiền không trả được và khả năng rút tiền ra. Tổ hợp lãi cao, bảo toàn vốn và “không rủi ro” chỉ đáng tin khi xác minh được nghĩa vụ, căn cứ bảo đảm và khả năng thanh toán."}},{"code":"CĐ3-040","q":"Một ứng dụng có mã giới thiệu, xếp hạng người kéo được nhiều người và trả hoa hồng nhiều tầng chủ yếu theo số người mới cùng số tiền họ nạp. Đây là dấu hiệu nào?","opt":[["A","Không giải thích được tiền lãi ở đâu ra"],["B","Được thưởng khi rủ thêm người tham gia"],["C","Hứa một mức lợi nhuận cố định"],["D","Nộp tiền thì dễ, rút tiền thì khó"]],"ans":"B","exp":{"B":"Đúng. Khi hoa hồng chủ yếu gắn với số người mới và số tiền họ nạp, thu nhập không dựa vào hàng hóa, dịch vụ hay hoạt động tạo doanh thu đã được chứng minh."}},{"code":"TN-19","q":"Một sàn tiền ảo trả thưởng chủ yếu bằng tiền của người mua sau. Còn công nghệ, khách hàng thật và việc làm ăn tạo ra doanh thu thì không chứng minh được. Nên đánh giá thế nào?","opt":[["A","Mua được, khi nhóm đông nhanh, giá tăng và có ảnh người rút được tiền"],["B","Tham gia sớm rồi bán ra trước lúc người mua bắt đầu thưa dần đi"],["C","Chuyển thử một khoản nhỏ để xem có rút ra được hay không"],["D","Phải dừng, vì tiền trả lấy từ người vào sau"]],"ans":"D","exp":{"D":"Đúng. Khi tiền trả cho người trước lấy từ người vào sau, thì hễ người mới ngừng vào là dòng tiền đứt."}},{"code":"CĐ3-053","q":"Anh P. nạp một khoản nhỏ vào ứng dụng đầu tư, thấy báo có lãi và rút ra được một lần. Kết luận nào đúng?","opt":[["A","Cứ tăng dần tiền nạp, miễn lần nào rút thử cũng về đúng hạn"],["B","Khoản lãi ban đầu chứng tỏ hệ thống của họ sinh lợi nhuận thật"],["C","Chỉ chứng minh lần rút đó đã thành công; chưa chứng minh nền tảng hợp pháp hay lần rút sau sẽ thành công"],["D","Sàn đã an toàn, vì đã trả tiền thật và xử lý xong một lệnh rút"]],"ans":"C","exp":{"C":"Đúng. Chỉ nên kết luận đúng bằng dữ kiện: một lần rút đã xong. Điều đó không chứng minh tính hợp pháp, nguồn lợi nhuận hay khả năng rút ở lần sau."}},{"code":"TH04-01-A","q":"Anh Q. nên hiểu lần rút 500 nghìn đó như thế nào?","opt":[["A","Chứng tỏ sàn có tiền và xử lý lệnh được; rút đúng ngày thì nên tăng vốn"],["B","Chứng tỏ hệ thống của sàn đã thật sự sinh lời trong đợt vừa rồi"],["C","Cho phép tăng vốn, miễn là mỗi đợt đều rút thử và có biên nhận đầy đủ"],["D","Chỉ chứng tỏ một lần rút đã xong, không chứng tỏ sàn an toàn"]],"ans":"D","exp":{"D":"Đúng. Bên nắm quyền hiển thị số dư và xử lý lệnh có thể cho rút một khoản nhỏ ban đầu; đó có thể là tiền mồi để tạo lòng tin, nhưng bản thân một lần rút chưa đủ kết luận ý đồ hay tính hợp pháp."}},{"code":"TH04-01-B","q":"Trước lời mời nạp 200 triệu, anh Q. nên làm gì?","opt":[["A","Dừng nạp; tự tra tiền lãi ở đâu ra và ai đứng ra vận hành sàn"],["B","Nạp 20 triệu trước, để xem sàn cho rút tới mức nào"],["C","Yêu cầu môi giới viết cam kết cho rút vốn bất cứ lúc nào"],["D","Nhờ một thành viên VIP trong nhóm xác nhận cách rút khoản lớn"]],"ans":"A","exp":{"A":"Đúng. Đây là lúc chuyển từ tin vào cảm giác sang tìm thông tin kiểm tra được ở nơi khác."}},{"code":"CĐ3-008","q":"Bên mời đầu tư chỉ đưa ra hồ sơ do chính họ soạn. Mình chưa tra được thông tin nào ở nơi khác. Nên làm gì?","opt":[["A","Hoãn lại, tự tra cứu ở cơ quan hoặc trang chính thức"],["B","Đăng ngay lên mạng rằng bên mời này chắc chắn đang lừa đảo"],["C","Góp một khoản nhỏ để xem họ có làm đúng như lời hứa không"],["D","Tin hồ sơ, vì in đẹp, có dấu đỏ và nhiều người cùng xác nhận"]],"ans":"A","exp":{"A":"Đúng. Hoãn lại rồi tự tìm nơi tra cứu chính thức. Đừng dùng đường dẫn do chính bên mời gửi cho."}},{"code":"CĐ3-028","q":"Khi hỏi “phần vốn và quyền lợi của tôi được ghi lại ở đâu?”, mình đang muốn có được thứ gì?","opt":[["A","Tên mình được thêm vào nhóm trao đổi của những người đã góp vốn"],["B","Một tờ chứng nhận in đẹp, nhưng không ghi rõ quyền lợi và số vốn"],["C","Giấy tờ ghi rõ số vốn, quyền lợi, và có bên nhận vốn ký xác nhận"],["D","Quyền được mời dự sự kiện và nhận quà do bên nhận vốn tổ chức"]],"ans":"C","exp":{"C":"Đúng. Phải ghi đủ ba thứ: mình góp bao nhiêu, được hưởng gì, và đơn vị nào chịu trách nhiệm. Có ký xác nhận thì mới đối chiếu được về sau."}},{"code":"CĐ3-051","q":"Một nhóm mời ông K. dùng “siêu trí tuệ nhân tạo tự động giao dịch”, hứa lãi cố định và bù lại mọi khoản lỗ. Trước khi chuyển tiền, ông nên làm gì?","opt":[["A","Nạp một khoản nhỏ, theo dõi vài đợt rồi mới tăng tiền lên"],["B","Tự tra ai đứng tên, tiền lãi ở đâu ra và rút bằng cách nào"],["C","Xin nhóm gửi ảnh giấy phép, báo cáo và lời chứng của người đã tham gia"],["D","Yêu cầu người quản trị viết giấy cam kết bù lỗ và trả đúng hẹn"]],"ans":"B","exp":{"B":"Đúng. Ba điều này tra được ở nơi khác, ngoài lời quảng cáo của chính họ. Đó mới là kiểm tra thật."}},{"code":"TN-14","q":"Một dự án đất nền mời đặt cọc “suất nội bộ”. Công ty có đăng ký thật, nhưng tiền phải chuyển vào tài khoản cá nhân của người quản lý, mà chưa rõ ai có quyền nhận tiền cho đúng thửa đất đó. Nên hiểu thế nào?","opt":[["A","Phải kiểm tra thửa đất, ai có quyền bán, ai được nhận tiền và dựa vào đâu để nhận cọc"],["B","Tài khoản cá nhân vẫn an toàn, miễn là ghi rõ nội dung chuyển tiền là đặt cọc đất"],["C","Công ty có thật thì người quản lý đương nhiên được nhận tiền vào tài khoản riêng"],["D","Chỉ cần môi giới gửi căn cước, ảnh bản đồ và giấy đăng ký kinh doanh là đủ"]],"ans":"A","exp":{"A":"Đúng. Công ty có thật chưa chứng minh họ được phép chào bán chính thửa đất đó, càng chưa chứng minh người kia được nhận tiền."}},{"code":"TN-15","q":"Bản dự thảo góp vốn ghi thời hạn ba năm, nhưng không nói có được rút trước hạn hay nhượng lại cho người khác hay không. Nên làm gì?","opt":[["A","Góp một phần vốn, vì đã ghi thời hạn và người quản lý hứa sẽ mua lại khi cần"],["B","Chấp nhận, nếu người quản lý chịu viết cam kết mua lại phần vốn khi mình cần tiền"],["C","Hoãn lại; yêu cầu ghi rõ điều kiện rút, nhượng lại, thời điểm và các khoản phí"],["D","Ký trước, rồi xin bổ sung quyền rút hoặc nhượng lại khi dự án bắt đầu có lãi"]],"ans":"C","exp":{"C":"Đúng. Rút vốn, nhượng lại và các khoản phí là những quyền quan trọng nhất. Phải rõ trước khi đưa tiền."}},{"code":"TH03-02-A","q":"Ông K. nên hiểu và quyết thế nào?","opt":[["A","Coi là tiền gửi, vì được tư vấn ngay tại ngân hàng; lãi trả vào tài khoản ngân hàng thì ký được"],["B","Mua được, vì hợp đồng do công ty chứng khoán ký và bên phát hành có bất động sản"],["C","Chỉ cần nhân viên nhắn tin xác nhận ngân hàng sẽ giúp bán lại sau 31 ngày là ký"],["D","Đây là trái phiếu, không phải tiền gửi; Công ty A có nghĩa vụ trả, còn lời hứa mua lại sau 31 ngày không có trong hợp đồng nên chưa ký"]],"ans":"D","exp":{"D":"Đúng. Hồ sơ xác định Công ty A là bên phát hành và có nghĩa vụ trả nợ; ngân hàng chỉ giới thiệu. Không có điều khoản mua lại sau 31 ngày thì không được suy ra mình sẽ rút được lúc đó."}},{"code":"TH03-02-B","q":"Trước khi cân nhắc lại, ông K. cần tự tra những thông tin nào?","opt":[["A","Những lời hứa miệng, nhờ cả ngân hàng lẫn công ty chứng khoán cùng xác nhận lại một lần nữa"],["B","Công ty A là ai, vay để làm gì, dòng tiền trả nợ, khi nào trả, bán lại thế nào, và bảo lãnh/tài sản bảo đảm nếu có"],["C","Chức danh nhân viên, địa chỉ chi nhánh, ngân hàng hoạt động bao nhiêu năm và quy mô ra sao"],["D","Mức lãi đã trả cho khách trước, ảnh dự án, số lượng khách hàng và lời giới thiệu về quy mô"]],"ans":"B","exp":{"B":"Đúng. Sáu nhóm thông tin này giúp đánh giá khả năng Công ty A trả nợ, khả năng lấy tiền ra sớm và quyền của người mua nếu bên phát hành không trả."}},{"code":"TN-16","q":"Có ba cách xử lý cần nhớ. HOÃN là tạm dừng để hỏi thêm khi còn thiếu thông tin. DỪNG là ngừng hẳn khi gặp yêu cầu nguy hiểm, hoặc khi điều kiện không thể chấp nhận. CÓ THỂ QUYẾT ĐỊNH là khi đã đủ thông tin để tự quyết. Nay tra một dự án thì thấy công ty có thật, nhưng hỏi tiền lãi ở đâu ra thì họ né, lại còn thúc chốt ngay trong ngày. Nên xử lý thế nào?","opt":[["A","CÓ THỂ QUYẾT ĐỊNH, vì có công ty thật, có người quản lý và có lịch sử tài khoản"],["B","HOÃN, nhưng vẫn chuyển tiền giữ chỗ, lấy biên nhận rồi kiểm tra nguồn lãi sau"],["C","DỪNG, vì vừa có chỗ đáng ngại vừa bị thúc ép"],["D","CÓ THỂ QUYẾT ĐỊNH, bằng cách nạp một khoản nhỏ xem có rút ra được không"]],"ans":"C","exp":{"C":"Đúng. Ở đây có hai điều cùng lúc: né câu hỏi quan trọng nhất, và ép về thời gian. Đủ để dừng hẳn, không chỉ hoãn."}},{"code":"TH03-03-A","q":"Khi chưa có ai ngoài quỹ xác nhận, chị A. nên quyết thế nào?","opt":[["A","Hoãn chuyển tiền; báo cáo của chính quỹ chưa đủ"],["B","Chờ đến khi có người không rút được tiền; nếu quỹ vẫn trả đều thì bắt đầu tham gia"],["C","Tham gia được, vì mức lãi không quá cao mà kết quả lại đều đặn suốt thời gian dài"],["D","Góp một khoản nhỏ, vì người giới thiệu có tiếng và quỹ đã hoạt động được nhiều năm"]],"ans":"A","exp":{"A":"Đúng. Chị A. không cần chứng minh quỹ có sai phạm hay không. Chỉ cần chưa có ai ngoài quỹ xác nhận là đã đủ lý do hoãn."}},{"code":"TH03-03-B","q":"Nhóm bằng chứng nào có giá trị nhất để biết tiền lãi thật sự ở đâu ra?","opt":[["A","Ảnh sao kê của thành viên, lịch sử rút tiền, số năm hoạt động và các lần quỹ đã trả lãi"],["B","Lý lịch người quản lý, bài thuyết trình chi tiết và mô tả về cách đầu tư bí mật"],["C","Ý kiến khách hàng lâu năm, giấy cam kết hoàn vốn và danh sách người được giới thiệu"],["D","Xác nhận từ bên ngoài quỹ về tài sản, giao dịch, kiểm toán và điều kiện rút vốn"]],"ans":"D","exp":{"D":"Đúng. Phải có một bên không ăn chia gì với quỹ đứng ra xác nhận tài sản và giao dịch. Sau đó mới xét tới quyền rút vốn của mình."}},{"code":"CĐ3-018","q":"Ông H. muốn góp thêm 200 triệu vào một nơi đang trả lãi đều, nhưng phải thế chấp quyền sử dụng đất hoặc nhà ở mới có tiền. Ông nên làm gì?","opt":[["A","Thế chấp quyền sử dụng đất/nhà ở, vì nơi này trả lãi đều nhiều tháng và người quen vẫn góp thêm"],["B","Chỉ vay một phần trên giá trị tài sản, rồi chia tiền góp vào vài nơi khác nhau"],["C","Vay người quen thay cho thế chấp nhà đất, để đỡ rủi ro cho chỗ ở"],["D","Không góp, vì phải đi vay hoặc thế chấp tài sản thiết yếu mới có tiền đã là lý do để dừng"]],"ans":"D","exp":{"D":"Đúng. Tiền vay vẫn phải trả dù đầu tư lỗ; thế chấp quyền sử dụng đất hoặc nhà ở còn có thể đe dọa chỗ ở của gia đình."}},{"code":"CĐ3-037","q":"Chị M. đã kiểm tra xong doanh nghiệp, tài khoản nhận tiền, tiền lãi ở đâu ra, hợp đồng, cách rút vốn, và cả khả năng chịu mất khoản tiền đó. Không còn điểm quan trọng nào chưa rõ. Chị nên làm gì?","opt":[["A","Không góp, vì khoản góp vốn nào cũng có thể lỗ như thường"],["B","Tự cân nhắc và quyết định, vì đã kiểm tra xong"],["C","Hoãn thêm ít nhất sáu tháng nữa, dù không còn gì cần kiểm tra"],["D","Chỉ góp nếu bên nhận vốn viết thêm cam kết hoàn trả đủ vốn"]],"ans":"B","exp":{"B":"Đúng. Kiểm tra xong mà không còn gì chưa rõ thì quyền quyết định thuộc về chị M. Chương trình này không dạy từ chối mọi thứ."}},{"code":"CĐ3-038","q":"Anh K. đã kiểm tra kỹ doanh nghiệp, tiền lãi ở đâu ra, hợp đồng, cách rút vốn, và hiểu rằng mình có thể lỗ. Một năm sau, xưởng làm ăn thua lỗ nên phần vốn của anh giảm. Nhận định nào đúng?","opt":[["A","Đây là rủi ro làm ăn mà anh K. đã biết và chấp nhận từ đầu"],["B","Đây là dấu hiệu lừa đảo, cần đi trình báo ngay lập tức"],["C","Anh K. đã kiểm tra sai ở đâu đó nên mới bị lỗ như vậy"],["D","Bên nhận vốn phải hoàn lại toàn bộ số tiền anh K. đã góp"]],"ans":"A","exp":{"A":"Đúng. Kiểm tra kỹ giúp anh biết mình bỏ tiền vào đâu và có thể mất gì. Nó không làm cho việc làm ăn luôn có lãi."}},{"code":"TH04-02-A","q":"Chị L. nên quyết thế nào?","opt":[["A","Yêu cầu quản trị viên viết cam kết sẽ mở cho rút sau ba lệnh đó"],["B","Dừng giao dịch và dừng nộp thêm, vì điều kiện rút đang bị họ thay đổi"],["C","Làm một lệnh nhỏ để kiểm tra tài khoản; ghi nhận được thì làm tiếp"],["D","Gửi thêm ảnh giấy tờ tùy thân theo đường dẫn họ đưa để sửa thông tin"]],"ans":"B","exp":{"B":"Đúng. Đến lúc rút mới đẻ ra điều kiện mới, đó chính là dấu hiệu phải dừng. Đừng đi tiếp trong luật chơi do họ tự đặt."}},{"code":"TH04-02-B","q":"Việc tiếp theo phù hợp nhất là gì?","opt":[["A","Xóa ứng dụng đi rồi chờ người môi giới chủ động hoàn tiền lại"],["B","Giao tài khoản cho môi giới, nhờ họ thao tác giúp cho nhanh"],["C","Chụp điều kiện rút và sao kê; đồng thời báo ngay ngân hàng/tổ chức thanh toán và tra đơn vị vận hành"],["D","Đôi co với quản trị viên cho tới khi họ nói ra lý do chặn rút"]],"ans":"C","exp":{"C":"Đúng. Giữ chứng cứ và liên hệ nơi tiền đã đi qua phải làm ngay; việc xác minh đơn vị vận hành được làm song song, không chờ tra xong mới báo."}},{"code":"TH04-03-A","q":"Ông T. nên xử lý thế nào?","opt":[["A","Vay ngắn hạn để giữ lệnh; giá quay lại thì trả nợ sau"],["B","Giao quyền vào tài khoản cho môi giới tự xoay xở giúp"],["C","Nạp một nửa thôi, giữ lệnh cũ và chờ giá hồi thêm chút nữa"],["D","Dừng nạp thêm; số đã mất không phải lý do để bỏ thêm tiền mới"]],"ans":"D","exp":{"D":"Đúng. Câu “dừng là mất trắng” là câu để ép ông nạp tiếp. Tiền đã mất không làm cho yêu cầu mới an toàn hơn."}},{"code":"TH04-03-B","q":"Việc tiếp theo phù hợp nhất là gì?","opt":[["A","Xóa hết tin nhắn nặng nề đi cho đỡ căng thẳng đầu óc trong lúc này"],["B","Chụp lại toàn bộ, liên hệ ngay nơi tiền đã đi qua, bảo vệ tài khoản và trình báo"],["C","Cứ giữ liên lạc, vờ như sắp nạp tiếp để moi thêm thông tin về họ"],["D","Công khai tên tuổi người môi giới lên mạng để ép họ hoàn trả tiền"]],"ans":"B","exp":{"B":"Đúng. Tình huống chưa cho biết ông T. đã cấp quyền vào máy, nên ưu tiên là giữ chứng cứ, gọi ngân hàng/tổ chức thanh toán để tra soát, bảo vệ tài khoản liên quan và trình báo."}},{"code":"CĐ3-054","q":"Khi chị Hạnh xin rút tiền, sàn báo phải nộp thêm “thuế xác minh” và mua gói VIP thì tài khoản mới mở. Chị nên làm gì?","opt":[["A","Nộp khoản thuế trước khi nhận hóa đơn, còn phí VIP thì trả sau khi tiền đã về"],["B","Nhờ người môi giới ứng trước hai khoản đó, rồi hoàn lại cho họ sau"],["C","Dừng nộp, giữ lại bằng chứng và gọi ngay ngân hàng bằng số in trên thẻ"],["D","Đặt một lệnh nhỏ trước, xem tài khoản còn hoạt động bình thường không"]],"ans":"C","exp":{"C":"Đúng. Dừng nộp để chặn thiệt hại mới, gọi ngân hàng để tra soát, và giữ bằng chứng để trình báo."}}]},"4":{"t":"Vay, cho vay và bảo lãnh","q":[{"code":"CĐ4-001","q":"Có người mời vay nhanh. Trước khi ký, điều đầu tiên mình nên tự hỏi là gì?","opt":[["A","Bên cho vay có chịu duyệt hồ sơ của mình hay không"],["B","Mức lãi bên này rao có thấp hơn mấy nơi khác không"],["C","Mình có thật sự cần vay không, và có trả nổi không"],["D","Vay một khoản nhỏ trước rồi tính khả năng trả sau"]],"ans":"C","exp":{"C":"Đúng. Trước khi nhận nợ phải biết mình có cần khoản này không, tổng phải trả bao nhiêu, và mỗi tháng lấy đâu ra tiền trả."}},{"code":"CĐ4-005","q":"Một tờ giấy đề là “góp vốn”, nhưng lại buộc bên nhận tiền phải trả đủ vào một ngày cố định và trả thêm một khoản cố định, dù làm ăn lãi hay lỗ. Nên làm gì?","opt":[["A","Coi đây là dấu hiệu của khoản vay hoặc nghĩa vụ hoàn trả cố định, tức là đã nhận tiền thì đến hạn phải trả đủ, không phụ thuộc làm ăn lãi hay lỗ và kiểm tra kỹ"],["B","Coi là góp vốn, vì giấy ghi chữ đó và hai bên đã cùng ký"],["C","Coi là tiền gửi, vì có hẹn trả tiền đều đặn theo từng kỳ"],["D","Không cần kiểm tra là loại gì, vì hai bên đã ký vào giấy rồi"]],"ans":"A","exp":{"A":"Đúng. Ngày hoàn tiền và khoản trả thêm cố định là dấu hiệu giao dịch có bản chất vay hoặc tạo nghĩa vụ hoàn trả cố định. Tên “góp vốn” chưa đủ để kết luận; phải đọc toàn bộ quyền, nghĩa vụ và rủi ro."}},{"code":"CĐ4-028","q":"Muốn biết bên cho vay có đáng tin hay không thì nên tra ở đâu?","opt":[["A","Bộ tài liệu giới thiệu chính thức mà bên cho vay đưa mình"],["B","Xem chính xác bên cho vay là công ty hay tổ chức nào, rồi tra ở nguồn chính thức"],["C","Điểm đánh giá và số lượt tải của ứng dụng cho vay đó"],["D","Lời khẳng định của một người đã vay ở đó trước mình"]],"ans":"B","exp":{"B":"Đúng. Không phải mọi loại bên cho vay nằm trong một danh sách; đăng ký doanh nghiệp cũng không tự đồng nghĩa được phép cho vay. Phải tra đúng cơ quan hoặc cơ sở dữ liệu áp dụng cho loại hình đó."}},{"code":"CĐ4-039","q":"Một ứng dụng duyệt trong vài phút, chỉ lấy ảnh giấy tờ và không thu thập bất kỳ thông tin nào về thu nhập, nghĩa vụ nợ hay nguồn trả. Đây là dấu hiệu gì?","opt":[["A","Trừ phí trước rồi mới chuyển phần tiền còn lại cho mình"],["B","Bắt cấp quyền vào danh bạ thì hồ sơ mới được duyệt"],["C","Sẽ làm phiền người thân của mình khi mình chậm trả"],["D","Giải ngân nhanh mà bỏ qua thông tin cốt lõi về khả năng trả nợ"]],"ans":"D","exp":{"D":"Đúng. Nếu thực sự không thu thập hoặc đánh giá dữ liệu nào về nguồn trả và nghĩa vụ nợ, bên cho vay đang bỏ qua thông tin cốt lõi. Chỉ việc không hỏi trực tiếp thu nhập chưa đủ kết luận, vì có nơi thẩm định bằng dữ liệu hợp pháp khác."}},{"code":"CĐ4-040","q":"Một ứng dụng bắt cấp quyền vào danh bạ, hình ảnh và tin nhắn thì mới cho vay. Việc này có thể dẫn tới rủi ro nào?","opt":[["A","Không dính gì tới các dấu hiệu rủi ro khác của khoản vay"],["B","Người thân và đồng nghiệp bị làm phiền khi mình chậm trả"],["C","Hồ sơ được duyệt nhanh hơn vì bên kia đã có đủ dữ liệu"],["D","Phí bị trừ trước khi tiền vay được chuyển về cho mình"]],"ans":"B","exp":{"B":"Đúng. Quyền danh bạ tạo khả năng ứng dụng thu thập hoặc khai thác thông tin người liên hệ và gây sức ép. Chỉ từ màn hình xin quyền chưa thể khẳng định việc thu thập/quấy rối chắc chắn đã xảy ra."}},{"code":"CĐ4-041","q":"Ứng dụng chỉ hiện số phải trả mỗi kỳ, không cho lưu hồ sơ và không cho biết tổng cộng phải trả bao nhiêu. Người vay nên làm gì?","opt":[["A","Nhận tiền trước, hoãn việc cộng tổng phải trả lại tới lúc sau"],["B","Chụp màn hình để tạm giữ lại, rồi bấm nhận khoản vay luôn"],["C","Hoãn lại, đòi hồ sơ đầy đủ và lưu được về máy của mình"],["D","Nhận vay, vì số phải trả mỗi kỳ thì đã ghi rõ ràng rồi"]],"ans":"C","exp":{"C":"Đúng. Hồ sơ phải lưu được và phải ghi rõ số thực nhận, tổng phải trả, lịch trả, phí và tiền phạt."}},{"code":"CĐ4-026","q":"Hồ sơ ghi vay 15 triệu đồng nhưng người vay chỉ nhận về 12 triệu đồng vì bị trừ. Cách hiểu nào đúng nhất?","opt":[["A","Đặt cạnh nhau số ghi, số thực nhận, số bị trừ và lịch trả"],["B","Chỉ cần để ý số 12 triệu thực nhận, vì đó là tiền dùng được"],["C","Khoản bị trừ đương nhiên được cộng trả thêm một lần nữa"],["D","Trách nhiệm chắc chắn chỉ tính trên số 15 triệu ghi hồ sơ"]],"ans":"A","exp":{"A":"Đúng. Bốn con số này phải đặt cạnh nhau thì mới thấy tiền vào bao nhiêu, bị trừ bao nhiêu, còn phải trả bao nhiêu."}},{"code":"CĐ4-045","q":"Hợp đồng ghi số tiền vay là 8 triệu đồng. Khi giải ngân, 1,6 triệu đồng bị khấu trừ nên người vay thực nhận 6,4 triệu đồng. Theo lịch, người vay phải trả 12 kỳ, mỗi kỳ 0,95 triệu đồng. Giả sử đây là toàn bộ các khoản phải trả và không có khoản hoàn lại nào khác. Khi so sánh tổng tiền phải trả với số tiền thực nhận, kết quả nào đúng?","opt":[["A","Tổng trả 13 triệu đồng; chênh 6,6 triệu đồng"],["B","Tổng trả 11,4 triệu đồng; chênh 3,4 triệu đồng"],["C","Chưa tính được vì chưa biết mức lãi suất"],["D","Tổng trả 11,4 triệu đồng; chênh 5 triệu đồng"]],"ans":"D","exp":{"D":"Đúng. 12 kỳ nhân 0,95 triệu đồng bằng 11,4 triệu đồng. Lấy 11,4 triệu đồng trừ 6,4 triệu đồng thì phần chênh là 5 triệu đồng."}},{"code":"CĐ4-024","q":"Hai hồ sơ đều ghi 20 triệu đồng. Khoản A bị trừ 2 triệu nên chỉ nhận 18 triệu, trả 18 kỳ, mỗi kỳ 1,4 triệu. Khoản B nhận đủ 20 triệu, trả 12 kỳ, mỗi kỳ 1,9 triệu. Khoản nào có phần chênh lệch thấp hơn?","opt":[["A","Khoản A, vì mỗi kỳ chỉ phải trả 1,4 triệu, nhẹ hơn hẳn"],["B","Như nhau, vì hai hồ sơ đều ghi cùng một số 20 triệu"],["C","Khoản B, chênh 2,8 triệu so với 7,2 triệu của khoản A"],["D","Không so được, vì hai khoản có số kỳ khác hẳn nhau"]],"ans":"C","exp":{"C":"Đúng. Khoản B trả 22,8 triệu trên 20 triệu thực nhận nên chênh 2,8 triệu, thấp hơn khoản A."}},{"code":"CĐ4-003","q":"Một khoản vay kèm bảo hiểm làm số tiền thực nhận giảm đi, nhưng hồ sơ chưa ghi bên bảo hiểm nào, quyền lợi ra sao, phí bao nhiêu và có được hủy hay hoàn phí không. Trước khi ký nên làm gì?","opt":[["A","Ký trước, vì bảo hiểm bao giờ cũng có lợi cho người vay"],["B","Chưa ký; đòi ghi rõ bên bảo hiểm, quyền lợi, phí, cách hủy"],["C","Chỉ so số phải trả mỗi kỳ, vì phí bảo hiểm không đáng kể"],["D","Chấp nhận nếu nhân viên nói miệng là sẽ được hoàn phí"]],"ans":"B","exp":{"B":"Đúng. Mấy thông tin đó quyết định khoản bảo hiểm bảo vệ ai, tốn thật bao nhiêu, và mình có được hủy hay lấy lại phí không."}},{"code":"CĐ4-018","q":"Hồ sơ ghi lãi suất ưu đãi trong 3 tháng đầu nhưng không ghi lãi suất tham chiếu, biên độ và chu kỳ điều chỉnh sau ưu đãi. Anh P. nên làm gì?","opt":[["A","Cứ ký, rồi hỏi công thức lãi suất sau khi đã nhận tiền"],["B","Ký vì 3 tháng đầu đã rõ; mức sau đó bên cho vay tự thông báo là được"],["C","Kết luận ngay bên cho vay vi phạm pháp luật và công khai hồ sơ"],["D","Hoãn ký; yêu cầu ghi công thức, chu kỳ điều chỉnh và ví dụ lịch trả"]],"ans":"D","exp":{"D":"Đúng. Công thức và ví dụ lịch trả giúp thấy khoản nộp có thể thay đổi thế nào sau ưu đãi."}},{"code":"TN-26","q":"Có ba cách xử lý: HOÃN là tạm dừng để hỏi thêm khi thiếu thông tin; DỪNG là ngừng hẳn khi gặp yêu cầu nguy hiểm hoặc điều kiện không thể chấp nhận; CÓ THỂ QUYẾT ĐỊNH là khi đủ thông tin. Một khoản vay có bên cho vay rõ, tổng chi phí chấp nhận được nhưng còn để trống cách tính lãi và các khoản phải trả khi chậm/quá hạn. Nên xử lý thế nào?","opt":[["A","HOÃN cho tới khi cách tính được điền đủ, rồi lưu bản hợp đồng"],["B","CÓ THỂ QUYẾT ĐỊNH ký, vì tổng chi phí nằm trong khả năng trả"],["C","DỪNG hẳn thay vì hoãn, vì chỗ để trống là bằng chứng lừa đảo"],["D","CÓ THỂ QUYẾT ĐỊNH ký, nếu người tư vấn nhắn tin hứa không thu thêm"]],"ans":"A","exp":{"A":"Đúng. Cần ghi rõ mức hoặc tỷ lệ, số tiền làm căn cứ, khoảng thời gian tính và ví dụ khi chậm một kỳ rồi mới quyết."}},{"code":"CĐ4-038","q":"“Được duyệt vay không có nghĩa là mình chắc chắn trả nổi. Kiểm tra đủ rồi thì mình được quyền quyết định, nhưng vẫn phải tính tới khả năng thu nhập thay đổi.” Nhận định này đúng hay sai?","opt":[["A","Đúng"],["B","Sai"]],"ans":"A","exp":{"A":"Đúng. Bên cho vay đồng ý cho vay không có nghĩa khoản vay đó vừa với thu nhập và chi tiêu của gia đình mình."}},{"code":"CĐ4-037","q":"Tổ chức tín dụng chấp thuận yêu
