document.addEventListener('change', e => { if (e.target.id === 'upfile') startUpload([...e.target.files]); });
function startUpload(files) {
  U.v.upq = U.v.upq || [];
  const folder = (U.dlg && U.dlg.args.folder) || 'bai';
  files.forEach(file => {
    const u = { name: file.name, p: 0, src: '' }; U.v.upq.push(u);
    if (file.size > 20 * 1024 * 1024) { u.err = 'Quá 20 MB'; return; }
    const finish = (src, dim) => {
      const tick = setInterval(() => { u.p = Math.min(100, u.p + 12 + Math.round(Math.random() * 18)); if (u.p >= 100) { clearInterval(tick); S.media.unshift({ id: Math.max(...S.media.map(m => m.id), 0) + 1, name: file.name.toLowerCase().replace(/\s+/g, '-'), folder, dim, size: file.size > 1048576 ? (file.size / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(file.size / 1024)) + ' KB', used: [], alt: '', g: 'linear-gradient(135deg,#0E7C72,#5BC0B4)', src, at: nowAt() }); save(); } if (U.dlg && U.dlg.fn === 'upload') render(); }, 160);
    };
    if (file.type.startsWith('image/') && file.type !== 'image/svg+xml') {
      const img = new Image(); const url = URL.createObjectURL(file);
      img.onload = () => { const c = document.createElement('canvas'); const k = Math.min(1, 320 / img.width); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); u.src = c.toDataURL('image/jpeg', .7); URL.revokeObjectURL(url); finish(u.src, img.width + '×' + img.height); };
      img.onerror = () => { u.err = 'Tệp lỗi'; render(); };
      img.src = url;
    } else finish('', file.type === 'application/pdf' ? 'PDF' : 'SVG');
  });
  render();
}

const QA_BOX = { new: 'Mới', draft: 'Đang soạn trả lời', answered: 'Đã trả lời', spam: 'Rác' };

  const cur = S.qa.find(q => q.id === selId) || list[0];
  const d = cur ? draftFor('qa' + cur.id, cur) : null;
  return { sec: 'qa', side: qaSide(box), body: `<div class="main"><div class="in">
    <div class="ph"><div><p class="crumb">Hỏi – Đáp</p><h1>${QA_BOX[box]}</h1><p class="lead">Câu hỏi, góp ý, kiến nghị người dân gửi từ trang Hỏi – Đáp.</p></div><div class="acts"><button class="btn" type="button" data-a="qaCsv"${isAdmin() ? '' : ' disabled title="Cần chế độ Quản trị"'}>Xuất CSV</button><a class="btn p" href="#/hoi-dap/them">${ic('plus')}Thêm hỏi đáp</a></div></div>
    <div class="filters"><label class="search">${ic('search', 16)}<input type="search" placeholder="Tìm trong nội dung" value="${esc(st.q)}" data-b="v.qa.q" data-r></label>${['all', 'Câu hỏi', 'Góp ý', 'Kiến nghị'].map(k => `<button class="chip" type="button" data-a="qaKind" data-k="${k}" aria-pressed="${st.kind === k}">${k === 'all' ? 'Tất cả' : k}</button>`).join('')}</div>
    <div class="cols"><div class="b" style="flex:1 1 340px;gap:8px">${list.map(q => `<a class="list-row${cur && q.id === cur.id ? ' is-sel' : ''}" href="#/hoi-dap/cau/${q.id}" style="text-decoration:none;align-items:flex-start"><span class="sp" style="min-width:0"><span style="display:flex;gap:8px;align-items:center"><span class="pill ${q.kind === 'Câu hỏi' ? 'info' : q.kind === 'Góp ý' ? 'ok' : 'warn'}">${q.kind}</span><span class="xs">${esc(q.at)}</span></span><b style="display:block;font-weight:600;margin-top:6px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${esc(q.q)}</b><span class="xs">${esc(q.name)} · ${esc(q.cat)}</span></span></a>`).join('') || `<div class="card">${empty('inbox', 'Hộp thư trống', box === 'new' ? 'Đã xử lý hết câu hỏi mới.' : 'Chưa có mục nào.')}</div>`}</div>
    <div class="a" style="flex:2 1 520px">${d ? qaDetail(d) : ''}</div></div></div></div>` };
}

      <div class="prop"><span class="lbl">Hiển thị</span><div class="grid" style="gap:10px">${chk('d.public', d.public !== false && d.kind === 'Câu hỏi', 'Đăng lên trang Hỏi – Đáp', 'Góp ý, kiến nghị thường không đăng.')}${chk('d.anonName', d.anonName !== false, 'Ẩn tên người hỏi', 'Hiện "Bạn đọc ở …".')}${d.contact ? chk('d.notify', d.notify !== false, 'Báo cho người hỏi khi đã trả lời', 'Gửi tới ' + esc(d.contact)) : ''}</div></div>
    </section>
    <div class="foot-bar"><span class="dirty" data-dirty${isDirty() ? '' : ' hidden'}>Chưa lưu</span><span class="sp"></span><button class="btn" type="button" data-a="qaSaveDraft" data-save>Lưu nháp</button><button class="btn p" type="button" data-a="qaSend">${ans ? 'Cập nhật câu trả lời' : 'Gửi trả lời'}</button></div>`;
}

const qaCur = () => S.qa.find(q => q.id === U.draft.id);
A.qaSaveDraft = () => { if (U.draft.status === 'new') U.draft.status = 'draft'; commitDraft(qaCur()); toast('Đã lưu nháp câu trả lời'); go('/hoi-dap/cau/' + U.draft.id); render(); };
A.qaSend = () => {
  if (!U.draft.reply.trim()) { toast('Cần viết câu trả lời trước khi gửi', 'bad'); const t = document.querySelector('[data-b="d.reply"]'); if (t) t.focus(); return; }
  const was = U.draft.status; U.draft.status = 'answered'; commitDraft(qaCur());
  const next = S.qa.find(q => q.status === 'new' && q.id !== U.draft.id);
  toast(was === 'answered' ? 'Đã cập nhật câu trả lời' : 'Đã gửi trả lời' + (U.draft.notify !== false && U.draft.contact ? ' và báo cho người hỏi' : '') + (U.draft.public !== false && U.draft.kind === 'Câu hỏi' ? '. Câu hỏi đã lên trang Hỏi – Đáp.' : ''), 'ok', next ? { label: 'Câu tiếp theo', fn: () => go('/hoi-dap/cau/' + next.id) } : null);
  dropDraft(); U.skipGuard = true; go(next && was !== 'answered' ? '/hoi-dap/cau/' + next.id : '/hoi-dap/answered');
};

A.qaUnspam = () => { const q = qaCur(); q.status = 'new'; dropDraft(); save(); toast('Đã đưa về hộp Mới'); go('/hoi-dap/cau/' + q.id); };

  <section class="card flush"><div class="tbl-wrap"><table class="tbl" style="min-width:820px"><thead><tr><th>Cuộc thi</th><th>Thời gian</th><th>Trạng thái</th><th class="r">Lượt thi</th><th></th></tr></thead><tbody>${S.contests.map(c => `<tr class="click" data-a="openContest" data-id="${c.id}"><td><strong>#${c.id} ${esc(c.name)}</strong><div class="xs">${c.count} câu · ${c.attempts} lượt · ${c.prizes.reduce((a, p) => a + p[1], 0)} giải</div></td><td class="muted nw">${c.open.split(' ')[1]} – ${c.close.split(' ')[1]}</td><td>${cPill(c.status)}</td><td class="r">${c.entries.toLocaleString('vi')}</td><td class="r" data-a="noop"><button class="icon-btn" type="button" data-a="contestMenu" data-id="${c.id}" aria-label="Thao tác">${ic('dots')}</button></td></tr>`).join('')}</tbody></table></div></section>`));
A.openContest = el => go('/cuoc-thi/' + el.dataset.id);
A.contestMenu = el => { const c = contest(el.dataset.id); openMenu(el, `<a href="#/cuoc-thi/${c.id}">${ic('edit')}${isAdmin() ? 'Sửa' : 'Xem'}</a><button type="button" data-a="dupContest" data-id="${c.id}"${isAdmin() ? '' : ' disabled'}>${ic('copy')}Nhân bản thành cuộc thi mới</button><a href="#/cuoc-thi/luot-thi?${c.id}">${ic('users')}Xem lượt thi</a>${['scheduled', 'draft'].includes(c.status) && isAdmin() ? `<hr><button class="red" type="button" data-a="delContest" data-id="${c.id}">${ic('trash')}Xóa cuộc thi…</button>` : ''}`); };
A.dupContest = el => { const c = contest(el.dataset.id); U.v.dupFrom = c.id; dropDraft(); go('/cuoc-thi/tao'); };
A.delContest = el => { const c = contest(el.dataset.id); confirmDlg({ title: `Xóa cuộc thi #${c.id}?`, body: 'Cuộc thi chưa mở nên chưa có lượt thi. Trang Cuộc thi trên website sẽ thôi hiện "Sắp diễn ra".', okLabel: 'Xóa cuộc thi', danger: true, onOk: () => { S.contests = S.contests.filter(x => x !== c); save(); toast('Đã xóa cuộc thi #' + c.id); } }); };

// ---- Tao cuoc thi theo buoc ----
const STEPS = [['Thông tin', 'Tên, mô tả'], ['Lịch và lượt', 'Thời gian, số lượt'], ['Bộ đề', 'Chọn câu hỏi'], ['Giải thưởng', 'Cơ cấu giải'], ['Xem lại', 'Kiểm tra rồi tạo']];
route(/^\/cuoc-thi\/tao$/, () => {
  if (!isAdmin()) return cPage('contests', gate('Tạo cuộc thi'));
  const from = U.v.dupFrom ? contest(U.v.dupFrom) : null;
  const d = draftFor('cnew', from ? Object.assign(clone(from), { id: 'new', name: from.name + ' (bản sao)', status: 'draft', open: '08:00 01/12/2026', close: '23:59 31/12/2026', entries: 0, step: 1, perTopic: {} }) :
    { id: 'new', name: '', desc: '', rules: '1. Mỗi người tham gia tối đa 2 lượt.\n2. Điểm cao nhất được dùng để xét giải.\n3. Mỗi người nhận tối đa 1 giải.', status: 'draft', open: '08:00 01/12/2026', close: '23:59 31/12/2026', attempts: 2, minutes: 20, otp: true, topics: [], perTopic: {}, count: 0, entries: 0, prizes: [['Giải Nhất', 1, 'Tiền mặt 5.000.000 đ'], ['Giải Nhì', 2, 'Tiền mặt 2.000.000 đ'], ['Giải Ba', 5, 'Thẻ quà tặng 500.000 đ']], threshold: 18, step: 1 });
  U.v.dupFrom = null;
  const st = d.step;
  const steps = `<ol class="steps">${STEPS.map(([n, s], i) => `<li class="${i + 1 < st ? 'done' : i + 1 === st ? 'now' : ''}"><button type="button" data-a="cStep" data-s="${i + 1}"><i>${i + 1 < st ? '✓' : i + 1}</i><span><b>${n}</b><small>${i === 2 && d.count ? d.count + ' câu' : s}</small></span></button></li>`).join('')}</ol>`;
  const err = U.v.cErr || {};
  let body = '';
  if (st === 1) body = `<section class="grp"><div class="prop${err.name ? ' inv' : ''}"><label>Tên cuộc thi <i>*</i><small>Ví dụ: Cuộc thi tháng 12: …</small></label><div><input class="inp${err.name ? ' bad' : ''}" data-b="d.name" value="${esc(d.name)}" data-autofocus>${err.name ? '<span class="err">Cần nhập tên cuộc thi.</span>' : ''}</div></div>
    <div class="prop${err.desc ? ' inv' : ''}"><label>Mô tả ngắn <i>*</i><small>Hiện dưới tên cuộc thi trên website.</small></label><div><textarea class="area${err.desc ? ' bad' : ''}" rows="3" data-b="d.desc">${esc(d.desc)}</textarea>${cnt(d.desc, 160)}${err.desc ? '<span class="err">Cần nhập mô tả.</span>' : ''}</div></div>
    <div class="prop"><label>Ảnh bìa<small>Khuyên dùng 1200×630.</small></label>${mediaPicker('d.cover', d.cover)}</div>
    <div class="prop"><label>Thể lệ</label><div><textarea class="area" rows="5" data-b="d.rules">${esc(d.rules)}</textarea><button class="btn sm ghost mt" type="button" data-a="copyRules">Dùng thể lệ của cuộc thi #8</button></div></div></section>`;
  if (st === 2) {
    const clash = overlap(d);
    body = `<div class="cols"><div class="a"><section class="grp" style="margin:0">
      <div class="prop"><label>Mở lúc <i>*</i></label><input class="inp" data-b="d.open" value="${esc(d.open)}" data-r></div>
      <div class="prop"><label>Đóng lúc <i>*</i></label><input class="inp" data-b="d.close" value="${esc(d.close)}" data-r></div>
      <div class="prop"><label>Số lượt mỗi người<small>Tính theo số điện thoại.</small></label><select class="sel" data-b="d.attempts">${[1, 2, 3].map(n => opt(n, d.attempts, n + ' lượt')).join('')}</select></div>
      <div class="prop"><label>Thời gian làm bài<small>Hết giờ tự nộp.</small></label><select class="sel" data-b="d.minutes">${[10, 15, 20, 30].map(n => opt(n, d.minutes, n + ' phút')).join('')}</select></div>
      <div class="prop"><span class="lbl">Xác thực</span>${chk('d.otp', d.otp, 'Yêu cầu mã OTP gửi về số điện thoại', 'Giảm thi hộ, thi nhiều lần.')}</div></section></div>
      <div class="b">${clash ? `<div class="note bad"><b>Trùng lịch</b><br>Khoảng thời gian này trùng với cuộc thi #${clash.id} (${clash.open} – ${clash.close}). Chọn thời gian khác.</div>` : `<div class="note ok"><b>Không trùng lịch</b><br>Không trùng cuộc thi nào.</div>`}<div class="note warn">Sau khi cuộc thi mở, <b>không đổi được</b> số lượt và bộ đề. Ngày đóng vẫn kéo dài được.</div></div></div>`;
  }
  if (st === 3) {
    const sum = Object.values(d.perTopic).reduce((a, n) => a + (+n || 0), 0);
    body = `<section class="card flush"><div style="padding:18px 22px 6px"><h2 style="margin:0">Chọn chuyên đề và số câu</h2><p class="small muted">Mỗi người dự thi nhận ngẫu nhiên đủ số câu đã chọn từ từng chuyên đề, thứ tự đảo.</p></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Chuyên đề</th><th class="r">Câu đang dùng</th><th style="width:160px">Lấy bao nhiêu câu</th></tr></thead><tbody>${S.topics.map(t => { const n = S.questions.filter(q => q.topic === t.id && q.status === 'on').length; return `<tr><td><strong>${esc(t.name)}</strong></td><td class="r muted">${n}</td><td><input class="inp" style="height:38px" type="number" min="0" max="${n}" data-b="d.perTopic.${t.id}" value="${d.perTopic[t.id] || ''}" placeholder="0" data-r></td></tr>`; }).join('')}</tbody></table></div>
      <div class="tfoot"><span>Tổng: <b style="color:${sum ? 'var(--t)' : 'var(--bad)'}">${sum} câu</b>${sum && sum !== 20 ? ' · thường dùng 20 câu' : ''}</span><button class="btn sm" type="button" data-a="perTopicQuick">Gợi ý: 10 + 10 từ hai chuyên đề</button></div></section>${err.q ? '<p class="err mt">Cần chọn ít nhất 1 câu hỏi.</p>' : ''}`;
  }
  if (st === 4) body = prizeEditor(d);
  if (st === 5) {
    const sum = Object.values(d.perTopic).reduce((a, n) => a + (+n || 0), 0);
    const rows = [['Thông tin', d.name || '<span style="color:var(--bad)">Chưa có tên</span>', 1, !!d.name], ['Lịch và lượt', `${d.open} – ${d.close} · ${d.attempts} lượt · ${d.minutes} phút${d.otp ? ' · có OTP' : ''}`, 2, !overlap(d)], ['Bộ đề', sum ? `${sum} câu từ ${Object.values(d.perTopic).filter(n => +n).length} chuyên đề` : '<span style="color:var(--bad)">Chưa chọn câu hỏi</span>', 3, sum > 0], ['Giải thưởng', `${d.prizes.reduce((a, p) => a + +p[1], 0)} giải · đúng từ ${d.threshold}/${sum || 20} câu`, 4, d.prizes.length > 0]];
    body = `<section class="card"><div class="grid" style="gap:10px">${rows.map(([a, b, s, ok]) => `<div class="list-row"><span style="width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;background:${ok ? 'var(--ok)' : 'var(--bad)'}">${ok ? '✓' : '!'}</span><span class="sp"><b>${a}</b><br><span class="small muted">${b}</span></span><button class="lnk" type="button" data-a="cStep" data-s="${s}">Sửa</button></div>`).join('')}</div>
      <div class="note info mt">Cuộc thi được tạo ở trạng thái <b>Đã lên lịch</b> và tự mở lúc ${esc(d.open)}. Trang Cuộc thi trên website hiện "Sắp diễn ra" từ bây giờ.</div></section>`;
  }
  return cPage('contests', `<a class="back" href="#/cuoc-thi/danh-sach">← Danh sách cuộc thi</a><div class="ph"><div><h1>${from || d.name.includes('(bản sao)') ? 'Nhân bản cuộc thi' : 'Tạo cuộc thi mới'}</h1></div></div>${steps}${body}
    <div class="foot-bar">${st > 1 ? `<button class="btn" type="button" data-a="cStep" data-s="${st - 1}">← Quay lại</button>` : `<a class="btn" href="#/cuoc-thi/danh-sach">Hủy</a>`}<span class="sp"></span>${st < 5 ? `<button class="btn p" type="button" data-a="cNext">Tiếp: ${STEPS[st][0]}</button>` : `<button class="btn p" type="button" data-a="cCreate">Tạo cuộc thi</button>`}</div>`);
});
function parseDt(s) { const m = /(\d+):(\d+)\s+(\d+)\/(\d+)\/(\d+)/.exec(s || ''); return m ? new Date(+m[5], +m[4] - 1, +m[3], +m[1], +m[2]).getTime() : NaN; }
function overlap(d) { const a = parseDt(d.open), b = parseDt(d.close); if (isNaN(a) || isNaN(b)) return null; return S.contests.find(c => c.id !== d.id && parseDt(c.open) <= b && parseDt(c.close) >= a) || null; }
function prizeEditor(d) {
  return `<section class="card flush"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Giải</th><th style="width:110px">Số giải</th><th>Phần thưởng</th><th></th></tr></thead><tbody>${d.prizes.map((p, i) => `<tr><td><input class="inp" style="height:38px" data-b="d.prizes.${i}.0" value="${esc(p[0])}"></td><td><input class="inp" style="height:38px" type="number" min="1" data-b="d.prizes.${i}.1" value="${p[1]}" data-r></td><td><input class="inp" style="height:38px" data-b="d.prizes.${i}.2" value="${esc(p[2])}"></td><td class="r"><button class="icon-btn" type="button" data-a="prizeDel" data-i="${i}" aria-label="Xóa giải">${ic('trash', 16)}</button></td></tr>`).join('')}</tbody></table></div>
    <div class="tfoot"><button class="lnk" type="button" data-a="prizeAdd">+ Thêm giải</button><span>Tổng ${d.prizes.reduce((a, p) => a + (+p[1] || 0), 0)} giải</span></div></section>
    <section class="grp mt" style="margin-top:16px"><div class="prop"><label>Điều kiện được quay số<small>Chỉ lượt thi đạt điều kiện mới vào danh sách quay.</small></label><select class="sel" data-b="d.threshold">${[15, 16, 17, 18, 19, 20].map(n => opt(n, d.threshold, 'Đúng từ ' + n + ' câu')).join('')}</select></div></section>`;
}
A.cStep = el => { U.draft.step = +el.dataset.s; U.v.cErr = null; render(); };
A.cNext = () => {
  const d = U.draft; const e = {};
  if (d.step === 1) { if (!d.name.trim()) e.name = 1; if (!d.desc.trim()) e.desc = 1; }
  if (d.step === 2 && overlap(d)) { toast('Lịch đang trùng với cuộc thi khác', 'bad'); return; }
  if (d.step === 3 && !Object.values(d.perTopic).some(n => +n > 0)) e.q = 1;
  if (Object.keys(e).length) { U.v.cErr = e; render(); return; }
  U.v.cErr = null; d.step++; render(); window.scrollTo(0, 0);
};
A.copyRules = () => { U.draft.rules = '1. Mỗi người tham gia tối đa 2 lượt.\n2. Điểm cao nhất được dùng để xét giải.\n3. Lượt thi có dấu hiệu gian lận bị loại.\n4. Kết quả công bố trên website trong 7 ngày sau khi đóng.'; render(); };
A.perTopicQuick = () => { U.draft.perTopic = { 4: 10, 7: 10 }; render(); };
A.prizeAdd = () => { U.draft.prizes.push(['Giải mới', 1, '']); render(); };
A.prizeDel = el => { U.draft.prizes.splice(+el.dataset.i, 1); render(); };
A.cCreate = () => {
  const d = U.draft; const sum = Object.values(d.perTopic).reduce((a, n) => a + (+n || 0), 0);
  if (!d.name.trim() || !sum || overlap(d)) { toast('Còn mục chưa đạt, xem các dòng màu đỏ', 'bad'); return; }
  const id = Math.max(...S.contests.map(c => c.id)) + 1;
  const c = Object.assign(clone(d), { id, status: 'scheduled', count: sum, topics: Object.keys(d.perTopic).filter(k => +d.perTopic[k]).map(Number), entries: 0 });
  delete c.step; S.contests.unshift(c); dropDraft(); save();
  toast(`Đã tạo cuộc thi #${id}. Tự mở lúc ${c.open}.`); U.skipGuard = true; go('/cuoc-thi/' + id);
};

// ---- Sua cuoc thi ----
route(/^\/cuoc-thi\/(\d+)$/, id => {
  const c = contest(id); if (!c) return cPage('contests', `<div class="card">${empty('trophy', 'Không có cuộc thi này', '')}</div>`);
  const d = draftFor('c' + c.id, c);
  const locked = c.status !== 'scheduled' && c.status !== 'draft';
  const ro = !isAdmin();
  const t = V('ctab' + c.id, 'info');
  const dis = ro ? ' disabled' : '';
  let body;
  if (t === 'info') body = `<section class="grp"><div class="prop"><label>Tên cuộc thi</label><input class="inp" data-b="d.name" value="${esc(d.name)}"${dis}></div><div class="prop"><label>Mô tả ngắn</label><textarea class="area" rows="3" data-b="d.desc"${dis}>${esc(d.desc)}</textarea></div><div class="prop"><label>Ảnh bìa</label>${ro ? mediaThumb(d.cover || 9, 90) : mediaPicker('d.cover', d.cover || 9)}</div></section>`;
  if (t === 'time') body = `${locked ? '<div class="note warn mb">Cuộc thi đã mở: chỉ kéo dài được ngày đóng. Số lượt và bộ đề đã khóa.</div>' : ''}<section class="grp"><div class="prop"><label>Mở lúc</label><input class="inp" data-b="d.open" value="${esc(d.open)}"${locked || ro ? ' disabled' : ''}></div><div class="prop"><label>Đóng lúc</label><input class="inp" data-b="d.close" value="${esc(d.close)}"${dis}></div><div class="prop"><label>Số lượt mỗi người</label><select class="sel" data-b="d.attempts"${locked || ro ? ' disabled' : ''}>${[1, 2, 3].map(n => opt(n, d.attempts, n + ' lượt')).join('')}</select></div><div class="prop"><label>Thời gian làm bài</label><select class="sel" data-b="d.minutes"${locked || ro ? ' disabled' : ''}>${[10, 15, 20, 30].map(n => opt(n, d.minutes, n + ' phút')).join('')}</select></div></section>`;
  if (t === 'set') body = `${locked ? '<div class="note warn mb">Bộ đề đã khóa vì cuộc thi đã mở.</div>' : ''}<section class="card flush"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Chuyên đề</th><th class="r">Số câu lấy</th></tr></thead><tbody>${d.topics.map(tid => `<tr><td><strong>${esc(topicName(tid))}</strong></td><td class="r">${Math.round(d.count / d.topics.length)}</td></tr>`).join('')}</tbody></table></div><div class="tfoot"><span>Tổng ${d.count} câu</span><a class="lnk" href="#/cuoc-thi/cau-hoi">Mở ngân hàng câu hỏi →</a></div></section>`;
  if (t === 'prize') body = ro || c.status === 'published' ? `<section class="card flush"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Giải</th><th class="r">Số giải</th><th>Phần thưởng</th></tr></thead><tbody>${d.prizes.map(p => `<tr><td><b>${esc(p[0])}</b></td><td class="r">${p[1]}</td><td>${esc(p[2])}</td></tr>`).join('')}</tbody></table></div></section>` : prizeEditor(d);
  return cPage('contests', `<a class="back" href="#/cuoc-thi/danh-sach">← Danh sách cuộc thi</a>
    <div class="ph"><div><h1>#${c.id} ${esc(c.name)}</h1><p class="lead">${cPill(c.status)} <span class="muted">· ${c.open} – ${c.close} · ${c.entries.toLocaleString('vi')} lượt thi</span></p></div><div class="acts"><a class="btn" href="#/cuoc-thi/luot-thi?${c.id}">Xem lượt thi</a>${c.status === 'closed' ? `<a class="btn p" href="#/cuoc-thi/quay-so?${c.id}">Quay số</a>` : c.status === 'drawn' ? `<a class="btn p" href="#/cuoc-thi/cong-bo?${c.id}">Công bố kết quả</a>` : ''}</div></div>
    <div class="tabs" role="tablist">${[['info', 'Thông tin'], ['time', 'Lịch và lượt'], ['set', 'Bộ đề'], ['prize', 'Giải thưởng']].map(([k, l]) => `<button type="button" role="tab" data-a="setTab" data-k="ctab${c.id}" data-t="${k}" aria-selected="${t === k}">${l}</button>`).join('')}</div>${body}
    ${ro ? '<div class="note info mt">Bạn đang xem ở chế độ Biên tập. Chuyển sang chế độ Quản trị để sửa.</div>' : `<div class="foot-bar"><span class="dirty" data-dirty${isDirty() ? '' : ' hidden'}>Chưa lưu</span><span class="sp"></span><button class="btn p" type="button" data-a="saveContest" data-save>Lưu thay đổi</button></div>`}`);
});
A.saveContest = () => { const d = U.draft; if (overlap(d)) { toast('Lịch đang trùng với cuộc thi #' + overlap(d).id, 'bad'); return; } commitDraft(contest(d.id)); toast('Đã lưu cuộc thi #' + d.id); render(); };

// ---- Luot thi ----
route(/^\/cuoc-thi\/luot-thi$/, () => {
  const st = V('ent', { c: 8, q: '', f: 'all', page: 0, reveal: {} });
  if (U.qs && contest(U.qs)) { st.c = +U.qs; }
  const c = contest(st.c);
  let rows = S.entries.filter(e => e.contest === st.c && !e.deleted && (!st.q || e.code.toLowerCase().includes(st.q.toLowerCase()) || e.name.toLowerCase().includes(st.q.toLowerCase()) || e.phone.includes(st.q)));
  const counts = { all: rows.length, flag: rows.filter(e => e.flag && !e.invalid).length, invalid: rows.filter(e => e.invalid).length, pass: rows.filter(e => e.score >= (c ? c.threshold : 18)).length };
  if (st.f === 'flag') rows = rows.filter(e => e.flag && !e.invalid); if (st.f === 'invalid') rows = rows.filter(e => e.invalid); if (st.f === 'pass') rows = rows.filter(e => e.score >= c.threshold);
  const per = 12, pages = Math.max(1, Math.ceil(rows.length / per)); if (st.page >= pages) st.page = 0;
  return cPage('entries', `<div class="ph"><div><p class="crumb">Vận hành</p><h1>Lượt thi</h1><p class="lead">Mỗi lần một người nộp bài là một lượt thi. Số điện thoại hiện dạng che.</p></div><div class="acts">${adminBtn('Xuất danh sách CSV', 'data-a="entCsv"', 'btn')}</div></div>
    <div class="filters"><select class="sel" style="width:auto;height:40px" data-b="v.ent.c" aria-label="Cuộc thi">${S.contests.filter(x => x.entries).map(x => `<option value="${x.id}"${x.id === st.c ? ' selected' : ''}>#${x.id} · ${esc(x.name)}</option>`).join('')}</select><label class="search">${ic('search', 16)}<input type="search" placeholder="Tìm theo mã, họ tên, số điện thoại" value="${esc(st.q)}" data-b="v.ent.q" data-r></label></div>

route(/^\/cuoc-thi\/quay-so$/, () => {

    <div class="b"><section class="card"><h2>Cơ cấu giải</h2>${left.map(([n, l]) => `<p style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line2)"><span>${esc(n)}</span><b>${l ? 'còn ' + l : '<span style="color:var(--ok-t)">đủ</span>'}</b></p>`).join('')}<p class="small muted mt">Điều kiện: đúng từ ${c.threshold}/${c.count} câu.</p></section>
      <section class="card"><h2>Biên bản quay số</h2>${(S.drawLog[c.id] || []).length ? (S.drawLog[c.id]).slice().reverse().map(l => `<p class="small" style="padding:6px 0;border-bottom:1px solid var(--line2)"><b>${l[0]}</b> · ${esc(l[1])}<br><span class="muted">${esc(l[2])}</span></p>`).join('') : '<p class="muted">Chưa có.</p>'}<button class="btn sm mt" type="button" data-a="fakeDl">Tải biên bản PDF</button></section></div></div>`);

A.spin = () => {
  const c = contest(U.v.drawC); const W = S.winners[c.id]; const won = new Set(W.map(w => w.code)); const usedPh = new Set(W.map(w => (S.entries.find(e => e.code === w.code) || {}).phone));
  const pool = S.entries.filter(e => e.contest === c.id && !e.invalid && e.score >= c.threshold && !won.has(e.code) && !usedPh.has(e.phone));

    <div class="cols"><div class="a"><section class="grp" style="margin:0"><h3>Thông tin</h3><div class="prop"><label>Họ tên</label><input class="inp" data-b="d.name" value="${esc(d.name)}"></div><div class="prop"><label>Email đăng nhập<small>Đổi email cần xác nhận qua email mới.</small></label><input class="inp" data-b="d.email" value="${esc(d.email)}"></div>
      <div class="prop"><label>Chế độ khi đăng nhập<small>Tài khoản của bạn có cả quyền Quản trị. Chuyển nhanh ở nút trên thanh đầu trang.</small></label><select class="sel" data-b="d.defaultMode">${opt('edit', d.defaultMode, 'Biên tập')}${opt('admin', d.defaultMode, 'Quản trị')}</select></div>
      <div class="prop"><span class="lbl"></span><div><button class="btn p" type="button" data-a="saveMe" data-save>Lưu thay đổi</button></div></div></section>
      <section class="card flush"><h2 style="padding:18px 22px 0">Phiên đăng nhập đang mở</h2><div class="tbl-wrap"><table class="tbl"><tbody><tr><td><strong>Chrome · Windows</strong><div class="xs">Máy này</div></td><td>Hà Nội</td><td class="muted">Đang dùng</td><td></td></tr>${U.v.sess2 ? '' : `<tr><td><strong>Safari · iPhone</strong></td><td>Hà Nội</td><td class="muted">21:10 hôm qua</td><td class="r"><button class="lnk red" type="button" data-a="killSess">Đăng xuất</button></td></tr>`}</tbody></table></div></section></div>
    <div class="b"><section class="card"><h2>Mật khẩu</h2><p class="muted mb">Đổi lần cuối 12/09/2026.</p><button class="btn" type="button" data-a="openPw">Đổi mật khẩu</button></section>
      <section class="card"><h2>Xác thực 2 lớp</h2><p class="mb">${me && me.tfa ? '<span class="pill ok">Đang bật</span>' : '<span class="pill warn">Chưa bật</span>'}</p><p class="muted mb">Dùng ứng dụng Google Authenticator. Còn 8 mã dự phòng.</p><div class="acts"><button class="btn" type="button" data-a="showCodes">Xem mã dự phòng</button></div></section>
      <section class="card"><h2>Hoạt động gần đây</h2>${S.articles.filter(a => a.who === 'Bạn').slice(0, 4).map(a => `<p class="small" style="padding:5px 0"><b>${esc(a.at)}</b> <a class="lnk" href="#/noi-dung/${a.id}">${esc(a.title)}</a></p>`).join('') || '<p class="muted">Chưa có.</p>'}</section></div></div></div></div>` };
});
A.saveMe = () => { const d = U.draft; S.me.name = d.name; S.me.email = d.email; S.me.defaultMode = d.defaultMode; S.me.short = initials(d.name); U.draftBase = JSON.stringify(d); save(); toast('Đã lưu hồ sơ'); render(); };
A.killSess = () => { U.v.sess2 = true; toast('Đã đăng xuất thiết bị Safari · iPhone'); render(); };
A.showCodes = () => confirmDlg({ title: 'Mã dự phòng', body: 'Mỗi mã dùng được một lần khi không có điện thoại. Cất ở nơi an toàn.', extra: `<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;font-family:monospace;font-size:16px">${['4829-1307', '7731-0592', '1046-8823', '5590-3318', '2284-7761', '9017-4405', '3362-9180', '6675-2049'].map(c => `<span style="padding:8px;border-radius:8px;background:#F4F5F8;text-align:center">${c}</span>`).join('')}</div>`, okLabel: 'Đã lưu lại', onOk: () => { } });
A.openPw = () => { U.menu = null; U.v.pw = { a: '', b: '', c: '' }; openDlg('pw', {}); };
D.pw = () => { const f = U.v.pw; const strong = f.b.length >= 10 && /\d/.test(f.b) && /[a-zA-Z]/.test(f.b);
  return `<div class="dlg" role="dialog" aria-labelledby="dt"><h2 id="dt">Đổi mật khẩu</h2><p class="sub">Sau khi đổi, các thiết bị khác sẽ phải đăng nhập lại.</p><div class="grid">
  <label class="f"><span>Mật khẩu hiện tại</span><input class="inp" type="password" data-b="v.pw.a" data-autofocus></label>
  <label class="f"><span>Mật khẩu mới</span><input class="inp" type="password" data-b="v.pw.b" data-r value="${esc(f.b)}"><span class="hint" style="color:${f.b ? (strong ? 'var(--ok-t)' : 'var(--warn-t)') : ''}">${f.b ? (strong ? '✓ Mật khẩu đủ mạnh' : 'Cần ít nhất 10 ký tự, có cả chữ và số') : 'Ít nhất 10 ký tự, có chữ và số.'}</span></label>
  <label class="f"><span>Nhập lại mật khẩu mới</span><input class="inp" type="password" data-b="v.pw.c" data-r value="${esc(f.c)}">${f.c && f.c !== f.b ? '<span class="err">Hai mật khẩu chưa khớp.</span>' : ''}</label></div>
  <div class="foot"><button class="btn" type="button" data-a="closeDlg">Hủy</button><button class="btn p" type="button" data-a="doPw"${strong && f.c === f.b && f.a ? '' : ' disabled'}>Đổi mật khẩu</button></div></div>`; };
A.doPw = () => { closeDlg(); toast('Đã đổi mật khẩu'); };

// ---- Cai dat ky thuat (chi che do Quan tri) ----
const TECH = [['loai', 'Loại nội dung', 'doc'], ['kieu', 'Kiểu dữ liệu', 'db'], ['mau', 'Mẫu giao diện', 'code'], ['ngon-ngu', 'Ngôn ngữ', 'lang'], ['dong-bo', 'Đồng bộ cấu hình', 'sync']];
route(/^\/cai-dat\/?([\w-]*)$/, k => {
  const cur = k || 'loai';
  const side = sideLinks('Cài đặt', TECH.map(([id, l, i]) => [id, l, '/cai-dat/' + id, i]), cur);
  if (!isAdmin()) return { sec: 'settings', side, body: gate('Cài đặt kỹ thuật') };
  const note = `<div class="note warn mb">Khu vực kỹ thuật. Thay đổi ở đây ảnh hưởng cấu trúc website, được lưu thành tệp cấu hình (uSync) và cần đội kỹ thuật kiểm tra trước khi đưa lên máy chủ thật.</div>`;
  let body = '';
  if (cur === 'loai') body = `<section class="card flush"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Loại nội dung</th><th>Bí danh</th><th>Thuộc tính</th><th>Dùng ở</th></tr></thead><tbody>${[['Trang chủ', 'home', 'Phần trang (Block Grid), SEO', 1], ['Trang', 'contentPage', 'Phần trang (Block Grid), SEO', 6], ['Trang danh sách', 'listPage', 'Phần mở đầu, số bài mỗi trang', 4], ['Bài viết', 'articlePage', 'Tóm tắt, Ảnh đại diện, Nội dung bài (Block List), Ghim, SEO', S.articles.filter(a => a.type === 'article').length], ['Câu chuyện thật', 'storyPage', 'Người kể, Tỉnh, Số tiền, Thủ đoạn, Câu chuyện, Bài học, Ảnh, Đồng ý cho đăng', S.articles.filter(a => a.type === 'story').length], ['Cài đặt chung', 'siteSettings', 'Tên website, Đường dây nóng, Mạng xã hội…', 1]].map(r => `<tr><td><strong>${r[0]}</strong></td><td><code>${r[1]}</code></td><td class="small">${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div></section>`;
  if (cur === 'kieu') body = `<section class="card flush"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Kiểu dữ liệu</th><th>Trình soạn</th></tr></thead><tbody>${[['Nội dung bài', 'Block List: Đoạn văn, Hộp lưu ý, Ảnh, Các bước, Trích dẫn'], ['Phần trang', 'Block Grid: 12 loại phần'], ['Thủ đoạn', 'Tags'], ['Ảnh đại diện', 'Media Picker, 1 ảnh, có khung cắt 1200×630'], ['Mô tả ngắn', 'Textarea, tối đa 160 ký tự'], ['Chữ có định dạng', 'Rich Text (Tiptap)']].map(r => `<tr><td><strong>${r[0]}</strong></td><td class="small">${r[1]}</td></tr>`).join('')}</tbody></table></div></section>`;
  if (cur === 'mau') body = `<section class="card flush"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Mẫu giao diện</th><th>Tệp</th></tr></thead><tbody>${Object.entries(TEMPLATES).map(([t, f]) => `<tr><td><strong>${TYPES[t]}</strong></td><td><code>Views/${f}.cshtml</code></td></tr>`).join('')}</tbody></table></div></section>`;
  if (cur === 'ngon-ngu') body = `<section class="card"><dl class="kv"><dt>Ngôn ngữ mặc định</dt><dd>Tiếng Việt (vi-VN)</dd><dt>Ngôn ngữ khác</dt><dd>Chưa có</dd></dl></section>`;
  if (cur === 'dong-bo') body = `<section class="card"><h2>Đồng bộ cấu hình (uSync)</h2><dl class="kv"><dt>Lần xuất gần nhất</dt><dd>${esc(S.settings.lastSync || '09:12 hôm nay')}</dd><dt>Số tệp cấu hình</dt><dd>214</dd><dt>Khác biệt</dt><dd><span class="pill ok">Không có</span></dd></dl><div class="acts mt"><button class="btn" type="button" data-a="syncReport">Kiểm tra khác biệt</button><button class="btn p" type="button" data-a="syncExport">Xuất cấu hình</button></div></section>`;
  return { sec: 'settings', side, body: `<div class="main"><div class="in"><div class="ph"><div><p class="crumb">Cài đặt</p><h1>${TECH.find(t => t[0] === cur)[1]}</h1></div></div>${note}${body}</div></div>` };
});
A.syncReport = () => toast('Không có khác biệt giữa cơ sở dữ liệu và tệp cấu hình');
A.syncExport = () => { S.settings.lastSync = nowAt(); save(); toast('Đã xuất 214 tệp cấu hình'); render(); };

// ---- Khoi dong ----
function boot() {
  const h = location.hash;
  if (!S.auth && !h.startsWith('#/dang-nhap')) { history.replaceState(null, '', '#/dang-nhap'); }
  if (S.auth && (!h || h.startsWith('#/dang-nhap'))) history.replaceState(null, '', '#/noi-dung');
  U.lastHash = location.hash;
  render();
}
window.addEventListener('hashchange', () => { if (!S.auth && !location.hash.startsWith('#/dang-nhap')) { history.replaceState(null, '', '#/dang-nhap'); render(); } });
boot();

</script>
</body>
</html>
