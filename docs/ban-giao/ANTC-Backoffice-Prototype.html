cầu vay tiền của anh D. và lập hồ sơ yêu cầu anh D ký. Trong hồ sơ đã ghi rõ số thực nhận, tổng phải trả, lịch trả. Trừ hết chi tiêu cần thiết, nợ đang có và khoản để dành, thu nhập ổn định của anh vẫn đủ trả. Anh nên quyết định thế nào?","opt":[["A","Cứ vay, vì hồ sơ đã được duyệt và hiện nay có khả năng trả nợ"],["B","Nên từ chối vì chưa rõ các điều kiện khác và không biết khả năng trả nợ trong tương lai thế nào"],["C","Có thể ký sau khi cân nhắc lại nhu cầu, đánh giá khả năng và kiểm tra đầy đủ các điều kiện khác"],["D","Coi như đã kiểm tra xong nên khoản vay chắc chắn an toàn cả kỳ"]],"ans":"C","exp":{"C":"Đúng. Anh D. đủ căn cứ để tự quyết, nhưng vẫn phải lường trước việc thu nhập có thể thay đổi."}},{"code":"CĐ4-007","q":"Anh Nam đứng tên vay giúp bạn, còn người bạn nhận và tiêu hết số tiền. Theo giấy tờ đã ký, ai có thể phải trả nợ?","opt":[["A","Người bạn đã trực tiếp cầm và tiêu hết số tiền vay đó"],["B","Anh Nam, vì anh là người đứng tên vay trong hồ sơ"],["C","Người đã giới thiệu hai bên quen nhau để làm hồ sơ"],["D","Không ai cả, nếu hai người chỉ thỏa thuận bằng miệng"]],"ans":"B","exp":{"B":"Đúng. Anh Nam tự nguyện đứng tên vay nên có thể phải trả theo hồ sơ, dù tiền đã giao cho bạn dùng."}},{"code":"CĐ4-035","q":"Một người chỉ cho số điện thoại để làm người tham chiếu trong hồ sơ vay của người thân. Việc đó có tự động biến họ thành người vay hoặc người bảo lãnh không?","opt":[["A","Có, vì bên cho vay đã lưu số điện thoại trong hồ sơ"],["B","Có, nếu bên cho vay đã gọi xác nhận họ biết người vay"],["C","Tự động thành người bảo lãnh khi người vay chậm một kỳ"],["D","Không; trách nhiệm phụ thuộc giấy tờ đã ký/chấp thuận và quy định áp dụng"]],"ans":"D","exp":{"D":"Đúng. Người tham chiếu, người vay và người bảo lãnh là các vai trò khác nhau; trách nhiệm phải xem đúng tài liệu đã ký/chấp thuận và pháp luật áp dụng."}},{"code":"TH01-01-A","q":"Anh M. nên quyết định thế nào là phù hợp nhất?","opt":[["A","Đồng ý nếu người kia gửi căn cước và chuyển một khoản đặt cọc"],["B","Bảo lãnh một khoản nhỏ trước để thử xem họ có trả nợ không"],["C","Không bảo lãnh cho người chỉ quen qua mạng; không gửi giấy tờ, chữ ký hay mã xác thực"],["D","Gửi trước ảnh giấy tờ cho họ mở hồ sơ, nhưng chưa ký gì cả"]],"ans":"C","exp":{"C":"Đúng. Bảo lãnh có thể khiến anh M. phải thực hiện nghĩa vụ thay. Ảnh hồ sơ và vài tháng trò chuyện không đủ để nhận nghĩa vụ này; tra được tổ chức cho vay thật cũng không chứng minh người nhờ bảo lãnh sẽ trả."}},{"code":"TH01-01-B","q":"Bước tiếp theo nào là an toàn nhất?","opt":[["A","Tự liên hệ tổ chức cho vay qua kênh chính thức, yêu cầu kiểm tra và ghi nhận mình không đồng ý bảo lãnh"],["B","Gọi số của bên cho vay do chính người kia gửi cho anh M."],["C","Đề nghị người kia chuyển một khoản tiền cho anh M. giữ"],["D","Xin gọi video nhìn mặt, xem có đúng người vẫn nhắn không"]],"ans":"A","exp":{"A":"Đúng. Liên hệ độc lập giúp xác định có hồ sơ hay không và tạo bằng chứng rằng anh M. không chấp thuận bảo lãnh; cần lưu số tiếp nhận và phản hồi."}},{"code":"TH01-02-A","q":"Chị Hoa nên xử lý lời đề nghị này như thế nào?","opt":[["A","Chuyển tiền nếu người kia gửi ảnh bệnh viện và ảnh giấy tờ"],["B","Dừng hẳn việc vay và chuyển tiền; vừa gấp lại vừa bắt giữ kín"],["C","Dừng một chút rồi vay một phần chuyển trước, mai kiểm tra lại"],["D","Hoãn lại, nhưng nộp trước khoản phí giữ chỗ vay cho chắc"]],"ans":"B","exp":{"B":"Đúng. Chỉ riêng yêu cầu vay/chuyển khoản lớn dưới sức ép khẩn cấp và giữ bí mật đã đủ để không vay hộ, không chuyển tiền và xác minh độc lập. Không cần đếm đủ hai hay ba dấu hiệu."}},{"code":"TH01-02-B","q":"Sau đó, chị Hoa nên làm gì cho an toàn?","opt":[["A","Xóa hết cuộc trò chuyện đi cho đỡ bị áp lực trong đầu"],["B","Đăng công khai ảnh người kia lên mạng để mọi người tìm"],["C","Tự tra rồi hỏi vặn người kia từng chi tiết cho tới khi họ nhận sai"],["D","Lưu lại lời đề nghị, tự tra lại, nhờ người tin cậy cùng xem"]],"ans":"D","exp":{"D":"Đúng. Lưu lại thì còn bằng chứng, mà kể cho một người tin cậy thì mình bớt phải quyết định một mình."}},{"code":"CĐ4-044","q":"Có người bảo anh S. đọc mã OTP để “hoàn tất khoản vay hộ”. Anh S. nên làm gì?","opt":[["A","Đọc mã, vì đó là một bước thủ tục bình thường của hồ sơ"],["B","Đọc mã trước, rồi đổi ngay mật khẩu tài khoản cho an toàn"],["C","Không đọc mã cho ai; tự mở ứng dụng ngân hàng mà kiểm tra"],["D","Chỉ đọc mã sau khi kiểm tra giấy tờ tùy thân của người kia"]],"ans":"C","exp":{"C":"Đúng. Không đọc và không nhập mã theo lời người khác. Muốn biết có gì thật thì tự mở ứng dụng hoặc gọi tổng đài."}},{"code":"CĐ4-014","q":"Chị Tâm biết tháng tới có thể không đủ tiền trả đúng hạn, dù khoản vay chưa tới hạn. Việc đầu tiên chị nên làm là gì?","opt":[["A","Gọi bên cho vay bằng số tự tra, bàn cách trả, xin ghi lại"],["B","Tự tra một nơi cho vay khác, vay nóng để trả cho kỳ tới"],["C","Bỏ một kỳ trả, vì bên cho vay chưa gây sức ép gì với chị"],["D","Im lặng, tắt máy, chờ tới lúc quá hạn cho bên kia gọi"]],"ans":"A","exp":{"A":"Đúng. Gọi sớm thì còn hỏi được về việc giãn kỳ hoặc cách trả khác, mà lại có ghi chép về nội dung đã bàn."}},{"code":"CĐ4-013","q":"Người đòi nợ gửi thông tin khoản vay cho đồng nghiệp của người vay để gây sức ép. Điểm đáng lo nhất là gì?","opt":[["A","Lịch trả nợ có thể chưa ghi rõ ngày và số tiền từng kỳ"],["B","Chuyện nợ bị đem làm phiền người không có trách nhiệm trả"],["C","Khoản vay có thể đã bị trừ mấy loại phí trước khi giải ngân"],["D","Người vay có thể đã ký đứng tên hộ cho một người khác dùng"]],"ans":"B","exp":{"B":"Đúng. Nếu là khoản vay tiêu dùng của công ty tài chính, việc nhắc/đòi nợ hoặc gửi thông tin thu hồi nợ cho đồng nghiệp hay người không có nghĩa vụ là không được phép. Với chủ thể khác, việc tiết lộ dữ liệu, đe dọa hoặc quấy rối vẫn cần được ghi nhận và xử lý theo quy định áp dụng."}},{"code":"TH08-01-A","q":"Chị K. nên quyết định thế nào?","opt":[["A","Trả một khoản nhỏ, giữ biên nhận, rồi khiếu nại sau nếu cần"],["B","Bảo em trai viết giấy nhận hết nợ, rồi chị trả giúp cho xong"],["C","Đăng số máy và lời dọa lên mạng, ai xác nhận thì chị chặn"],["D","Không tự nhận khoản nợ chỉ vì bị gọi đúng tên và bị dọa"]],"ans":"D","exp":{"D":"Đúng. Bị gọi đúng tên hay bị dọa đều không có nghĩa là chị K. phải trả khoản vay đó."}},{"code":"TH08-01-B","q":"Bước tiếp theo phù hợp là gì?","opt":[["A","Gọi lại số khác người kia đưa, đọc mã hồ sơ để hỏi cho rõ"],["B","Nhờ cộng đồng mạng tìm người gọi, đăng số máy và ảnh hồ sơ"],["C","Lưu lời dọa; tự liên hệ tổ chức bị nhắc đến và yêu cầu căn cứ nghĩa vụ"],["D","Xóa tin nhắn và chặn số ngay, để đầu óc đỡ nặng nề vì việc đó"]],"ans":"C","exp":{"C":"Đúng. Lưu nội dung giúp khiếu nại và trình báo; tự liên hệ tổ chức qua kênh độc lập để xác định có khoản nợ nào và chị K. có nghĩa vụ hay không."}},{"code":"TH08-02-A","q":"Cách hiểu nào phù hợp nhất?","opt":[["A","Phải đối chiếu hồ sơ và tính tới khả năng bị mạo danh đã"],["B","Ông V. nói chưa vay thì tự khắc ông không có nghĩa vụ gì"],["C","Gia đình nên trả trước một kỳ để khỏi phát sinh tiền phạt"],["D","Đọc đúng căn cước và địa chỉ tức là ông V. đã tự nguyện vay"]],"ans":"A","exp":{"A":"Đúng. Chỉ dựa vào tên, số căn cước hay địa chỉ thì chưa kết luận được ông V. có tự nguyện vay hay không."}},{"code":"TH08-02-B","q":"Gia đình nên làm gì tiếp?","opt":[["A","Chặn hết cuộc gọi và không trả lời bất kỳ tổ chức nào nữa"],["B","Giữ thông báo, tự liên hệ tổ chức, đòi hồ sơ và báo đúng nơi"],["C","Đăng ảnh thông báo lên mạng tìm người từng gặp chuyện giống"],["D","Đối đầu người gọi, buộc họ xóa khoản nợ ngay trong cuộc gọi"]],"ans":"B","exp":{"B":"Đúng. Giữ được thông báo thì mới đòi được hồ sơ, và tự liên hệ thì mới chắc đang nói chuyện với đúng tổ chức."}}]},"5":{"t":"Việc làm, tuyển dụng và nhiệm vụ trực tuyến","q":[{"code":"CĐ5-001","q":"Trước một lời mời việc làm bắt nộp hồ sơ, trả phí hoặc giao giấy tờ, câu hỏi nào nên đặt ra trước tiên?","opt":[["A","Công việc này có phải là chỗ trả lương cao nhất không?"],["B","Mình có nên nộp một khoản nhỏ để giữ chỗ trước không?"],["C","Người tuyển dụng này có chắc chắn là người xấu không?"],["D","Có nên nộp tiền hay giấy tờ khi chưa rõ ai đang tuyển?"]],"ans":"D","exp":{"D":"Đúng. Câu hỏi này chặn đúng chỗ nguy hiểm nhất: đưa tiền hoặc giấy tờ đi khi chưa biết bên kia là ai."}},{"code":"CĐ5-003","q":"Trường hợp nào dưới đây là chuyện tìm việc hoặc nhận việc, cần kiểm tra kỹ?","opt":[["A","Mua một chiếc điện thoại để dùng cho công việc của mình"],["B","Nộp phí hồ sơ để được người ta giới thiệu việc làm"],["C","Góp 50 triệu vào một xưởng may để nhận phần chia lãi"],["D","Vay 20 triệu của một tổ chức tín dụng có giấy phép"]],"ans":"B","exp":{"B":"Đúng. Người xin việc đang phải chuyển tiền đi để được nhận việc. Đó chính là lúc phải dừng lại kiểm tra."}},{"code":"CĐ5-021","q":"Câu hỏi nào giúp kiểm tra nhanh nhất xem tiền đang chảy về phía nào?","opt":[["A","Công việc này có hợp với mình hay không?"],["B","Bên tuyển dụng có bao nhiêu nhân viên?"],["C","Đồng tiền đầu tiên đi theo chiều nào?"],["D","Mỗi tháng mình kiếm được bao nhiêu?"]],"ans":"C","exp":{"C":"Đúng. Câu này trả lời được trong vài giây, mà lại chặn đúng chỗ nguy hiểm nhất. Đi làm thì tiền phải chảy về phía mình."}},{"code":"CĐ5-025","q":"Trước khi nộp hồ sơ hoặc nộp bất kỳ khoản tiền nào, cần làm rõ nhóm thông tin nào?","opt":[["A","Lương - giờ làm - đồng phục - đi lại - chỗ ở - suất ăn"],["B","Hồ sơ gồm gì - nộp ở đâu - nộp cho ai - khi nào - phí bao nhiêu"],["C","Tên công ty - địa chỉ - điện thoại - mã số thuế - trang mạng xã hội"],["D","Chiều tiền - công việc - ai tuyển - trả công - giấy tờ - đường ra"]],"ans":"D","exp":{"D":"Đúng. Sáu nhóm này là ngưỡng sàng lọc tối thiểu, không phải bảo đảm việc làm là thật. Thiếu hoặc mâu thuẫn thì chưa nộp tiền hay giao giấy tờ; nếu đủ vẫn phải kiểm tra người tuyển, thẩm quyền, hợp đồng và dòng tiền."}},{"code":"CĐ5-005","q":"Một ứng dụng bắt nạp tiền theo từng gói để “mở nhiệm vụ” rồi nhận hoa hồng, nhưng lại tự gọi đó là đầu tư. Hiểu thế nào cho đúng?","opt":[["A","Là kiểu làm cộng tác viên mà bắt nạp tiền trước mới có việc"],["B","Là đầu tư an toàn, vì họ tự giới thiệu vậy và có bảng lợi nhuận"],["C","Là mua hàng bình thường, vì vẫn có thao tác đặt đơn hàng"],["D","Là một khoản vay, vì người tham gia phải bỏ tiền ra trước"]],"ans":"A","exp":{"A":"Đúng. Gọi tên là gì cũng được, nhưng việc đang xảy ra là: mình nạp tiền vào, rồi được hứa trả hoa hồng."}},{"code":"CĐ5-013","q":"Một nơi nhắn: “Em nạp 200 nghìn để kích hoạt gian hàng, làm nhiệm vụ rồi nhận hoa hồng.” Dấu hiệu đáng lo nhất là gì?","opt":[["A","Bên tuyển giữ bằng gốc để bảo đảm người làm xong nhiệm vụ"],["B","Phải nạp tiền thì mới được giao việc và mới nhận hoa hồng"],["C","Thu nhập được trả cố định theo từng tháng làm việc"],["D","Người xin việc phải đến tận nơi để phỏng vấn trực tiếp"]],"ans":"B","exp":{"B":"Đúng. Tiền chảy từ người tìm việc sang phía họ trước, mà khoản nạp lại gắn liền với việc được giao và tiền hoa hồng."}},{"code":"CĐ5-017","q":"Tin tuyển việc yêu cầu cài ứng dụng từ đường dẫn ngoài cửa hàng ứng dụng chính thức và cấp quyền Trợ năng để hệ thống “tự làm nhiệm vụ”. Phản ứng an toàn nhất là gì?","opt":[["A","Cấp tạm, rút quyền sau khi nhận việc"],["B","Cấp quyền nhưng ẩn ứng dụng ngân hàng"],["C","Dừng lại; không cài ứng dụng và không cấp quyền Trợ năng"],["D","Dùng điện thoại phụ thì ứng dụng lạ sẽ an toàn"]],"ans":"C","exp":{"C":"Đúng. Ứng dụng độc hại có thể lợi dụng quyền Trợ năng để lấy dữ liệu hoặc chiếm quyền. Yêu cầu này không cần thiết cho một công việc bình thường."}},{"code":"TN-29","q":"Một ứng dụng trả hoa hồng cho vài nhiệm vụ đầu, rồi bắt nạp khoản lớn hơn. Khoản trả ban đầu đó chứng minh được điều gì?","opt":[["A","Là việc làm thật, vì có tiền nhiệm vụ và có lịch trả rõ ràng"],["B","Chứng tỏ ứng dụng có tiền, nếu họ đã trả cho nhiều người"],["C","Chỉ chứng tỏ đã có một khoản được trả, chưa nói gì thêm"],["D","Cho phép nạp tăng dần, miễn là rút được ngay sau mỗi nhiệm vụ"]],"ans":"C","exp":{"C":"Đúng. Khoản trả lúc đầu là mồi. Nó không cho biết tiền đó từ đâu, cũng không chứng minh có công việc thật."}},{"code":"CĐ5-036","q":"Người giới thiệu việc cho em Trung là bạn cùng phòng, đang làm và đang thật sự nhận được tiền. Như vậy đã đủ để khỏi phải kiểm tra chưa?","opt":[["A","Đủ rồi, vì bạn cùng phòng chẳng có lý do gì để đi lừa mình cả"],["B","Chưa đủ; người giới thiệu không thay được tự kiểm tra"],["C","Đủ rồi, nếu bạn ấy đã làm được hơn một tháng"],["D","Chưa đủ, vì bạn cùng phòng chắc chắn đang ăn hoa hồng"]],"ans":"B","exp":{"B":"Đúng. Rất nhiều người bị hại trở thành người đi giới thiệu, chỉ vì họ nhận được tiền thật ở mấy nhiệm vụ đầu tiên."}},{"code":"TH07-01-A","q":"Ứng viên nên quyết thế nào?","opt":[["A","Nộp bằng ví phụ cho đỡ lộ tài khoản chính của mình"],["B","Nộp đi, vì khoản đó sẽ được hoàn sau nhiệm vụ đầu"],["C","Làm thử một nhiệm vụ miễn phí rồi mới quyết nộp"],["D","Dừng lại, vì đây là nộp tiền để được nhận việc"]],"ans":"D","exp":{"D":"Đúng. Chỉ cần nhìn chiều tiền là đủ: người xin việc đang phải chuyển tiền đi. Đó là lúc dừng."}},{"code":"TH07-01-B","q":"Cách kiểm tra đúng là gì?","opt":[["A","Chuyển một khoản nhỏ rồi thử xem có rút tiền ra được không"],["B","Tự tìm tổ chức đó, vị trí tuyển và nơi họ đăng tin"],["C","Hỏi mấy thành viên đã nhận được hoa hồng trong nhóm chat"],["D","Gọi số hỗ trợ được gắn sẵn trong ứng dụng làm nhiệm vụ"]],"ans":"B","exp":{"B":"Đúng. Tự đi tìm là bước ra khỏi câu chuyện họ đang kể. Đó mới là kiểm tra thật."}},{"code":"CĐ5-045","q":"Em Phong đã nạp nhiều lần, ứng dụng hiện số hoa hồng khá lớn. Khi em xin rút, ứng dụng báo phải nâng gói và nạp thêm mới rút được. Nên hiểu con số hoa hồng đó thế nào?","opt":[["A","Chỉ là con số ứng dụng hiện ra; bắt nạp thêm là lúc phải dừng"],["B","Là tiền của em đang được giữ hộ, làm xong thủ tục là rút được"],["C","Là tiền công của những nhiệm vụ em đã làm nên em có quyền đòi"],["D","Là con số tạm tính, sẽ đúng lại sau khi em nâng gói lên"]],"ans":"A","exp":{"A":"Đúng. Con số đó có thể đổi hoặc biến mất cùng với ứng dụng. Thứ duy nhất đã xảy ra thật là những khoản em đã nạp đi."}},{"code":"CĐ5-014","q":"Một nơi tuyển dụng bảo anh Minh để lại bằng tốt nghiệp bản chính “để làm thủ tục”. Anh Minh nên làm gì?","opt":[["A","Giao bản chính, nếu có biên nhận ghi rõ ngày sẽ trả lại"],["B","Chờ thấy thêm một dấu hiệu lạ nữa rồi hãy từ chối giao"],["C","Không giao cho họ giữ; chỉ đưa ra đối chiếu rồi cầm về ngay"],["D","Giao, nếu đã kiểm tra được địa chỉ và đăng ký của công ty"]],"ans":"C","exp":{"C":"Đúng. Anh Minh cứ đưa ra cho họ xem để đối chiếu, rồi cầm về ngay. Khoản 1 Điều 17 Bộ luật Lao động năm 2019 cấm người sử dụng lao động giữ bản chính giấy tờ tùy thân, văn bằng, chứng chỉ của người lao động — nên họ không có quyền giữ."}},{"code":"CĐ5-044","q":"Một lời mời “việc nhẹ” trả công để em Hùng mở, cho mượn, cho thuê hoặc bán lại tài khoản ngân hàng; sau đó em phải giao thẻ, SIM, mã xác thực, hoặc nhận tiền rồi chuyển hộ. Em nên làm gì?","opt":[["A","Chỉ đưa số tài khoản thôi, còn thẻ và SIM thì giữ lại"],["B","Dừng; không mở, không cho thuê, không nhận chuyển tiền hộ"],["C","Làm thử một ngày, thấy bất thường thì khóa tài khoản"],["D","Làm, nếu có hợp đồng, biết người thuê và chỉ nhận khoản nhỏ"]],"ans":"B","exp":{"B":"Đúng. Tài khoản đứng tên em có thể bị dùng để nhận, chuyển hoặc che giấu tiền từ lừa đảo hay hành vi phạm pháp. Việc cho thuê/cho mượn tài khoản bị cấm; trách nhiệm hình sự về rửa tiền hoặc tội khác còn phụ thuộc hành vi, nhận thức và các yếu tố cụ thể."}},{"code":"TH07-02-A","q":"Ứng viên nên làm gì?","opt":[["A","Giao bản chính, nhưng bắt họ ký biên nhận là đang giữ hộ"],["B","Mua bộ rẻ nhất rồi giữ hóa đơn lại, như vậy đỡ rủi ro hơn"],["C","Chấp nhận, vì công ty có thật và họ đã gửi ảnh thẻ nhân viên"],["D","Dừng làm việc qua người này; không chuyển tiền, không giao bản chính; tự liên hệ công ty"]],"ans":"D","exp":{"D":"Đúng. Công ty có thật không chứng minh người nhắn là người của công ty. Người sử dụng lao động cũng không được giữ bản chính giấy tờ tùy thân, văn bằng hoặc chứng chỉ của người lao động. Phải xác minh qua bộ phận tuyển dụng chính thức."}},{"code":"TH07-02-B","q":"Qua bộ phận tuyển dụng chính thức do mình tự tìm, cần xác minh gì trước khi cân nhắc đi tiếp?","opt":[["A","Vị trí và người liên hệ; bên bán, giá/hoàn tiền; xác nhận không giữ bản chính"],["B","Đã có bao nhiêu người được người liên hệ này tuyển thành công"],["C","Lời hứa miệng rằng sẽ hoàn tiền công cụ sau khi hết thử việc"],["D","Ảnh văn phòng, giấy phép và cam kết công ty đang hoạt động"]],"ans":"A","exp":{"A":"Đúng. Phải xác minh người đang nhắn có được giao tuyển vị trí này không, việc mua công cụ có bắt buộc và hoàn tiền ra sao; bản chính chỉ đưa ra đối chiếu, không giao để giữ."}},{"code":"CĐ5-011","q":"Một người lạ rủ em Khoa đi làm xa với lời hứa “việc nhẹ, lương cao”, không cho địa chỉ cụ thể, lại giục lên xe ngay tối nay. Dấu hiệu đáng lo nhất là gì?","opt":[["A","Chỗ làm ở xa nhà và phải đi bằng xe do bên tuyển bố trí"],["B","Người tuyển hẹn đưa đón, nói sẽ cho địa chỉ khi đã lên đường"],["C","Không biết sẽ đến đâu, gặp ai, mà vẫn bị giục đi ngay trong đêm"],["D","Lương được hứa trả vào cuối tháng chứ không trả theo từng ngày"]],"ans":"C","exp":{"C":"Đúng. Không biết nơi đến, không biết gặp ai, mà lại bị giục đi ngay trong đêm — đây là nguy cơ cho cả tiền, giấy tờ lẫn sự an toàn của bản thân."}},{"code":"CĐ5-012","q":"Một tài khoản mạng xã hội mời chị Nhàn đi làm ở nước ngoài, nhưng không nói doanh nghiệp nào, làm ở đâu, hợp đồng ra sao. Dấu hiệu rõ nhất là gì?","opt":[["A","Không biết doanh nghiệp nào, làm ở đâu, ai chịu trách nhiệm"],["B","Lời mời gửi qua mạng xã hội thay vì gặp nhau tại văn phòng"],["C","Việc này được quảng cáo cùng lúc cho rất nhiều người khác"],["D","Người liên hệ dùng số di động và tài khoản nhắn tin cá nhân"]],"ans":"A","exp":{"A":"Đúng. Chị Nhàn không có căn cứ nào để biết mình sẽ làm ở đâu, cho ai, và ai chịu trách nhiệm nếu có chuyện."}},{"code":"CĐ5-035","q":"Chị Thảo định nộp 8 triệu học phí một khóa kỹ năng. Đơn vị tổ chức tra được trên cổng thông tin chính thức, có địa chỉ thật. Tờ quảng cáo ghi là học xong sẽ được giới thiệu việc làm, nhưng hợp đồng đào tạo lại không ghi điều đó, cũng không ghi khi nào được hoàn học phí. Chị Thảo nên làm gì?","opt":[["A","Nộp học phí, vì đơn vị đã tra được và có địa chỉ thật rồi"],["B","Không nộp, vì cam kết giới thiệu việc không có trong hợp đồng"],["C","Hoãn lại; yêu cầu ghi rõ cam kết việc làm và điều kiện hoàn phí"],["D","Nộp trước một nửa học phí để học thử một phần khóa học"]],"ans":"C","exp":{"C":"Đúng. Lời quảng cáo hoặc cam kết có thể là căn cứ và chứng cứ, nhưng nội dung mơ hồ dễ gây tranh chấp. Hãy yêu cầu đưa cam kết việc làm và hoàn phí vào hợp đồng rõ ràng trước khi nộp tiền."}},{"code":"CĐ5-018","q":"Chị Loan được mời tham gia công việc có kèm khoản phí đào tạo phải nộp. Thỏa thuận đã rõ công việc, tiền công và giấy tờ, nhưng chưa ghi thời hạn, cách chấm dứt và xử lý khoản đã nộp. Nên làm gì?","opt":[["A","Cứ tham gia; thời hạn, cách chấm dứt và khoản đã nộp bổ sung sau"],["B","Giao bản chính giấy tờ để giữ chỗ, miễn là có biên nhận hẹn trả"],["C","Dừng hẳn và kết luận lừa đảo vì thỏa thuận còn thiếu điều khoản"],["D","Hoãn ký/nộp; yêu cầu ghi rõ thời hạn, chấm dứt và xử lý khoản tiền"]],"ans":"D","exp":{"D":"Đúng. Hỏi rõ loại quan hệ, thời hạn, cách chấm dứt và khoản khấu trừ/hoàn trả theo pháp luật và thỏa thuận trước khi ký hoặc nộp tiền."}},{"code":"CĐ5-037","q":"Em Quyên ứng tuyển việc làm thêm. Công ty tra được trên cổng thông tin chính thức, em đã đến xem chỗ làm là có thật, không ai đòi nộp khoản nào, chỉ cần bản sao giấy tờ. Hợp đồng ghi rõ công việc, tiền công theo giờ, kỳ trả và cách nghỉ; em còn được mang về đọc trước một ngày. Em nên làm gì?","opt":[["A","Có thể nhận việc, vì đã kiểm tra đủ rồi"],["B","Hoãn thêm một tháng nữa để quan sát công ty"],["C","Không nhận, vì làm thêm luôn ảnh hưởng việc học"],["D","Chỉ nhận nếu công ty chịu trả lương theo tuần"]],"ans":"A","exp":{"A":"Đúng. Chiều tiền đúng, không ai bắt nộp khoản nào, hợp đồng rõ ràng và em có thời gian đọc. Không còn gì chưa rõ thì em có quyền nhận việc."}},{"code":"TN-33","q":"Nếu đã lỡ gửi ảnh giấy tờ và nộp phí cho một nơi tuyển dụng đáng ngờ, nên làm theo thứ tự nào?","opt":[["A","Xóa ảnh, tin nhắn và ứng dụng trước, để bên kia khỏi dùng tiếp"],["B","Dừng liên hệ, giữ bằng chứng, bảo vệ tài khoản rồi báo đúng nơi"],["C","Nộp thêm phí hoàn hồ sơ, rồi chấm dứt sau khi nhận lại giấy tờ"],["D","Công khai toàn bộ ảnh giấy tờ, nhờ mọi người xác minh giúp mình"]],"ans":"B","exp":{"B":"Đúng. Dừng làm theo và không nộp thêm; lưu ngay tin nhắn, URL, tài khoản nhận, biên lai. Vì đã chuyển tiền, liên hệ ngân hàng/tổ chức thanh toán để tra soát ngay; các việc có thể làm song song."}},{"code":"CĐ5-049","q":"Anh Trọng đã nộp bằng tốt nghiệp bản gốc cho một trung tâm, nay không liên lạc được với họ nữa. Anh nên làm gì?","opt":[["A","Nộp thêm khoản phí mà trung tâm yêu cầu để lấy lại bằng"],["B","Đăng tên trung tâm lên mạng, kèm ảnh giấy tờ của mình"],["C","Chờ thêm mà không gửi yêu cầu, không liên hệ cơ quan quản lý và không trình báo"],["D","Trình báo Công an và làm theo hướng dẫn của cơ quan"]],"ans":"D","exp":{"D":"Đúng. Trình báo sớm để vụ việc được ghi nhận và được hướng dẫn. Văn bằng/chứng chỉ thường chỉ cấp bản chính một lần; nếu mất, hãy hỏi cơ sở/cơ quan cấp về bản sao từ sổ gốc, không hứa chắc sẽ được cấp lại bản chính."}}]},"6":{"t":"Mua bán, đặt cọc và dịch vụ tiêu dùng","q":[{"code":"CĐ6-002","q":"Trước khi trả tiền hoặc đặt cọc, câu tự nhắc nào vừa dễ nhớ vừa đủ ý nhất?","opt":[["A","Chưa rõ giá, số lượt đánh giá và cửa hàng mở bao lâu thì chưa trả"],["B","Chưa rõ tiền vào tay ai, nhận gì và nhận cách nào thì chưa trả"],["C","Chưa hỏi ý người quen và chưa xem ảnh người bán thì chưa trả tiền"],["D","Chưa thấy người bán quảng cáo nhiều nơi thì chưa nên đặt cọc"]],"ans":"B","exp":{"B":"Đúng. Ba câu này nhìn thẳng vào chỗ dễ mất tiền nhất: người nhận tiền, món hàng, và cách giao nhận."}},{"code":"CĐ6-003","q":"Trong mua bán, rủi ro thường nằm ở chỗ nào?","opt":[["A","Ở chỗ người bán có niềm nở, dễ chịu hay không dễ chịu"],["B","Ở chỗ món hàng đắt hay rẻ tiền, nhiều hay ít"],["C","Ở chỗ mua trên mạng hay mua trực tiếp tại cửa hàng"],["D","Ở khoảng cách giữa lúc trả tiền và lúc nhận hàng"]],"ans":"D","exp":{"D":"Đúng. Càng phải trả tiền sớm mà càng lâu mới cầm được hàng, thì khoảng thời gian ở giữa càng rủi ro."}},{"code":"CĐ6-028","q":"Trước khi trả tiền hoặc đặt cọc, cần làm rõ nhóm thông tin nào?","opt":[["A","Giá bán, thương hiệu, thời gian bảo hành, quà khuyến mại và cách đóng gói"],["B","Ngày đặt hàng, hãng vận chuyển, phí giao hàng, kích thước gói và giờ giao"],["C","Tiền vào ai — nhận gì — trả qua đâu — giao thế nào — hoàn trả ra sao"],["D","Số người theo dõi, số bình luận, số buổi phát trực tiếp và số mặt hàng"]],"ans":"C","exp":{"C":"Đúng. Năm câu này là mức kiểm tra tối thiểu, chưa tự bảo đảm giao dịch an toàn. Còn phải đối chiếu người bán, giá, cách thanh toán, chính sách đổi trả/bảo hành và bằng chứng."}},{"code":"CĐ6-024","q":"Trả hết tiền trước, đặt cọc một phần, và trả khi nhận hàng — ba cách này khác nhau chủ yếu ở điểm nào?","opt":[["A","Khác ở số tiền mình đưa vào chỗ rủi ro trước khi nhận được hàng"],["B","Không khác nhau, vì rốt cuộc người mua vẫn phải trả đủ tiền"],["C","Khác ở mức phí chuyển khoản mà ngân hàng thu của người mua"],["D","Khác ở tốc độ người bán chuẩn bị, đóng gói và giao hàng cho mình"]],"ans":"A","exp":{"A":"Đúng. Số tiền trả trước là phần đã rời tay trước khi nhận hàng nên chịu rủi ro trực tiếp hơn. Nếu có sự cố, khả năng thu hồi còn tùy chứng từ, kênh thanh toán, chính sách sàn và pháp luật; không thể khẳng định chắc chắn mất đúng phần đó."}},{"code":"CĐ6-013","q":"Giá rẻ bất thường kèm thúc giục; đổi điều kiện giao hàng; đòi trả tiền ra ngoài sàn; tiền lại vào tay người không rõ vai trò. Bốn điều này có điểm chung gì?","opt":[["A","Đều do người bán lạ mặt, mới gặp lần đầu thực hiện"],["B","Đều thúc mình đưa tiền trước khi kịp kiểm tra"],["C","Đều chỉ xảy ra với những món hàng có giá trị lớn"],["D","Đều chỉ xuất hiện trên sàn thương mại điện tử"]],"ans":"B","exp":{"B":"Đúng. Cả bốn đều nhắm tới một việc: làm mình đưa tiền đi trước khi kịp nhìn cho rõ."}},{"code":"CĐ6-012","q":"Người bán nói: “Giá này chỉ có hôm nay, mà còn đúng một suất thôi.” Nên hiểu câu này thế nào?","opt":[["A","Đây là thông tin khuyến mại rõ ràng, quyết trước khi hết hạn là được"],["B","Câu này chỉ đáng lo khi món hàng đắt so với thu nhập của mình"],["C","Sức ép về thời gian đang làm mình bỏ qua bước kiểm tra"],["D","Nghe câu này là kết luận được ngay người bán đang lừa đảo"]],"ans":"C","exp":{"C":"Đúng. Giá thấp cộng với câu “chỉ hôm nay” là cách làm mình quyết trước khi kịp nghĩ."}},{"code":"CĐ6-009","q":"Một gian hàng có rất nhiều đánh giá tốt và lượt bán lớn. Điều đó chứng minh được gì?","opt":[["A","Chứng minh món hàng đúng như mô tả ghi trên trang bán"],["B","Chứng minh giao dịch này được sàn đứng ra bảo vệ hoàn toàn"],["C","Chứng minh người bán có thật và luôn giao hàng đúng hẹn"],["D","Chỉ là dữ liệu tham khảo, không bảo đảm người bán hoặc đơn hàng này an toàn"]],"ans":"D","exp":{"D":"Đúng. Một phần đánh giá/lượt bán có thể không xác thực; ngay cả đánh giá thật cũng phản ánh đơn khác, không bảo đảm người bán hay đơn của mình an toàn."}},{"code":"CĐ6-015","q":"Vì sao việc người bán rủ mình ra ngoài sàn để trả tiền riêng là điều cần cảnh giác?","opt":[["A","Vì trả tiền ngoài sàn là việc pháp luật không công nhận trong mọi trường hợp"],["B","Vì phí chuyển tiền bên ngoài thường cao hơn mức phí sàn đang thu của khách"],["C","Vì có thể mất lịch sử giao dịch, cơ chế thanh toán bảo vệ, tức là cách trả tiền có nơi đứng ra hỗ trợ nếu hàng có vấn đề và đường khiếu nại của sàn"],["D","Vì người bán đề nghị trả riêng thì thường bán hàng kém chất lượng hơn"]],"ans":"C","exp":{"C":"Đúng. Ra ngoài sàn có thể làm giao dịch không còn được ghi nhận hoặc không còn thuộc cơ chế giữ tiền/đổi trả/khiếu nại mà sàn cung cấp. Mức bảo vệ phải xem chính sách cụ thể."}},{"code":"CĐ6-018","q":"Lúc đặt hàng thì được hứa là cho kiểm tra hàng, nhưng khi giao lại không cho mở, còn giục ký nhận trước. Vì sao phải cảnh giác?","opt":[["A","Vì bên giao hàng buộc phải cho kiểm tra mọi gói hàng trước khi ký nhận"],["B","Vì hễ đã ký nhận là người mua mất toàn bộ quyền khiếu nại về sau"],["C","Vì đổi điều kiện giao nhận chứng tỏ món hàng bên trong chắc chắn là giả"],["D","Vì điều đã hứa bị rút mất, và mình bị buộc xác nhận trước khi được xem"]],"ans":"D","exp":{"D":"Đúng. Mình bị đòi xác nhận đã nhận đủ trong khi chưa được xem. Đó là lúc phải dừng lại."}},{"code":"CĐ6-026","q":"Cửa hàng bảo chuyển tiền cho một người không rõ là ai; mã hàng trong tin nhắn khác mã trên đơn; điều kiện hoàn tiền cũng chưa ghi rõ. Nên làm gì?","opt":[["A","Hoãn lại, vì người nhận tiền, món hàng và điều kiện hoàn đều chưa khớp"],["B","Cứ chuyển, nếu giá vẫn rẻ hơn nơi khác và họ hứa sẽ sửa mã hàng sau"],["C","Chuyển một phần để giữ đơn, ba chỗ lệch kia giải quyết dần lúc chờ"],["D","Đổi sang trả khi nhận hàng là xong, không cần làm rõ ba chỗ lệch đó"]],"ans":"A","exp":{"A":"Đúng. Mọi thông tin của cùng một đơn hàng phải khớp nhau. Ba chỗ lệch cùng lúc là quá nhiều để bỏ qua."}},{"code":"TH05-01-A","q":"Nên hiểu đường dẫn bán vé này thế nào?","opt":[["A","Phải xét riêng trang vừa nhảy sang, đừng tin theo nơi đã đặt đường dẫn đó"],["B","Thấy trang đích có biểu tượng ổ khóa trên thanh địa chỉ là chuyển tiền được"],["C","Đường dẫn này an toàn, vì nó nằm ngay trong bài trên một trang báo uy tín"],["D","Chuyển thử một khoản nhỏ cũng được, vì báo đã kiểm duyệt quảng cáo giúp rồi"]],"ans":"A","exp":{"A":"Đúng. Nơi đặt quảng cáo và trang đích là hai bên khác nhau; phải kiểm tra riêng người bán, địa chỉ trang đích và tài khoản nhận tiền. Trách nhiệm kiểm tra/giám sát quảng cáo của bên phát hành không biến trang đích thành an toàn."}},{"code":"TH05-01-B","q":"Cách kiểm tra đúng là gì?","opt":[["A","Gõ lại tiêu đề lên công cụ tìm kiếm rồi bấm vào kết quả đầu tiên"],["B","Gọi số điện thoại ghi trên chính trang lạ đó để hỏi tên đơn vị và giá vé"],["C","Tự mở trang hoặc ứng dụng chính thức của đơn vị bán vé rồi đối chiếu"],["D","Đọc bình luận dưới bài báo, xem lượt thích rồi quyết định có mua hay không"]],"ans":"C","exp":{"C":"Đúng. Tự mở nơi chính thức là mở một đường kiểm tra tách hẳn khỏi bài báo và trang lạ đang dẫn dắt mình."}},{"code":"CĐ6-041","q":"Ông B. được mời ngồi thử máy chăm sóc sức khỏe miễn phí suốt hai tháng, hay được tặng quà nhỏ và được gọi là “thành viên thân thiết”. Rồi người tổ chức nói chỗ trải nghiệm sắp đóng cửa, không mua máy 95 triệu ngay hôm nay là mất cơ hội. Nên hiểu thế nào?","opt":[["A","Nên mua ngay, để ông B. khỏi mất chỗ ngồi, mất quà và mất quyền lợi đã có"],["B","Quà và hạn chót đang thúc ông quyết vội; gia đình nên dừng lại và tự kiểm tra"],["C","Nhiều người cùng ngồi thử và đều khen tốt, nên chỉ cần xem lại giá là được"],["D","Được dùng miễn phí hai tháng đã đủ chứng minh máy tốt và người bán tử tế"]],"ans":"B","exp":{"B":"Đúng. Cho dùng miễn phí, tặng quà, gọi thân tình rồi báo sắp hết cơ hội — chuỗi việc này làm người ta ngại từ chối và quyết quá nhanh."}},{"code":"CĐ6-044","q":"Giấy tờ của một máy chăm sóc sức khỏe ghi công dụng là “hỗ trợ giảm mỏi cơ”. Nhân viên lại nói máy “chữa dứt điểm, khỏi phải uống thuốc”, vì nhiều người ngồi thử thấy đỡ. Nên hiểu thế nào?","opt":[["A","Tin công dụng ghi trong giấy tờ; “hỗ trợ” không phải “chữa khỏi”"],["B","Đã có giấy tờ sản phẩm thì lời nhân viên nói thêm cũng đáng tin cả"],["C","Nhiều người ngồi thử thấy đỡ là đủ chứng minh máy chữa bệnh"],["D","Máy đắt tiền và bán ở hội thảo nên tác dụng thật chắc hơn giấy tờ"]],"ans":"A","exp":{"A":"Đúng. “Hỗ trợ” không đồng nghĩa điều trị khỏi. Cần đối chiếu giấy tờ/nhãn đúng tên, đúng mẫu và nguồn giấy tờ; hỏi người có chuyên môn trước khi dùng cho bệnh."}},{"code":"CĐ6-045","q":"Tại một hội thảo tổ chức ở hội trường thuê tạm, công ty đưa bà M. bản hợp đồng mua máy giá 95 triệu và đòi đặt cọc 10 triệu ngay. Bà M. vừa cầm hợp đồng trên tay. Bà nên làm gì?","opt":[["A","Đặt cọc giữ giá, vì thời gian suy nghĩ chỉ bắt đầu sau khi trả đủ tiền"],["B","Hội thảo không tổ chức tại nhà nên chỗ bán tạm này không có quy định riêng"],["C","Chưa đặt cọc; giữ hợp đồng, ghi ngày nhận và dùng thời hạn 03 ngày làm việc để cân nhắc"],["D","Đã cầm hợp đồng thì phải mua, nên ghi lại ngày nhận cũng chẳng để làm gì"]],"ans":"C","exp":{"C":"Đúng. Đây là bán hàng không tại địa điểm giao dịch thường xuyên. Với hợp đồng bằng văn bản, người tiêu dùng có 03 ngày làm việc từ ngày nhận hợp đồng để quyết định thực hiện hoặc đơn phương chấm dứt; bên bán không được yêu cầu đặt cọc, thanh toán hoặc thực hiện hợp đồng trước khi hết thời hạn này."}},{"code":"TN-38","q":"Có ba cách xử lý cần nhớ. HOÃN là tạm dừng để hỏi thêm khi thiếu thông tin. DỪNG là ngừng hẳn khi gặp yêu cầu nguy hiểm hoặc điều kiện không thể chấp nhận. CÓ THỂ QUYẾT ĐỊNH là khi đã đủ thông tin để tự quyết. Nay cửa hàng có thật, giá hợp lý nhưng chưa ghi rõ phạm vi việc phải làm, tiêu chí nghiệm thu và trường hợp hoàn tiền. Nên xử lý thế nào?","opt":[["A","Dừng hẳn và tố cửa hàng gian dối; họ bổ sung sau cũng không xem xét lại"],["B","CÓ THỂ QUYẾT ĐỊNH trả tiền, vì cửa hàng và giá đã rõ; phần còn lại bổ sung sau"],["C","CÓ THỂ QUYẾT ĐỊNH đặt cọc một khoản nhỏ, để cửa hàng soạn điều kiện nghiệm thu"],["D","HOÃN trả tiền, cho tới khi ghi rõ việc phải làm và điều kiện được hoàn tiền"]],"ans":"D","exp":{"D":"Đúng. Ở đây chỉ thiếu thông tin, chưa có gì nguy hiểm — nên là HOÃN chứ không phải DỪNG."}},{"code":"CĐ6-046","q":"Bà T. mua nồi cơm điện ở gian hàng chính hãng, đã đối chiếu với trang của nhà sản xuất. Sàn giữ tiền đến khi giao xong; chính sách đổi trả, quyền kiểm tra hàng và giá đều rõ. Bà nên làm gì?","opt":[["A","Không mua, vì mua hàng trên mạng thì bao giờ cũng có rủi ro"],["B","Hoãn thêm vài ngày nữa để tìm xem còn chỗ nào bán rẻ hơn không"],["C","Nhắn người bán cam kết thêm một câu rồi mới chịu thanh toán"],["D","Có thể thanh toán, vì đã kiểm tra đủ và không thấy gì đáng ngờ"]],"ans":"D","exp":{"D":"Đúng. Kiểm tra đủ rồi mà không thấy gì đáng ngờ thì bà T. hoàn toàn có quyền mua. Chương trình này không dạy từ chối mọi thứ."}},{"code":"CĐ6-005","q":"Bạn nhận tin nhắn nói có người chuyển nhầm tiền vào tài khoản của bạn, kèm mã QR hoặc đường dẫn để “hoàn lại”. Cách làm an toàn nhất là gì?","opt":[["A","Chuyển lại vào tài khoản ghi trong tin nhắn, cho khỏi mang tiếng giữ tiền người ta"],["B","Không quét mã, không bấm đường dẫn; tự mở ứng dụng ngân hàng để xem"],["C","Gọi số điện thoại trong tin nhắn rồi làm theo cách hoàn tiền mà họ hướng dẫn"],["D","Quét mã QR để xem ai là người nhận, nhưng dừng trước bước xác nhận"]],"ans":"B","exp":{"B":"Đúng. Bạn không phải là người chủ động giao dịch với họ. Việc cần làm là tự xem tài khoản của mình và làm việc với ngân hàng qua kênh mình tự mở."}},{"code":"TN-39","q":"Đã thanh toán xong rồi, người bán lại nhắn xin mã xác thực để “hoàn tiền cho nhanh”. Nên làm gì?","opt":[["A","Không đưa mã; chụp lại yêu cầu đó rồi tự gọi ngân hàng và người bán"],["B","Đưa một mã thôi, nếu số tiền hoàn khớp, mã đơn đúng và tin nhắn có tên cửa hàng"],["C","Bấm vào đường dẫn họ gửi để đăng nhập, tự xem lệnh hoàn tiền đang chờ"],["D","Xóa hết tin nhắn, chặn số và gỡ ứng dụng, hết tin nhắn thì khỏi bị làm phiền"]],"ans":"A","exp":{"A":"Đúng. Bảo vệ tài khoản trước đã, còn chuyện đúng sai giữa hai bên tính sau. Gọi bằng số mình tự tìm, không gọi số trong tin nhắn."}},{"code":"TH06-01-A","q":"Chị A. nên quyết thế nào?","opt":[["A","Cứ tiếp tục, nếu tên chủ tài khoản mới trông gần giống tên cửa hàng"],["B","Dừng mọi khoản tiếp theo và chuyển sang xử lý sự cố sau thanh toán"],["C","Chờ hết ngày hẹn giao rồi mới làm gì, kẻo lại thành hiểu nhầm người ta"],["D","Chuyển thêm một khoản nhỏ giữ đơn, giao chậm thì đòi hoàn lại sau"]],"ans":"B","exp":{"B":"Đúng. Ba chuyện bất thường xuất hiện cùng lúc ngay sau khi chị chuyển tiền. Đây đã là sự cố, không còn là mua bán bình thường."}},{"code":"TH06-01-B","q":"Việc tiếp theo nào là phù hợp nhất?","opt":[["A","Đăng ảnh căn cước và số tài khoản của người bán lên mạng để mọi người tìm giúp"],["B","Xóa tin nhắn, chặn tài khoản và thoát khỏi cuộc trò chuyện cho khỏi bị thúc"],["C","Nhờ một dịch vụ nhận thu hồi tiền, chịu trả phí trước để họ xử lý ngay"],["D","Giữ đơn hàng và sao kê, rồi liên hệ chính nơi mình đã trả tiền qua"]],"ans":"D","exp":{"D":"Đúng. Liên hệ nơi thanh toán ngay; lưu chứng cứ song song, không đợi gom “đủ” mới gọi. Có thể cung cấp chứng từ đang có và bổ sung sau."}},{"code":"TH06-02-A","q":"Lúc này nên hiểu tình huống ra sao và ưu tiên làm gì trước?","opt":[["A","Coi như thẻ đã lộ; bảo vệ thẻ ngay bây giờ, đừng chờ bị trừ tiền"],["B","Đây chỉ là tranh chấp mua bán, cứ chờ người bán trả lời rồi tính tiếp"],["C","Chưa có chuyện gì đâu, vì tài khoản vẫn chưa thấy bị trừ đồng nào cả"],["D","Thử lại bằng một thẻ khác, xem có phải trang đó bị lỗi kỹ thuật không"]],"ans":"A","exp":{"A":"Đúng. Số thẻ đã nằm trong tay người khác rồi. Việc bị trừ tiền có thể xảy ra sau vài giờ hoặc vài ngày."}},{"code":"TH06-02-B","q":"Bước tiếp theo phù hợp là gì?","opt":[["A","Che bớt vài số rồi đăng ảnh thẻ lên mạng, nhờ mọi người kiểm tra giúp mình"],["B","Gọi ngân hàng để khóa/thay thẻ, kiểm tra giao dịch và lưu đường dẫn"],["C","Hỏi người bán xem trang đó có thật không, rồi mới quyết định khóa thẻ"],["D","Đổi trình duyệt, dùng thẻ phụ hạn mức thấp để hoàn tất nốt đơn đang chờ"]],"ans":"B","exp":{"B":"Đúng. Khóa hoặc thay thẻ chặn nguy cơ tiếp tục; kiểm tra giao dịch để phát hiện khoản không do mình thực hiện và tra soát/khiếu nại khi cần."}}]},"7":{"t":"Cuộc gọi, tin nhắn, đường dẫn và giả mạo","q":[{"code":"CĐ7-001","q":"Có người tự xưng là nhân viên hỗ trợ gọi đến, bảo bạn làm ngay mấy việc. Trước hết bạn nên tự hỏi điều gì?","opt":[["A","Có nên đọc mã xác thực trước, rồi mở ứng dụng kiểm tra sau không?"],["B","Có cần chắc chắn đây là lừa đảo rồi mới được cúp máy không?"],["C","Người gọi biết đúng thông tin của mình thì làm theo được chưa?"],["D","Mình có nên làm theo ngay khi đang nói chuyện với họ không?"]],"ans":"D","exp":{"D":"Đúng. Đây là câu hỏi đầu tiên và quan trọng nhất. Gần như mọi vụ lừa qua điện thoại đều cần mình làm theo ngay trong lúc còn đang nghe máy."}},{"code":"CĐ7-003","q":"Vì sao không cần cố nhớ từng kiểu giả mạo — giả công an, giả ngân hàng, giả người thân, giả người giao hàng?","opt":[["A","Vì mấy kiểu giả mạo đó ít gặp, không cần phân biệt riêng làm gì"],["B","Vì câu chuyện thì đổi, nhưng việc họ bảo mình làm thì lặp"],["C","Vì chỉ cần nghe kỹ giọng nói và cách xưng hô là nhận ra ngay"],["D","Vì nhận biết giả mạo là việc của riêng cơ quan chức năng"]],"ans":"B","exp":{"B":"Đúng. Hôm nay họ xưng công an, mai xưng nhân viên giao hàng, nhưng cuối cùng vẫn là bốn việc: đòi mã, bắt cài ứng dụng, đòi quyền vào máy, hoặc bảo chuyển tiền."}},{"code":"CĐ7-005","q":"Chị H. tự vào một trang bán hàng, chọn món và định chuyển khoản. Chị cần kiểm tra gì trước?","opt":[["A","Người bán, món hàng, cách giao và tài khoản nhận tiền đã rõ chưa"],["B","Có ai đang giục chị đọc mã xác thực để giữ đơn hàng không"],["C","Có ai gửi riêng cho chị một ứng dụng và bảo cài không"],["D","Có phải cứ mua hàng trên mạng thì đều nguy hiểm hay không"]],"ans":"A","exp":{"A":"Đúng. Ở đây chị H. là người chủ động, không ai gọi đến giục. Việc cần làm là kiểm tra bốn thứ trước khi chuyển tiền."}},{"code":"CĐ7-011","q":"Người gọi nói: “Việc này đang trong quá trình xử lý, anh không được hỏi gia đình, không được hỏi ngân hàng hay cơ quan.” Vì sao đây là dấu hiệu nặng?","opt":[["A","Vì giao dịch nào cũng bắt buộc phải hỏi ý gia đình trước đã"],["B","Vì họ đang chặn hết nơi có thể kiểm tra giúp mình"],["C","Vì chỉ cần hỏi người thân là mọi việc sẽ được giải quyết xong xuôi"],["D","Vì người thân buộc phải nghe và xác nhận từng cuộc gọi"]],"ans":"B","exp":{"B":"Đúng. Người làm ăn đàng hoàng không bao giờ cấm mình hỏi lại ngân hàng hay cơ quan. Cấm hỏi chính là để mình không kịp phát hiện."}},{"code":"TN-44","q":"Yêu cầu nào là điểm phải dừng ngay, kể cả khi người liên hệ có thể là người thật?","opt":[["A","Đề nghị hẹn lại vào giờ hành chính để trao đổi cho kỹ hơn"],["B","Gửi bản mô tả và để mình tự kiểm tra bằng số hoặc ứng dụng chính thức"],["C","Đề nghị xác nhận đã nhận được một thông báo không chứa thông tin gì nhạy cảm"],["D","Yêu cầu cài công cụ điều khiển máy và đọc mã xác thực ngay lập tức"]],"ans":"D","exp":{"D":"Đúng. Cài công cụ điều khiển là giao cả điện thoại cho người khác. Đọc mã xác thực là giao luôn chìa khóa tài khoản. Gặp một trong hai là dừng, không cần biết họ là ai."}},{"code":"CĐ7-042","q":"Trong cùng một cuộc gọi, bên kia đòi bạn gửi ảnh giấy tờ, cài ứng dụng và chuyển tiền. Nên xử lý thế nào?","opt":[["A","Không gửi, không cài, không chuyển; cúp máy rồi tự đi kiểm tra lại"],["B","Gửi ảnh giấy tờ trước vì đó là việc nhẹ nhất, hai việc kia thì chưa"],["C","Làm lần lượt từng việc một, xem việc nào mới thật sự gây nguy hiểm"],["D","Chuyển thử một khoản nhỏ rồi mới tính đến hai yêu cầu còn lại"]],"ans":"A","exp":{"A":"Đúng. Ba yêu cầu này đánh vào ba chỗ khác nhau: giấy tờ của mình, cái máy của mình, và tiền của mình. Cả ba đều gây hại ngay."}},{"code":"TN-45","q":"Một người tự xưng là ngân hàng gọi đến, yêu cầu cập nhật hồ sơ. Nên tách yêu cầu này ra để kiểm tra theo cách nào?","opt":[["A","Kiểm tra tên và số hồ sơ; khớp rồi thì cứ làm hết mọi việc họ nêu ra"],["B","Coi đây chủ yếu là chuyện hợp đồng, nên chỉ xem nội dung cần cập nhật"],["C","Tách ra làm ba phần: tiền; giấy tờ và quyền vào máy; nội dung cam kết"],["D","Coi mọi cuộc gọi lạ là sự cố đã xảy ra, làm ngay các bước xử lý thiệt hại"]],"ans":"C","exp":{"C":"Đúng. Một cuộc gọi thường gói mấy quyết định vào làm một. Tách ra thì thấy rõ chỗ nào nguy hiểm."}},{"code":"CĐ7-049","q":"Một tin nhắn hiện đúng tên ngân hàng, lại nằm chung luồng với các tin thật trước đó, kèm đường dẫn tải ứng dụng và yêu cầu quét khuôn mặt. Nên làm gì?","opt":[["A","Bấm vào, vì tin nhắn nằm cùng luồng với những tin thật cũ"],["B","Không dùng đường dẫn đó; tự mở ứng dụng ngân hàng"],["C","Chuyển đường dẫn cho người thân bấm thử xem sao"],["D","Không cài ứng dụng, nhưng vẫn quét khuôn mặt để kiểm tra thử xem sao"]],"ans":"B","exp":{"B":"Đúng. Không bấm vào đường dẫn nào cả. Tự mở ứng dụng ngân hàng hoặc gọi số in trên thẻ để hỏi cho chắc."}},{"code":"TH02-03-A","q":"Có ba cách xử lý cần nhớ. HOÃN là tạm dừng để hỏi thêm khi còn thiếu thông tin. DỪNG là ngừng hẳn khi gặp yêu cầu nguy hiểm, hoặc khi điều kiện không thể chấp nhận. CÓ THỂ QUYẾT ĐỊNH là khi đã đủ thông tin để tự quyết. Người nhận cuộc gọi nên làm gì ngay lúc này?","opt":[["A","HOÃN, chờ xuất hiện thêm một dấu hiệu nữa rồi mới quyết"],["B","CÓ THỂ QUYẾT ĐỊNH tiếp tục, miễn là chưa đọc mã xác thực cho họ"],["C","CÓ THỂ QUYẾT ĐỊNH cài ứng dụng, rồi gỡ đi sau khi hỗ trợ xong"],["D","DỪNG ngay, vì họ đòi quyền điều khiển máy và bắt giữ bí mật"]],"ans":"D","exp":{"D":"Đúng. Hai yêu cầu nguy hiểm cùng lúc: quyền điều khiển máy, và bắt giữ bí mật. Không cần biết cuộc gọi video là thật hay giả mới được cúp máy."}},{"code":"TH02-03-B","q":"Bước tiếp theo an toàn nhất là gì?","opt":[["A","Cúp máy, rồi tự mở ứng dụng ngân hàng hoặc gọi số trên thẻ"],["B","Đòi họ gửi thẻ nhân viên và mã hồ sơ ngay trong cuộc gọi để mình đối chiếu"],["C","Giữ cuộc gọi thêm lát nữa, cho ngân hàng có thời gian theo dõi"],["D","Đăng nhập bằng một tài khoản phụ để thử xem công cụ đó làm gì"]],"ans":"A","exp":{"A":"Đúng. Cúp máy rồi tự mở ứng dụng là tách hẳn việc kiểm tra ra khỏi kênh do người kia nắm."}},{"code":"TH05-02-A","q":"Nên xử lý trang này thế nào?","opt":[["A","Nhập một mật khẩu sai, rồi dừng lại trước bước nhập mã xác thực gửi về"],["B","Đi tiếp tới bước cuối để chụp đủ bằng chứng rồi thoát"],["C","Đóng hẳn trang đó lại, không đăng nhập và không cài gì"],["D","Dùng một tài khoản phụ để thử xem trang đó xử lý ra sao"]],"ans":"C","exp":{"C":"Đúng. Trang bán học bổng mà lại đòi đăng nhập ngân hàng — chỉ riêng điều đó đã đủ để đóng lại."}},{"code":"TH05-02-B","q":"Nếu lỡ nhập mật khẩu vào trang đó rồi thì bước tiếp theo là gì?","opt":[["A","Quay lại chính trang vừa rồi để đổi mật khẩu và xem lịch sử đăng nhập"],["B","Chờ xem có thông báo đăng nhập lạ hay giao dịch nào không rồi mới đổi"],["C","Xóa lịch sử trình duyệt trước đã, rồi cứ tiếp tục dùng tài khoản bình thường"],["D","Dùng một máy an toàn để đổi mật khẩu, xem lại tài khoản và lưu địa chỉ trang"]],"ans":"D","exp":{"D":"Đúng. Không nhập thêm vào trang giả. Nếu chỉ nhập mật khẩu mà chưa tải/cài gì, có thể dùng kênh chính thức trên thiết bị đáng tin; bắt buộc dùng máy khác khi đã cài/cấp quyền hoặc nghi máy bị chiếm."}},{"code":"CĐ7-054","q":"Một trang bất ngờ báo bạn trúng điện thoại và phiếu mua hàng lớn, nhưng bắt đăng nhập ngân hàng hoặc nộp “phí nhận thưởng” trong 15 phút. Nên làm gì?","opt":[["A","Nhập sai mật khẩu một lần để xem trang phản hồi ra sao, thấy lạ thì đóng"],["B","Nộp khoản phí nhỏ trước vì phần thưởng đáng giá hơn, rồi xác minh sau"],["C","Đóng trang, không nhập và không chuyển gì; tự đi kiểm tra chương trình đó"],["D","Dùng tài khoản phụ đăng nhập thử, xem thể lệ rồi dừng trước bước trả tiền"]],"ans":"C","exp":{"C":"Đúng. Chương trình thật phải có thể tra thể lệ và đơn vị tổ chức qua kênh chính thức. Không nộp theo đường dẫn/tài khoản do người liên hệ đưa; thuế hoặc phí hợp lệ, nếu có, phải theo quy trình chính thức và được giải thích rõ."}},{"code":"CĐ7-023","q":"Khi đã tự gọi lại cho tổ chức bằng số chính thức, bạn cần hỏi cho rõ những gì?","opt":[["A","Người đó là ai, có quyền yêu cầu không, yêu cầu có thật không, làm có đúng cách không"],["B","Người liên hệ là ai, số họ đang dùng có đúng không, giấy tờ họ gửi có cùng một tên không"],["C","Yêu cầu có thật không, có liên quan tới mình không, và đang được xử lý trong thời gian nào"],["D","Số điện thoại, tài khoản nhắn tin, giấy tờ và ảnh nhận diện của chính người đang liên hệ"]],"ans":"A","exp":{"A":"Đúng. Bốn câu này bọc kín được cả bốn chỗ hở. Thiếu câu nào cũng còn đường cho kẻ giả danh lách qua."}},{"code":"CĐ7-025","q":"Tài khoản mạng xã hội của người thân nhắn tin nhờ chuyển tiền gấp. Cách kiểm tra nào đáng tin hơn cả?","opt":[["A","Nhắn lại vào chính tài khoản đó để hỏi cho chắc"],["B","Gọi vào số đã lưu từ trước, hoặc hỏi một người thân khác"],["C","Bảo tài khoản đó gửi một đoạn ghi âm giọng nói để đối chiếu"],["D","Bảo tài khoản đó gọi video cho mình vài giây là biết ngay"]],"ans":"B","exp":{"B":"Đúng. Gọi số đã lưu hoặc hỏi người thân khác là bước ra khỏi cái kênh đang bị nghi ngờ. Đó mới là kiểm tra thật."}},{"code":"TN-46","q":"Bạn đã tự gọi số chính thức và được xác nhận rằng yêu cầu cập nhật địa chỉ là có thật, không ai đòi mã hay đòi tiền. Nên làm gì?","opt":[["A","Gọi lại số lạ ban đầu để báo đã xác minh xong, rồi làm tiếp với họ"],["B","Từ chối cập nhật, dù tự mở ứng dụng thấy đúng thông báo trong đó"],["C","Làm nốt việc đó ngay trong ứng dụng chính thức mà mình vừa tự mở"],["D","Bấm lại đường dẫn cũ, vì nội dung yêu cầu đã được xác nhận có thật"]],"ans":"C","exp":{"C":"Đúng. Yêu cầu là thật thì cứ làm, nhưng làm ở kênh mình tự mở chứ không phải kênh họ đưa."}},{"code":"CĐ7-045","q":"Chị D. nhận cuộc gọi của người giao hàng, hỏi có gửi đơn ở quầy lễ tân được không. Chị tự mở ứng dụng mua hàng, thấy đúng đơn, đúng tên người giao; không ai đòi mã, đòi cài ứng dụng hay đòi thêm tiền. Chị nên làm gì?","opt":[["A","Xác nhận ngay trong chính ứng dụng mua hàng mình vừa tự mở"],["B","Từ chối, vì hễ có cuộc gọi chủ động đến là chuyện đáng ngờ"],["C","Bảo người giao gửi ảnh giấy tờ tùy thân cho chắc đã"],["D","Gọi lại đúng cái số vừa gọi đến để hỏi cho rõ thêm"]],"ans":"A","exp":{"A":"Đúng. Chị đã tự mở ứng dụng, thấy khớp hết, và không có yêu cầu nguy hiểm nào. Vậy thì cứ xác nhận. Chương trình này không dạy từ chối mọi thứ."}},{"code":"TH01-03-A","q":"Nên hiểu tình huống này thế nào?","opt":[["A","Đã gọi video trực tiếp và nói đúng thông tin thì coi như đã xác minh xong"],["B","Những dấu hiệu đó chưa chứng minh họ là ai, cũng chưa nói gì về chuyện tiền bạc"],["C","Chỉ cần gọi lại thêm một lần nữa trong cùng ứng dụng đó để đối chiếu là được"],["D","Góp một khoản nhỏ cũng được, vì đó được gọi là tài khoản chung của hai người"]],"ans":"B","exp":{"B":"Đúng. Nói chuyện trực tiếp qua màn hình vẫn là ở trong kênh do người kia chọn. Nó không thay được việc kiểm tra ở nơi khác."}},{"code":"TH01-03-B","q":"Nếu vẫn muốn tìm hiểu thêm thì nên làm gì?","opt":[["A","Đòi giấy tờ, sao kê, ảnh nơi làm việc; thấy khớp thì chuyển vào tài khoản đó"],["B","Hỏi một người trong nhóm bạn trên mạng của người kia xem họ thế nào"],["C","Dùng tài khoản phụ chuyển thử, đòi hoàn trong ngày; được thì tăng dần lên"],["D","Tự chọn cách kiểm tra riêng: họ là ai, để làm gì, và ai đứng tên nhận tiền"]],"ans":"D","exp":{"D":"Đúng. Tự chọn cách kiểm tra là bước ra khỏi câu chuyện họ đang kể cho mình nghe."}},{"code":"CĐ7-052","q":"Sau mấy tháng trò chuyện, một người đề nghị bà T. chuyển tiền vào “tài khoản đầu tư chung”, và dặn giữ kín để gia đình khỏi ngăn. Bà nên làm gì?","opt":[["A","Chuyển một khoản nhỏ trước; nếu họ còn bắt giữ bí mật nữa thì mới dừng lại"],["B","Đồng ý, nếu đã xem giấy tờ, gọi video và biết được nghề nghiệp của họ"],["C","Không chuyển tiền; tự kiểm tra họ là ai, và hỏi một người ngoài cuộc"],["D","Bắt họ viết cam kết về mục đích, lợi nhuận, hoàn tiền rồi mới chuyển"]],"ans":"C","exp":{"C":"Đúng. Câu “giữ kín để gia đình khỏi ngăn” chính là dấu hiệu nặng nhất ở đây. Người tử tế không cần mình giấu gia đình."}},{"code":"CĐ7-026","q":"Một bài đăng kêu gọi giúp cháu bé đang cấp cứu, giục chuyển tiền ngay vào tài khoản cá nhân, và ghi: “Ai muốn kiểm tra thì gọi số bệnh viện ở dưới bài.” Nên kiểm tra thế nào?","opt":[["A","Nhắn cho người đăng xin thêm ảnh và giấy tờ, rồi mới chuyển một khoản hỗ trợ"],["B","Gọi số ghi dưới bài để đối chiếu, vì nơi điều trị đã được nêu công khai"],["C","Chuyển một khoản nhỏ trước cho kịp cứu cháu, rồi kiểm tra tiếp sau đó"],["D","Tự tra ra số bệnh viện hoặc nơi tiếp nhận rồi gọi hỏi cho rõ"]],"ans":"D","exp":{"D":"Đúng. Tự tra số của bệnh viện, phòng công tác xã hội hoặc tổ chức đứng ra vận động để hỏi có đợt kêu gọi chính thức, mã trường hợp và đúng tài khoản tiếp nhận; không yêu cầu cung cấp hồ sơ bệnh án."}},{"code":"CĐ7-038","q":"Một tài khoản tự xưng là “thầy” nói gia đình chị L. sắp gặp nạn, chỉ tối nay mới “giải hạn” kịp; họ bảo giữ kín và chuyển sang nhắn tin riêng để làm lễ. Nên xử lý thế nào?","opt":[["A","Chưa chuyển tiền, nhưng cứ gửi ngày sinh và ảnh gia đình để họ xem kỹ"],["B","Tiếp tục làm theo, vì họ chưa hỏi mật khẩu, chưa hỏi mã, chưa đòi vào tài khoản"],["C","Dừng lại, không trả tiền và không gửi gì; nói chuyện với người mình tin cậy"],["D","Đăng thông tin cá nhân của người đó lên mạng và kết luận tâm linh là gian dối"]],"ans":"C","exp":{"C":"Đúng. Dọa tai họa, ép làm ngay tối nay, và bắt giữ kín — ba thứ này gộp lại là dùng nỗi sợ để mình không kịp hỏi ai."}},{"code":"CĐ7-018","q":"Một sinh viên nhận cuộc gọi video của người tự xưng là Công an. Họ dọa em liên quan đến một vụ án, bắt em thuê phòng ở một mình, cấm nói với gia đình, và đòi chuyển 20 triệu để “xác minh dòng tiền”. Em nên làm gì?","opt":[["A","Cứ ở một mình theo yêu cầu, nhưng chỉ chuyển một khoản nhỏ xem họ phản ứng"],["B","Chuyển tiền sang một tài khoản khác của chính mình theo hướng dẫn, để chứng minh mình trong sạch"],["C","Giữ kín và chờ họ gửi thêm giấy tờ có dấu, hình ảnh hoặc video xác nhận vụ việc"],["D","Cúp máy; đi tới chỗ có người khác, không chuyển tiền, và báo ngay cho người nhà"]],"ans":"D","exp":{"D":"Đúng. Đây là tống tiền trực tuyến, thường được gọi là “bắt cóc online”: kẻ xấu giả danh cơ quan tố tụng, cô lập và khống chế nạn nhân để chiếm đoạt tiền. Đi tới chỗ có người khác giúp phá vỡ thế cô lập."}},{"code":"TH02-02-A","q":"Ông P. nên làm gì ngay?","opt":[["A","Hỏi thêm chuyện riêng trong nhà để thử giọng, rồi thương lượng về số tiền"],["B","Cúp máy, không chuyển tiền và không đọc mã; tự gọi người thân và Công an"],["C","Đọc một mã sai để kéo dài thời gian, xem họ phản ứng thế nào rồi tính tiếp"],["D","Chuyển một khoản nhỏ trước, vì hình ảnh và giọng nói của con có thể là thật"]],"ans":"B","exp":{"B":"Đúng. Cắt cuộc gọi rồi tự mở các kênh khác thì cả nhà mới cùng đi tìm con và báo cơ quan chức năng được."}},{"code":"TH02-02-B","q":"Nên dùng những kênh nào để xác minh và phối hợp tìm con?","opt":[["A","Số người thân đã lưu, nơi con học hoặc làm việc, và số Công an tự tra"],["B","Số của một “cán bộ xử lý” mà người đang đòi tiền vừa đọc cho ông trong cuộc gọi"],["C","Tài khoản nhắn tin mới mà người gọi gửi, để gia đình nhận hướng dẫn và tin tức"],["D","Một người trong nhóm chat mà chính người gọi giới thiệu là đầu mối phối hợp"]],"ans":"A","exp":{"A":"Đúng. Đây là những nơi nằm ngoài tầm với của kẻ đang đòi tiền. Chỉ ở đó ông mới biết được tình hình thật của con."}},{"code":"CĐ7-007","q":"Bạn vừa chuyển tiền theo yêu cầu của một người lạ, rồi thấy tài khoản còn bị trừ thêm. Việc cần làm ngay là gì?","opt":[["A","Chờ người đó giải thích cho rõ, rồi mới gọi ngân hàng"],["B","Dừng liên lạc, gọi ngân hàng số chính thức, giữ bằng chứng"],["C","Chuyển thêm một khoản nhỏ nữa, xem cái lỗi kia có lặp lại lần nữa không"],["D","Xóa hết tin nhắn và chặn số cho khỏi bị làm phiền thêm nữa"]],"ans":"B","exp":{"B":"Đúng. Ba việc theo đúng thứ tự: cắt liên lạc để họ không dẫn tiếp, gọi ngân hàng để chặn, giữ bằng chứng để trình báo."}},{"code":"TN-47","q":"Bạn đã lỡ chia sẻ màn hình và đọc mã theo một cuộc gọi lạ. Việc đầu tiên phải làm là gì?","opt":[["A","Đọc thêm một mã sai, xem thử người gọi có thật sự vào được tài khoản không"],["B","Xóa ngay mọi ứng dụng và tin nhắn có trên chính cái máy vừa dùng"],["C","Tắt Wi-Fi và dữ liệu di động (mạng 3G/4G/5G); từ máy khác gọi ngân hàng để khóa/chặn, đồng thời bảo vệ tài khoản và giữ chứng cứ"],["D","Giữ máy để hỏi từng giao dịch, chỉ ngắt khi người gọi báo đã thoát ra"]],"ans":"C","exp":{"C":"Đúng. Vì đã chia sẻ màn hình/quyền và lộ mã, cô lập thiết bị trước; từ máy khác gọi ngân hàng để khóa/chặn/tra soát và đăng xuất khỏi mọi máy đang đăng nhập. Đổi mật khẩu và lưu chứng cứ có thể làm song song."}},{"code":"CĐ7-048","q":"“Khi đã thấy có chuyện bất thường, hãy lưu lại những gì mình đang có rồi dừng nói chuyện, đừng cố nói tiếp để thu thập thêm bằng chứng.” Nhận định này đúng hay sai?","opt":[["A","Đúng"],["B","Sai"]],"ans":"A","exp":{"A":"Đúng. Bằng chứng cần giữ là những gì đã có sẵn. Nói tiếp không thêm được bao nhiêu, mà lại kéo dài rủi ro."}}]},"8":{"t":"Xử lý, phục hồi và phòng lừa đảo lần hai","q":[{"code":"TN-48","q":"Dấu hiệu nào cho thấy chuyện đã xảy ra rồi, và giờ là lúc phải xử lý hậu quả?","opt":[["A","Nhận lời mời lãi cao, đã cho họ số điện thoại nhưng chưa chuyển tiền gì"],["B","Đã chuyển tiền hoặc đã đưa giấy tờ, đưa quyền rồi mới thấy lạ"],["C","Đang đọc bản hợp đồng và thấy có một điều khoản khó hiểu, khó nắm"],["D","Thấy một đường dẫn lạ trong bài viết nhưng chưa bấm vào"]],"ans":"B","exp":{"B":"Đúng. Ranh giới nằm ở chỗ đã đưa đi thứ gì chưa. Đã đưa rồi thì chuyển sang lo giảm thiệt hại, không còn là lo phòng ngừa nữa."}},{"code":"CĐ8-003","q":"Chuyện đã xảy ra rồi, câu hỏi nào nên nghĩ đến trước tiên?","opt":[["A","Có nên chờ xem thiệt hại có tự dừng lại hay không?"],["B","Trong nhà ai là người đáng trách nhất về chuyện này?"],["C","Có nên tự đi tìm kẻ đã gây ra chuyện này hay không?"],["D","Việc gì phải làm trước, việc gì làm sau để đỡ thiệt hại?"]],"ans":"D","exp":{"D":"Đúng. Thứ tự đúng là: chặn cái đang nguy hiểm trước, gọi nơi có thể khóa hoặc chặn, rồi bảo vệ tài khoản và giữ bằng chứng."}},{"code":"CĐ8-009","q":"Muốn biết phải làm gì trước, nên chia sự việc theo cách nào?","opt":[["A","Chia theo thứ mình đã mất hoặc đã đưa đi"],["B","Chia theo tên của thủ đoạn và người đã liên hệ"],["C","Chia theo số tiền mất là lớn, vừa hay nhỏ"],["D","Chia theo tuổi và mức độ thạo dùng điện thoại"]],"ans":"A","exp":{"A":"Đúng. Mất tiền thì gọi ngân hàng/tổ chức thanh toán; lộ OTP hoặc thẻ thì khóa đúng dịch vụ; cài/cấp quyền thì cô lập máy; lộ giấy tờ/sinh trắc học thì giữ chứng cứ, trình báo và theo dõi dấu hiệu mạo danh. Mỗi loại cần ưu tiên khác nhau."}},{"code":"CĐ8-027","q":"Sáu việc cần làm khi có sự cố là: 1. DỪNG NGUY CƠ (chặn cái đang nguy hiểm); 2. LIÊN HỆ CHÍNH THỨC (gọi nơi có thể khóa hoặc chặn); 3. BẢO VỆ TÀI KHOẢN (lấy lại quyền, đổi mật khẩu); 4. LƯU CHỨNG CỨ; 5. CẢNH BÁO VÀ TRÌNH BÁO; 6. THEO DÕI. Nên hiểu sáu việc này thế nào?","opt":[["A","Là sáu thủ tục cứng: làm xong việc này, có kết quả rồi mới được sang việc kia"],["B","Chỉ là gợi ý thôi, có thể bỏ qua việc gọi nơi có thể khóa hoặc chặn"],["C","Là khung việc cần làm khi thấy bất thường, tùy loại sự cố mà điều chỉnh"],["D","Là danh sách chỉ dùng đến khi đã mất tiền thật, còn lại thì không cần"]],"ans":"C","exp":{"C":"Đúng. Đây là khung để không bỏ sót, không phải sáu thủ tục cứng. Việc nào gấp làm trước, nhiều việc có thể làm song song và bước cô lập thiết bị chỉ dùng khi máy có nguy cơ."}},{"code":"CĐ8-005","q":"Nên hiểu việc xử lý sớm sau khi bị lừa như thế nào?","opt":[["A","Quá một giờ rồi thì chỉ còn cách đi trình báo thôi"],["B","Làm ngay việc cần làm, nhưng đừng hứa chắc lấy lại tiền"],["C","Phải biết chắc tiền đang nằm ở đâu rồi mới bắt đầu xử lý được"],["D","Báo thật sớm thì chắc chắn sẽ lấy lại được số tiền đã mất"]],"ans":"B","exp":{"B":"Đúng. Làm sớm thì cơ hội được hỗ trợ cao hơn, nhưng không ai bảo đảm chắc lấy lại được. Phát hiện muộn thì vẫn phải báo và vẫn phải xử lý tiếp."}},{"code":"CĐ8-012","q":"Đã lỡ đọc mã xác thực, hoặc đã đưa thông tin thẻ cho người khác. Việc phải làm ngay là gì?","opt":[["A","Gọi ngay ngân hàng qua kênh chính thức để khóa thẻ hoặc tạm khóa ngân hàng số/phiên liên quan, tùy loại thông tin đã lộ"],["B","Ghi nhớ để lần sau không đưa nữa, còn lần này thì đành chịu"],["C","Gọi lại người vừa xin mã, hỏi xem họ đã dùng mã đó chưa đã"],["D","Chờ xem có giao dịch nào phát sinh không rồi mới tính đến xử lý"]],"ans":"A","exp":{"A":"Đúng. Nói rõ loại OTP, thông tin thẻ hoặc thao tác đã lộ để ngân hàng khóa đúng thẻ, dịch vụ, phiên hoặc giao dịch; không nhất thiết khóa mọi thứ giống nhau."}},{"code":"TN-50","q":"Sau khi lộ một mã mà chưa biết nó đã được dùng để xác nhận đăng nhập, liên kết thiết bị hay giao dịch gì, vì sao không nên chờ “xem có tự hết không”?","opt":[["A","Vì đã lộ mã thì chắc chắn mất tiền, dù mã đó đã hết hạn từ lâu"],["B","Vì trình báo muộn sẽ làm mất quyền được hỗ trợ về sau"],["C","Vì cảm giác xấu hổ chỉ ảnh hưởng tinh thần, không ảnh hưởng việc xử lý"],["D","Vì quyền hoặc giao dịch có thể đã phát sinh, mà việc khóa thẻ và chặn giao dịch lại bị lùi"]],"ans":"D","exp":{"D":"Đúng. Mã có thể đã được dùng để đăng nhập, liên kết thiết bị hoặc xác nhận giao dịch. Chờ đợi làm giảm cơ hội ngân hàng chặn và bảo vệ tài khoản."}},{"code":"TH06-04-A","q":"Bà Dung nên làm gì trước tiên?","opt":[["A","Cứ làm theo tiếp, để xem người lạ định thao tác những gì"],["B","Đổi mật khẩu ngân hàng ngay trên chính cái máy đó"],["C","Tắt mạng của máy và dừng ngay, không mở ứng dụng ngân hàng"],["D","Gỡ ứng dụng ngay trong cuộc gọi rồi đăng nhập ngân hàng xem sao"]],"ans":"C","exp":{"C":"Đúng. Tắt mạng là cắt đứt đường điều khiển từ xa. Đó là việc phải làm đầu tiên, trước mọi việc khác."}},{"code":"TH06-04-B","q":"Sau đó nên làm gì?","opt":[["A","Khôi phục cài đặt gốc cho máy ngay, rồi mới xem lại tài khoản sau"],["B","Dùng thiết bị khác gọi ngân hàng để khóa thẻ và chặn giao dịch; đồng thời đăng xuất khỏi mọi máy đang đăng nhập và đổi mật khẩu"],["C","Chờ con cháu đến vào ngày mai rồi mới báo ngân hàng và đổi mật khẩu"],["D","Bảo người kia gửi ảnh chứng minh đã thoát và cam kết sẽ không vào lại"]],"ans":"B","exp":{"B":"Đúng. Khóa dòng tiền và chấm dứt quyền truy cập đều phụ thuộc thời gian; gọi ngân hàng và đổi mật khẩu/đăng xuất khỏi mọi máy đang đăng nhập có thể làm song song trên thiết bị khác đáng tin."}},{"code":"CĐ8-051","q":"Anh Quân đã nạp tiền, đã cài công cụ hỗ trợ theo hướng dẫn, và giờ không rút được tiền ra. Nên xử lý thế nào?","opt":[["A","Tắt mạng máy; dùng máy khác bảo vệ tài khoản rồi trình báo"],["B","Xóa tin nhắn, lịch sử giao dịch và tệp đã tải cho đỡ phải nghĩ đến nữa"],["C","Thương lượng tiếp, và thuê dịch vụ thu hồi có trả phí trước"],["D","Nộp phí mở khóa, rồi đổi mật khẩu ngay trên chính cái máy đó"]],"ans":"A","exp":{"A":"Đúng. Tắt mạng để cắt quyền điều khiển. Những việc còn lại làm trên máy khác, đồng thời gọi ngân hàng, giữ bằng chứng và trình báo."}},{"code":"TH06-03-A","q":"Việc ưu tiên ngay lúc này là gì?","opt":[["A","Nộp phí thu hồi cho người môi giới để họ can thiệp giúp"],["B","Chờ xác định chắc chắn đây là lừa đảo rồi mới đi báo"],["C","Giữ liên lạc, hỏi căn cước; nếu khớp thì thương lượng tiếp"],["D","Gọi ngay ngân hàng bằng số chính thức để đề nghị tra soát"]],"ans":"D","exp":{"D":"Đúng. Ngân hàng hoặc tổ chức thanh toán là kênh đầu tiên có thể khẩn cấp khóa, tra soát hoặc phối hợp với bên nhận; gọi sớm tăng cơ hội nhưng không bảo đảm thu hồi. Công an và nền tảng liên quan còn xử lý các phần khác."}},{"code":"TH06-03-B","q":"Việc tiếp theo phù hợp là gì?","opt":[["A","Chỉ báo cho gia đình biết thôi; phần bằng chứng thì ngân hàng đã có đủ"],["B","Đối đầu với họ và công khai số tài khoản đã nhận tiền lên mạng"],["C","Giữ lại bằng chứng, bảo vệ tài khoản, rồi báo cho cơ quan Công an"],["D","Xóa ứng dụng, ảnh và tin nhắn đi để khỏi bị họ theo dõi tiếp"]],"ans":"C","exp":{"C":"Đúng. Ba việc này đi liền nhau: giữ bằng chứng để có cái nộp, bảo vệ tài khoản để không mất thêm, và trình báo Công an để vụ việc được xử lý."}},{"code":"CĐ8-014","q":"Chị Diệp đã gửi ảnh giấy tờ và một đoạn video khuôn mặt cho một bên chưa rõ là ai, nhưng chưa thấy mất tiền. Nên làm gì?","opt":[["A","Chỉ theo dõi một tài khoản ngân hàng trong vòng một tháng là đủ rồi"],["B","Chờ đến khi thấy có khoản vay lạ đứng tên mình rồi hãy báo"],["C","Chưa mất tiền thì cũng chưa cần làm gì thêm cho mệt"],["D","Giữ bằng chứng, trình báo và theo dõi dấu hiệu mạo danh ở tài khoản, khoản vay và báo cáo tín dụng"]],"ans":"D","exp":{"D":"Đúng. Đây là sự cố về giấy tờ và sinh trắc học: cần giữ chứng cứ, trình báo, theo dõi dấu hiệu mở tài khoản/vay trái phép và báo tổ chức tài chính liên quan khi có bất thường."}},{"code":"CĐ8-017","q":"Một ứng dụng lạ vừa được cấp quyền đọc danh bạ. Ngoài việc gỡ ứng dụng và thu hồi quyền, còn cần báo cho ai?","opt":[["A","Hỏi lại người đã gửi ứng dụng xem họ dùng danh bạ vào việc gì"],["B","Cảnh báo trước cho người thân và nhóm có nguy cơ cao rằng có thể có người mạo danh mình"],["C","Chờ đến khi có ai đó nhận được tin nhắn lạ rồi mới báo cho họ"],["D","Báo ngân hàng trước, dù chuyện này chưa liên quan tới tài khoản"]],"ans":"B","exp":{"B":"Đúng. Có danh bạ trong tay, kẻ xấu có thể giả danh mình để vay tiền hoặc xin dữ liệu. Ưu tiên cảnh báo người thân và nhóm có nguy cơ cao; không cần phát tán rộng thêm thông tin."}},{"code":"TH06-05-A","q":"Chị Mai nên quyết thế nào?","opt":[["A","Tự hẹn gặp ở nơi công cộng để xem kẻ đang dọa mình là ai"],["B","Giữ kín với gia đình, chờ có cuộc gọi thật rồi mới cảnh báo"],["C","Không đối đầu; xem ai có thể bị liên lụy rồi báo riêng cho họ"],["D","Đăng tin nhắn, ảnh giấy tờ và số điện thoại lên nhờ mọi người"]],"ans":"C","exp":{"C":"Đúng. Việc cần làm là bảo vệ những người có thể bị nhắm tới, mà không phát tán thêm thông tin của chính mình."}},{"code":"TH06-05-B","q":"Nên cảnh báo bằng cách nào?","opt":[["A","Báo riêng cho người thân, hẹn nhau một cách xác minh khi có ai nhắn vay tiền"],["B","Gửi ảnh giấy tờ bị lộ vào nhóm gia đình để mọi người cùng đối chiếu cho biết"],["C","Bảo người thân gọi lại số của kẻ xấu, nói chuyện lâu và ghi âm làm bằng chứng"],["D","Chỉ đổi số điện thoại là xong, không cần xem lại tài khoản hay dữ liệu nào"]],"ans":"A","exp":{"A":"Đúng. Báo riêng giúp bảo vệ mà không lan dữ liệu. Hẹn xác minh qua số/kênh đã biết từ trước, gặp trực tiếp hoặc người thân thứ ba; nếu nghi SIM/số điện thoại bị chiếm thì dùng kênh thay thế."}},{"code":"TN-56","q":"Đã giữ được bằng chứng rồi. Việc tiếp theo phù hợp nhất là gì?","opt":[["A","Lập một tài khoản giả để lần ra người đứng sau tài khoản nhận tiền"],["B","Gọi cho kẻ đó, dọa sẽ công khai để buộc họ phải trả lại tiền"],["C","Dựa vào các ảnh đã lưu để công khai kết luận họ đã phạm tội"],["D","Nộp cho ngân hàng/tổ chức liên quan và trình báo Công an khi có dấu hiệu tội phạm, tùy sự cố"]],"ans":"D","exp":{"D":"Đúng. Ngân hàng/tổ chức liên quan xử lý tài khoản, giao dịch hoặc nền tảng; Công an tiếp nhận dấu hiệu tội phạm. Nhiều sự cố cần báo cả hai, không phải chọn một nơi duy nhất."}},{"code":"CĐ8-042","q":"“Mình mất nhiều rồi, nộp thêm một khoản nhỏ để thử thì cũng chẳng rủi ro thêm bao nhiêu.” Nhận định này đúng hay sai?","opt":[["A","Đúng"],["B","Sai"]],"ans":"B","exp":{"B":"Đúng. Số tiền đã mất không làm cho khoản nộp thêm trở nên an toàn. Đây là lúc phải dừng hẳn và tự kiểm tra."}},{"code":"TH04-04-A","q":"Chị Nga nên xử lý yêu cầu nộp thêm này thế nào?","opt":[["A","Nhờ người môi giới ứng trước khoản đó, rồi hoàn lại cho họ sau"],["B","Nộp phần thuế trước, còn phí VIP thì khất tới khi rút được tiền"],["C","Không nộp thêm tiền, không đưa thêm giấy tờ hay quyền gì cả"],["D","Dùng một tài khoản phụ để trả, cho khỏi lộ tài khoản chính"]],"ans":"C","exp":{"C":"Đúng. “Thuế xác minh” và gói VIP mới xuất hiện, không có căn cứ hợp đồng/biểu phí và bị ép nộp riêng để rút là dấu hiệu nguy hiểm. Dịch vụ hợp pháp có thể có phí/thuế đã công bố, nhưng phải xác minh độc lập và nộp theo quy trình chính thức."}},{"code":"TH04-04-B","q":"Việc tiếp theo chị Nga nên làm là gì?","opt":[["A","Giữ bằng chứng, gọi ngân hàng và trình báo đúng nơi có thẩm quyền"],["B","Xóa tài khoản và gỡ ứng dụng đi, cho sàn khỏi trừ thêm phí nữa"],["C","Thuê một người nhận thu hồi tiền quảng cáo trong nhóm để can thiệp"],["D","Thương lượng tiếp, xin sàn giảm bớt mức thuế xuống cho dễ nộp"]],"ans":"A","exp":{"A":"Đúng. Đây là lúc chuyển hẳn từ chỗ bị đòi nộp thêm sang chỗ tự bảo vệ và nhờ nơi có thẩm quyền xử lý."}},{"code":"TN-54","q":"Một người nhận giúp xử lý nói cần thêm mã xác thực để “đảo lại giao dịch”. Nguyên tắc không nộp thêm áp dụng ở đây thế nào?","opt":[["A","Đưa mã nếu họ không đòi tiền, biết đúng số tiền mất và gửi ảnh hồ sơ"],["B","Dùng tài khoản phụ, đổi mật khẩu rồi đưa mã; tách ra thì làm tiếp được"],["C","Bắt họ cam kết không lưu lại mã, rồi mới đọc mã qua điện thoại"],["D","Từ chối, vì đây vẫn là bị đòi thêm thứ gì đó để lấy lại tài sản"]],"ans":"D","exp":{"D":"Đúng. Nguyên tắc không nộp thêm không chỉ nói về tiền. Mã xác thực, giấy tờ, quyền vào máy đều là thứ bị đòi thêm cả."}},{"code":"TH04-05-A","q":"Anh Đức nên nhìn nhận lời mời này thế nào?","opt":[["A","Cho họ email phụ, để họ chứng minh là truy được dấu vết tiền"],["B","Từ chối, vì họ vừa đòi thêm tiền, vừa đòi quyền, lại hứa chắc"],["C","Chỉ trả phí thôi, không cho vào email, như vậy đỡ rủi ro hơn"],["D","Có thể tin, vì họ biết đúng các khoản phí đã bị sàn trừ"]],"ans":"B","exp":{"B":"Đúng. Ba dấu hiệu cùng lúc: tự tìm đến, đòi thêm tiền và quyền, và hứa chắc lấy lại được. Đây là vụ lừa thứ hai."}},{"code":"TH04-05-B","q":"Bước bảo vệ phù hợp nhất lúc này là gì?","opt":[["A","Xóa email, xóa lịch sử đăng nhập và tin nhắn, rồi lập một email mới"],["B","Giữ liên lạc, hỏi tên thật và địa chỉ để tự xác định người đang nhắn"],["C","Khóa các tài khoản liên quan, đổi mật khẩu bằng máy an toàn, giữ tin nhắn"],["D","Chuyển phí qua một ví khác, để không lộ tài khoản ngân hàng của mình"]],"ans":"C","exp":{"C":"Đúng. Khóa và đổi mật khẩu để chặn đường vào, còn tin nhắn thì giữ lại làm bằng chứng."}},{"code":"CĐ8-037","q":"Vì sao không nên tin ngay một người chỉ vì họ có mặt trong nhóm của những người cùng bị lừa?","opt":[["A","Vì ở trong nhóm không chứng minh được họ là ai, hay giúp được gì"],["B","Vì nhóm nào cũng có quản trị viên nên thành viên đã được sàng lọc rồi"],["C","Vì người nào đăng nhiều bài hỗ trợ thì mới đáng tin hơn người khác"],["D","Vì những người cùng bị lừa thì không nên trao đổi gì với nhau cả"]],"ans": }

A.nodeMenu = el => {
  const n = node(el.dataset.id);
  const can = allowedKids(n);
  const items = [];
  if (can.length) items.push(`<button type="button" data-a="createUnder" data-id="${n.id}">${ic('plus')}Tạo…</button>`);
  items.push(`<button type="button" data-a="preview" data-id="${n.id}">${ic('eye')}Xem trên website</button>`);
  if (n.type !== 'home') {
    if (!isPage(n) || isAdmin()) items.push(`<button type="button" data-a="moveNode" data-id="${n.id}">${ic('move')}Di chuyển đến…</button>`);
    items.push(`<button type="button" data-a="copyNode" data-id="${n.id}">${ic('copy')}Sao chép…</button>`);
  }
  if (isPage(n) && subpages(n.id).length) items.push(`<button type="button" data-a="sortNode" data-id="${n.id}"${isAdmin() ? '' : ' disabled title="Cần chế độ Quản trị"'}>${ic('sort')}Sắp xếp trang con…</button>`);
  if (n.status === 'published' || n.status === 'changed') items.push(`<button type="button" data-a="unpublish" data-id="${n.id}">${ic('undo')}Gỡ khỏi website…</button>`);
  if (isAdmin()) items.push(`<button type="button" data-a="permNode" data-id="${n.id}">${ic('lock')}Quyền…</button>`);
  if (n.type !== 'home' && (!isPage(n) || isAdmin())) items.push('<hr>', `<button class="red" type="button" data-a="trashNode" data-id="${n.id}">${ic('trash')}Chuyển vào thùng rác…</button>`);
  openMenu(el, `<div class="head">${esc(nodeName(n))}</div>` + items.join(''));
};
function allowedKids(n) {
  if (!n || !isPage(n)) return [];
  if (n.list === 'article') return ['article'];
  if (n.list === 'story') return ['story'];
  if (n.type === 'home') return isAdmin() ? ['page', 'listPage'] : [];
  return [];
}

// ---- Danh sach con (collection view) ----
function collection(pid) {
  const k = 'col' + (pid || 'all');
  const st = V(k, { q: '', s: 'all', page: 0, sel: [], sort: 'new', cat: '' });
  const base = pid ? children(pid) : S.articles;
  let rows = base.filter(a => (!st.q || (a.title || '').toLowerCase().includes(st.q.toLowerCase())) && (!st.cat || String(a.parent) === st.cat));
  const counts = { all: rows.length };
  ['published', 'draft', 'changed', 'scheduled', 'review'].forEach(s => counts[s] = rows.filter(a => a.status === s).length);
  if (st.s !== 'all') rows = rows.filter(a => a.status === st.s);
  if (st.sort === 'az') rows = rows.slice().sort((a, b) => (a.title || '').localeCompare(b.title || '', 'vi'));
  const per = 10, pages = Math.max(1, Math.ceil(rows.length / per));
  if (st.page >= pages) st.page = pages - 1;
  const show = rows.slice(st.page * per, st.page * per + per);
  const chips = [['all', 'Tất cả'], ['published', 'Đã xuất bản'], ['draft', 'Bản nháp'], ['changed', 'Có thay đổi'], ['scheduled', 'Hẹn giờ'], ['review', 'Chờ duyệt']].filter(([s]) => s === 'all' || counts[s]);
  const lists = S.pages.filter(p => p.list);
  const sel = st.sel.filter(id => base.some(a => a.id === id));
  st.sel = sel;
  const allOn = show.length && show.every(a => sel.includes(a.id));
  return `<div class="filters">
      <label class="search">${ic('search', 16)}<span class="sr">Tìm</span><input type="search" placeholder="Tìm theo tiêu đề" value="${esc(st.q)}" data-b="v.${k}.q" data-r></label>
      ${pid ? '' : `<select class="sel" style="width:auto;height:40px" data-b="v.${k}.cat" aria-label="Mục">${opt('', st.cat, 'Mọi mục')}${lists.map(p => opt(p.id, st.cat, p.name)).join('')}</select>`}
      <select class="sel" style="width:auto;height:40px" data-b="v.${k}.sort" aria-label="Sắp xếp">${opt('new', st.sort, 'Mới sửa trước')}${opt('az', st.sort, 'Theo tên A–Z')}</select>
    </div>
    <div class="filters">${chips.map(([s, l]) => `<button class="chip" type="button" data-a="colStatus" data-k="${k}" data-s="${s}" aria-pressed="${st.s === s}">${l} <em>${counts[s]}</em></button>`).join('')}</div>
    ${sel.length ? `<div class="note info" style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px"><b>Đã chọn ${sel.length}</b><span class="sp"></span>
      <button class="btn sm" type="button" data-a="bulk" data-k="${k}" data-op="publish">Xuất bản</button>
      <button class="btn sm" type="button" data-a="bulk" data-k="${k}" data-op="unpublish">Gỡ khỏi website</button>
      <button class="btn sm" type="button" data-a="bulk" data-k="${k}" data-op="move">Di chuyển…</button>
      <button class="btn sm dl" type="button" data-a="bulk" data-k="${k}" data-op="trash">Chuyển vào thùng rác</button>
      <button class="lnk" type="button" data-a="bulk" data-k="${k}" data-op="clear">Bỏ chọn</button></div>` : ''}
    <section class="card flush"><div class="tbl-wrap"><table class="tbl" style="min-width:760px">
      <thead><tr><th style="width:44px"><input type="checkbox" aria-label="Chọn cả trang" data-a="colAll" data-k="${k}"${allOn ? ' checked' : ''} style="width:18px;height:18px;accent-color:var(--p)"></th><th>Tiêu đề</th>${pid ? '' : '<th>Mục</th>'}<th>Trạng thái</th><th>Sửa lần cuối</th><th><span class="sr">Thao tác</span></th></tr></thead>
      <tbody>${show.map(a => `<tr class="click${sel.includes(a.id) ? ' is-sel' : ''}" data-a="openNode" data-id="${a.id}">
        <td data-a="noop"><input type="checkbox" aria-label="Chọn" data-a="colSel" data-k="${k}" data-id="${a.id}"${sel.includes(a.id) ? ' checked' : ''} style="width:18px;height:18px;accent-color:var(--p)"></td>
        <td><strong>${esc(a.title || '(chưa đặt tên)')}</strong>${a.pinned ? ' <span class="pill info">Ghim</span>' : ''}<div class="xs">${esc(nodeUrl(a))}</div></td>
        ${pid ? '' : `<td class="muted">${esc(pageName(a.parent))}</td>`}
        <td>${statusPill(a.status)}</td><td class="muted nw">${esc(a.at)}<div class="xs">${esc(a.who)}</div></td>
        <td class="r" data-a="noop"><button class="icon-btn" type="button" data-a="nodeMenu" data-id="${a.id}" aria-label="Thao tác">${ic('dots')}</button></td></tr>`).join('') ||
        `<tr><td colspan="6">${empty('search', 'Không có bài phù hợp', st.q ? 'Thử từ khóa khác hoặc bỏ bộ lọc.' : 'Mục này chưa có bài nào.', pid ? `<button class="btn p" type="button" data-a="createUnder" data-id="${pid}">${ic('plus')}Tạo bài đầu tiên</button>` : '')}</td></tr>`}</tbody></table></div>
      <div class="tfoot"><span>${rows.length ? (st.page * per + 1) + '–' + Math.min(rows.length, st.page * per + per) + ' trên ' + rows.length + ' bài' : '0 bài'}</span>
      <span class="acts"><button class="btn sm" type="button" data-a="colPage" data-k="${k}" data-d="-1"${st.page ? '' : ' disabled'}>Trước</button><span>Trang ${st.page + 1}/${pages}</span><button class="btn sm" type="button" data-a="colPage" data-k="${k}" data-d="1"${st.page < pages - 1 ? '' : ' disabled'}>Sau</button></span></div></section>`;
}
A.noop = () => { };
A.colStatus = el => { const st = U.v[el.dataset.k]; st.s = el.dataset.s; st.page = 0; render(); };
A.colPage = el => { const st = U.v[el.dataset.k]; st.page += +el.dataset.d; render(); };
A.colSel = (el, e) => { e.stopPropagation(); const st = U.v[el.dataset.k]; const id = +el.dataset.id; st.sel = st.sel.includes(id) ? st.sel.filter(x => x !== id) : st.sel.concat(id); render(); };
A.colAll = el => { const st = U.v[el.dataset.k]; const ids = [...document.querySelectorAll(`[data-a="colSel"][data-k="${el.dataset.k}"]`)].map(x => +x.dataset.id); st.sel = el.checked ? [...new Set(st.sel.concat(ids))] : st.sel.filter(x => !ids.includes(x)); render(); };
A.bulk = el => {
  const st = U.v[el.dataset.k]; const items = st.sel.map(id => node(id)).filter(Boolean); const op = el.dataset.op;
  if (op === 'clear') { st.sel = []; render(); return; }
  if (op === 'publish') {
    const bad = items.filter(a => missing(a).length);
    items.filter(a => !missing(a).length).forEach(a => { a.status = 'published'; a.at = nowAt(); a.versions.unshift({ at: nowAt(), who: 'Bạn', what: 'Xuất bản', pub: true }); });
    st.sel = []; save();
    toast(`Đã xuất bản ${items.length - bad.length} bài.` + (bad.length ? ` ${bad.length} bài còn thiếu mục bắt buộc nên chưa xuất bản.` : ''), bad.length ? 'bad' : 'ok'); render(); return;
  }
  if (op === 'unpublish') { items.forEach(a => { a.status = 'unpublished'; a.at = nowAt(); }); st.sel = []; save(); toast(`Đã gỡ ${items.length} bài khỏi website. Bài vẫn còn trong danh sách.`); render(); return; }
  if (op === 'move') { openDlg('move', { ids: items.map(a => a.id), k: el.dataset.k }); return; }
  if (op === 'trash') confirmDlg({ title: `Chuyển ${items.length} bài vào thùng rác?`, body: 'Bài sẽ gỡ khỏi website. Khôi phục được trong 30 ngày.', okLabel: 'Chuyển vào thùng rác', danger: true, onOk: () => { items.forEach(toTrash); st.sel = []; save(); toast(`Đã chuyển ${items.length} bài vào thùng rác`, 'ok', { label: 'Hoàn tác', fn: () => restoreLast(items.length) }); } });
};

  <div class="cat">${a.kinds.map(k => `<button type="button" data-a="createIn" data-id="${a.id}" data-t="${k}">${ic(k === 'listPage' ? 'list' : 'page', 22)}<b>${TYPES[k]}</b><small>${k === 'listPage' ? 'Trang chứa danh sách bài, như "Tin tức"' : 'Trang nội dung tự do, như "Giới thiệu"'}</small></button>`).join('')}</div>

function blank(parent, type) {
  const base = { id: 'new', type, parent: +parent, title: '', status: 'draft', at: nowAt(), who: 'Bạn', slug: '', summary: '', seoTitle: '', seoDesc: '', ogOwn: false, noindex: false, cover: '', pinned: false, versions: [] };

}

// Phan dau va chan cua workspace
function wsHead(d, views, cur, icon, nameKey) {
  const base = d.id === 'new' ? '' : '#/noi-dung/' + d.id;
  const inv = (U.v.invalid || []).includes('title');
  return `<div class="ws-h">
    <div class="ws-name">${ic(icon, 22)}<label class="sr" for="wsname">Tên</label><input id="wsname" class="${inv ? 'bad' : ''}" data-b="d.${nameKey}" value="${esc(d[nameKey])}" placeholder="${d.type === 'story' ? 'Nhập tiêu đề câu chuyện' : d.type === 'article' ? 'Nhập tiêu đề bài viết' : 'Nhập tên trang'}"${d.id === 'new' ? ' data-autofocus' : ''}>${statusPill(d.status)}</div>
    ${d.id === 'new' ? '' : `<nav class="views" aria-label="Chế độ xem">${views.map(([k, l, i]) => `<a href="${base}/${k}"${k === cur ? ' aria-current="page"' : ''}>${ic(i, 18)}${l}</a>`).join('')}</nav>`}
    ${d.id === 'new' ? '' : `<button class="icon-btn" type="button" data-a="nodeMenu" data-id="${d.id}" aria-label="Thao tác khác">${ic('dots')}</button>`}
  </div>`;
}
function crumbs(d) {
  const path = []; let p = node(d.parent);
  while (p) { path.unshift(p); p = p.parent ? node(p.parent) : null; }

function docWs(d, view, isNew) {
  const isStory = d.type === 'story';

    const tabs = isStory ? [['main', 'Câu chuyện'], ['sender', 'Người gửi và hiển thị'], ['seo', 'Chia sẻ và tìm kiếm']] : [['main', 'Nội dung'], ['seo', 'Chia sẻ và tìm kiếm']];
    const t = V('tab' + d.id, 'main');
    const miss = U.v.invalid || [];
    const tabBad = { main: miss.some(f => ['summary', 'blocks', 'cover', 'body', 'lesson', 'tags'].includes(f)), seo: miss.includes('seoDesc'), sender: false };
    body = `<div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button type="button" role="tab" data-a="setTab" data-k="tab${d.id}" data-t="${k}" aria-selected="${t === k}">${l}${tabBad[k] ? ' <span class="dot" style="background:var(--bad)"></span>' : ''}</button>`).join('')}</div>` +

// ---- Kiem tra truoc khi xuat ban ----
function missing(d) {
  const m = [];
  if (!(d.title || d.name || '').trim()) m.push('title');
  if (d.type === 'article') {
    if (!(d.summary || '').trim()) m.push('summary');
    if (!d.cover) m.push('cover');
    if (!d.blocks.length || d.blocks.every(b => !strip(b.body) && !b.media && !(b.items || []).some(Boolean))) m.push('blocks');
    if (!(d.seoDesc || '').trim()) m.push('seoDesc');
  }
  if (d.type === 'story') {
    if (!d.tags.length) m.push('tags');
    if (!strip(d.body)) m.push('body');
    if (!(d.lesson || '').trim()) m.push('lesson');
    if (!d.cover) m.push('cover');
    if (!d.consent) m.push('consent');
  }
  return m;
}

function persist(d, what, status) {
  if (!d.slug && d.title) d.slug = slugify(d.title);
  if (d.type === 'page' || d.type === 'listPage') { if (!d.url && d.name) d.url = '/' + slugify(d.name); }
  d.at = nowAt(); d.who = 'Bạn';
  if (status) d.status = status;
  d.versions = d.versions || [];
  d.versions.unshift({ at: nowAt(), who: 'Bạn', what, pub: status === 'published' });
  if (d.id === 'new') {
    d.id = nid();
    if (isPage(d)) { d.sort = subpages(d.parent).length + 1; S.pages.push(clone(d)); } else S.articles.unshift(clone(d));
    U.draftKey = 'n' + d.id; U.draftBase = JSON.stringify(d); save();
    U.skipGuard = true; location.replace('#/noi-dung/' + d.id + (isPage(d) ? '/' + (d.list ? 'danh-sach' : 'sua-nhanh') : '/noi-dung'));
    return true;
  }
  commitDraft(node(d.id));
  return false;
}
