<title>Ô nhập backoffice ANTC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Bố cục: khung backoffice Umbraco (thanh trên, cây nội dung, vùng soạn theo tab, thanh xuất bản) theo QĐ-028 */
:root{
  --top:#0B3B3A; --top-fg:#E4F1EF; --top-dim:rgba(228,241,239,.66); --top-line:rgba(255,255,255,.16);
  --accent:#0E7C72; --accent-hover:#0B675F; --accent-fg:#FFFFFF;
  --sel:#E3F4F1; --sel-fg:#0A5E57; --sel-line:#B9E2DB;
  --bg:#EDF1F2; --panel:#FFFFFF; --panel-2:#F5F8F8; --line:#D6DFE1; --line-strong:#AFBEC2;
  --fg:#18282B; --muted:#56686C; --faint:#8A9A9E;
  --err:#B42318; --err-bg:#FDECEA; --warn:#8A5A00; --warn-bg:#FFF3D6; --ok:#1E7B4D; --ok-bg:#E5F4EC;
  --lv-n:#2F6FB3; --lv-h:#B7791F; --lv-d:#C2410C; --lv-g:#1E7B4D;
  --k-blue:#EAF2FB; --k-yellow:#FFF6DA; --k-orange:#FDEEE6;
  --logo:#8E1B1B; --shadow:0 8px 28px rgba(11,59,58,.16); --focus:#0E7C72;
  --font:'Roboto',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --mono:'Roboto Mono',ui-monospace,Consolas,monospace;
  --fs-xs:.75rem; --fs-s:.8125rem; --fs-m:.875rem; --fs-l:1rem; --fs-xl:1.25rem;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --top:#072423; --top-fg:#DCEDEA; --top-dim:rgba(220,237,234,.6); --top-line:rgba(255,255,255,.12);
  --accent:#27A393; --accent-hover:#33B7A6; --accent-fg:#06201E;
  --sel:#11332F; --sel-fg:#8EDDD1; --sel-line:#25574F;
  --bg:#0E181A; --panel:#152225; --panel-2:#1A2A2E; --line:#28393D; --line-strong:#3D5459;
  --fg:#E1EAEC; --muted:#9DB0B4; --faint:#6F8589;
  --err:#F97066; --err-bg:#3A1917; --warn:#F2C062; --warn-bg:#352A10; --ok:#4CC38A; --ok-bg:#12301F;
  --lv-n:#6FA8E8; --lv-h:#E9B44C; --lv-d:#FB8A4C; --lv-g:#4CC38A;
  --k-blue:#15283A; --k-yellow:#2E2812; --k-orange:#33201A; --logo:#D35454;
  --shadow:0 8px 28px rgba(0,0,0,.5); --focus:#4CC9B8; color-scheme:dark}}
:root[data-theme="dark"]{
  --top:#072423; --top-fg:#DCEDEA; --top-dim:rgba(220,237,234,.6); --top-line:rgba(255,255,255,.12);
  --accent:#27A393; --accent-hover:#33B7A6; --accent-fg:#06201E;
  --sel:#11332F; --sel-fg:#8EDDD1; --sel-line:#25574F;
  --bg:#0E181A; --panel:#152225; --panel-2:#1A2A2E; --line:#28393D; --line-strong:#3D5459;
  --fg:#E1EAEC; --muted:#9DB0B4; --faint:#6F8589;
  --err:#F97066; --err-bg:#3A1917; --warn:#F2C062; --warn-bg:#352A10; --ok:#4CC38A; --ok-bg:#12301F;
  --lv-n:#6FA8E8; --lv-h:#E9B44C; --lv-d:#FB8A4C; --lv-g:#4CC38A;
  --k-blue:#15283A; --k-yellow:#2E2812; --k-orange:#33201A; --logo:#D35454;
  --shadow:0 8px 28px rgba(0,0,0,.5); --focus:#4CC9B8; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:var(--fs-m);line-height:1.45}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{display:grid;grid-template-rows:auto 1fr;height:100%}
.topbar{background:var(--top);color:var(--top-fg);display:flex;align-items:center;gap:18px;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:48px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}
.brand .shield{width:26px;height:26px;color:var(--logo);background:#fff;border-radius:6px;display:grid;place-items:center}
.brand .shield svg{width:18px;height:18px;fill:currentColor;stroke:none}
.brand small{display:block;font-weight:400;font-size:var(--fs-xs);color:var(--top-dim)}
.sections{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0}
.sections button{background:none;border:0;color:var(--top-dim);padding:14px 12px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
.sections button[aria-current="page"]{color:var(--top-fg);border-bottom-color:var(--top-fg);font-weight:500}
.role{display:flex;align-items:center;gap:8px;font-size:var(--fs-xs);color:var(--top-dim);white-space:nowrap}
.seg{display:flex;border:1px solid var(--top-line);border-radius:999px;padding:2px}
.seg button{background:none;border:0;color:var(--top-dim);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:var(--fs-xs)}
.seg button[aria-pressed="true"]{background:var(--top-fg);color:var(--top);font-weight:500}

.shell{display:grid;grid-template-columns:280px 1fr;min-height:0}
.tree{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:10px 8px 24px}
.tree h2{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:4px 10px 8px;font-weight:500}
.tree ul{list-style:none;margin:0;padding:0}
.tree ul ul{padding-left:14px}
.trow{display:flex;align-items:center}
.tchev{background:none;border:0;width:22px;height:28px;display:grid;place-items:center;color:var(--faint);cursor:pointer;border-radius:4px;flex:none}
.tchev svg{width:14px;height:14px}
.tchev[aria-expanded="true"] svg{transform:rotate(90deg)}
.tchev.none{visibility:hidden}
.tnode{display:flex;align-items:center;gap:6px;flex:1;min-width:0;background:none;border:0;border-radius:6px;padding:5px 8px;text-align:left;cursor:pointer;color:var(--fg);font-size:var(--fs-s)}
.tnode:hover{background:var(--panel-2)}
.tnode[aria-current="page"]{background:var(--sel);color:var(--sel-fg);font-weight:500;box-shadow:inset 0 0 0 1px var(--sel-line)}
.tnode .i{color:var(--muted);width:16px;height:16px}
.tnode[aria-current="page"] .i{color:var(--sel-fg)}
.tnode span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnode.draft span{font-style:italic;color:var(--muted)}
.tnode.off span{color:var(--faint);text-decoration:line-through}
.tadd{background:none;border:0;width:24px;height:24px;border-radius:4px;color:var(--accent);cursor:pointer;display:grid;place-items:center;opacity:0;flex:none}
.trow:hover .tadd,.tadd:focus-visible{opacity:1}
.tadd svg{width:15px;height:15px}
.tadd:hover{background:var(--sel)}
@media (hover:none){.tadd{opacity:1}}
.cmenu{position:fixed;z-index:55;background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;box-shadow:var(--shadow);padding:4px;width:300px}
.cmenu button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer;align-items:flex-start}
.cmenu button:hover,.cmenu button:focus-visible{background:var(--sel)}
.cmenu button small{display:block;color:var(--muted);font-size:var(--fs-xs)}
.cmenu .cm-h{font-size:var(--fs-xs);color:var(--muted);padding:6px 10px 4px}
.cmenu .cm-off{font-size:var(--fs-xs);color:var(--muted);padding:6px 10px}
.tnode .cnt{margin-left:auto;font-size:.6875rem;color:var(--faint);font-variant-numeric:tabular-nums}

.main{display:grid;grid-template-rows:auto 1fr auto;min-height:0;min-width:0}
.wshead{background:var(--panel);border-bottom:1px solid var(--line);padding-block:12px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wsrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.wsicon{width:36px;height:36px;border-radius:8px;background:var(--sel);color:var(--sel-fg);display:grid;place-items:center;flex:none}
.wsname{font-size:var(--fs-xl);font-weight:500;border:1px solid transparent;border-radius:6px;padding:4px 8px;background:none;flex:1;min-width:0}
.wsname:hover{border-color:var(--line)}
.wsname.bad{border-color:var(--err);background:var(--err-bg)}
.crumb{font-size:var(--fs-xs);color:var(--muted);margin:2px 0 0 48px;display:flex;gap:6px 14px;flex-wrap:wrap}
.crumb code{font-family:var(--mono);color:var(--fg)}
.state{font-size:var(--fs-xs);padding:3px 8px;border-radius:999px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.state.pub{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.state.dirty{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.treebtn{display:none;background:none;border:1px solid var(--line);border-radius:6px;padding:6px;cursor:pointer}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;font-weight:500;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .ed{background:var(--err);color:#fff;border-radius:999px;font-size:.6875rem;padding:0 6px;min-width:18px;text-align:center}
.tabs .lk{width:14px;height:14px}

.content{overflow:auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.content-in{max-width:1120px;margin:0 auto;display:grid;gap:16px}
.tabpanel{display:grid;gap:16px;min-width:0}
.hint{background:var(--panel);border:1px dashed var(--sel-line);border-radius:10px;padding:10px 14px}
.hint summary{cursor:pointer;font-weight:500;color:var(--sel-fg)}
.hint ul{margin:8px 0 2px;padding-left:20px;color:var(--muted);display:grid;gap:3px}
.hint kbd,.kbd{font-family:var(--mono);font-size:var(--fs-xs);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--panel-2);color:var(--fg)}
.banner{border-radius:10px;padding:10px 14px;display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.banner.err{background:var(--err-bg);color:var(--err)}
.banner.note{background:var(--warn-bg);color:var(--warn)}
.banner.info{background:var(--sel);color:var(--sel-fg)}
.banner > span{flex:1;min-width:200px}
.banner button.l{background:none;border:0;text-decoration:underline;color:inherit;cursor:pointer;font-weight:500;padding:0}
.banner ul{margin:4px 0 0;padding-left:18px;flex-basis:100%}
.banner .btn{padding:5px 12px}

.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:grid;gap:18px;min-width:0}
.box > h3{margin:0;font-size:var(--fs-l);font-weight:500;display:flex;gap:8px;align-items:center}
.box > h3 small{font-weight:400;color:var(--muted);font-size:var(--fs-xs)}
.prop{display:grid;grid-template-columns:220px 1fr;gap:6px 20px;align-items:start;min-width:0}
.prop.top{grid-template-columns:1fr}
.plabel{font-weight:500;padding-top:7px}
.prop.top > .plabel{padding-top:0}
.plabel .req{color:var(--err);margin-left:2px}
.plabel .xb{color:var(--warn);font-size:.6875rem;font-weight:500;margin-left:4px;border:1px solid currentColor;border-radius:4px;padding:0 4px;vertical-align:1px}
.plabel .adm{color:var(--sel-fg);font-size:.6875rem;font-weight:500;margin-left:4px;background:var(--sel);border-radius:4px;padding:0 5px;vertical-align:1px}
.plabel small{display:block;font-weight:400;color:var(--muted);font-size:var(--fs-xs);margin-top:2px}
.pctl{min-width:0;display:grid;gap:4px}
.perr{color:var(--err);font-size:var(--fs-xs)}
.perr:empty{display:none}
.txt,.area{width:100%;border:1px solid var(--line-strong);border-radius:6px;background:var(--panel);padding:7px 10px;min-height:36px}
.area{resize:none;overflow:hidden;line-height:1.45;display:block}
.txt:hover,.area:hover{border-color:var(--muted)}
.txt:focus,.area:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--sel)}
.txt[readonly]{background:var(--panel-2);color:var(--muted)}
.bad > .pctl .txt,.bad > .pctl .area,.bad > .pctl .cb-field,.bad > .pctl .rte,.bad > .pctl .tl-wrap,.bad > .pctl .ll .txt:first-of-type{border-color:var(--err)!important}
.bad > .pctl .txt,.bad > .pctl .area{background:var(--err-bg)}
.count{font-size:var(--fs-xs);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.count.over{color:var(--err);font-weight:500}
.chk{display:inline-flex;gap:8px;align-items:center;cursor:pointer;padding-top:6px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.lockv{display:flex;align-items:center;gap:8px;font-family:var(--mono);background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 10px;color:var(--fg)}
.lockv small{font-family:var(--font);color:var(--muted)}
.infov{color:var(--muted);padding-top:7px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.infov b{color:var(--fg);font-weight:500}
.filebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filebox .cb{flex:1;min-width:220px}
.upl{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:6px;padding:7px 12px;cursor:pointer;background:var(--panel)}
.upl:hover{background:var(--panel-2)}
.upl input{position:absolute;opacity:0;width:1px;height:1px}

/* Combobox */
.cb{position:relative;min-width:0}
.cb-field{display:flex;flex-wrap:wrap;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:6px;background:var(--panel);padding:4px 6px;min-height:36px;cursor:text}
.cb-field:hover{border-color:var(--muted)}
.cb.open .cb-field,.cb-field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--sel)}
.cb-vals{display:contents}
.cb:not(.multi) .cb-field{flex-wrap:nowrap}
.cb:not(.multi) .cb-input{min-width:0}
[hidden]{display:none!important}
.cb-input{flex:1;min-width:90px;border:0;background:none;padding:3px 4px;outline:none}
.cb-single{display:flex;align-items:center;gap:6px;padding-left:4px;min-width:0}
.cb-single span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb.open .cb-single{display:none}
.cb-single.off{color:var(--faint)}
.cb-x,.cb-caret{background:none;border:0;padding:4px;border-radius:4px;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.cb-x:hover{background:var(--panel-2);color:var(--fg)}
.cb-x svg,.cb-caret svg{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--sel);color:var(--sel-fg);border:1px solid var(--sel-line);border-radius:999px;padding:2px 4px 2px 8px;font-size:var(--fs-s);max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .i{width:15px;height:15px}
.chip button{background:none;border:0;padding:2px;border-radius:50%;color:inherit;cursor:pointer;display:grid;place-items:center}
.chip button:hover{background:var(--sel-line)}
.chip button svg{width:13px;height:13px}
.chip.off{background:var(--panel-2);color:var(--faint);border-style:dashed;border-color:var(--line-strong)}
.chip.dr{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip[draggable="true"]{cursor:grab}
.chip.dragging{opacity:.4}
.chip.drop{box-shadow:-3px 0 0 var(--accent)}
.cb-meta{display:flex;justify-content:space-between;gap:8px;font-size:var(--fs-xs);color:var(--muted)}
.cb-meta:empty{display:none}
.cb-pop{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;box-shadow:var(--shadow);max-height:300px;overflow:auto;padding:4px}
.cb-opt{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer}
.cb-opt.act{background:var(--sel)}
.cb-opt[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.cb-opt .tick{width:16px;height:16px;border:1.5px solid var(--line-strong);border-radius:4px;display:grid;place-items:center;flex:none}
.cb-opt[aria-selected="true"] .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.cb-opt .tick svg{width:12px;height:12px;stroke-width:3}
.cb-opt .i{color:var(--muted)}
.cb-opt .t{flex:1;min-width:0}
.cb-opt .t small{display:block;color:var(--muted);font-size:var(--fs-xs)}
.cb-opt mark{background:none;color:var(--accent);font-weight:700}
.cb-opt.new .t{color:var(--accent);font-weight:500}
.cb-empty,.cb-foot{padding:10px 8px;color:var(--muted);font-size:var(--fs-s)}
.cb-foot{border-top:1px solid var(--line);margin-top:4px;font-size:var(--fs-xs)}
.tag{font-size:.6875rem;padding:1px 6px;border-radius:4px;background:var(--warn-bg);color:var(--warn);font-weight:500;flex:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.dot.n{background:var(--lv-n)} .dot.h{background:var(--lv-h)} .dot.d{background:var(--lv-d)} .dot.g{background:var(--lv-g)}
.lvchip{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);font-weight:500;white-space:nowrap}

/* Danh sách dòng */
.ll{display:grid;gap:6px}
.ll-row{display:flex;gap:6px;align-items:flex-start}
.ll-row .txt{flex:1}
.ll-row.dragging{opacity:.4}
.ll-row.drop-b{box-shadow:0 -2px 0 var(--accent)}
.ll-row.drop-a{box-shadow:0 2px 0 var(--accent)}
.handle{background:none;border:0;padding:8px 4px;color:var(--faint);cursor:grab;border-radius:4px;display:grid;place-items:center;flex:none}
.handle:hover{color:var(--fg);background:var(--panel-2)}
.handle svg{stroke-width:3}
.ibtn{background:none;border:0;padding:7px;border-radius:6px;color:var(--muted);cursor:pointer;display:grid;place-items:center;flex:none;position:relative}
.ibtn:hover{background:var(--panel-2);color:var(--fg)}
.ibtn.del:hover{background:var(--err-bg);color:var(--err)}
.addbtn{justify-self:start;display:inline-flex;align-items:center;gap:6px;background:none;border:1px dashed var(--line-strong);border-radius:6px;padding:6px 12px;color:var(--accent);cursor:pointer;font-weight:500}
.addbtn:hover{border-color:var(--accent);background:var(--sel)}
.addbtn svg{width:16px;height:16px}
.rowhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.num{font-size:var(--fs-xs);color:var(--muted);font-variant-numeric:tabular-nums}

/* Bảng */
.tl{display:grid;gap:8px;min-width:0}
.tl-wrap{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tl table{width:100%;border-collapse:collapse;table-layout:fixed}
.tl th{background:var(--panel-2);text-align:left;font-weight:500;font-size:var(--fs-s);color:var(--muted);padding:8px;border-bottom:1px solid var(--line)}
.tl th .req{color:var(--err)}
.tl td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.tl tbody tr:last-child td{border-bottom:0}
.tl td .txt,.tl td .area{border-color:transparent;background:transparent;padding:6px 8px}
.tl td .txt:hover,.tl td .area:hover{border-color:var(--line)}
.tl td .txt:focus,.tl td .area:focus{border-color:var(--accent);background:var(--panel)}
.tl td .cb-field{border-color:transparent;background:transparent}
.tl td .cb-field:hover{border-color:var(--line)}
.tl td.bad .txt,.tl td.bad .area,.tl td.bad .cb-field,.xgrid .bad .txt,.xgrid .bad .area{border-color:var(--err)!important;background:var(--err-bg)}
.tl td .perr{padding:2px 8px 0}
.tl td .count{padding:0 8px}
.tl tr.dragging{opacity:.4}
.tl tr.drop-b td{box-shadow:inset 0 2px 0 var(--accent)}
.tl tr.drop-a td{box-shadow:inset 0 -2px 0 var(--accent)}
.tl tr.xrow td{background:var(--panel-2);padding:10px 12px 12px 44px}
.xgrid{display:grid;gap:10px}
.xgrid label{font-size:var(--fs-s);font-weight:500;display:block;margin-bottom:4px}
.xgrid label small{font-weight:400;color:var(--muted)}

chuyển tiền, đã đưa tiền, hoặc đã giao hàng đi chưa?","btn":"Rồi — xem việc cần làm","note":"Nếu bạn lỡ cả câu 2 và câu 3, hãy làm xong câu 2 trước rồi quay lại đây.","to":"p2"},{"_k":"r43","q":"4. Giấy tờ, khuôn mặt, chữ ký hoặc tên của bạn đã được gửi đi, hoặc bị người khác dùng — kể cả khi bạn không hề làm việc đó?","btn":"Rồi — xem việc cần làm","note":"Kể cả khi bạn chưa mất đồng nào, việc này vẫn cần xử lý.","to":"p6"},{"_k":"r44","q":"5. Có khoản tiền lạ nào tự nhiên chuyển vào tài khoản của bạn không?","btn":"Có — xem việc cần làm","note":"Đừng tiêu và đừng chuyển trả cho tới khi đọc xong.","to":"p9"},{"_k":"r45","q":"Chưa câu nào ở trên đúng với bạn?","btn":"Vậy bạn chưa mất gì — xem cách dừng đúng lúc","note":"Chưa mất gì là tình thế tốt nhất. Việc cần làm bây giờ là kiểm chứng trước khi đưa bất cứ thứ gì.","to":"p1"}],"rev":"2026-10-20","src":"Bài đọc Chuyên đề 1 và Chuyên đề 8, bản 2.0"}},{"id":"p1","p":"khan-cap","type":"viecCanLamPage","name":"Có người đang thúc bạn làm ngay, bạn chưa đưa gì","st":"pub","v":{"title":"Có người đang thúc bạn làm ngay, bạn chưa đưa gì","slug":"dang-bi-thuc-ep","icon":"clock","lead":"Làm bước 1 trước. Các bước còn lại bạn quay lại làm sau cũng được.","hide":false,"steps":[{"_k":"r46","s":"Dừng liên lạc. Không bấm vào bất kỳ đường link nào họ đã gửi.","d":[],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r47","s":"Tự tìm đường liên hệ chính thức của nơi được nhắc tới, rồi gọi lại để hỏi.","d":["Lấy số từ ứng dụng bạn đã cài từ trước, từ giấy tờ bạn đang có, hoặc từ cổng thông tin của cơ quan nhà nước.","Không dùng số người đó đưa. Cũng không dùng số lấy từ quảng cáo hoặc từ kết quả tìm kiếm đầu tiên — số giả vẫn mua được chỗ hiển thị trên cùng."],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r48","s":"Kiểm tra tên chủ tài khoản nhận tiền.","d":["Tên không khớp với bên bạn đang giao dịch thì dừng lại."," Ảnh biên lai và tin nhắn báo có tiền đều làm giả được. Và ngay cả khi tiền đã vào thật, điều đó cũng không chứng minh người chuyển hay yêu cầu của họ là đáng tin — nhất là khi họ đòi bạn hoàn lại một khoản “chuyển thừa”.","Nếu nhận qua một đơn vị thanh toán, xem khoản đó đã về tài khoản chưa hay mới chỉ báo đang xử lý. Khoản đang xử lý chưa phải tiền đã nhận xong và vẫn có thể bị hủy hoặc bị trừ lại."],"say":"","bank":false,"cond":"","snip":"","ask":true,"askQ":"Bạn cũng đã đưa mã OTP, mật khẩu, hoặc cài ứng dụng theo lời người khác?","askBtn":"Làm thêm: bảo vệ tài khoản và thiết bị","askNote":"Nếu có thể, hãy dùng một thiết bị khác mà bạn tin cậy để làm các bước đó.","askTo":"p3"},{"_k":"r54","s":"Lưu lại bằng chứng đang có: biên lai, tin nhắn, cuộc gọi, số tài khoản nhận tiền, đường link, thời gian và diễn biến.","d":[],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r55","s":"Đến Công an nơi gần nhất hoặc nơi bạn cư trú để trình báo. Mang theo bằng chứng đã lưu.","d":["ĐỪNG CHỜ kết quả tra soát của ngân hàng rồi mới đi trình báo. Hai việc này làm song song được, và càng sớm thì càng còn dấu vết để lần theo."],"say":"","bank":false,"cond":"","snip":"sn-recov","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r56","s":"Nếu việc bắt đầu từ cuộc gọi hoặc tin nhắn, phản ánh tới 156 hoặc 5656.","d":["Đây là nơi phản ánh cuộc gọi, tin nhắn có dấu hiệu lừa đảo. Không phải nơi thu hồi tiền, và không thay cho việc trình báo."],"say":"","bank":false,"cond":"sn-cond","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""}],"screen":[],"rev":"2026-10-20","src":"Bài đọc Chuyên đề 1 và Chuyên đề 8, bản 2.0"}},{"id":"p3","p":"khan-cap","type":"viecCanLamPage","name":"Người khác đang có quyền vào tài khoản hoặc điện thoại của bạn","st":"pub","v":{"title":"Người khác đang có quyền vào tài khoản hoặc điện thoại của bạn","slug":"bi-chiem-quyen-tai-khoan","icon":"key","lead":"Dù bạn tự đưa hay bị lấy mất, việc cần làm gần như giống nhau. Đọc ba dòng đầu, làm dòng đúng với bạn trước.","hide":false,"steps":[{"_k":"r57","s":"NẾU BẠN ĐÃ CÀI ỨNG DỤNG LẠ, cho người khác nhìn hoặc điều khiển màn hình, hoặc thấy máy tự bật tắt, tự thao tác: ngắt mạng trên điện thoại hoặc máy tính đó — tắt Wi-Fi và tắt dữ liệu di động — rồi ngừng dùng máy.","d":["Từ đây trở đi, mọi việc làm trên một thiết bị khác mà bạn tin cậy."],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r58","s":"NẾU BẠN CHỈ MỚI ĐỌC MÃ OTP HOẶC ĐƯA MẬT KHẨU, còn máy vẫn bình thường — không cần tắt mạng. Dùng ngay một thiết bị khác gọi ngân hàng.","d":["Tắt mạng lúc này chỉ làm bạn không nhận được thông báo và không liên lạc được, trong khi máy chưa có dấu hiệu bị điều khiển."],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r59","s":"NẾU SIM ĐỘT NHIÊN MẤT SÓNG, hoặc bạn nhận được thông báo đổi SIM mà không phải bạn làm — gọi nhà mạng ngay từ một thiết bị khác để khóa SIM và hỏi lại các yêu cầu đổi SIM gần nhất.","d":["Mất quyền với SIM là mất luôn nơi nhận mã OTP. Việc này gấp ngang với việc gọi ngân hàng."],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r60","s":"Gọi ngân hàng, đề nghị khóa tạm thời dịch vụ ngân hàng trên điện thoại và trên internet, cùng với thẻ.","d":[],"say":"Tôi nghi tài khoản ngân hàng của tôi đã bị lộ. Xin tạm khóa giao dịch online và thẻ, rồi hướng dẫn tôi bước tiếp theo.","bank":true,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r61","s":"Từ thiết bị tin cậy, đổi mật khẩu và xem lại lịch sử giao dịch cùng những điện thoại, máy tính đang đăng nhập tài khoản của bạn.","d":["Xem từ thời điểm bạn bắt đầu nghi ngờ. Nếu không nhớ rõ từ khi nào, xem lại toàn bộ giao dịch gần đây và đề nghị ngân hàng hỗ trợ tra soát."],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r62","s":"Đừng vội gỡ ứng dụng hoặc xóa dữ liệu trong máy. Những thứ đó có thể cần để ngân hàng và cơ quan Công an kiểm tra.","d":["Chụp ảnh màn hình những gì lấy được mà không cần nối mạng: tên ứng dụng lạ, tin nhắn, cuộc gọi.","Chưa tự khôi phục cài đặt gốc nếu trong máy còn dữ liệu bạn cần. Sau khi đã khóa tài khoản và lưu bằng chứng, hãy gỡ ứng dụng lạ hoặc làm sạch máy theo hướng dẫn của nơi sửa chữa.","Không dùng lại máy đó cho việc ngân hàng cho tới khi máy đã được làm sạch."],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r63","s":"Mang máy tới nơi sửa chữa hoặc bảo hành do bạn tự chọn — không phải nơi người kia giới thiệu.","d":[],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r64","s":"Nếu đã phát sinh giao dịch, đến Công an nơi gần nhất hoặc nơi bạn cư trú để trình báo.","d":["Không chờ ngân hàng trả lời xong mới đi."],"say":"","bank":false,"cond":"","snip":"sn-recov","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""}],"screen":[],"rev":"2026-10-20","src":"Bài đọc Chuyên đề 1 và Chuyên đề 8, bản 2.0"}},{"id":"p4","p":"khan-cap","type":"viecCanLamPage","name":"Có người mời bạn góp vốn, đầu tư, làm ăn hoặc mời việc làm","st":"pub","v":{"title":"Có người mời bạn góp vốn, đầu tư, làm ăn hoặc mời việc làm","slug":"duoc-moi-dau-tu","icon":"chart","lead":"Còn một câu chưa trả lời được thì chưa quyết định.","hide":false,"steps":[{"_k":"r65","s":"Hỏi ba câu trước khi bỏ tiền: lợi nhuận ở đâu ra, ai có nghĩa vụ trả tiền cho mình, và muốn rút thì rút bằng cách nào.","d":["Nếu còn điều chưa rõ, đừng chuyển tiền. Hãy hỏi lại, đọc kỹ giấy tờ, hoặc nhờ một người bạn tin cậy xem giúp.","Đây là ba câu trở đi trở lại của Chuyên đề 3."],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r66","s":"Kiểm tra xem họ có giấy cho phép làm đúng loại dịch vụ đang mời bạn hay không.","d":["Có đăng ký doanh nghiệp mới chỉ là có đăng ký kinh doanh. Nhận tiền của người khác để đầu tư, cho vay hay bảo hiểm còn cần giấy phép riêng."],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r67","s":"Xin toàn bộ điều kiện bằng văn bản, mang về đọc. Không ký, không chuyển tiền tại chỗ.","d":[],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r68","s":"Xác định trước mức thiệt hại tối đa bạn chấp nhận được, và những khoản bạn có thể phải trả thêm về sau.","d":[],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r69","s":"Không vay tiền, không dùng tiền dành cho việc thiết yếu để đầu tư.","d":[],"say":"","bank":false,"cond":"","snip":"sn-recov","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""}],"screen":[],"rev":"2026-10-20","src":"Bài đọc Chuyên đề 1 và Chuyên đề 8, bản 2.0"}},{"id":"p5","p":"khan-cap","type":"viecCanLamPage","name":"Tiền đã đưa đi nhưng không lấy lại được, hoặc hợp đồng phát sinh vấn đề","st":"pub","v":{"title":"Tiền đã đưa đi nhưng không lấy lại được, hoặc hợp đồng phát sinh vấn đề","slug":"khong-lay-lai-duoc-tien","icon":"doc","lead":"Bước 1 là việc quan trọng nhất: đừng chuyển thêm bất cứ khoản nào.","hide":false,"steps":[{"_k":"r70","s":"Không chuyển thêm tiền cho bên đang giữ tiền của bạn, hoặc vào tài khoản họ chỉ định, để được rút hoặc được nhận lại tiền.","d":["Họ có thể gọi khoản đó là “gỡ lỗ”, “tiền thuế”, “phí xác minh”, “phí mở khóa rút tiền”.","Nếu họ nói đó là khoản bắt buộc theo quy định, hãy tự kiểm tra với cơ quan nhà nước phụ trách trước khi chuyển bất cứ đồng nào."],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r71","s":"Ghi ra ba việc, càng cụ thể càng tốt: bạn đã được hứa những gì; hợp đồng hoặc thỏa thuận nói gì; và lý do họ đưa ra để không trả tiền cho bạn.","d":["Bạn không cần tự kết luận đây là lừa đảo hay là rủi ro kinh doanh. Việc đó không phải của bạn."],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r72","s":"Tìm lại hợp đồng, sao kê, tin nhắn và điều kiện rút vốn bạn đã ký hoặc đã đồng ý.","d":[],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r73","s":"Liên hệ đơn vị đã nhận, giữ hoặc chuyển tiền trong giao dịch, và cơ quan nhà nước cấp phép cho loại dịch vụ đó.","d":[],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r74","s":"Nếu bạn nghi mình bị đưa thông tin giả, giấy tờ giả, hoặc tiền bị cố ý giữ lại — đến Công an nơi gần nhất hoặc nơi bạn cư trú để trình báo những gì bạn đang có.","d":["Không chờ tới khi tự thấy đã đủ chứng cứ. Việc xác định đúng sai là của cơ quan có thẩm quyền."],"say":"","bank":false,"cond":"","snip":"sn-recov","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""}],"screen":[],"rev":"2026-10-20","src":"Bài đọc Chuyên đề 1 và Chuyên đề 8, bản 2.0"}},{"id":"p6","p":"khan-cap","type":"viecCanLamPage","name":"Giấy tờ, chữ ký hoặc tên của bạn đã được gửi đi, hoặc bị người khác dùng","st":"pub","v":{"title":"Giấy tờ, chữ ký hoặc tên của bạn đã được gửi đi, hoặc bị người khác dùng","slug":"lo-giay-to-chu-ky","icon":"id","lead":"Có thể bạn chưa nhìn thấy thiệt hại nào, nhưng giấy tờ và tên của bạn có thể đang tiếp tục bị dùng. Làm bước 1 trước.","hide":false,"steps":[{"_k":"r75","s":"Dừng lại. Không đưa thêm bất kỳ giấy tờ, chữ ký hay mã OTP nào nữa.","d":["Kể cả khi họ nói cần thêm một lần nữa để “hoàn tất”, để “hủy bỏ” hoặc để “lấy lại” thứ bạn đã đưa."],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r76","s":"Nếu bạn đã cho mượn, cho thuê, bán hoặc mở hộ tài khoản ngân hàng, ví điện tử, SIM: liên hệ ngay nơi quản lý tài khoản hoặc SIM đó để đề nghị khóa tạm thời và làm theo hướng dẫn xử lý.","d":["Hãy nói đầy đủ sự việc khi liên hệ và khi trình báo. Trình báo sớm giúp ghi nhận thời điểm bạn phát hiện và những việc bạn đã làm để dừng lại.","Để càng lâu, tài khoản mang tên bạn càng bị dùng vào nhiều việc hơn."],"say":"","bank":true,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r77","s":"Nếu bạn đã gửi ảnh giấy tờ hoặc đã quét khuôn mặt: kiểm tra tài khoản và giao dịch tại từng ngân hàng bạn đang dùng.","d":["Ứng dụng của một ngân hàng chỉ cho biết tài khoản tại chính ngân hàng đó, không cho biết tài khoản bạn có ở nơi khác.","Để xem có khoản vay hay thẻ tín dụng nào đứng tên mình, hãy xem báo cáo tín dụng của CIC — trung tâm thông tin tín dụng thuộc Ngân hàng Nhà nước. Báo cáo này cho biết các khoản vay, không cho biết mọi tài khoản thanh toán."],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r78","s":"Nếu bạn đã ký giấy tờ: đề nghị được nhận một bản của đúng thứ bạn đã ký, và giữ lại bằng chứng rằng bạn đã đề nghị.","d":["Không ký thêm giấy nào theo chỉ dẫn của chính bên đang bị nghi ngờ.","Chỉ ký giấy sửa, hủy hay chấm dứt sau khi đã đọc hết, được một người độc lập giải thích, và bạn giữ được một bản."],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r79","s":"Nói cho người thân trong nhà biết, để họ không làm theo nếu có ai lấy danh nghĩa bạn liên hệ.","d":[],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r80","s":"Lưu bằng chứng: ai nhờ, nhờ qua kênh nào, bạn đã gửi những gì, ngày giờ, và khoản tiền công đã nhận nếu có.","d":[],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r81","s":"Nếu bạn phát hiện có tài khoản, khoản vay, doanh nghiệp hoặc hợp đồng mang tên mình mà bạn chưa từng làm: giữ nguyên mọi giấy tờ, tin nhắn, thông báo đã nhận.","d":["Trường hợp này bạn không hề đưa gì cho ai — giấy tờ của bạn bị lấy được từ nơi khác. Trình báo sớm là cách ghi nhận rằng bạn không phải người thực hiện."],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r82","s":"Đến Công an nơi gần nhất hoặc nơi bạn cư trú để trình báo. Mang theo bằng chứng đã lưu.","d":[],"say":"","bank":false,"cond":"","snip":"sn-recov","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""}],"screen":[],"rev":"2026-10-20","src":"Bài đọc Chuyên đề 1 và Chuyên đề 8, bản 2.0"}},{"id":"p7","p":"khan-cap","type":"viecCanLamPage","name":"Cách tự kiểm chứng trước khi đưa","st":"pub","v":{"title":"Cách tự kiểm chứng trước khi đưa","slug":"tu-kiem-chung","icon":"search","lead":"Dùng khi bạn sắp làm một việc và muốn kiểm tra trước, khi không có dấu hiệu nào rõ ràng, hoặc khi bạn thấy phân vân mà không gọi tên được vì sao.","hide":true,"steps":[{"_k":"r83","s":"Trước hết, chậm lại. Bộ chuyên đề gọi đây là bốn việc phải làm theo thứ tự: CHẬM LẠI — XÁC MINH ĐỘC LẬP — LÀM RÕ ĐIỀU KIỆN — RỒI MỚI QUYẾT.","d":["Đặt điện thoại xuống hai phút. Tự trả lời bốn câu: mình sắp làm gì, làm với ai, sẽ hỏi lại ở đâu, và còn chỗ nào chưa rõ."],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r84","s":"Xác minh bằng KÊNH CHÍNH THỨC — nghĩa là nơi do chính mình tự tìm ra.","d":["Số in trên thẻ ngân hàng; ứng dụng chính mình đã tự cài và vẫn dùng; địa chỉ mình tự nhập có tên miền kết thúc đúng bằng .gov.vn; số công bố trên trang chính thức; hoặc cơ quan Công an nơi gần nhất.","Không phải số máy hay đường dẫn do người kia đưa. Cũng không phải số lấy từ quảng cáo hay từ kết quả tìm kiếm đầu tiên.","Nếu người kia cản bạn làm việc này, bạn đã có câu trả lời."],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r85","s":"Xem mình đang ở lĩnh vực nào, rồi hỏi đúng bộ câu hỏi của lĩnh vực đó.","d":[],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r86","s":"Có người mời góp vốn, đầu tư — hỏi ba câu: lợi nhuận ở đâu ra, ai có nghĩa vụ trả tiền cho mình, và muốn rút thì rút bằng cách nào.","d":["Chỉ dùng số tiền mà nếu mất thì đời sống gia đình vẫn ổn. Dừng nếu phải vay, thế chấp tài sản thiết yếu, hoặc dùng tiền dưỡng già, tiền chữa bệnh để góp vốn."],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r87","s":"Có người mời việc làm, mời làm thêm — hỏi sáu nhóm: chiều tiền, công việc, ai tuyển, trả công, giấy tờ, đường ra.","d":["Chiều tiền là câu quan trọng nhất: việc làm thật thì người ta trả tiền cho mình. Hễ bị yêu cầu nộp tiền để mở việc, mở nhiệm vụ, giữ chỗ hay bảo đảm thực hiện công việc thì dừng, và đừng nộp thử."],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r88","s":"Sắp mua bán, đặt cọc — hỏi năm câu: tiền vào ai, mình nhận gì, trả qua đâu, giao thế nào, hoàn trả ra sao.","d":[],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r89","s":"Sắp ký hợp đồng — bốn điều phải rõ trước khi ký: ai là bên cung cấp, mình phải trả bao nhiêu, mình được hưởng gì, và muốn dừng thì làm thế nào.","d":["Xin toàn bộ giấy tờ mang về đọc. Không ký, không trả tiền tại chỗ. Còn chỗ quan trọng chưa rõ thì hoãn ký."],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r90","s":"Sắp vay tiền — ghi ra giấy ba con số: mình nhận về bao nhiêu, tổng cộng phải trả bao nhiêu, mỗi kỳ trả bao nhiêu. Rồi đặt cạnh thu nhập và các khoản chi cần thiết của gia đình.","d":[],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r91","s":"Cuối cùng, chọn một trong ba: HOÃN, DỪNG, hoặc CÓ THỂ QUYẾT ĐỊNH.","d":["HOÃN là tạm dừng để hỏi thêm khi còn thiếu thông tin.","DỪNG là ngừng hẳn khi gặp yêu cầu nguy hiểm, hoặc khi điều kiện không thể chấp nhận.","CÓ THỂ QUYẾT ĐỊNH là khi đã đủ thông tin để tự quyết. Đây là ba cách xử lý của bộ chuyên đề."],"say":"","bank":false,"cond":"","snip":"sn-cover","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""}],"screen":[],"rev":"2026-10-20","src":"Bài đọc Chuyên đề 1 và Chuyên đề 8, bản 2.0"}},{"id":"p8","p":"khan-cap","type":"viecCanLamPage","name":"Có người đang đe dọa, ép buộc bạn","st":"pub","v":{"title":"Có người đang đe dọa, ép buộc bạn","slug":"bi-de-doa","icon":"alert","lead":"Bạn không có lỗi vì bị đe dọa. Việc quan trọng nhất là không xử lý một mình.","hide":false,"steps":[{"_k":"r92","s":"Nếu bạn đang bị đe dọa tính mạng, sức khỏe, hoặc có người tìm đến tận nơi: gọi 113 ngay.","d":[],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r93","s":"Nói cho một người thân mà bạn tin cậy biết ngay hôm nay.","d":["Sức ép của kẻ đe dọa dựa vào việc bạn giữ kín và tự xoay xở.","Nếu bạn đang thấy quá căng thẳng, hãy nói với người đó trước, rồi mới làm các bước còn lại. Không có bước nào ở đây quan trọng hơn việc bạn có người bên cạnh."],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r94","s":"Không chuyển thêm tiền theo yêu cầu đe dọa.","d":["Trả tiền không bảo đảm lời đe dọa sẽ dừng lại.","Nếu bạn đã lỡ trả rồi thì cũng không sao — điều đó không làm bạn mất quyền được giúp đỡ, và không có gì phải ngại khi trình báo."],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r95","s":"Không tự thương lượng, không hứa hẹn thêm, và không gửi thêm bất kỳ thông tin, hình ảnh hay giấy tờ nào nữa.","d":[],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r96","s":"Nếu làm được nhanh và bạn thấy an toàn: chụp lại bằng chứng — tin nhắn, cuộc gọi, số tài khoản họ đòi chuyển, ngày giờ — rồi ngừng trả lời hoặc chặn.","d":["Chặn rồi thì phần lớn bằng chứng không lấy lại được, nên chụp trước nếu kịp.","Nhưng nếu việc tiếp tục liên lạc khiến bạn thấy không an toàn hoặc quá căng thẳng, hãy ngừng liên lạc trước. An toàn của bạn đứng trên bằng chứng."],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r97","s":"Nếu họ dọa gọi cho người trong danh bạ của bạn, hãy báo trước cho người thân, bạn bè.","d":["Nói với họ rằng có thể có cuộc gọi như vậy, và đó có thể là cuộc gọi quấy rối hoặc đe dọa. Người được báo trước sẽ không hoang mang. Đừng tranh luận với người gọi về danh nghĩa của họ."],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r98","s":"Đến Công an nơi gần nhất hoặc nơi bạn cư trú để trình báo. Mang theo những gì bạn đang có.","d":["Nếu bị đe dọa tung hình ảnh hoặc thông tin riêng tư để đòi tiền: người bị đe dọa là người bị hại. Đừng gửi thêm, đừng trả thêm, hãy trình báo."],"say":"","bank":false,"cond":"","snip":"sn-cover","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""}],"screen":[],"rev":"2026-10-20","src":"Bài đọc Chuyên đề 1 và Chuyên đề 8, bản 2.0"}},{"id":"p9","p":"khan-cap","type":"viecCanLamPage","name":"Tự nhiên có tiền lạ chuyển vào tài khoản của bạn","st":"pub","v":{"title":"Tự nhiên có tiền lạ chuyển vào tài khoản của bạn","slug":"tien-la-chuyen-vao","icon":"inbox","lead":"Đây có thể là chuyển nhầm thật, cũng có thể là một thủ đoạn. Trong cả hai trường hợp, việc cần làm giống nhau.","hide":false,"steps":[{"_k":"r99","s":"Không tiêu, không rút, không chuyển khoản tiền đó đi đâu.","d":[],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r100","s":"Không chuyển trả theo số tài khoản mà người gọi điện đưa cho bạn — kể cả khi họ nói là chuyển nhầm.","d":["Cách thường gặp: họ chuyển tiền vào, sau đó gọi đòi lại kèm tiền lãi, hoặc yêu cầu bạn chuyển sang một tài khoản khác. Khi đó bạn vừa mất tiền, vừa dính vào đường đi của tiền không rõ nguồn gốc."],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r101","s":"Liên hệ ngân hàng của chính bạn để báo có khoản tiền lạ và đề nghị hướng dẫn xử lý.","d":[],"say":"Tài khoản của tôi vừa nhận một khoản tiền không rõ nguồn gốc. Tôi chưa sử dụng khoản này. Xin hướng dẫn cách xử lý và ghi nhận sự việc.","bank":true,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r102","s":"Chỉ hoàn trả theo đúng cách ngân hàng hướng dẫn, hoặc theo hướng dẫn của cơ quan có thẩm quyền.","d":["Đây là điều nhiều người chưa biết, nên bị thuyết phục chuyển thẳng. Không chuyển thẳng cho người lạ, không chuyển sang một tài khoản khác, và không trả thêm bất kỳ khoản lãi hay phí nào."],"say":"","bank":false,"cond":"","snip":"","ask":false,"askQ":"","askBtn":"","askNote":"","askTo":""},{"_k":"r103","s":"Giữ nguyên tin nhắn báo có tiền và mọi liên hệ của người đòi lại tiền.","d":[],"say":"","bank":false,"cond":"","snip":"sn-cover","ask":true,"askQ":"Người đó có đe dọa bạn không?","askBtn":"Có — xem việc cần làm khi bị đe dọa","askNote":"Bị đe dọa là chuyện khác và cần xử lý theo hướng khác.","askTo":"p8"}],"screen":[],"rev":"2026-10-20","src":"Bài đọc Chuyên đề 1 và Chuyên đề 8, bản 2.0"}},{"id":"cong-cu","p":"home","type":"congCuPage","name":"Công cụ & checklist","st":"pub","v":{"title":"Công cụ & checklist","lead":"Tự kiểm tra trước khi chuyển tiền, đầu tư, vay, hoặc khi nghi mình đã bị lừa. Mỗi lần một câu, có kết quả và việc cần làm tiếp theo.","tools":["tool1","tool2","tool3"],"chkTitle":"8 checklist “Trước khi…”","chkLead":"Lấy nguyên văn từ 8 bài đọc chuyên đề. In hoặc lưu PDF được.","links":[{"_k":"r104","nhan":"Thử sức 8 câu","trang":"cuoc-thi"},{"_k":"r105","nhan":"Tự luyện 200 câu","trang":"cuoc-thi"}]}},{"id":"tool1","p":"cong-cu","type":"toolPage","name":"Trước khi chuyển tiền","st":"pub","v":{"title":"Kiểm tra trước khi chuyển tiền","slug":"truoc-khi-chuyen-tien","icon":"money","card":"5 câu hỏi trước khi bấm chuyển. Biết nên dừng lại, kiểm tra thêm, hay chưa thấy điểm dừng.","lead":"5 câu hỏi về khoản tiền bạn sắp chuyển. Mỗi lần một câu.","kind":"dem","qs":[{"_k":"r106","q":"Bạn có biết chắc người nhận không?","help":"","sign":"khong"},{"_k":"r107","q":"Có bị yêu cầu chuyển ngay không?","help":"","sign":"co"},{"_k":"r108","q":"Có được yêu cầu chuyển sang tài khoản cá nhân không?","help":"","sign":"co"},{"_k":"r109","q":"Có được yêu cầu cung cấp OTP hoặc mật khẩu không?","help":"","sign":"co"},{"_k":"r110","q":"Có được hứa hoàn tiền, trúng thưởng hoặc lợi nhuận không?","help":"","sign":"co"}],"bands":[{"_k":"r111","from":"0","to":"0","label":"An toàn tương đối","color":"xanh","desc":"Không có dấu hiệu cảnh báo."},{"_k":"r112","from":"1","to":"1","label":"Cần kiểm tra thêm","color":"vang","desc":"Có 1 dấu hiệu."},{"_k":"r113","from":"2","to":"","label":"Cần dừng lại","color":"cam","desc":"Có từ 2 dấu hiệu trở lên."}],"acts":["Không chuyển tiền ngay.","Gọi lại qua số chính thức.","Hỏi người thân tin cậy.","Nếu đã chuyển, liên hệ ngân hàng ngay."],"none":"","bq":[],"chk":"chk6"}},{"id":"tool2","p":"cong-cu","type":"toolPage","name":"Trước khi đầu tư, vay","st":"pub","v":{"title":"Kiểm tra trước khi đầu tư/vay","slug":"truoc-khi-dau-tu-vay","icon":"chart","card":"5 câu hỏi trước khi góp vốn, đầu tư hoặc ký khoản vay.","lead":"5 câu hỏi trước khi góp vốn, đầu tư hoặc ký khoản vay. Mỗi lần một câu.","kind":"dem","qs":[{"_k":"r114","q":"Có được hứa lợi nhuận bảo đảm hoặc không rủi ro không?","help":"","sign":"co"},{"_k":"r115","q":"Có được yêu cầu trả phí trước để nhận vốn/lãi không?","help":"","sign":"co"},{"_k":"r116","q":"Có được yêu cầu chuyển tiền vào tài khoản cá nhân không?","help":"","sign":"co"},{"_k":"r117","q":"Có được yêu cầu mời người thân tham gia không?","help":"","sign":"co"},{"_k":"r118","q":"Có thông tin pháp nhân, giấy phép và hợp đồng rõ ràng không?","help":"","sign":"khong"}],"bands":[{"_k":"r119","from":"0","to":"0","label":"Cần thẩm định kỹ","color":"vang","desc":""},{"_k":"r120","from":"1","to":"1","label":"Rủi ro cao","color":"cam","desc":""},{"_k":"r121","from":"2","to":"","label":"Không nên tham gia","color":"cam","desc":""}],"acts":[],"none":"","bq":[],"chk":"chk3"}},{"id":"tool3","p":"cong-cu","type":"toolPage","name":"Khi nghi ngờ bị lừa","st":"pub","v":{"title":"Kiểm tra khi nghi ngờ bị lừa","slug":"khi-nghi-bi-lua","icon":"alert","card":"4 câu hỏi để biết việc nào phải làm trước, theo đúng thứ tự.","lead":"4 câu hỏi để biết việc nào phải làm trước, theo đúng thứ tự.","kind":"nhanh","qs":[],"bands":[],"acts":[],"none":"Bạn chưa làm việc nào trong bốn việc trên. Giữ bốn nguyên tắc dừng lại và tự kiểm tra qua kênh chính thức.","bq":[{"_k":"r122","q":"Bạn đã chuyển tiền chưa?","label":"Đã chuyển tiền","acts":["Liên hệ ngân hàng ngay.","Yêu cầu khóa/giữ giao dịch.","Lưu bằng chứng."],"to":"p2"},{"_k":"r123","q":"Bạn đã cung cấp OTP/mật khẩu chưa?","label":"Đã cung cấp OTP/mật khẩu","acts":["Đổi mật khẩu.","Bật xác thực hai lớp.","Khóa thẻ/tài khoản."],"to":"p3"},{"_k":"r124","q":"Bạn đã bấm link hoặc cài ứng dụng chưa?","label":"Đã bấm link/cài app","acts":["Không nhập thêm thông tin.","Gỡ ứng dụng lạ.","Quét thiết bị.","Đổi mật khẩu."],"to":"p3"},{"_k":"r125","q":"Bạn đã gửi ảnh CCCD/chữ ký chưa?","label":"Đã gửi giấy tờ","acts":["Theo dõi tài khoản.","Cảnh giác với cuộc gọi/tin nhắn mạo danh.","Không cung cấp thêm dữ liệu."],"to":"p6"}],"chk":"chk8"}},{"id":"chk1","p":"cong-cu","type":"checklistPage","name":"Trước mọi quyết định có dính đến tiền","st":"pub","v":{"title":"Trước mọi quyết định có dính đến tiền","icon":"clock","src":"doc1","groups":[{"_k":"r126","t":"Năm việc phải chặn ngay","items":["Đọc hoặc gửi mã xác thực, mật khẩu.","Cài ứng dụng theo đường dẫn người khác gửi, hoặc cấp quyền xem màn hình, quyền can thiệp sâu vào máy, quyền điều khiển máy.","Chuyển tiền để “xác minh”, “mở khóa”, “giải phóng”.","Quét khuôn mặt hoặc gửi ảnh giấy tờ theo yêu cầu của người chưa xác minh được.","Bị yêu cầu giữ bí mật, không cho hỏi gia đình, ngân hàng hay cơ quan."]},{"_k":"r127","t":"Bảng kiểm bỏ túi","items":["Mình đang ở trạng thái nào? Tham, sợ, gấp, quá tin, quá thương hay quá hy vọng?","Ai đang chọn thời điểm quyết định — mình hay người kia?","Người này là ai, và mình biết điều đó từ đâu?","Họ đang bảo mình làm gì?","Mình sẽ hỏi lại ở đâu — kênh đó do ai đưa?","Còn điểm nào chưa rõ không? Còn thì hoãn."]}],"pdf":"","ver":"2.0","rev":"2026-10-20"}},{"id":"chk2","p":"cong-cu","type":"checklistPage","name":"Trước khi ký hợp đồng, bấm đồng ý","st":"pub","v":{"title":"Trước khi ký hợp đồng, bấm đồng ý","icon":"pen","src":"doc2","groups":[{"_k":"r128","t":"Năm việc phải chặn ngay","items":["Ký vào giấy còn chỗ trống — thiếu số tiền, thiếu ngày, thiếu phụ lục.","Bấm đồng ý khi chưa mở được, chưa đọc hết hoặc chưa lưu được bản điều khoản.","Ký biên bản nghiệm thu khi chưa tự kiểm tra xong hàng hóa hoặc công việc.","Chuyển tiền vào tài khoản không khớp tên bên ký hợp đồng, mà không có căn cứ kiểm tra được.","Bị giục ký ngay kèm lời khuyên đừng hỏi thêm ai, hoặc đừng mang giấy tờ về nhà đọc.","Chặn một việc không có nghĩa là cả giao dịch đều hỏng. Chặn xong rồi mới xét lại: có thể vẫn là hoãn, và cũng có thể vẫn ký được."]},{"_k":"r129","t":"Bảng kiểm bỏ túi","items":["Mình ký với ai — tên đầy đủ của bên kia là gì?","Tổng cộng phải trả bao nhiêu, gồm những khoản nào?","Mình được nhận gì, và bao giờ nhận?","Có tự động gia hạn không? Muốn dừng thì làm thế nào?","Đã cầm và đọc hết phụ lục cùng bảng phí chưa?","Có ai đang giục, hoặc bảo mình đừng hỏi thêm ai không?","Còn chỗ nào để trống không? Còn thì chưa ký.","Ký xong mình có giữ được một bản không?"]}],"pdf":"","ver":"2.0","rev":"2026-10-20"}},{"id":"chk3","p":"cong-cu","type":"checklistPage","name":"Trước khi đầu tư, góp vốn","st":"pub","v":{"title":"Trước khi đầu tư, góp vốn","icon":"chart","src":"doc3","groups":[{"_k":"r130","t":"Năm việc phải chặn ngay","items":["Nộp thêm bất kỳ khoản nào để được rút tiền ra.","Đọc hoặc gửi mã xác thực, mật khẩu; cài ứng dụng hoặc cấp quyền điều khiển máy theo hướng dẫn của nơi mời đầu tư.","Chuyển tiền vào tài khoản cá nhân trong khi hợp đồng ký với một công ty, mà không có căn cứ thu hộ kiểm tra được.","Đi vay, thế chấp nhà đất, hoặc dùng tiền dưỡng già để góp thêm.","Rủ người thân, bạn bè cùng tham gia khi mình chưa tự kiểm tra xong.","Chặn một việc không có nghĩa là mọi thứ đều hỏng. Chặn xong rồi tự xác minh, lúc đó mới quyết định về cả khoản đầu tư."]},{"_k":"r131","t":"Bảng kiểm bỏ túi","items":["Tiền lãi ở đâu ra? Ai làm ra khoản đó, bằng việc gì?","Ai có nghĩa vụ trả tiền cho mình — tên đơn vị nào?","Muốn rút thì rút thế nào, mất bao lâu, mất phí gì?","Tài khoản nhận tiền đứng tên ai, có khớp bên ký hợp đồng không?","Mình tra được gì ở nơi nằm ngoài chính lời mời này?","Nếu mất hết khoản này, đời sống gia đình có ổn không?","Có ai đang giục mình chốt ngay trong hôm nay không?"]}],"pdf":"","ver":"2.0","rev":"2026-10-20"}},{"id":"chk4","p":"cong-cu","type":"checklistPage","name":"Trước khi vay, bảo lãnh, đứng tên","st":"pub","v":{"title":"Trước khi vay, bảo lãnh, đứng tên","icon":"coins","src":"doc4","groups":[{"_k":"r132","t":"Năm việc phải chặn ngay","items":["Đọc hoặc nhập mã xác thực theo yêu cầu của người khác, kể cả để “hoàn tất khoản vay hộ”.","Ký hoặc gửi hồ sơ bảo lãnh cho người chỉ quen qua mạng; gửi ảnh giấy tờ, chữ ký cho họ.","Ký vào giấy còn chỗ trống, hoặc giấy ghi vai trò của mình một cách mơ hồ.","Vay hoặc chuyển tiền trong lúc đang bị thúc và bị bắt giữ bí mật, không cho hỏi người nhà.","Đứng tên vay hộ người khác, dù là người quen.","Chặn một việc không có nghĩa là cả khoản vay đều hỏng. Chặn xong rồi tự xác minh bằng kênh chính thức, lúc đó mới quyết định."]},{"_k":"r133","t":"Bảng kiểm bỏ túi","items":["Mình thật sự nhận về tay bao nhiêu?","Tổng cộng phải trả bao nhiêu, gồm những khoản gì?","Mỗi kỳ trả bao nhiêu, trong bao nhiêu kỳ?","Lãi sau ưu đãi tính thế nào? Chậm một kỳ thì mất thêm bao nhiêu?","Bên cho vay tên pháp lý là gì, mình tra ở đâu ra?","Trừ hết chi tiêu và khoản để dành, mình còn đủ trả không?","Có ai đang giục, hoặc bắt mình giữ bí mật với người nhà không?","Mình đang ký với vai trò gì — người vay, người bảo lãnh, hay người tham chiếu?"]}],"pdf":"","ver":"2.0","rev":"2026-10-20"}},{"id":"chk5","p":"cong-cu","type":"checklistPage","name":"Trước khi nhận việc, nộp hồ sơ","st":"pub","v":{"title":"Trước khi nhận việc, nộp hồ sơ","icon":"brief","src":"doc5","groups":[{"_k":"r134","t":"Năm việc phải chặn ngay","items":["Nạp tiền để kích hoạt gian hàng, mở nhiệm vụ, nâng gói hoặc để được nhận hoa hồng.","Giao bản chính giấy tờ tùy thân, văn bằng, chứng chỉ cho bên tuyển giữ; hoặc đặt tiền, đặt tài sản để bảo đảm thực hiện hợp đồng lao động.","Cài ứng dụng tuyển việc từ đường dẫn lạ, hoặc cấp quyền can thiệp sâu vào máy cho nó.","Mở, cho mượn, cho thuê hoặc bán tài khoản ngân hàng; giao thẻ, SIM, mã xác thực; nhận tiền rồi chuyển hộ.","Lên xe đi làm xa trong đêm khi chưa biết sẽ đến đâu và gặp ai.","Chặn một việc không có nghĩa là mọi cơ hội đều hỏng. Chặn xong rồi tự xác minh bằng kênh chính thức, lúc đó mới quyết định."]},{"_k":"r135","t":"Bảng kiểm bỏ túi","items":["Đồng tiền đầu tiên đi theo chiều nào — mình nhận hay mình nộp?","Công việc cụ thể là gì, làm ở đâu?","Đơn vị tuyển tên gì? Mình tra ra ở đâu, ngoài chính lời mời này?","Tiền công bao nhiêu, tính thế nào, trả vào lúc nào?","Họ đòi mình giao giấy tờ gì, cấp quyền gì trên điện thoại?","Muốn nghỉ thì làm sao? Khoản đã nộp xử lý thế nào?","Có ai đang giục mình quyết ngay hôm nay không?"]}],"pdf":"","ver":"2.0","rev":"2026-10-20"}},{"id":"chk6","p":"cong-cu","type":"checklistPage","name":"Trước khi mua, chuyển khoản, đặt cọc","st":"pub","v":{"title":"Trước khi mua, chuyển khoản, đặt cọc","icon":"cart","src":"doc6","groups":[{"_k":"r136","t":"Năm việc phải chặn ngay","items":["Đọc hoặc gửi mã xác thực cho bất kỳ ai, kể cả người bán, kể cả để “hoàn tiền cho nhanh”.","Nhập thông tin thẻ hoặc đăng nhập ngân hàng trên một trang tự nhảy sang từ quảng cáo hay đường dẫn.","Quét mã QR hoặc bấm đường dẫn trong tin nhắn báo “chuyển nhầm tiền” để hoàn lại.","Ký nhận hàng khi bị từ chối cho kiểm tra, dù lúc đặt đã hứa cho kiểm tra.","Đặt cọc ngay tại buổi hội thảo khi đang bị giục và chưa bàn với gia đình.","Chặn một việc không có nghĩa là cả đơn hàng đều hỏng. Chặn xong rồi tự kiểm tra bằng kênh chính thức, lúc đó mới quyết định."]},{"_k":"r137","t":"Bảng kiểm bỏ túi","items":["Tài khoản nhận tiền đứng tên ai? Có khớp với bên bán không?","Mình nhận đúng món gì — tên và mã hàng có khớp với đơn không?","Mình trả qua đâu? Kênh đó có chứng từ và có chỗ khiếu nại không?","Giao nhận thế nào? Mình có được kiểm tra hàng không?","Muốn trả lại hoặc đòi hoàn tiền thì làm sao, trong bao lâu?","Mình đang trả trước bao nhiêu, và có cần trả nhiều đến thế không?","Có ai đang giục mình chốt trong hôm nay không?"]}],"pdf":"","ver":"2.0","rev":"2026-10-20"}},{"id":"chk7","p":"cong-cu","type":"checklistPage","name":"Khi người lạ liên hệ, gửi đường link","st":"pub","v":{"title":"Khi người lạ liên hệ, gửi đường link","icon":"call","src":"doc7","groups":[{"_k":"r138","t":"Năm việc phải chặn ngay","items":["Đọc hoặc gửi mã xác thực, mật khẩu cho người đang liên hệ.","Cài ứng dụng theo đường dẫn họ gửi, chia sẻ màn hình, hoặc cấp quyền can thiệp sâu vào máy, quyền điều khiển máy.","Chuyển tiền để “xác minh dòng tiền”, “mở khóa”, “nộp phí nhận thưởng”.","Quét khuôn mặt hoặc gửi ảnh giấy tờ theo yêu cầu của người chưa xác minh được.","Làm theo yêu cầu giữ bí mật, không cho hỏi gia đình, ngân hàng hay cơ quan.","Thấy bất thường thì lưu lại những gì đang có rồi dừng nói chuyện. Đừng cố nói tiếp để moi thêm bằng chứng về họ."]},{"_k":"r139","t":"Bảng kiểm bỏ túi","items":["Họ đang bảo mình làm gì — đưa gì, cài gì, cho quyền gì, chuyển cho ai?","Cuộc liên hệ này do ai bắt đầu — mình hay họ?","Số máy hoặc đường dẫn này do ai đưa?","Có ai đang giục, dọa, hay bắt mình giữ bí mật không?","Mình sẽ kiểm tra lại ở đâu — kênh đó mình tự tìm ra chứ?","Nếu cúp máy bây giờ thì mình mất gì? Thường là không mất gì."]}],"pdf":"","ver":"2.0","rev":"2026-10-20"}},{"id":"chk8","p":"cong-cu","type":"checklistPage","name":"Khi đã lỡ đưa tiền, mã hoặc giấy tờ","st":"draft","v":{"title":"Khi đã lỡ đưa tiền, mã hoặc giấy tờ","icon":"alert","src":"doc8","groups":[{"_k":"r140","t":"Năm việc phải chặn ngay","items":["Nộp bất kỳ khoản nào — phí hồ sơ, phí xác minh, phí mở khóa, “thuế” — để lấy lại tiền hoặc để mở tài khoản.","Đọc mã xác thực cho ai đó, kể cả người tự nhận là đang giúp mình xử lý.","Cấp quyền vào email, tài khoản ngân hàng hay mạng xã hội cho người tự tìm đến.","Ký giấy ủy quyền do bên tự tìm đến gửi, trước khi tự kiểm tra được họ là ai ở một nơi khác.","Xóa máy, xóa tin nhắn hay gỡ ứng dụng trước khi đã lưu xong chứng cứ."]},{"_k":"r141","t":"Bảng kiểm bỏ túi","items":["Mình đã đưa đi thứ gì — tiền, mã, quyền vào máy, hay giấy tờ?","Cái gì đang còn nguy hiểm ngay lúc này? Đã chặn chưa?","Đã gọi nơi có thể khóa hoặc kiểm tra giúp chưa — bằng số mình tự tra chứ?","Đã đổi mật khẩu và đăng xuất khỏi mọi máy khác đang mở tài khoản đó chưa?","Đã chụp lại tin nhắn, biên lai, tài khoản nhận và mốc thời gian chưa?","Đã nói với một người trong nhà chưa? Đã trình báo chưa?","Có ai đang giục, dọa, hay bắt mình giữ bí mật không?","Có ai vừa tự tìm đến hứa lấy lại tiền giúp mình không?"]}],"pdf":"","ver":"2.0","rev":"2026-10-20"}},{"id":"rui-ro","p":"home","type":"ruiRoPage","name":"Các rủi ro","st":"pub","v":{"title":"Các rủi ro","lead":"Chọn một nhóm để xem cảnh báo và bài hướng dẫn."}},{"id":"canh-bao-moi","p":"rui-ro","type":"alertListPage","name":"Cảnh báo mới","st":"pub","v":{"title":"Cảnh báo mới","lead":"Mỗi cảnh báo dựa trên văn bản của cơ quan nhà nước, ghi rõ nguồn và ngày cập nhật. Website không tổng hợp tin báo chí.","sample":true}},{"id":"al1","p":"canh-bao-moi","type":"alertPage","name":"Ứng dụng giả mạo dịch vụ công dụ người dân cài đặt","st":"pub","v":{"title":"Ứng dụng giả mạo dịch vụ công dụ người dân cài đặt","desc":"Người gọi tự xưng cán bộ, gửi đường link và hướng dẫn cài một ứng dụng mang tên dịch vụ công. Ứng dụng đó không có trong kho ứng dụng chính thức.","level":"ratCao","pop":"thuong-gap","popNote":"","steps":["Một người gọi điện, tự xưng cán bộ, nói hồ sơ của bạn cần cập nhật gấp.","Họ gửi đường link qua tin nhắn hoặc Zalo, bảo bạn cài một ứng dụng mang tên dịch vụ công.","Ứng dụng xin quyền xem màn hình hoặc quyền can thiệp sâu vào máy, rồi bảo bạn nhập mật khẩu, mã OTP.","Trong lúc bạn làm theo, tiền trong tài khoản bị chuyển đi."],"signs":["cai-ung-dung","doc-ma"],"signs2":[],"todo":"p3","img":"","imgAlt":"","agency":"","docNo":"","docDate":"","docUrl":"","ch":["dien-thoai","tin-nhan","website-ung-dung"],"aud":["nguoi-cao-tuoi","nguoi-moi-dung"],"tac":["t24","t29"],"tabs":["g-du-lieu-ca-nhan"],"rel":[],"kw":[],"upd":"2026-10-20","ttl":"180"}},{"id":"al2","p":"canh-bao-moi","type":"alertPage","name":"Ứng dụng vay nhanh đòi nộp phí trước khi giải ngân","st":"pub","v":{"title":"Ứng dụng vay nhanh đòi nộp phí trước khi giải ngân","desc":"Quảng cáo vay nhanh, duyệt trong vài phút. Hồ sơ được “duyệt” nhưng phải nộp phí bảo hiểm, phí xác minh trước rồi mới giải ngân.","level":"ratCao","pop":"rat-pho-bien","popNote":"","steps":["Quảng cáo vay nhanh, không cần thế chấp, duyệt trong vài phút.","Ứng dụng đòi quyền vào danh bạ, hình ảnh, tin nhắn.","Hồ sơ được “duyệt”, nhưng phải nộp phí bảo hiểm, phí xác minh trước rồi mới giải ngân.","Nộp xong lại phát sinh khoản phí khác; khoản vay không về."],"signs":["phi-mo-khoa"],"signs2":[],"todo":"p5","img":"","imgAlt":"","agency":"","docNo":"","docDate":"","docUrl":"","ch":["website-ung-dung","mang-xa-hoi"],"aud":["cong-nhan","nguoi-moi-dung"],"tac":["t9","t10"],"tabs":["g-vay-va-no"],"rel":[],"kw":[],"upd":"2026-10-16","ttl":"180"}},{"id":"al3","p":"canh-bao-moi","type":"alertPage","name":"Mời góp vốn qua ứng dụng, cam kết lợi nhuận cố định","st":"pub","v":{"title":"Mời góp vốn qua ứng dụng, cam kết lợi nhuận cố định","desc":"Lời mời góp vốn qua một ứng dụng, hứa trả lãi cố định hằng tháng và cho rút thử một khoản nhỏ lúc đầu.","level":"cao","pop":"thuong-gap","popNote":"","steps":["Một người làm quen qua mạng xã hội, kể chuyện góp vốn có lãi đều mỗi tháng.","Họ mời tải một ứng dụng hoặc vào một trang đầu tư, cho góp thử một khoản nhỏ.","Lần rút đầu tiên được trả thật, để bạn tin.","Đến khi góp số tiền lớn, ứng dụng báo lỗi rút tiền hoặc đòi thêm phí."],"signs":[],"signs2":[],"todo":"p4","img":"","imgAlt":"","agency":"","docNo":"","docDate":"","docUrl":"","ch":["mang-xa-hoi","website-ung-dung"],"aud":["cong-nhan","hoc-sinh-sinh-vien"],"tac":["t4","t7"],"tabs":[],"rel":[],"kw":[],"upd":"2026-10-12","ttl":"180"}},{"id":"al4","p":"canh-bao-moi","type":"alertPage","name":"Nhiệm vụ trực tuyến trả hoa hồng vài lần đầu rồi bắt nạp thêm","st":"pub","v":{"title":"Nhiệm vụ trực tuyến trả hoa hồng vài lần đầu rồi bắt nạp thêm","desc":"Vài nhiệm vụ đầu được trả hoa hồng thật, tiền về tài khoản thật. Rồi mới đến câu quan trọng: nạp thêm để mở gói lớn hơn.","level":"ratCao","pop":"rat-pho-bien","popNote":"","steps":["Tin nhắn mời làm việc online tại nhà: thả tim, đánh giá sản phẩm, nhận hoa hồng.","Vài nhiệm vụ đầu được trả tiền thật.","Họ bảo nạp tiền để mở gói nhiệm vụ lớn hơn, hoa hồng cao hơn.","Khi muốn rút, họ nói tài khoản đang bị giữ, phải nạp thêm mới rút được."],"signs":["phi-mo-khoa"],"signs2":[],"todo":"p5","img":"","imgAlt":"","agency":"","docNo":"","docDate":"","docUrl":"","ch":["mang-xa-hoi","tin-nhan","website-ung-dung"],"aud":["cong-nhan","hoc-sinh-sinh-vien"],"tac":["t14"],"tabs":[],"rel":[],"kw":[],"upd":"2026-10-05","ttl":"180"}},{"id":"al5","p":"canh-bao-moi","type":"alertPage","name":"Tin nhắn mạo danh ngân hàng chen vào luồng tin thật, báo tài khoản sắp bị khóa","st":"pub","v":{"title":"Tin nhắn mạo danh ngân hàng chen vào luồng tin thật, báo tài khoản sắp bị khóa","desc":"Tin nhắn hiện ngay trong luồng tin của ngân hàng, kèm đường link trông giống trang của ngân hàng, đòi nhập mật khẩu và mã OTP.","level":"ratCao","pop":"thuong-gap","popNote":"","steps":["Tin nhắn hiện ngay trong luồng tin của ngân hàng, báo tài khoản sắp bị khóa hoặc cần cập nhật.","Tin nhắn kèm một đường link trông giống trang của ngân hàng.","Trang đó đòi nhập tên đăng nhập, mật khẩu và mã OTP."],"signs":["doc-ma"],"signs2":[],"todo":"p3","img":"","imgAlt":"","agency":"","docNo":"","docDate":"","docUrl":"","ch":["tin-nhan"],"aud":["nguoi-moi-dung","nguoi-cao-tuoi"],"tac":["t27"],"tabs":["g-du-lieu-ca-nhan"],"rel":[],"kw":[],"upd":"2026-09-30","ttl":"180"}},{"id":"al6","p":"canh-bao-moi","type":"alertPage","name":"Chuyển nhầm tiền vào tài khoản, kèm mã QR hoặc đường dẫn để hoàn lại","st":"pub","v":{"title":"Chuyển nhầm tiền vào tài khoản, kèm mã QR hoặc đường dẫn để hoàn lại","desc":"Tài khoản tự nhiên nhận một khoản tiền lạ. Ngay sau đó có tin nhắn kèm mã QR hoặc đường dẫn, đòi bạn hoàn lại tiền theo cách họ chỉ.","level":"ratCao","pop":"it-gap","popNote":"","steps":["Tài khoản của bạn tự nhiên nhận một khoản tiền lạ.","Ngay sau đó có người gọi hoặc nhắn tin, nói là chuyển nhầm.","Họ gửi mã QR, đường dẫn, hoặc đưa một số tài khoản khác, đòi bạn hoàn lại ngay, có khi đòi thêm tiền lãi."],"signs":[],"signs2":[],"todo":"p9","img":"","imgAlt":"","agency":"","docNo":"","docDate":"","docUrl":"","ch":["tin-nhan","dien-thoai"],"aud":["tieu-thuong","nguoi-cao-tuoi"],"tac":["t23"],"tabs":[],"rel":[],"kw":[],"upd":"2026-09-28","ttl":"180"}},{"id":"al7","p":"canh-bao-moi","type":"alertPage","name":"Gọi điện báo có khoản vay quá hạn mang tên bạn, đòi chuyển tiền để “tất toán”","st":"pub","v":{"title":"Gọi điện báo có khoản vay quá hạn mang tên bạn, đòi chuyển tiền để “tất toán”","desc":"Người gọi nói bạn có một khoản vay quá hạn mà bạn chưa từng vay, dọa gọi cho người thân, đồng nghiệp, rồi đưa một tài khoản cá nhân để chuyển tiền “tất toán”.","level":"cao","pop":"thuong-gap","popNote":"","steps":["Có người gọi, nói bạn đang có một khoản vay quá hạn mà bạn chưa từng vay.","Họ dọa báo nợ xấu, gọi cho người thân, đồng nghiệp trong danh bạ.","Họ đưa một số tài khoản cá nhân, bảo chuyển tiền để “tất toán” hoặc “hủy hồ sơ”."],"signs":[],"signs2":[],"todo":"p6","img":"","imgAlt":"","agency":"","docNo":"","docDate":"","docUrl":"","ch":["dien-thoai"],"aud":["cong-nhan","nguoi-cao-tuoi"],"tac":["t13","t12"],"tabs":["g-du-lieu-ca-nhan"],"rel":[],"kw":[],"upd":"2026-09-15","ttl":"180"}},{"id":"al8","p":"canh-bao-moi","type":"alertPage","name":"Giới thiệu hợp đồng bảo hiểm như một khoản gửi tiết kiệm lãi cao","st":"pub","v":{"title":"Giới thiệu hợp đồng bảo hiểm như một khoản gửi tiết kiệm lãi cao","desc":"Người tư vấn nói đây là “gửi tiết kiệm lãi cao”, nhưng giấy tờ đưa ký là một hợp đồng khác: thời hạn dài và có khoản phạt nếu dừng sớm.","level":"cao","pop":"it-gap","popNote":"","steps":["Người tư vấn mời “gửi tiết kiệm lãi cao”, tại nhà hoặc tại quầy.","Giấy tờ đưa ký là một hợp đồng khác: thời hạn dài, có khoản phạt nếu dừng sớm.","Người ký chỉ biết khi muốn rút tiền trước hạn."],"signs":[],"signs2":[],"todo":"p5","img":"","imgAlt":"","agency":"","docNo":"","docDate":"","docUrl":"","ch":["truc-tiep","dien-thoai"],"aud":["nguoi-cao-tuoi"],"tac":["t6","t1"],"tabs":["g-bao-hiem-va-tiet-kiem"],"rel":[],"kw":[],"upd":"2026-08-18","ttl":"180"}},{"id":"al9","p":"canh-bao-moi","type":"alertPage","name":"Cuộc gọi video giả người thân, nhắn cần tiền gấp và dặn đừng hỏi ai","st":"pub","v":{"title":"Cuộc gọi video giả người thân, nhắn cần tiền gấp và dặn đừng hỏi ai","desc":"Một tài khoản mang tên, ảnh người thân gọi video rất ngắn, hình mờ. Ngay sau đó nhắn đang gặp chuyện gấp, cần chuyển tiền vào một tài khoản lạ.","level":"cao","pop":"thuong-gap","popNote":"","steps":["Một tài khoản mang tên, ảnh của người thân gọi video rất ngắn, hình mờ, tiếng chập chờn.","Ngay sau đó họ nhắn tin: đang gặp chuyện gấp, cần chuyển tiền ngay vào một tài khoản lạ.","Họ dặn đừng gọi lại hay hỏi ai khác."],"signs":["giu-bi-mat"],"signs2":[],"todo":"p1","img":"","imgAlt":"","agency":"","docNo":"","docDate":"","docUrl":"","ch":["mang-xa-hoi","dien-thoai"],"aud":["nguoi-cao-tuoi"],"tac":["t26","t28"],"tabs":["g-du-lieu-ca-nhan"],"rel":[],"kw":[],"upd":"2026-07-02","ttl":"180"}},{"id":"al10","p":"canh-bao-moi","type":"alertPage","name":"Giả người mua, người giao hàng để chiếm tài khoản của người bán","st":"draft","v":{"title":"Giả người mua, người giao hàng để chiếm tài khoản của người bán","desc":"Người tự xưng khách mua hoặc người giao hàng gửi đường link “nhận tiền”, hoặc bảo người bán đọc mã để “xác nhận đơn”.","level":"cao","pop":"it-gap","popNote":"","steps":["Một người tự xưng khách mua hàng hoặc người giao hàng liên hệ người bán.","Họ gửi đường link để “nhận tiền”, hoặc bảo người bán đọc mã để “xác nhận đơn”.","Đường link dẫn tới trang giả, đòi nhập thông tin đăng nhập ngân hàng và mã OTP."],"signs":["doc-ma","cai-ung-dung"],"signs2":[],"todo":"p3","img":"","imgAlt":"","agency":"","docNo":"","docDate":"","docUrl":"","ch":["dien-thoai","tin-nhan","san-thuong-mai"],"aud":["tieu-thuong"],"tac":["t24","t27"],"tabs":["g-du-lieu-ca-nhan"],"rel":[],"kw":[],"upd":"2026-06-21","ttl":"180"}},{"id":"g-lua-dao","p":"rui-ro","type":"riskCategoryPage","name":"Lừa đảo","st":"pub","v":{"tab":"Lừa đảo","short":"Giả danh, việc làm online, mua bán, đặt cọc","lead":"Không cần nhớ tên từng thủ đoạn. Đừng nghe họ tự xưng là ai, hãy nhìn vào việc họ đang bảo mình làm.","icon":"alert","tactics":[],"pins":[],"noAns":"Không thấy câu trả lời? Gửi câu hỏi ở trang Hỏi – Đáp."}},{"id":"g-vay-va-no","p":"rui-ro","type":"riskCategoryPage","name":"Vay và nợ","st":"pub","v":{"tab":"Vay và nợ","short":"Vay nhanh, phí trước, đứng tên hộ, đòi nợ","lead":"Ghi ra giấy ba con số trước khi vay: mình nhận về bao nhiêu, tổng cộng phải trả bao nhiêu, mỗi kỳ trả bao nhiêu.","icon":"coins","tactics":[],"pins":[],"noAns":"Không thấy câu trả lời? Gửi câu hỏi ở trang Hỏi – Đáp."}},{"id":"g-dau-tu","p":"rui-ro","type":"riskCategoryPage","name":"Đầu tư","st":"pub","v":{"tab":"Đầu tư","short":"Cam kết lợi nhuận, rút thử, hoa hồng theo tầng","lead":"Ba câu trở đi trở lại: lợi nhuận ở đâu ra, ai có nghĩa vụ trả tiền cho mình, và muốn rút thì rút bằng cách nào.","icon":"chart","tactics":[],"pins":[],"noAns":"Không thấy câu trả lời? Gửi câu hỏi ở trang Hỏi – Đáp."}},{"id":"g-bao-hiem-va-tiet-kiem","p":"rui-ro","type":"riskCategoryPage","name":"Bảo hiểm và tiết kiệm","st":"pub","v":{"tab":"Bảo hiểm và tiết kiệm","short":"Hợp đồng, phí định kỳ, nhập nhèm sản phẩm","lead":"Bốn điều phải rõ trước khi ký: ai là bên cung cấp, mình phải trả bao nhiêu, mình được hưởng gì, và muốn dừng thì làm thế nào.","icon":"shield","tactics":[],"pins":[],"noAns":"Không thấy câu trả lời? Gửi câu hỏi ở trang Hỏi – Đáp."}},{"id":"g-du-lieu-ca-nhan","p":"rui-ro","type":"riskCategoryPage","name":"Dữ liệu cá nhân","st":"pub","v":{"tab":"Dữ liệu cá nhân","short":"Mã OTP, giấy tờ, tài khoản, SIM","lead":"Mã xác thực, giấy tờ, khuôn mặt, tài khoản ngân hàng và SIM là chìa khóa của bạn. Không ai cần những thứ đó của mình qua điện thoại.","icon":"id","tactics":[],"pins":[],"noAns":"Không thấy câu trả lời? Gửi câu hỏi ở trang Hỏi – Đáp."}},{"id":"doc1","p":"g-lua-dao","type":"riskArticlePage","name":"Bài đọc Chuyên đề 1: Những điều nền tảng và cách quyết định cho chắc","st":"pub","v":{"title":"Bài đọc Chuyên đề 1: Những điều nền tảng và cách quyết định cho chắc","kind":"docChuyenDe","desc":"Đọc khoảng 10 phút. Đọc xong rồi hãy làm 19 câu của Chuyên đề 1.","icon":"book","img":"","sum":"","signs":[],"scen":[],"todo":[],"todoPage":"","dont":[],"body":"<div class=\"k-now\"><p><b>CHUYỆN ĐANG XẢY RA NGAY LÚC NÀY?<\/b><\/p><p>Nếu vừa chuyển tiền, vừa đọc mã, hoặc nghi điện thoại đang bị người khác điều khiển — đọc thẳng mục “Nếu đã lỡ” ở cuối bài trước, rồi quay lại đọc từ đầu sau.<\/p><\/div><div class=\"k-box\"><p><b>CÂU HỎI CỦA BÀI<\/b><\/p><p>Mình đang quyết định trong trạng thái nào, và đã kiểm tra bằng kênh của ai?<\/p><\/div><div class=\"k-box\"><p><b>NHỚ MỘT CÂU<\/b><\/p><p>Chưa kiểm tra bằng kênh do mình tự tìm — chưa quyết.<\/p><\/div><div class=\"k-box\"><p><b>HIỂU NHANH MẤY TỪ<\/b><\/p><p>Kênh chính thức là nơi do chính mình tự tìm ra và kiểm được là đúng tổ chức: số in trên thẻ ngân hàng, ứng dụng chính thức của đúng nhà phát hành mà mình đã dùng từ trước, trang chính thức mình tự gõ địa chỉ và đối chiếu được tên miền, số công bố trên trang đó, hoặc cơ quan Công an nơi gần nhất. Không phải số máy hay đường dẫn do người kia đưa, và cũng không phải ứng dụng mình vừa cài theo lời ai đó.<\/p><p>Thấy có điểm bất thường thì hoãn lại và tự kiểm tra. Gặp một yêu cầu nguy hiểm thì chặn ngay yêu cầu đó, không chờ dấu hiệu thứ hai.<\/p><\/div><h3>Chuyện thường bắt đầu vào lúc mình đang bận<\/h3><p>Một cuộc gọi đến giữa lúc dở tay. Người bên kia nói đúng tên mình, đúng một thông tin mình tưởng chỉ mình biết. Họ nói có việc cần xử lý ngay. Giọng rành mạch, nghe như người hiểu việc.<\/p><p>Đến lúc kịp nhận ra thì mình đã làm theo được vài bước rồi. Chuyện đó không xảy ra vì mình kém hiểu biết, mà vì hai lẽ: mình đang bận, và có người vừa chọn giúp mình thời điểm phải quyết định.<\/p><p>Bài này không dạy nhận mặt từng kiểu lừa. Nó dạy một cách quyết định dùng được cho mọi kiểu — kể cả kiểu chưa ai đặt tên.<\/p><h3>Vì sao người cẩn thận vẫn quyết định sai<\/h3><table><tr><th>Điều nhiều người nghĩ<\/th><th>Thực tế<\/th><\/tr><tr><td>“Tôi cẩn thận nên không bị lừa.”<\/td><td>Người cẩn thận vẫn sai khi đang mệt, đang vội, đang lo. Cái bị nhắm tới là thời điểm, không phải trình độ.<\/td><\/tr><tr><td>“Họ đọc đúng tên mình thì chắc là người thật.”<\/td><td>Thông tin thật làm câu chuyện nghe thật. Nó không cho biết người gọi là ai.<\/td><\/tr><tr><td>“Phải thấy đủ hai dấu hiệu mới được dừng.”<\/td><td>Một yêu cầu nguy hiểm là đủ để chặn ngay yêu cầu đó.<\/td><\/tr><tr><td>“Chuyển thử một khoản nhỏ cho chắc.”<\/td><td>Khoản nhỏ vẫn là làm theo trước khi kiểm tra xong.<\/td><\/tr><tr><td>“Hỏi lại chính người đó là đã kiểm tra rồi.”<\/td><td>Đó vẫn là một nguồn duy nhất. Kiểm tra là hỏi ở một nơi khác.<\/td><\/tr><\/table><h3>Sáu tín hiệu trong lòng mình<\/h3><p>Kiểu lừa thay đổi từng tháng. Nhưng cái mà chúng nhắm vào thì gần như không đổi — sáu cảm giác dễ làm mình vội tin:<\/p><div class=\"k-chips\"><p>THAM · SỢ · GẤP · TIN · THƯƠNG · HY VỌNG<\/p><\/div><p>Nhớ sáu chữ này bền hơn nhớ tên thủ đoạn. Thủ đoạn mới bao giờ cũng xuất hiện trước, thông báo đến sau; còn sáu cảm giác này thì lặp lại mãi.<\/p><p>Việc cần làm không phải là dập tắt cảm xúc. Chỉ cần gọi tên nó ra: mình đang nôn nao, mình đang sợ, mình đang bị giục. Gọi tên được thì mình có thêm một cơ hội chậm lại — không phải lúc nào cũng đủ, nhưng thường là đủ.<\/p><h3>Ba câu hỏi gốc<\/h3><p>Trước bất kỳ việc gì liên quan đến tiền, giấy tờ hoặc quyền vào điện thoại, tự hỏi ba câu:<\/p><p>Người này là ai?  ·  Họ bảo mình làm gì?  ·  Mình hỏi lại ở đâu?<\/p><p>Câu thứ ba quan trọng nhất, và cũng hay bị bỏ nhất.<\/p><p>Dùng đúng: cúp máy → tự tra số công bố của cơ quan đó → gọi lại bằng số mình vừa tìm.<\/p><p>Dùng sai: hỏi lại chính người đang gọi cho thật kỹ → thấy trả lời trôi chảy nên yên tâm. Trôi chảy không phải bằng chứng; đó vẫn là lời của cùng một người.<\/p><h3>Bốn bước khi phải quyết một việc lớn<\/h3><ol><li>CHẬM LẠI<\/li><li>XÁC MINH ĐỘC LẬP<\/li><li>LÀM RÕ ĐIỀU KIỆN<\/li><li>QUYẾT ĐỊNH<\/li><\/ol><p>Đặt điện thoại xuống hai phút cũng đã là chậm lại. Xác minh độc lập là hỏi ở một nơi mình tự tìm. Làm rõ điều kiện là biết mình được gì, mất gì, và rút ra bằng cách nào. Rồi mới quyết định.<\/p><h3>Ba cách xử lý — và cách thứ ba cũng quan trọng<\/h3><table><tr><th>Cách xử lý<\/th><th>Khi nào, và làm ngay gì<\/th><\/tr><tr><td><b>DỪNG<\/b><\/td><td>Nghĩa là: Không làm theo yêu cầu, và kết thúc cuộc liên hệ đó.<br>Khi nào: Gặp một yêu cầu nguy hiểm, hoặc điều kiện không thể chấp nhận.<br>Làm ngay: Cúp máy hoặc thoát trang, chưa đưa gì cả.<\/td><\/tr><tr><td><b>HOÃN<\/b><\/td><td>Nghĩa là: Chưa quyết, giữ nguyên đó để hỏi thêm.<br>Khi nào: Còn điểm chưa rõ.<br>Làm ngay: Tự kiểm tra bằng kênh chính thức mình tìm.<\/td><\/tr><tr><td><b>CÓ THỂ QUYẾT ĐỊNH<\/b><\/td><td>Khi nào: Đã đủ thông tin để tự quyết.<br>Làm ngay: Quyết, và giữ lại giấy tờ.<\/td><\/tr><\/table><p>DỪNG là dừng yêu cầu đang được đưa ra và dừng cuộc liên hệ đó — chứ không có nghĩa cả việc mình đang làm đều hỏng. Chặn xong rồi tự xác minh, lúc đó mới quyết định về cả giao dịch: có thể vẫn hoãn, và cũng có thể vẫn làm tiếp được.<\/p><p>Bài này không dạy nghi ngờ tất cả. Một thông báo thay đổi cách tính tiền mà đối chiếu với biểu giá niêm yết và với hợp đồng thấy khớp thì cứ làm theo, chỉ cần giữ lại giấy tờ. Phần lớn giao dịch trong đời là bình thường. Biết lúc nào được yên tâm cũng là một phần của việc quyết định cho chắc.<\/p><div class=\"k-stop\"><p><b>NĂM VIỆC PHẢI CHẶN NGAY<\/b><\/p><p>Không đọc mã — Không cài theo đường dẫn — Không cho quyền vào máy — Không chuyển tiền để “xác minh” — Không giữ bí mật với người nhà. Không chờ dấu hiệu thứ hai. Gặp một trong năm việc này thì chặn ngay việc đó, rồi mới tính tiếp:<\/p><ul><li>Đọc hoặc gửi mã xác thực, mật khẩu.<\/li><li>Cài ứng dụng theo đường dẫn người khác gửi, hoặc cấp quyền xem màn hình, quyền can thiệp sâu vào máy, quyền điều khiển máy.<\/li><li>Chuyển tiền để “xác minh”, “mở khóa”, “giải phóng”.<\/li><li>Quét khuôn mặt hoặc gửi ảnh giấy tờ theo yêu cầu của người chưa xác minh được.<\/li><li>Bị yêu cầu giữ bí mật, không cho hỏi gia đình, ngân hàng hay cơ quan.<\/li><\/ul><\/div><div class=\"k-pocket\"><p><b>BẢNG KIỂM BỎ TÚI — CHỤP LẠI MÀN HÌNH NÀY<\/b><\/p><p>Bình tĩnh. Làm từng ô một. Chưa nhớ hết cũng không sao.<\/p><ul><li>Mình đang ở trạng thái nào? Tham, sợ, gấp, quá tin, quá thương hay quá hy vọng?<\/li><li>Ai đang chọn thời điểm quyết định — mình hay người kia?<\/li><li>Người này là ai, và mình biết điều đó từ đâu?<\/li><li>Họ đang bảo mình làm gì?<\/li><li>Mình sẽ hỏi lại ở đâu — kênh đó do ai đưa?<\/li><li>Còn điểm nào chưa rõ không? Còn thì hoãn.<\/li><\/ul><\/div><h3>Nếu đã lỡ<\/h3><div class=\"k-note\"><p>Bị lừa không phải lỗi của người bị hại. Việc lúc này không phải là trách mình, mà là chặn thiệt hại. Làm theo đúng loại việc đã xảy ra:<\/p><\/div><div class=\"k-case\"><p><b>Lỡ chuyển tiền rồi.<\/b> Dừng lại, không chuyển thêm đồng nào. Gọi ngân hàng bằng số in sau thẻ hoặc trong ứng dụng chính thức mình tự mở, đề nghị khóa và kiểm tra giúp khoản vừa chuyển, càng sớm càng tốt. Giữ lại tin nhắn và biên lai.<\/p><p><b>Đã đọc, đã gửi, hoặc đã nhập mã xác thực theo yêu cầu của ai đó hay theo một liên kết chưa xác minh — kể cả khi tự tay mình nhập.<\/b> Hoặc đã đưa thông tin thẻ. Liên hệ ngay ngân hàng hoặc ví bằng kênh chính thức để khóa dịch vụ và đổi mật khẩu. Đừng chờ xem mã đó có tự hết tác dụng không.<\/p><p><b>Đã cài ứng dụng lạ, đã chia sẻ màn hình, hoặc nghi máy đang bị người khác điều khiển.<\/b> Cắt mạng của chiếc máy đó trước — tắt Wi-Fi và dữ liệu di động, hoặc bật chế độ máy bay. Rồi dùng một thiết bị khác đáng tin để gọi ngân hàng, đổi mật khẩu và đăng xuất khỏi mọi máy khác đang mở tài khoản đó. Giữ chiếc máy kia ở tình trạng cách ly, đừng dùng lại vội. Khi đã lưu xong chứng cứ thì thu hồi các quyền đã cấp, gỡ ứng dụng lạ, và nhờ người có chuyên môn kiểm tra hoặc đặt lại máy trước khi dùng nó trở lại. Cắt mạng là để người ở xa không điều khiển tiếp được; đừng vội xóa máy ngay từ đầu, vì làm vậy là mất luôn bằng chứng.<\/p><\/div><p>Sau đó, dù là trường hợp nào: nói với một người trong nhà, và trình báo cơ quan Công an nơi gần nhất.<\/p><p><\/p><div class=\"k-note\"><p>Và cảnh giác với người tự tìm đến hứa chắc chắn lấy lại được tiền, chỉ cần nộp trước một khoản. Chuyên đề 8 nói kỹ về việc này.<\/p><\/div><p><i>19 câu của Chuyên đề 1. Mỗi câu đều có phần giải thích sau khi trả lời — chọn sai cũng không sao, phần giải thích mới là chỗ để học.<\/i><\/p>","srcs":[],"topic":"cd1","ch":[],"aud":[],"level":"","tabs":[],"kw":[],"syn":[],"rel":[],"chk":"chk1","feat":true,"ver":"2.0","rev":"2026-10-20","by":"Công an xã Thiên Lộc"}},{"id":"doc2","p":"g-bao-hiem-va-tiet-kiem","type":"riskArticlePage","name":"Bài đọc Chuyên đề 2: Ký hợp đồng và cam kết dịch vụ","st":"pub","v":{"title":"Bài đọc Chuyên đề 2: Ký hợp đồng và cam kết dịch vụ","kind":"docChuyenDe","desc":"Đọc khoảng 12 phút. Đọc xong rồi hãy làm 24 câu của Chuyên đề 2.","icon":"book","img":"","sum":"","signs":[],"scen":[],"todo":[],"todoPage":"","dont":[],"body":"<div class=\"k-now\"><p><b>CHUYỆN ĐANG XẢY RA NGAY LÚC NÀY?<\/b><\/p><p>Nếu đang cầm bút trước một tờ giấy, hay ngón tay đang đặt trên nút “Tôi đồng ý” mà màn hình có đồng hồ đếm ngược — đặt bút xuống, thoát khỏi bước xác nhận đó. Chưa ký thì chưa mất gì. Đọc xong bài này vẫn kịp.<\/p><\/div><div class=\"k-box\"><p><b>CÂU HỎI CỦA BÀI<\/b><\/p><p>Mình đang cam kết điều gì, trong bao lâu, và giữ được bản nào trong tay?<\/p><\/div><div class=\"k-box\"><p><b>NHỚ MỘT CÂU<\/b><\/p><p>Còn chỗ quan trọng chưa rõ — chưa ký.<\/p><\/div><div class=\"k-box\"><p><b>HIỂU NHANH MẤY TỪ<\/b><\/p><p>Bản đầy đủ là hợp đồng chính cùng mọi phụ lục và bảng phí đi kèm, có ngày hoặc số phiên bản, và mình tải hoặc lưu được về máy của mình. Bản tóm tắt do bên bán viết không phải bản đầy đủ; lời hứa miệng của nhân viên cũng không phải.<\/p><p>Còn điểm chưa rõ thì hoãn lại để làm rõ. Gặp một việc nguy hiểm — như bị bảo ký vào giấy còn để trống — thì chặn ngay việc đó, không chờ dấu hiệu thứ hai.<\/p><\/div><h3>Chuyện thường bắt đầu bằng một câu tử tế<\/h3><p>Người tư vấn nói nhẹ nhàng, giải thích trôi chảy, và bảo phần còn lại “chỉ là quy định chung thôi”. Bộ hồ sơ thì dày, chữ thì nhỏ, mà phòng sắp đóng cửa. Mình gật đầu vì thấy chẳng có gì đáng ngại.<\/p><p>Vài tháng sau, một khoản tiền bị trừ đều đặn. Mở lại giấy tờ mới thấy nó nằm trong một phụ lục mình chưa từng đọc.<\/p><p>Chuyện đó thường không phải vì gặp người xấu. Hợp đồng
