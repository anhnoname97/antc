 chữ ký có ý nghĩa gì và cần làm gì trước khi đặt bút ký, bấm “đồng ý” hoặc xác nhận giao dịch.<\/p>","signs":[],"scen":[],"todo":[],"todoPage":"","dont":[],"body":"","srcs":[],"topic":"","ch":[],"aud":[],"level":"","tabs":[],"kw":[],"syn":[],"rel":[],"chk":"","feat":false,"ver":"1.0","rev":"","by":""}},{"id":"ar6","p":"g-dau-tu","type":"riskArticlePage","name":"Vì sao bị mất tiền nhưng không phải vụ nào cũng là lừa đảo?","st":"pub","v":{"title":"Vì sao bị mất tiền nhưng không phải vụ nào cũng là lừa đảo?","kind":"docThem","desc":"","icon":"doc","img":"","sum":"<p>Có những trường hợp người dân mất tiền và cảm thấy rõ ràng mình đã bị lừa, nhưng vụ việc lại không được kết luận là tội lừa đảo. Hiểu đúng ranh giới này giúp mỗi người thận trọng hơn trước khi ký giấy tờ, chuyển tiền hoặc tham gia một lời mời đầu tư.<\/p>","signs":[],"scen":[],"todo":[],"todoPage":"","dont":[],"body":"","srcs":[],"topic":"","ch":[],"aud":[],"level":"","tabs":[],"kw":[],"syn":[],"rel":[],"chk":"","feat":false,"ver":"1.0","rev":"","by":""}},{"id":"ar7","p":"g-lua-dao","type":"riskArticlePage","name":"Sau cú lừa: 72 giờ vàng để giảm thiệt hại và bảo vệ bản thân","st":"draft","v":{"title":"Sau cú lừa: 72 giờ vàng để giảm thiệt hại và bảo vệ bản thân","kind":"docThem","desc":"","icon":"doc","img":"","sum":"<p>Khi phát hiện mình hoặc người thân vừa bị lừa, điều quan trọng nhất là hành động nhanh và đúng cách. Trong những giờ đầu, mỗi quyết định đúng có thể giúp giảm thiệt hại, giữ lại bằng chứng và ngăn kẻ xấu tiếp tục lợi dụng.<\/p>","signs":[],"scen":[],"todo":[],"todoPage":"","dont":[],"body":"","srcs":[],"topic":"","ch":[],"aud":[],"level":"","tabs":[],"kw":[],"syn":[],"rel":[],"chk":"","feat":false,"ver":"1.0","rev":"","by":""}},{"id":"ar8","p":"g-lua-dao","type":"riskArticlePage","name":"Thế giới đang chống lừa đảo tài chính ra sao?","st":"draft","v":{"title":"Thế giới đang chống lừa đảo tài chính ra sao?","kind":"docThem","desc":"","icon":"doc","img":"","sum":"<p>Lừa đảo ngày càng tinh vi, nhưng cách phòng tránh không nhất thiết phải phức tạp. Bài viết này giúp người đọc hiểu một số biện pháp đang được nhiều nước áp dụng, đồng thời ghi nhớ những bước đơn giản để tự bảo vệ trước khi chuyển tiền hoặc cung cấp thông tin cá nhân.<\/p>","signs":[],"scen":[],"todo":[],"todoPage":"","dont":[],"body":"","srcs":[],"topic":"","ch":[],"aud":[],"level":"","tabs":[],"kw":[],"syn":[],"rel":[],"chk":"","feat":false,"ver":"1.0","rev":"","by":""}},{"id":"ar3_1","p":"g-lua-dao","type":"riskArticlePage","name":"Những chiêu lừa kinh điển vẫn còn hiệu quả","st":"pub","v":{"title":"Những chiêu lừa kinh điển vẫn còn hiệu quả","kind":"docThem","desc":"","icon":"doc","img":"","sum":"<p>Chiêu lừa có thể thay áo mới theo thời gian, nhưng cách đánh vào lòng tin, nỗi sợ và sự vội vàng của con người thì không hề mới. Phần 1 giới thiệu những thủ đoạn đã xuất hiện từ lâu nhưng đến nay vẫn khiến nhiều người mắc bẫy.<\/p>","signs":[],"scen":[],"todo":[],"todoPage":"","dont":[],"body":"","srcs":[],"topic":"","ch":[],"aud":[],"level":"","tabs":[],"kw":[],"syn":[],"rel":[],"chk":"","feat":false,"ver":"1.0","rev":"","by":""}},{"id":"ar3_2","p":"g-lua-dao","type":"riskArticlePage","name":"Những thủ đoạn lừa đảo trong kỷ nguyên số","st":"pub","v":{"title":"Những thủ đoạn lừa đảo trong kỷ nguyên số","kind":"docThem","desc":"","icon":"doc","img":"","sum":"<p>Phần 1 đã điểm lại những chiêu lừa kinh điển. Phần này tập trung vào các thủ đoạn gắn với điện thoại, ứng dụng, mạng xã hội và chuyển khoản trực tuyến — nhóm đang gây thiệt hại lớn vì diễn ra nhanh, kín và khó kiểm soát.<\/p>","signs":[],"scen":[],"todo":[],"todoPage":"","dont":[],"body":"","srcs":[],"topic":"","ch":[],"aud":[],"level":"","tabs":[],"kw":[],"syn":[],"rel":[],"chk":"","feat":false,"ver":"1.0","rev":"","by":""}},{"id":"ar3_3","p":"g-lua-dao","type":"riskArticlePage","name":"Khi kẻ lừa đảo dùng AI và deepfake","st":"pub","v":{"title":"Khi kẻ lừa đảo dùng AI và deepfake","kind":"docThem","desc":"","icon":"doc","img":"","sum":"<p>Phần 2 đã nói về các thủ đoạn trong kỷ nguyên số. Phần cuối của bài 3 nói về nhóm thay đổi nhanh nhất: khi kẻ lừa đảo dùng trí tuệ nhân tạo để giả giọng nói, giả hình ảnh và viết kịch bản riêng cho từng người.<\/p>","signs":[],"scen":[],"todo":[],"todoPage":"","dont":[],"body":"","srcs":[],"topic":"","ch":[],"aud":[],"level":"","tabs":[],"kw":[],"syn":[],"rel":[],"chk":"","feat":false,"ver":"1.0","rev":"","by":""}},{"id":"hoi-dap","p":"home","type":"hoiDapPage","name":"Hỏi – Đáp","st":"pub","v":{}},{"id":"lien-he","p":"home","type":"lienHePage","name":"Liên hệ đúng nơi","st":"pub","v":{"title":"Liên hệ đúng nơi","lead":"Mỗi việc có một nơi nhận. Gọi đúng nơi thì việc được xử lý nhanh hơn.","groups":[{"_k":"r142","grp":"Ngân hàng, ví điện tử của bạn","unit":"Tổng đài in trên thẻ hoặc trong ứng dụng bạn đã cài","how":["<b>Có thẻ ngân hàng:<\/b> lật mặt sau thẻ, gọi số chăm sóc khách hàng in trên thẻ.","<b>Không có thẻ:<\/b> mở ứng dụng ngân hàng bạn đã cài từ trước, vào mục Trợ giúp hoặc Liên hệ."],"src":"","checked":""},{"_k":"r143","grp":"Phản ánh cuộc gọi, tin nhắn lừa đảo","unit":"Tổng đài 156, 5656","how":["Gọi hoặc nhắn tin tới 156.","Nhắn tin tới 5656."],"src":"","checked":""},{"_k":"r144","grp":"Trình báo sự việc","unit":"Công an xã, phường nơi gần nhất hoặc nơi bạn cư trú","how":["Đến trực tiếp, mang theo bằng chứng đã lưu.","Gọi 113 khi có nguy hiểm tức thời."],"src":"","checked":""}]}},{"id":"gop-y","p":"home","type":"gopYPage","name":"Góp ý","st":"pub","v":{"title":"Góp ý","lead":"Thấy nội dung sai, khó hiểu hoặc đã cũ? Gửi cho Ban biên tập.","crit":"","reward":false}},{"id":"info-ve-website","p":"home","type":"infoPage","name":"Về website","st":"pub","v":{"title":"Về website","lead":"","body":"","gaps":""}},{"id":"info-nguyen-tac","p":"home","type":"infoPage","name":"Nguyên tắc nội dung","st":"pub","v":{"title":"Nguyên tắc nội dung","lead":"","body":"","gaps":""}},{"id":"info-xac-minh","p":"home","type":"infoPage","name":"Xác minh đúng trang","st":"pub","v":{"title":"Xác minh đúng trang","lead":"","body":"","gaps":""}},{"id":"pol-mt","p":"home","type":"policyPage","name":"Tuyên bố miễn trừ trách nhiệm","st":"draft","v":{"title":"Tuyên bố miễn trừ trách nhiệm","slug":"tuyen-bo-mien-tru-trach-nhiem","ver":"Bản dự thảo · chưa có ngày ban hành","body":"<h3>1. Website này là gì<\/h3><p>antoantaichinh.vn là website tư vấn, hướng dẫn nhận diện và phòng, chống lừa đảo, đồng thời cảnh báo rủi ro tài chính. Website do <span class=\"fill\">[Pháp nhân chủ quản]<\/span> vận hành dưới sự định hướng, thẩm định nội dung chuyên môn của Công an xã Thiên Lộc.<\/p><p>Toàn bộ nội dung ở đây nhằm giúp bạn <b>tự kiểm tra, tự xác minh và tự quyết định<\/b>. Website đưa ra cách kiểm tra, không đưa ra kết luận thay bạn.<\/p><h3>2. Website này không phải là gì<\/h3><div class=\"k-box\"><p><b>Không phải website của cơ quan nhà nước.<\/b> Đây là website do doanh nghiệp vận hành. Việc Công an xã Thiên Lộc thẩm định nội dung chuyên môn không làm cho website trở thành trang của cơ quan nhà nước.<\/p><\/div><div class=\"k-box\"><p><b>Không phải nơi tiếp nhận tố giác, tin báo về tội phạm.<\/b> Việc trình báo phải thực hiện tại cơ quan Công an. Website không nhận, không chuyển và không thay mặt bạn trình báo bất cứ việc gì.<\/p><\/div><div class=\"k-box\"><p><b>Không trực 24/7.<\/b> Khi đang xảy ra sự việc, hãy gọi ngân hàng của bạn và cơ quan Công an nơi gần nhất; gọi 113 nếu có nguy hiểm tức thời.<\/p><\/div><div class=\"k-box\"><p><b>Không phải tư vấn pháp lý hay tư vấn tài chính.<\/b> Nội dung ở đây không thay được ý kiến của luật sư, của chuyên gia tài chính hay của cơ quan có thẩm quyền cho trường hợp cụ thể của bạn.<\/p><\/div><div class=\"k-box\"><p><b>Không phải trang thông tin điện tử tổng hợp.<\/b> Website không tổng hợp tin tức từ các nguồn khác.<\/p><\/div><h3>3. Website không kết luận và không bảo chứng<\/h3><p>Website <b>không kết luận<\/b> một cá nhân, tổ chức nào đó là lừa đảo, không xác định ai đúng ai sai trong một vụ việc cụ thể, và không đánh giá, không xếp hạng bất kỳ tổ chức nào. Việc xác định hành vi vi phạm pháp luật thuộc thẩm quyền của cơ quan nhà nước.<\/p><p>Website <b>không bảo chứng<\/b> cho bất kỳ giao dịch, sản phẩm, dịch vụ, tổ chức hay đơn vị tài trợ nào. Việc một tổ chức xuất hiện trên website — kể cả với tư cách đơn vị tài trợ — không có nghĩa website khuyến nghị hay bảo đảm cho tổ chức đó.<\/p><p>Công an xã Thiên Lộc thẩm định nội dung chuyên môn, và <b>không bảo chứng<\/b> cho giao dịch, sản phẩm, dịch vụ hoặc đơn vị tài trợ.<\/p><h3>4. Website không bao giờ nói một việc là “an toàn”<\/h3><p>Đây là nguyên tắc thiết kế, không phải cách nói tránh. Website chỉ dùng ba trạng thái: <b>DỪNG<\/b> · <b>HOÃN VÀ KIỂM CHỨNG<\/b> · <b>CHƯA PHÁT HIỆN ĐIỂM DỪNG<\/b>.<\/p><p>“Chưa phát hiện điểm dừng” <b>không có nghĩa là an toàn<\/b>. Nó chỉ có nghĩa là với những gì bạn mô tả, website chưa thấy lý do rõ ràng để bạn dừng lại. Không danh sách nào ghi hết được thủ đoạn, và thủ đoạn mới xuất hiện liên tục.<\/p><h3>5. Về các số điện thoại và đường dẫn trên website<\/h3><p>Website chỉ nêu đầu mối của cơ quan nhà nước có thẩm quyền và các đầu số do Nhà nước vận hành. Riêng danh sách đường dây nóng của tổ chức tín dụng, website chỉ đăng những số <b>chép lại được từ văn bản hoặc cổng thông tin của cơ quan nhà nước<\/b>, kèm ngày kiểm chứng.<\/p><p>Danh sách đó là tiện ích, <b>không phải chỗ dựa duy nhất và không được bảo đảm luôn đúng tại mọi thời điểm<\/b>. Số điện thoại có thể thay đổi mà website chưa kịp cập nhật. Cách chắc chắn hơn luôn là số in ở mặt sau thẻ và số trong ứng dụng bạn đã cài từ trước. Website không chịu trách nhiệm về thiệt hại phát sinh từ việc bạn liên hệ theo một số đã thay đổi.<\/p><h3>6. Nội dung có thể lạc hậu<\/h3><p>Pháp luật thay đổi, thủ đoạn thay đổi, quy trình của ngân hàng và cơ quan nhà nước thay đổi. Mỗi bài trên website đều ghi ngày cập nhật gần nhất. Bài quá hạn rà soát được gắn nhãn công khai.<\/p><p>Bạn có trách nhiệm đối chiếu với quy định hiện hành và với hướng dẫn của cơ quan có thẩm quyền tại thời điểm bạn sử dụng.<\/p><h3>7. Giới hạn trách nhiệm<\/h3><p>Bạn tự quyết định và tự chịu trách nhiệm về quyết định của mình. Trong phạm vi pháp luật cho phép, <span class=\"fill\">[Pháp nhân chủ quản]<\/span> không chịu trách nhiệm đối với thiệt hại phát sinh từ việc bạn sử dụng hoặc không sử dụng nội dung trên website, trừ trường hợp thiệt hại do lỗi cố ý của chính đơn vị vận hành.<\/p><p>Quy định này không loại trừ trách nhiệm mà pháp luật không cho phép loại trừ.<\/p><h3>8. Liên kết ra ngoài<\/h3><p>Khi website dẫn tới cổng thông tin của cơ quan nhà nước, việc dẫn đó chỉ nhằm giúp bạn kiểm chứng. Website không kiểm soát và không chịu trách nhiệm về nội dung của trang đích, và cũng không chịu trách nhiệm nếu trang đích thay đổi địa chỉ.<\/p><h3>9. Nếu bạn thấy nội dung sai<\/h3><p>Hãy báo cho chúng tôi qua mục Góp ý. Cách xử lý và thời hạn được nêu tại <b>Cách báo lỗi và cải chính<\/b>.<\/p><h3>10. Hiệu lực và thay đổi<\/h3><p>Tuyên bố này có hiệu lực từ <span class=\"fill\">[ngày]<\/span>. Khi thay đổi, phiên bản mới được đăng tại đây kèm ngày ban hành, và bản cũ được lưu để đối chiếu.<\/p>"}},{"id":"pol-dl","p":"home","type":"policyPage","name":"Chính sách bảo vệ dữ liệu cá nhân","st":"draft","v":{"title":"Chính sách bảo vệ dữ liệu cá nhân","slug":"chinh-sach-bao-ve-du-lieu-ca-nhan","ver":"Bản dự thảo · chưa có ngày ban hành","body":"<p>Chính sách này được soạn theo Luật Bảo vệ dữ liệu cá nhân số 91/2025/QH15, Nghị định 356/2025/NĐ-CP hướng dẫn thi hành, và có tính tới chế tài tại Nghị định 330/2026/NĐ-CP.<\/p><h3>1. Ai giữ dữ liệu của bạn<\/h3><p><b>Bên Kiểm soát dữ liệu cá nhân:<\/b> <span class=\"fill\">[Pháp nhân chủ quản · địa chỉ · mã số doanh nghiệp]<\/span>.<\/p><p><b>Đầu mối tiếp nhận yêu cầu về dữ liệu cá nhân:<\/b> <span class=\"fill\">[họ tên hoặc chức danh · thư điện tử · địa chỉ nhận thư]<\/span>.<\/p><p><b>Công an xã Thiên Lộc không phải Bên Kiểm soát dữ liệu<\/b>, không nhận và không xem dữ liệu cá nhân do bạn gửi qua website.<\/p><h3>2. Bốn nguyên tắc chúng tôi tự ràng buộc<\/h3><div class=\"k-box\"><p><b>Tối thiểu.<\/b> Chỉ thu thập thứ thật sự cần cho đúng mục đích đã nói. Mỗi ô nhập trên website đều phải trả lời được câu hỏi: mục đích nào cần ô này.<\/p><\/div><div class=\"k-box\"><p><b>Đúng mục đích.<\/b> Không dùng dữ liệu vào việc khác với việc đã nói với bạn.<\/p><\/div><div class=\"k-box\"><p><b>Không bán, không quảng cáo.<\/b> Không bán, không trao đổi, không cho thuê dữ liệu. Không dùng dữ liệu để quảng cáo, kể cả cho đơn vị tài trợ.<\/p><\/div><div class=\"k-box\"><p><b>Không hỏi thứ nguy hiểm.<\/b> Website không bao giờ hỏi mật khẩu, mã xác thực (OTP), mã PIN, số thẻ hay số tài khoản ngân hàng của bạn — trong bất kỳ trường hợp nào.<\/p><\/div><h3>3. Chúng tôi thu thập gì, trong từng trường hợp<\/h3><p>Chỉ đọc website<\/p><p>Không cần đăng ký, không cần cung cấp gì. Hệ thống ghi nhật ký kỹ thuật ở mức tối thiểu để vận hành và bảo mật; nhật ký này <b>không dùng để nhận dạng cá nhân<\/b> và bị xóa sau <span class=\"fill\">[…]<\/span> ngày. Các ô bạn đánh dấu trong bảng kiểm được lưu <b>trên chính máy của bạn<\/b>, không gửi về máy chủ.<\/p><p>Gửi góp ý<\/p><p>Mặc định <b>hoàn toàn ẩn danh<\/b>: chỉ nội dung góp ý, không tên, không số điện thoại, không tài khoản. Địa chỉ mạng không được lưu cùng với nội dung góp ý.<\/p><p>Dự xét thưởng góp ý<\/p><p>Chỉ khi bạn tự mở phần này: <b>họ tên<\/b> và <b>số điện thoại<\/b>, dùng vào <b>đúng một việc<\/b> là liên hệ trao thưởng. Không gắn với nội dung góp ý khi đăng. Xóa trong <span class=\"fill\">[…]<\/span> ngày sau khi trao thưởng xong, trừ chứng từ phải lưu theo pháp luật kế toán và thuế.<\/p><p>Gửi câu hỏi vào mục Hỏi – Đáp<\/p><p>Nội dung câu hỏi; tên hoặc biệt danh bạn tự chọn; thư điện tử hoặc số điện thoại <b>chỉ khi bạn muốn nhận trả lời riêng<\/b>. Bản thô chưa biên tập bị xóa trong <span class=\"fill\">[…]<\/span> ngày sau khi biên tập xong. Thông tin liên hệ bị xóa ngay sau khi đã gửi câu trả lời cho bạn.<\/p><p>Giai đoạn đầu <b>không cho tải tệp đính kèm<\/b>, kể cả ảnh chụp màn hình — đây là cách bảo vệ dữ liệu của người thứ ba.<\/p><p>Đăng ký dự thi<\/p><p>Họ tên · ngày sinh · số điện thoại · trường lớp hoặc đơn vị nếu có · bài làm và kết quả. <b>Không thu số căn cước ở bước đăng ký.<\/b> Dữ liệu thí sinh lưu tách biệt khỏi cơ sở dữ liệu nội dung công khai, phân quyền riêng. Xóa trong <span class=\"fill\">[…]<\/span> ngày sau khi hoàn tất trao giải và quyết toán, trừ chứng từ phải lưu theo pháp luật kế toán và thuế.<\/p><h3>4. Căn cứ để chúng tôi xử lý dữ liệu<\/h3><p>Là <b>sự đồng ý của bạn<\/b>, thể hiện bằng việc bạn tự đánh dấu vào ô đồng ý. Mỗi mục đích có ô đồng ý riêng, không đánh dấu sẵn, không gộp nhiều mục đích vào một ô.<\/p><p>Một phần nhỏ dữ liệu được xử lý theo nghĩa vụ luật định — ví dụ chứng từ chi giải thưởng phải lưu theo pháp luật kế toán và thuế. Phần này được nêu rõ ngay tại nơi thu thập.<\/p><h3>5. Quyền của bạn, và cách thực hiện<\/h3><p>Theo Luật Bảo vệ dữ liệu cá nhân, bạn có quyền: <b>biết<\/b> việc dữ liệu của mình được xử lý · <b>đồng ý và rút lại sự đồng ý<\/b> · <b>xem<\/b> · <b>yêu cầu sửa<\/b> · <b>yêu cầu xóa<\/b> · <b>hạn chế<\/b> hoặc <b>phản đối<\/b> việc xử lý · <b>khiếu nại, tố cáo, khởi kiện<\/b> · <b>yêu cầu bồi thường thiệt hại<\/b> theo quy định.<\/p><p>Gửi yêu cầu tới đầu mối ở Mục 1. Chúng tôi trả lời trong <span class=\"fill\">[…]<\/span> ngày. Nếu từ chối, chúng tôi nêu rõ lý do bằng văn bản.<\/p><p><b>Rút lại sự đồng ý<\/b> không ảnh hưởng tới việc xử lý đã thực hiện hợp pháp trước đó. Riêng với cuộc thi, rút lại sự đồng ý sau khi đã có kết quả <b>không làm mất giải<\/b> bạn đã đạt.<\/p><h3>6. Dữ liệu của trẻ em<\/h3><p>Trẻ em là người <b>dưới 16 tuổi<\/b>. Với dữ liệu của trẻ em, chúng tôi áp dụng thêm:<\/p><div class=\"k-box\"><p>Phải có sự đồng ý của <b>cha, mẹ hoặc người giám hộ<\/b>.<\/p><\/div><div class=\"k-box\"><p>Với trẻ <b>từ đủ 7 tuổi<\/b> trở lên, việc công bố, tiết lộ thông tin về đời sống riêng tư còn phải có <b>sự đồng ý của chính trẻ em<\/b>. Hai sự đồng ý này không thay thế cho nhau. Vì vậy việc đăng họ tên, trường lớp của người đạt giải dưới 16 tuổi chỉ thực hiện khi có <b>đủ cả hai<\/b>; thiếu một trong hai thì <b>mặc định không đăng<\/b>, và người đạt giải vẫn nhận đủ giải thưởng.<\/p><\/div><div class=\"k-box\"><p>Chúng tôi <b>xác minh độ tuổi<\/b> trước khi xử lý dữ liệu của trẻ em; khai báo ngày sinh không phải biện pháp duy nhất.<\/p><\/div><div class=\"k-box\"><p>Người từ đủ 16 đến dưới 18 tuổi không phải trẻ em, nhưng là người chưa thành niên, nên việc nhận giải thưởng và việc công bố danh tính cần xác nhận của cha, mẹ hoặc người giám hộ.<\/p><\/div><p>Ngừng xử lý và xóa dữ liệu trẻ em khi đã xong mục đích, khi sự đồng ý bị rút lại, hoặc khi có yêu cầu của cơ quan có thẩm quyền.<\/p><h3>7. Chúng tôi chia sẻ dữ liệu với ai<\/h3><p><b>Không chia sẻ với bên thứ ba vì mục đích thương mại.<\/b> Chỉ có hai trường hợp dữ liệu ra khỏi phạm vi Ban biên tập:<\/p><div class=\"k-box\"><p><b>Bên xử lý dữ liệu:<\/b> đơn vị cung cấp hạ tầng lưu trữ và vận hành kỹ thuật, làm theo đúng chỉ dẫn của chúng tôi, có hợp đồng ràng buộc về bảo mật, và không được dùng dữ liệu cho mục đích riêng. Danh sách: <span class=\"fill\">[…]<\/span>.<\/p><\/div><div class=\"k-box\"><p><b>Cơ quan nhà nước có thẩm quyền<\/b>, khi có yêu cầu hợp pháp bằng văn bản. Chúng tôi chỉ cung cấp đúng phạm vi được yêu cầu, ghi nhật ký việc cung cấp, và thông báo cho bạn khi pháp luật không cấm việc thông báo.<\/p><\/div><h3>8. Lưu trữ và an toàn<\/h3><p>Dữ liệu được lưu trên hạ tầng đặt tại Việt Nam. Chúng tôi áp dụng: phân quyền theo nguyên tắc ít nhất cần thiết · mã hóa đường truyền · ghi nhật ký truy cập dữ liệu thô · tách biệt cơ sở dữ liệu cuộc thi khỏi cơ sở dữ liệu nội dung công khai · rà soát quyền truy cập định kỳ.<\/p><p>Khi xảy ra sự cố làm lộ dữ liệu, chúng tôi <b>thông báo cho cơ quan có thẩm quyền và cho người bị ảnh hưởng theo đúng thời hạn luật định<\/b>, nêu rõ dữ liệu nào bị ảnh hưởng và bạn nên làm gì.<\/p><h3>9. Đo lường truy cập<\/h3><p>Website chỉ đo ở mức tổng hợp: số lượt xem trang, thiết bị, nguồn truy cập. <b>Không theo dõi hành vi cá nhân, không lập hồ sơ người dùng, không dùng cho quảng cáo.<\/b> Không dùng công cụ đo lường nào yêu cầu chia sẻ dữ liệu cá nhân với bên thứ ba vì mục đích quảng cáo.<\/p><h3>10. Thay đổi chính sách<\/h3><p>Khi thay đổi, phiên bản mới được đăng tại đây kèm ngày ban hành. Nếu thay đổi mở rộng mục đích xử lý so với sự đồng ý bạn đã cho, chúng tôi <b>xin lại sự đồng ý<\/b> chứ không tự áp dụng.<\/p>"}},{"id":"pol-tt","p":"home","type":"policyPage","name":"Chính sách tài trợ","st":"draft","v":{"title":"Chính sách tài trợ","slug":"chinh-sach-tai-tro","ver":"Bản dự thảo · chưa có ngày ban hành","body":"<h3>1. Vì sao website nhận tài trợ<\/h3><p>Website không thu bất kỳ khoản tiền nào của người đọc. Tài trợ là nguồn để duy trì hạ tầng, biên tập nội dung và tổ chức các hoạt động. Chính sách này công khai để bạn biết ai trả tiền và việc đó ảnh hưởng tới nội dung ra sao.<\/p><h3>2. Hình thức tài trợ được nhận<\/h3><p>Chỉ một hình thức: <b>hiển thị tên đơn vị, logo và một dòng giới thiệu ngắn<\/b> do đơn vị cung cấp, tại vị trí đã định.<\/p><p><b>Không nhận<\/b>: bài viết do đơn vị tài trợ soạn · nội dung quảng cáo trá hình dưới dạng bài hướng dẫn · đường dẫn tới trang bán hàng · mã giảm giá · nút gọi tới đơn vị tài trợ · bất kỳ hình thức nào thu thập dữ liệu của người đọc.<\/p><h3>3. Ai được tài trợ<\/h3><p>Đơn vị tài trợ phải là pháp nhân hoặc cá nhân kinh doanh <b>có đăng ký hợp pháp tại Việt Nam<\/b>, đang hoạt động, và <b>không thuộc trường hợp bị cấm quảng cáo<\/b> theo pháp luật về quảng cáo.<\/p><p>Danh mục ngành được nhận tài trợ: <span class=\"fill\">[danh mục do chủ quản quyết định và công bố tại đây]<\/span>.<\/p><p><b>Đề nghị của Ban biên tập:<\/b> nên loại trừ mọi ngành có liên quan tới tiền của chính người đọc — tài chính, đầu tư, cho vay, bảo hiểm, tiền mã hóa, cầm đồ, thu hồi nợ, dịch vụ “hỗ trợ lấy lại tiền”. Lý do không phải vì các ngành đó xấu, mà vì đây là website dạy người dân cảnh giác với lời mời liên quan đến tiền; một logo tài chính đứng cạnh bài cảnh báo về đầu tư sẽ làm hỏng chính thông điệp đó. Đây là quyết định của chủ quản, ghi lại để cân nhắc.<\/p><h3>4. Không nhận tài trợ trong mọi trường hợp sau<\/h3><div class=\"k-box\"><p>Đơn vị thuộc trường hợp bị cấm quảng cáo, hoặc kinh doanh hàng hóa, dịch vụ bị cấm quảng cáo theo pháp luật về quảng cáo.<\/p><\/div><div class=\"k-box\"><p>Đơn vị đang bị cơ quan nhà nước cảnh báo, đang bị điều tra hoặc đã bị xử lý về hành vi lừa đảo, chiếm đoạt tài sản, huy động vốn trái phép.<\/p><\/div><div class=\"k-box\"><p>Đơn vị kinh doanh dịch vụ “hỗ trợ lấy lại tiền đã mất”, “gỡ nợ xấu”, “xóa nợ” — vì đây chính là loại dịch vụ mà website cảnh báo người dân đề phòng.<\/p><\/div><div class=\"k-box\"><p>Đơn vị yêu cầu được đặt nội dung trong luồng hướng dẫn khẩn cấp, hoặc yêu cầu được nhắc tên trong nội dung chuyên môn.<\/p><\/div><div class=\"k-box\"><p>Đơn vị đặt điều kiện về việc website phải viết gì hoặc không được viết gì.<\/p><\/div><div class=\"k-box\"><p>Cá nhân, tổ chức mà việc xuất hiện của họ có thể khiến người đọc hiểu nhầm website là của cơ quan nhà nước.<\/p><\/div><h3>5. Đặt ở đâu, và không được đặt ở đâu<\/h3><p>Nội dung tài trợ đặt tại <b>vị trí cố định đã công bố<\/b>, có nhãn “Nội dung quảng cáo · Đơn vị tài trợ” hiển thị rõ ràng, dùng màu trung tính.<\/p><p><b>Tuyệt đối không đặt<\/b>: trong dải khẩn cấp đầu trang · trong ba cửa vào · trong khối dấu hiệu phải dừng · trong bất kỳ quy trình hướng dẫn từng bước nào · xen giữa nội dung chuyên môn · trong bản in phát tay.<\/p><p>Nội dung tài trợ <b>không được dùng màu của hệ cảnh báo<\/b> (đỏ, hổ phách) và không được trình bày giống một cảnh báo hay một bài hướng dẫn.<\/p><h3>6. Tài trợ không mua được nội dung<\/h3><p>Việc nhận tài trợ <b>không ảnh hưởng<\/b> tới nội dung chuyên môn. Đơn vị tài trợ không được xem trước, không được góp ý và không được yêu cầu sửa nội dung chuyên môn. Nội dung chuyên môn do Ban biên tập chịu trách nhiệm và do Công an xã Thiên Lộc thẩm định.<\/p><p>Nếu một đơn vị tài trợ trở thành đối tượng bị cảnh báo, website <b>vẫn đăng cảnh báo<\/b> và <b>chấm dứt tài trợ<\/b>, chứ không gỡ cảnh báo.<\/p><h3>7. Không dùng dữ liệu người đọc cho tài trợ<\/h3><p>Đơn vị tài trợ không nhận được bất kỳ dữ liệu nào của người đọc. Website không đo lường hành vi người đọc cho mục đích quảng cáo và không cho phép đơn vị tài trợ đặt mã theo dõi.<\/p><h3>8. Công khai thu chi<\/h3><p>Danh sách đơn vị tài trợ, tổng số tiền nhận và việc sử dụng được công bố tại đây theo kỳ <span class=\"fill\">[…]<\/span>. Quỹ giải thưởng của các hoạt động được gộp chung và công khai thu – chi.<\/p><h3>9. Chấm dứt tài trợ<\/h3><p>Website có quyền chấm dứt tài trợ và gỡ nội dung tài trợ bất kỳ lúc nào nếu đơn vị không còn đáp ứng điều kiện tại Mục 3 và 4, mà không phải hoàn lại phần đã sử dụng, theo thỏa thuận tài trợ.<\/p><p>Người đọc phát hiện đơn vị tài trợ có dấu hiệu vi phạm, xin báo cho chúng tôi qua mục Góp ý.<\/p>"}},{"id":"pol-ng","p":"home","type":"policyPage","name":"Nguyên tắc dẫn nguồn","st":"draft","v":{"title":"Nguyên tắc dẫn nguồn","slug":"nguyen-tac-dan-nguon","ver":"Bản dự thảo · chưa có ngày ban hành","body":"<p>Website không phải trang thông tin điện tử tổng hợp và không đưa tin. Nhưng website có đăng nội dung hướng dẫn, cảnh báo và bài phân tích — nên cần một quy tắc về việc dẫn nguồn nào và dẫn như thế nào.<\/p><h3>1. Ba loại nội dung, ba nguồn khác nhau<\/h3><p>Nội dung hướng dẫn<\/p><p>Là các quy trình việc cần làm, dấu hiệu phải dừng, cách tự kiểm chứng. Nguồn <b>duy nhất<\/b> là bộ tài liệu chuyên đề của Chương trình, gồm bài đọc và ngân hàng câu hỏi, đã được Công an xã Thiên Lộc thẩm định.<\/p><p>Website <b>không tự đặt ra khái niệm mới<\/b> và không tự đặt tên cho công cụ nào chưa có trong bộ tài liệu đó. Khi website bổ sung một nội dung không có trong bộ tài liệu, phải ghi rõ đó là phần website bổ sung.<\/p><p>Cảnh báo<\/p><p>Chỉ đăng khi có <b>văn bản hoặc thông tin công bố chính thức của cơ quan nhà nước có thẩm quyền<\/b>. Mỗi cảnh báo phải ghi: tên cơ quan · số và ngày văn bản, hoặc địa chỉ cổng thông tin đã công bố · ngày website cập nhật.<\/p><p>Bài phân tích<\/p><p>Là các bài giải thích, kể chuyện, tổng hợp kiến thức. Phải phân biệt rõ đâu là dữ kiện có nguồn và đâu là phân tích của người viết. Không đưa số liệu mà không nói lấy từ đâu.<\/p><h3>2. Nguồn nào được dùng<\/h3><div class=\"k-box\"><p>Văn bản quy phạm pháp luật, tra tại cơ sở dữ liệu quốc gia về văn bản pháp luật.<\/p><\/div><div class=\"k-box\"><p>Văn bản, thông cáo, cảnh báo chính thức của cơ quan nhà nước có thẩm quyền.<\/p><\/div><div class=\"k-box\"><p>Cổng thông tin điện tử chính thức của cơ quan nhà nước.<\/p><\/div><div class=\"k-box\"><p>Bộ tài liệu chuyên đề của Chương trình.<\/p><\/div><h3>3. Nguồn nào không dùng<\/h3><div class=\"k-box\"><p>Tin đồn, bài đăng mạng xã hội, tin nhắn lan truyền, ảnh chụp màn hình không rõ nguồn gốc.<\/p><\/div><div class=\"k-box\"><p>Bài của báo chí hoặc trang tin dùng làm <b>nguồn duy nhất<\/b> cho một cảnh báo. Có thể dùng để biết có sự việc, nhưng phải tìm tới văn bản gốc của cơ quan nhà nước trước khi đăng cảnh báo.<\/p><\/div><div class=\"k-box\"><p>Thông tin do chính đơn vị được nhắc tới cung cấp về mình.<\/p><\/div><div class=\"k-box\"><p>Nội dung do đơn vị tài trợ cung cấp, dùng làm căn cứ cho nội dung chuyên môn.<\/p><\/div><div class=\"k-box\"><p>Kết quả tìm kiếm hoặc quảng cáo trên công cụ tìm kiếm.<\/p><\/div><h3>4. Không nêu tên tổ chức, cá nhân cụ thể<\/h3><p>Website <b>không nêu đích danh<\/b> một doanh nghiệp, tổ chức hay cá nhân là bên lừa đảo, kể cả khi người đọc phản ánh, kể cả khi có nhiều phản ánh giống nhau.<\/p><p>Chỉ nêu tên khi <b>trích lại đúng nội dung một văn bản của cơ quan nhà nước đã nêu tên<\/b>, và khi đó phải trích nguyên văn, ghi rõ nguồn, không thêm bình luận quy kết.<\/p><p>Lý do: website không có thẩm quyền kết luận hành vi vi phạm, và việc nêu tên sai có thể gây thiệt hại cho bên bị nêu, đồng thời làm website mất uy tín.<\/p><h3>5. Ghi nguồn thế nào<\/h3><p>Mỗi nội dung có nguồn phải hiển thị nguồn <b>ngay tại chỗ<\/b>, không giấu ở trang khác, không ghi chung chung kiểu “theo cơ quan chức năng”. Người đọc phải tự tra lại được.<\/p><p>Khi dẫn văn bản pháp luật: ghi đúng số hiệu, ngày ban hành, và điều khoản cụ thể. Không dẫn một văn bản cho một nội dung nằm ngoài phạm vi điều chỉnh của văn bản đó.<\/p><h3>6. Ngày cập nhật và hạn rà soát<\/h3><div class=\"k-box\"><p>Mỗi bài hiển thị <b>ngày cập nhật gần nhất<\/b>.<\/p><\/div><div class=\"k-box\"><p>Quá <b>90 ngày<\/b> chưa rà soát: hệ thống tự gắn nhãn công khai “Nội dung đang chờ rà soát lại”.<\/p><\/div><div class=\"k-box\"><p>Quá <b>180 ngày<\/b> chưa rà soát, hoặc liên kết nguồn bị hỏng: hệ thống tự chuyển cảnh báo về trạng thái không hiển thị và báo cho người duyệt.<\/p><\/div><div class=\"k-box\"><p>Khi văn bản nguồn hết hiệu lực hoặc bị thay thế: gỡ hoặc cập nhật trong <span class=\"fill\">[…]<\/span> ngày làm việc kể từ khi biết.<\/p><\/div><h3>7. Ba trạng thái, không có trạng thái “an toàn”<\/h3><p>Mọi nội dung chỉ dùng ba trạng thái: <b>DỪNG<\/b> · <b>HOÃN VÀ KIỂM CHỨNG<\/b> · <b>CHƯA PHÁT HIỆN ĐIỂM DỪNG<\/b>. Không có nhãn nào mang nghĩa an toàn tuyệt đối, và không dùng màu xanh lá cho trạng thái.<\/p>"}},{"id":"pol-cc","p":"home","type":"policyPage","name":"Cách báo lỗi và cải chính","st":"draft","v":{"title":"Cách báo lỗi và cải chính","slug":"cach-bao-loi-va-cai-chinh","ver":"Bản dự thảo · chưa có ngày ban hành","body":"<p>Website này sẽ có lỗi. Điều quan trọng không phải là không bao giờ sai, mà là sai thì sửa nhanh và nói rõ đã sửa gì.<\/p><h3>1. Ai báo lỗi cũng được<\/h3><p>Không cần tài khoản, không cần để lại tên hay số điện thoại. Gửi qua mục <b>Góp ý<\/b> trên website.<\/p><p>Nếu bạn muốn nhận phản hồi về việc chúng tôi xử lý ra sao, hãy để lại một cách liên hệ; nhưng đó là <b>tùy bạn<\/b>, không bắt buộc.<\/p><h3>2. Bốn loại lỗi chúng tôi tiếp nhận<\/h3><div class=\"k-box\"><p><b>Sai về nội dung:<\/b> hướng dẫn sai, dẫn văn bản sai, số liệu sai, dẫn nguồn không đúng phạm vi.<\/p><\/div><div class=\"k-box\"><p><b>Lạc hậu:<\/b> quy định đã thay đổi, quy trình đã khác, số điện thoại đã đổi.<\/p><\/div><div class=\"k-box\"><p><b>Khó hiểu hoặc dễ hiểu nhầm:<\/b> câu chữ khiến người đọc làm sai. Loại này quan trọng ngang loại thứ nhất, vì hậu quả giống nhau.<\/p><\/div><div class=\"k-box\"><p><b>Lộ thông tin cá nhân:<\/b> một bài đã đăng còn sót tên, số điện thoại, số tài khoản hoặc chi tiết nhận ra được người nào đó.<\/p><\/div><h3>3. Thời hạn xử lý<\/h3><p>Loại lỗi | Xử lý trong<\/p><p>Lộ thông tin cá nhân | Gỡ hoặc che ngay khi tiếp nhận, chậm nhất trong ngày<\/p><p>Sai nội dung có thể gây thiệt hại cho người đọc | 24 giờ<\/p><p>Sai nội dung khác, hoặc lạc hậu | 03 ngày làm việc<\/p><p>Khó hiểu, dễ hiểu nhầm | 07 ngày làm việc<\/p><p>Nếu cần thêm thời gian để xác minh, chúng tôi <b>gắn nhãn cảnh báo lên bài<\/b> trong thời gian chờ, chứ không để bài nguyên trạng.<\/p><h3>4. Chúng tôi cải chính thế nào<\/h3><div class=\"k-box\"><p><b>Sửa tại chỗ<\/b> trên chính bài có lỗi, không sửa lặng lẽ.<\/p><\/div><div class=\"k-box\"><p><b>Ghi rõ đã sửa gì<\/b> ở cuối bài: ngày sửa · nội dung cũ sai ở đâu · nội dung mới. Không xóa dấu vết của lỗi.<\/p><\/div><div class=\"k-box\"><p>Với lỗi có thể đã khiến người đọc làm sai, phần cải chính <b>đặt ở đầu bài<\/b>, không đặt ở cuối.<\/p><\/div><div class=\"k-box\"><p>Nếu bài đã được in phát tay hoặc chia sẻ rộng, đăng thêm một <b>thông báo cải chính riêng<\/b> tại mục Cảnh báo lừa đảo.<\/p><\/div><h3>5. Trường hợp phải gỡ ngay<\/h3><p>Gỡ bài khỏi trang công khai ngay, không chờ xác minh xong, khi: bài làm lộ thông tin cá nhân · bài có hướng dẫn có thể gây thiệt hại trực tiếp · văn bản nguồn đã bị thu hồi hoặc hết hiệu lực · có yêu cầu hợp pháp của cơ quan nhà nước có thẩm quyền.<\/p><p>Sau khi gỡ, đăng một dòng tại vị trí cũ nói rõ bài đã được gỡ và vì sao — không để bài biến mất không dấu vết.<\/p><h3>6. Yêu cầu từ cơ quan nhà nước<\/h3><p>Website có <b>đầu mối liên lạc trực cả ngoài giờ hành chính<\/b> để tiếp nhận yêu cầu gỡ hoặc chỉnh sửa nội dung của cơ quan nhà nước có thẩm quyền: <span class=\"fill\">[họ tên · số điện thoại · thư điện tử]<\/span>.<\/p><p>Hệ thống quản trị nội dung cho phép người có thẩm quyền <b>gỡ một bài trong không quá 03 thao tác<\/b>, không cần nhà thầu kỹ thuật can thiệp.<\/p><h3>7. Nhật ký cải chính công khai<\/h3><p>Toàn bộ lần cải chính và gỡ bài được ghi vào một trang công khai tại đây, gồm: ngày · bài nào · loại lỗi · đã xử lý ra sao. Trang này <b>không bao giờ bị xóa mục nào<\/b>.<\/p><p>Lý do công khai: một website dạy người dân kiểm chứng thì phải để người dân kiểm chứng được chính nó.<\/p><h3>8. Nếu bạn không đồng ý với cách chúng tôi xử lý<\/h3><p>Hãy gửi lại qua mục Góp ý và nói rõ bạn không đồng ý ở điểm nào. Nếu vẫn chưa thỏa đáng, bạn có quyền khiếu nại tới cơ quan nhà nước có thẩm quyền theo quy định của pháp luật.<\/p>"}},{"id":"cuoc-thi","p":"home","type":"thiPage","name":"Cuộc thi trực tuyến","st":"pub","v":{}},{"id":"tim-kiem","p":"home","type":"searchPage","name":"Tìm kiếm","st":"pub","v":{}},{"id":"404","p":"home","type":"notFoundPage","name":"Không tìm thấy trang","st":"pub","v":{}},{"id":"lib","p":null,"type":"libraryFolder","name":"Thư viện","st":"pub","v":{}},{"id":"f-ch","p":"lib","type":"channelFolder","name":"Kênh tiếp cận","st":"pub","v":{}},{"id":"dien-thoai","p":"f-ch","type":"channelItem","name":"Điện thoại, cuộc gọi","st":"pub","v":{"code":"dien-thoai","icon":"call","active":true}},{"id":"tin-nhan","p":"f-ch","type":"channelItem","name":"Tin nhắn, Zalo","st":"pub","v":{"code":"tin-nhan","icon":"chat","active":true}},{"id":"mang-xa-hoi","p":"f-ch","type":"channelItem","name":"Mạng xã hội","st":"pub","v":{"code":"mang-xa-hoi","icon":"users","active":true}},{"id":"website-ung-dung","p":"f-ch","type":"channelItem","name":"Web ép hình ảnh, giọng nói người thân trong cuộc gọi video","st":"pub","v":{"code":"ghep-hinh-anh-giong-noi-nguoi-than-trong","active":true,"topic":"cd7","article":"doc7","anchor":"","ch":["mang-xa-hoi","dien-thoai"],"level":"cao","kw":[]}},{"id":"t27","p":"f-tac","type":"tacticItem","name":"Tin nhắn giả chen vào đúng luồng tin thật của ngân hàng","st":"pub","v":{"code":"tin-nhan-gia-chen-vao-dung-luong-tin-tha","active":true,"topic":"cd7","article":"doc7","anchor":"","ch":["tin-nhan"],"level":"ratCao","kw":[]}},{"id":"t28","p":"f-tac","type":"tacticItem","name":"Chiếm tài khoản mạng xã hội rồi giả người quen hỏi vay tiền","st":"pub","v":{"code":"chiem-tai-khoan-mang-xa-hoi-roi-gia-nguo","active":true,"topic":"cd7","article":"doc7","anchor":"","ch":["mang-xa-hoi","tin-nhan"],"level":"cao","kw":[]}},{"id":"t29","p":"f-tac","type":"tacticItem","name":"Dụ chia sẻ màn hình hoặc cài công cụ điều khiển máy từ xa","st":"pub","v":{"code":"du-chia-se-man-hinh-hoac-cai-cong-cu-die","active":true,"topic":"cd7","article":"doc7","anchor":"","ch":["dien-thoai","website-ung-dung"],"level":"ratCao","kw":[]}},{"id":"t30","p":"f-tac","type":"tacticItem","name":"Tâm linh, giải hạn: dọa gia đình sắp gặp nạn để đòi tiền","st":"pub","v":{"code":"tam-linh-giai-han-doa-gia-dinh-sap-gap-n","active":true,"topic":"cd7","article":"doc7","anchor":"","ch":["truc-tiep","dien-thoai"],"level":"cao","kw":[]}},{"id":"t-cu","p":"f-tac","type":"tacticItem","name":"Tin nhắn trúng thưởng, nhận quà tri ân","st":"pub","v":{"code":"tin-nhan-trung-thuong","active":false,"topic":"cd7","article":"doc7","anchor":"","ch":["tin-nhan"],"level":"cao","kw":["trúng thưởng"]}},{"id":"f-qa","p":"lib","type":"quickQaFolder","name":"Hỏi – đáp nhanh","st":"pub","v":{}},{"id":"qa0","p":"f-qa","type":"quickQaItem","name":"Có người gọi nói tài khoản của tôi sắp bị khóa, bảo đọc mã OTP để xác minh. Tôi phải làm gì?","st":"pub","v":{"q":"Có người gọi nói tài khoản của tôi sắp bị khóa, bảo đọc mã OTP để xác minh. Tôi phải làm gì?","a":"Không đọc mã. Cúp máy, rồi tự gọi số in ở mặt sau thẻ hoặc tự mở ứng dụng ngân hàng để hỏi.","why":"<p>Bảo bạn <b>đọc<\/b> hoặc <b>gửi<\/b> mật khẩu, mã OTP, mã PIN là một dấu hiệu phải dừng. Đừng nghe họ tự xưng là ai, hãy nhìn vào việc họ đang bảo mình làm.<\/p>","todo":"<p><b>Có thẻ ngân hàng:<\/b> lật mặt sau thẻ, gọi số chăm sóc khách hàng in trên thẻ.<br><b>Không có thẻ:<\/b> mở ứng dụng ngân hàng bạn đã cài từ trước, vào mục Trợ giúp hoặc Liên hệ.<br><b>Luôn luôn:<\/b> không bấm đường link và không gọi số do người kia gửi.<\/p>","pages":[],"by":"Ban biên tập"}},{"id":"qa1","p":"f-qa","type":"quickQaItem","name":"Người lạ bảo tôi cài ứng dụng để được hỗ trợ. Có nên cài không?","st":"pub","v":{"q":"Người lạ bảo tôi cài ứng dụng để được hỗ trợ. Có nên cài không?","a":"Không cài. Người khác gửi đường link và bảo bạn cài ứng dụng là một dấu hiệu phải dừng.","why":"<p>Cài công cụ điều khiển là giao cả điện thoại cho người khác. Đọc mã xác thực là giao luôn chìa khóa tài khoản. Không có cơ quan hay ngân hàng nào cần những thứ đó của mình.<\/p>","todo":"<p>Nếu đã cài: ngắt mạng trên điện thoại hoặc máy tính đó, tắt Wi-Fi và tắt dữ liệu di động, rồi ngừng dùng máy. Từ đây trở đi, mọi việc làm trên một thiết bị khác mà bạn tin cậy.<\/p>","pages":[],"by":"Ban biên tập"}},{"id":"qa2","p":"f-qa","type":"quickQaItem","name":"Người quen đầu tư lãi nhiều, rủ tôi góp vốn. Có nên theo không?","st":"pub","v":{"q":"Người quen đầu tư lãi nhiều, rủ tôi góp vốn. Có nên theo không?","a":"Trước hết hỏi ba câu: lợi nhuận ở đâu ra, ai có nghĩa vụ trả tiền cho mình, và muốn rút thì rút bằng cách nào.","why":"<p>Người thân quen có thể cũng đang bị dẫn. Nhiều mô hình sống được chính là nhờ người quen rủ người quen. Rút thử được một khoản nhỏ chỉ chứng minh lần rút đó đã xong; khoản trả đầu tiên thường chính là tiền mồi.<\/p>","todo":"<p>Dùng công cụ “Trước khi đầu tư, vay”. Không vay, không thế chấp nhà đất, không dùng tiền dưỡng già để góp.<\/p>","pages":[],"by":"Ban biên tập"}},{"id":"qa3","p":"f-qa","type":"quickQaItem","name":"Ứng dụng vay đòi nộp phí trước rồi mới giải ngân. Có nên nộp?","st":"pub","v":{"q":"Ứng dụng vay đòi nộp phí trước rồi mới giải ngân. Có nên nộp?","a":"Chưa nộp. Xem tiền chảy về phía nào. Bạn phải nộp tiền trước thì dừng lại.","why":"<p>Ba con số phải ghi ra giấy trước khi quyết: số thực nhận là tiền thật sự về tay sau khi trừ phí, bảo hiểm và khoản giữ lại; tổng phải trả gồm gốc, lãi, phí và bảo hiểm cộng lại; mỗi kỳ trả là số phải nộp mỗi lần theo lịch.<\/p>","todo":"<p>Với ứng dụng cho vay, xem thêm quyền mà nó đòi. Quyền nào không cần cho chức năng rõ ràng thì không cấp.<\/p>","pages":[],"by":"Ban biên tập"}},{"id":"qa4","p":"f-qa","type":"quickQaItem","name":"Tôi lỡ chuyển tiền rồi. Bây giờ làm gì trước?","st":"pub","v":{"q":"Tôi lỡ chuyển tiền rồi. Bây giờ làm gì trước?","a":"Gọi ngay ngân hàng hoặc ví điện tử bạn đã chuyển. Làm bước này trước, rồi mới làm các bước còn lại.","why":"<p>Gọi càng sớm thì ngân hàng càng có cơ hội tra soát giao dịch. Số đúng là số bạn tự lấy từ thẻ hoặc ứng dụng của chính mình.<\/p>","todo":"<p>Câu nói mẫu với tổng đài: “Tôi vừa chuyển tiền và nghi có rủi ro lừa đảo. Xin ghi nhận sự việc, tra soát giao dịch và hướng dẫn tôi cách bảo vệ tài khoản.”<\/p>","pages":[],"by":"Ban biên tập"}},{"id":"qa5","p":"f-qa","type":"quickQaItem","name":"Có người chuyển nhầm tiền vào tài khoản tôi rồi gọi đòi lại. Tôi có nên chuyển trả ngay theo số họ đưa?","st":"pub","v":{"q":"Có người chuyển nhầm tiền vào tài khoản tôi rồi gọi đòi lại. Tôi có nên chuyển trả ngay theo số họ đưa?","a":"Chưa chuyển trả theo số tài khoản người gọi đưa, và không tiêu, không rút khoản đó.","why":"<p>Không quét mã QR hoặc bấm đường dẫn trong tin nhắn báo “chuyển nhầm tiền” để hoàn lại.<\/p>","todo":"<p>Liên hệ ngân hàng của chính bạn để báo có khoản tiền lạ, rồi chỉ hoàn trả theo đúng cách ngân hàng hướng dẫn.<\/p>","pages":[],"by":"Ban biên tập"}},{"id":"qa6","p":"f-qa","type":"quickQaItem","name":"Có người nhờ tôi cho mượn tài khoản ngân hàng, trả tiền công. Có sao không?","st":"pub","v":{"q":"Có người nhờ tôi cho mượn tài khoản ngân hàng, trả tiền công. Có sao không?","a":"Từ chối ngay, dù được trả tiền công.","why":"<p>Không mở, cho mượn, cho thuê hay bán tài khoản ngân hàng, và không nhận chuyển tiền hộ. Đây là hành vi bị cấm, và nó kéo người đứng tên vào dòng tiền phạm pháp.<\/p>","todo":"<p>Nếu đã lỡ giao thẻ, SIM hoặc mã xác thực, báo cả ngân hàng và nhà mạng bằng số chính thức bạn tự tìm.<\/p>","pages":[],"by":"Ban biên tập"}},{"id":"f-snip","p":"lib","type":"snippetFolder","name":"Đoạn dùng chung","st":"pub","v":{}},{"id":"sn-bankbox","p":"f-snip","type":"sharedSnippet","name":"Tìm đúng số tổng đài ngân hàng, ví điện tử","st":"pub","v":{"title":"Tìm đúng số tổng đài ngân hàng, ví điện tử","body":"<ul><li><b>Nếu chính điện thoại của bạn đang nghi bị người khác điều khiển: đừng mở ứng dụng trên máy đó.<\/b> Dùng số in ở mặt sau thẻ, hoặc đến thẳng một điểm giao dịch bạn vẫn quen.<\/li><li><b>Có thẻ ngân hàng:<\/b> lật mặt sau thẻ, gọi số chăm sóc khách hàng in trên thẻ.<\/li><li><b>Không có thẻ, và máy của bạn vẫn bình thường:<\/b> mở ứng dụng ngân hàng hoặc ví điện tử bạn đã cài từ trước, vào mục Trợ giúp hoặc Liên hệ.<\/li><li>Không mở đường link và không gọi số người kia gửi. Không gọi số lấy từ quảng cáo hoặc từ kết quả tìm kiếm đầu tiên.<\/li><\/ul>"}},{"id":"sn-recov","p":"f-snip","type":"sharedSnippet","name":"Đừng trả phí cho người hứa lấy lại tiền","st":"pub","v":{"title":"Đừng trả phí cho người hứa lấy lại tiền","body":"<p>Nếu họ yêu cầu trả tiền trước, hãy dừng liên hệ ngay. Muốn thuê dịch vụ thật thì bạn tự đi tìm, đừng dùng người tự nhắn tin đến.<\/p>"}},{"id":"sn-cover","p":"f-snip","type":"sharedSnippet","name":"Quy tắc dùng cho mọi trường hợp còn lại","st":"pub","v":{"title":"Quy tắc dùng cho mọi trường hợp còn lại","body":"<p>Trước khi chuyển tiền hoặc đưa thông tin, hỏi hai câu. Một: việc này do chính tôi bắt đầu, trên ứng dụng hoặc website tôi vẫn dùng từ trước, và mọi thông tin đều khớp — phải không? Hai: nếu không phải, tôi đã tự liên hệ lại bằng số hoặc địa chỉ do chính tôi tìm ra chưa? Cả hai đều “chưa” thì chưa đưa. “Chính tôi bắt đầu” nghĩa là bạn đã có nhu cầu này từ trước khi có ai liên hệ, và bạn không thao tác theo lời ai đang chỉ. “Tự liên hệ lại” nghĩa là dùng số hoặc địa chỉ bạn đã có sẵn từ trước, không phải quảng cáo, không phải kết quả tìm kiếm đầu tiên, và không phải chính tài khoản đang nhắn với bạn. Qua được hai câu này cũng chưa có nghĩa là an toàn.<\/p>"}},{"id":"sn-legit","p":"f-snip","type":"sharedSnippet","name":"Nếu đây là hợp đồng hợp pháp mà bạn chưa hiểu hết","st":"pub","v":{"title":"Nếu đây là hợp đồng hợp pháp mà bạn chưa hiểu hết","body":"<p>Không phải mọi khoản lỗ hay khoản phải trả đều là lừa đảo. Vay, bảo hiểm, đầu tư hợp pháp đều có thể phát sinh khoản bạn không lường trước. Việc cần làm khác đi: đọc lại đúng bản hợp đồng bạn đã ký, ghi ra từng khoản chưa hiểu, đề nghị đơn vị giải thích bằng văn bản, và hỏi cơ quan nhà nước cấp phép cho loại dịch vụ đó nếu vẫn chưa rõ. Website không thay được ý kiến của luật sư và không kết luận đúng sai cho trường hợp cụ thể của bạn.<\/p>"}},{"id":"sn-cond","p":"f-snip","type":"sharedSnippet","name":"Chỉ làm các bước dưới đây nếu bạn nghi tài khoản, điện thoại hoặc máy tính của mình đã bị người khác kiểm soát:","st":"pub","v":{"title":"Chỉ làm các bước dưới đây nếu bạn nghi tài khoản, điện thoại hoặc máy tính của mình đã bị người khác kiểm soát:","body":"<ul><li>Nếu đã dùng cùng mật khẩu ở nơi khác, hãy đổi các mật khẩu đó bằng một thiết bị bạn tin cậy.<\/li><li>Đăng xuất những điện thoại, máy tính đang đăng nhập tài khoản mà bạn không nhận ra.<\/li><li>Nếu nghi Zalo, Facebook hoặc email đã bị chiếm: đổi mật khẩu từ một máy khác, đăng xuất những máy lạ, và báo người thân đừng làm theo tin nhắn gửi từ tài khoản mang tên bạn.<\/li><\/ul>"}}],"MEDIA":[{"id":"m-logo","name":"logo-antc.svg","icon":"image","sub":"Logo · 240 × 64"},{"id":"m-logo-w","name":"logo-antc-trang.svg","icon":"image","sub":"Logo nền tối · 240 × 64"},{"id":"m-phone","name":"minh-hoa-dien-thoai.png","icon":"image","sub":"Minh họa · 960 × 1200"},{"id":"m-share","name":"anh-chia-se-mac-dinh.png","icon":"image","sub":"Ảnh chia sẻ · 1200 × 630"}]}</script>

  if(bannerEl)c.querySelector('#banner').append(bannerEl);
  else if(n.st==='new')c.querySelector('#banner').append(h('div',{class:'banner info'},icon('plus'),h('span',{text:'Đang tạo '+ty.name.toLowerCase()+' mới trong “'+((byId(n.p)||{}).name||'')+'”. Nhập tên ở ô trên cùng, điền các ô có dấu *, rồi Lưu nháp hoặc Lưu và xuất bản.'}),h('button',{type:'button',class:'btn',onclick:()=>{const pid=n.p;N=N.filter(x=>x.id!==n.id);go(pid);toast('Đã hủy, không tạo mục mới.')}},'Hủy')));
  tabs.forEach((t,i)=>{const pn=h('div',{class:'tabpanel',role:'tabpanel','data-tab':i});pn.hidden=i!==TAB;
    if(t.list)pn.append(Collection(n));
    else{const ctx={node:n,prefix:'',rerender:()=>rerenderPanel(i),hidden:0};const loose=[];
      t.f.forEach(f=>{const el=fieldEl(f,n.v,ctx);if(!el)return;if(f.g||f.t==='matrix')pn.append(el);else loose.push(el)});
      if(loose.length)pn.prepend(h('section',{class:'box'},loose));
      if(ctx.hidden)pn.append(h('div',{class:'banner info'},icon('lock'),h('span',{text:ctx.hidden+' nhóm hoặc trường chỉ Quản trị viên thấy.'})))}
    PANELS.push(pn);c.append(pn)});
  updTabErr();
  // thanh dưới
  const left=h('div',{class:'left'});
  if(!ty.folder){
    if(canDo(ty.del)&&n.st!=='new')left.append(h('button',{type:'button',class:'btn danger',onclick:askDelete},icon('trash'),'Xóa'));
    if(n.st==='pub'&&ty.page&&canDo(ty.del))left.append(h('button',{type:'button',class:'btn',onclick:()=>{n.st='draft';renderTree();renderNode();toast('Đã gỡ khỏi website. Trang vẫn còn ở dạng nháp.',{label:'Hoàn tác',fn:()=>{n.st='pub';renderTree();renderNode()}})}},icon('off'),'Gỡ khỏi website'));
    if(!canDo(ty.del)&&ty.del!==false)left.append(h('span',{class:'note',text:'Chỉ Quản trị viên được xóa loại này.'}));
    if(ty.del===false)left.append(h('span',{class:'note',text:'Trang cố định: không xóa, không di chuyển.'}));
    foot.append(left,h('button',{type:'button',class:'btn',onclick:()=>toast('Mockup không có trang xem trước.')},icon('eye'),'Xem trước'),h('button',{type:'button',class:'btn',onclick:()=>save('save')},'Lưu nháp'),h('button',{type:'button',class:'btn pri',onclick:()=>save('pub')},'Lưu và xuất bản'));
  }else foot.append(h('span',{class:'left note',text:'Thư mục không có nội dung. Bấm một dòng để mở mục.'}));
}
function rerenderPanel(i){const n=CURNODE();const t=tabsOf(n)[i];const old=PANELS[i];if(!old||t.list)return;const sc=document.getElementById('content').scrollTop;
  const pn=h('div',{class:'tabpanel',role:'tabpanel','data-tab':i});pn.hidden=old.hidden;const ctx={node:n,prefix:'',rerender:()=>rerenderPanel(i),hidden:0};const loose=[];
  t.f.forEach(f=>{const el=fieldEl(f,n.v,ctx);if(!el)return;if(f.g||f.t==='matrix')pn.append(el);else loose.push(el)});if(loose.length)pn.prepend(h('section',{class:'box'},loose));
  if(ctx.hidden)pn.append(h('div',{class:'banner info'},icon('lock'),h('span',{text:ctx.hidden+' nhóm hoặc trường chỉ Quản trị viên thấy.'})));
  old.replaceWith(pn);PANELS[i]=pn;document.getElementById('content').scrollTop=sc;updTabErr()}
function updTabErr(){const n=CURNODE();if(!n||!T[n.type].tabs)return;const keys=Object.keys(ERR);
  document.querySelectorAll('.tabs button[data-tab]').forEach(b=>{const i=+b.dataset.tab;const p=PANELS[i];const c=p?keys.filter(k=>p.querySelector('[data-ek="'+CSS.escape(k)+'"]')||(ERRTAB[k]===i)).length:0;const e=b.querySelector('.ed');if(e){e.hidden=!c;e.textContent=c}})}
let ERRTAB={};
function save(mode){
  const n=CURNODE();const list=collect(n,mode);ERR={};ERRTAB={};list.forEach(([k,m,ti])=>{ERR[k]=m;ERRTAB[k]=ti});
  if(list.length){const firstTab=list[0][2];TAB=firstTab;if(n.v.matrix){const r=n.v.matrix.find(r=>list.some(([k])=>k.startsWith(r._k+'.')));if(r)MXS.sel=r._k}
    const ban=h('div',{class:'banner err',role:'alert'},icon('alert'),h('span',{text:(mode==='pub'?'Chưa xuất bản được: ':'Chưa lưu được: ')+'còn '+list.length+' chỗ cần sửa'+(mode==='save'?' (ô bắt buộc).':'. Bản nháp vẫn lưu được nếu đủ ô có dấu *.')}),
      h('button',{type:'button',class:'l',onclick:()=>focusFirst()},'Đến ô đầu tiên'));
    renderNode(ban);setTimeout(focusFirst,30);return}
  if(mode==='pub'){n.st='pub';DIRTY=false;renderTree();renderNode();toast('Đã xuất bản “'+n.name+'”. Mockup không lưu thật.')}
  else{if(n.st==='new')n.st='draft';DIRTY=false;renderTree();renderNode();toast(n.st==='pub'?'Đã lưu bản nháp. Website vẫn hiện bản đang đăng cho tới khi xuất bản.':'Đã lưu bản nháp.')}
}
function focusFirst(){const el=document.querySelector('#cin [data-ek].bad, .wsname.bad');if(!el)return;const p=el.closest('.tabpanel');if(p&&p.hidden)SHOWTAB(+p.dataset.tab);const f=el.matches('input')?el:el.querySelector('input,textarea,[contenteditable],button');el.scrollIntoView({block:'center'});f&&f.focus()}
function askDelete(){const n=CURNODE();const r=refs(n.id);const slot=document.getElementById('banner');slot.textContent='';
  if(r.length){slot.append(h('div',{class:'banner err',role:'alert'},icon('lock'),h('span',null,'Không xóa được “'+n.name+'”: đang được dùng ở '+r.length+' chỗ.'+(n.v.active!==undefined?' Tắt “Đang dùng” để ẩn mục khỏi website mà không mất dữ liệu ở các bài đã gắn.':' Bỏ chọn ở các trang này trước.')),
    h('ul',null,r.slice(0,8).map(x=>h('li',null,h('button',{type:'button',class:'l',onclick:()=>go(x.id)},x.name),' · '+T[x.type].name)),r.length>8?h('li',{text:'và '+(r.length-8)+' chỗ khác'}):null)));}
  else slot.append(h('div',{class:'banner note',role:'alert'},icon('trash'),h('span',{text:'Xóa “'+n.name+'”? Mục vào Thùng rác, Quản trị viên khôi phục được.'}),h('button',{type:'button',class:'btn danger',onclick:()=>{const pid=n.p;removeNode(n.id);go(pid);toast('Đã chuyển “'+n.name+'” vào Thùng rác.',{label:'Hoàn tác',fn:()=>{restoreTrash(1);go(n.id)}})}},'Xóa'),h('button',{type:'button',class:'btn',onclick:()=>slot.textContent=''},'Thôi')));
  slot.scrollIntoView({block:'nearest'})}
function removeNode(id){const all=[id];for(let i=0;i<all.length;i++)kids(all[i]).forEach(k=>all.push(k.id));const removed=N.filter(n=>all.includes(n.id));N=N.filter(n=>!all.includes(n.id));TRASH.push(removed)}
function restoreTrash(count){for(let i=0;i<count;i++){const g=TRASH.pop();if(g)N=N.concat(g)}}
function createChild(parent,type){const ty=T[type];const v=ty.defaults?ty.defaults():{};const n={id:uid(),p:parent.id,type,name:'',st:'new',v,o:Math.max(0,...N.map(x=>x.o))+1};N.push(n);OPEN.add(parent.id);go(n.id);
  setTimeout(()=>{const x=document.querySelector('.wsname');x&&x.focus()},30);toast('Đã mở '+ty.name.toLowerCase()+' mới. Nhập tên rồi lưu nháp hoặc xuất bản.')}

/* ---------- khởi động ---------- */
document.querySelectorAll('[data-soon]').forEach(b=>b.addEventListener('click',()=>toast('Mockup chỉ có khu Nội dung.')));
document.querySelectorAll('[data-role]').forEach(b=>b.addEventListener('click',()=>{ROLE=b.dataset.role;document.querySelectorAll('[data-role]').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));ERR={};renderTree();renderNode();toast('Đang xem như '+(ROLE==='qt'?'Quản trị viên':'Biên tập viên')+'.')}));
let start=(location.hash||'').slice(1);if(start.startsWith('qt.')){start=start.slice(3);ROLE='qt';document.querySelectorAll('[data-role]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.role==='qt'?'true':'false'))}
if(start==='selftest'){
  const errs=[];let count=0;
  ['bt','qt'].forEach(r=>{ROLE=r;N.slice().forEach(n=>{try{go(n.id);count++;PANELS.forEach((p,i)=>SHOWTAB&&SHOWTAB(i));save('pub');
      document.querySelectorAll('.card .card-h').forEach((c,i)=>{if(i<6)c.click()});}catch(e){errs.push(r+' '+n.id+' '+n.type+': '+e.message)}})});
  try{ROLE='qt';Object.keys(ALLOW).forEach(pt=>{const par=N.find(x=>x.type===pt);if(!par)return;ALLOW[pt].forEach(ct=>{createChild(par,ct);const nn=CURNODE();if(nn.type!==ct)errs.push('create '+ct+' fail');save('save');if(!ERR.name)errs.push('create '+ct+' thiếu báo tên');nn.name='Thử';save('save');PANELS.forEach((p2,i)=>SHOWTAB(i));count++})})}catch(e){errs.push('create: '+e.message)}
  try{const w=byId('wizard').v;const a2=new Set([w.o2[1]._k]);const res=mxCompute(w,w.o1[0]._k,a2,new Set([w.o3[1]._k]));if(!res||res.lv!=='ratCao')errs.push('matrix compute sai: '+JSON.stringify(res&&res.lv))}catch(e){errs.push('matrix: '+e.message)}
  document.body.append(h('pre',{id:'selftest',text:'SELFTEST '+(errs.length?'FAIL':'OK')+' renders='+count+' nodes='+N.length+'\n'+errs.join('\n')}));
}else go(byId(start)?start:'khan-cap');
</script>
